# Base URL cho deep link — nối với code tạo link đầy đủ (vd: https://app.bdspro.com/dl/)
applink:
  base_url: "https://bdspro.com/app/link/"

server:
  name: hub-service
  http_port: 8030
  tcp_port: 8280

rpc:
  bdspro:
    address: "bdspro:8202"
  notification:
    address: "notification:8204"
  user:
    address: "user:8201"

database:
  host: localhost
  port: 5432
  name: hub_service
  user: postgres
  password: "CHANGE_ME"
  dsn: "CHANGE_ME_LOCAL_DSN"

jwt:
  key-generate: "your-secret-key-here"
  tokenPrefix: "Bearer "
  tokenExpirationAfterDays: 7
  accessExpAfterMinutes: 60
  refreshExpAfterMinutes: 43200
  authorizationHeader: "Authorization"
  listPermit:
    - "/v2/hub/event-queue/list"
    - "/v2/hub/event-queue/detail"

security:
  api_key: "CHANGE_ME"
  protected_methods:
    - "/hubpb.VersionService/CreateVersionFromDev"

redis:
  host: redis:6379
  pass: "CHANGE_ME"

config-app:
  qhpro:
    - domain_api: "https://api.qhpro.vn"
    - domain_file: "https://data.bdspro.com"
    - domain_pmtile: "https://data-map.qhpro.vn"
    - domain_style: "https://map.qhpro.vn"