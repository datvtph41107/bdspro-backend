# Base URL cho deep link — nối với code tạo link đầy đủ (vd: https://app.bdspro.com/dl/)
applink:
  base_url: "https://bdspro.com/app/link/"

server:
  name: hub-service
  http_port: 8030
  tcp_port: 8280

database:
  host: localhost
  port: 5432
  name: hub_service
  user: postgres
  password: password
  dsn: host=14.225.210.29 user=hieubap password=Matkhau.1 dbname=db_hub port=5432 sslmode=disable

jwt:
  key-generate: "your-secret-key-here"
  tokenPrefix: "Bearer "
  tokenExpirationAfterDays: 7
  accessExpAfterMinutes: 60
  refreshExpAfterMinutes: 43200
  authorizationHeader: "Authorization"
  listPermit:
    - "/v2/hub/event-queue/list"
    - "/v2/hub/event-queue/detail"

security:
  api_key: "develop-hub-api-key"
  protected_methods:
    - "/hubpb.VersionService/CreateVersionFromDev"

trusted_metadata:
  service_id: hub-service
  secret: qhpro-local-transport-trust-only
  mode: audit
  max_age: 30s
  clock_skew: 5s

redis:
  host: redis:6379
  pass: protected_redis_secure_password

config-app:
  qhpro:
    - domain_api: "https://api.qhpro.vn"
    - domain_file: "https://data.bdspro.com"
    - domain_pmtile: "https://data-map.qhpro.vn"
    - domain_style: "https://map.qhpro.vn"