root = "."
testdata_dir = "testdata"
tmp_dir = ".tmp/air"

[build]
  args_bin = ["-server=grpc"]
  bin = "./.tmp/air/tqd-service"
  cmd = "go build -o ./.tmp/air/tqd-service ."
  delay = 1000
  exclude_dir = [".tmp", "bin", "assets", "vendor", "testdata", "docs"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "tpl", "tmpl", "html", "yml", "yaml"]
  kill_delay = "500ms"
  log = "build-errors.log"
  send_interrupt = true

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
