key:
    jwt: key-generate-jwt-token-authentication

jwt:
    key-generate: key-generate-jwt-token-authentication
    tokenPrefix: Bearer
    tokenExpirationAfterDays: 14
    accessExpAfterMinutes: 1 # access token hết hạn 15 phút
    refreshExpAfterMinutes: 129600 # refresh token có hạn là 3 tháng
    listPermit:
    authorizationHeader: Authorization

redis:
    host: redis:6379
    pass: protected_redis_secure_password

config-app:
  qhpro:
    domain_api: "https://api-test.qhpro.vn"
    domain_file: "https://data-test.qhpro.vn"
    domain_pmtile: "https://data-map-test.qhpro.vn"
    domain_style: "http://14.225.210.29:8000"

# Layer configuration
layer:
    # Base URL configuration
    base_url: "ciproto://data-map-test.qhpro.vn"

    # Default style templates
    default_styles:
        vector:
            - id: "{sourceCode}_fill"
              type: "fill"
              maxzoom: 22
              paint:
                  fill-color: ["get", "color"]
                  fill-opacity: 0.8
              source: "{sourceCode}"
              source-layer: "{sourceCode}"
            - id: "{sourceCode}_outline"
              type: "line"
              minzoom: 16
              paint:
                  line-color: ["get", "color"]
                  line-width: 1
              source: "{sourceCode}"
              source-layer: "{sourceCode}"
            - id: "{sourceCode}_label"
              type: "symbol"
              minzoom: 16
              layout:
                  text-field: ["get", "name"]
                  text-size: 13
                  text-allow-overlap: false
                  text-padding: 12
              paint:
                  text-color: "#ff0000"
                  text-halo-color: "#ffffff"
                  text-halo-width: 2
              source: "{sourceCode}"
              source-layer: "{sourceCode}"

        raster:
            - id: "{sourceCode}"
              type: "raster"
              paint:
                  raster-opacity: 1.0
              source: "{sourceCode}"

