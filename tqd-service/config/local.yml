server:
    port: 8230
    tcp_port: 8219

eureka:
    url: localhost
    port: 8761

database:
    dsn: host=14.225.210.29 user=hieubap password=Matkhau.1 dbname=db_tqd port=5433 sslmode=disable
    # dsn: host=localhost user=admin password=123 dbname=postgres port=5432 sslmode=disable

key:
    jwt: key-generate-jwt-token-authentication

jwt:
    key-generate: key-generate-jwt-token-authentication
    tokenPrefix: Bearer
    tokenExpirationAfterDays: 14
    accessExpAfterMinutes: 1 # access token hết hạn 15 phút
    refreshExpAfterMinutes: 129600 # refresh token có hạn là 3 tháng
    listPermit:
    authorizationHeader: Authorization

quota:
    enabled: true
    policy_file: "config/quota_policy.yml"

layer_configs:
    # Default config cho tất cả layers
    defaults:
        layer_url_pattern: "http://14.225.210.29:8032/{source_code}/{z}/{x}/{y}.pbf"
        style_config_pattern: |
            [
              {
                "id": "{source_code}",
                "type": "fill",
                "paint": {
                  "fill-color": ["get", "hex_color"],
                  "fill-opacity": 0.3
                },
                "source": "{source_code}",
                "source-layer": "{source_code}"
              }
            ]

    # Specific config theo source_code pattern
    overrides:
        - source_pattern: "layer*"
          layer_url: "http://14.225.210.29:8032/{source_code}/{z}/{x}/{y}.pbf"
          style_config: |
              [
                {
                  "id": "{source_code}_fill",
                  "type": "fill",
                  "paint": {
                    "fill-color": ["get", "hex_color"],
                    "fill-opacity": 0.3
                  },
                  "source": "{source_code}",
                  "source-layer": "{source_code}"
                }
              ]

        - source_pattern: "layer1"
          layer_url: "http://14.225.210.29:8032/qhsdd_hn/{z}/{x}/{y}.pbf"
          style_config: |
              [
                {
                  "id": "qhsdd_hn",
                  "type": "fill",
                  "paint": {
                    "fill-color": ["get", "hex_color"],
                    "fill-opacity": 0.3
                  },
                  "source": "qhsdd_hn",
                  "source-layer": "qhsdd_hn"
                }
              ]

        - source_pattern: "layer67"
          style_config: |
              [
                {
                  "id": "{source_code}_fill",
                  "type": "fill",
                  "paint": {
                    "fill-color": ["match", ["get", "quyhoach"], "dtvt", "#22c55e", "phan_khu", "#f97316", "rgba(0,0,255,0.2)"],
                    "fill-opacity": 0.2
                  },
                  "source": "{source_code}",
                  "source-layer": "{source_code}"
                },
                {
                  "id": "{source_code}_outline",
                  "type": "line",
                  "paint": {
                    "line-color": ["match", ["get", "quyhoach"], "dtvt", "#16a34a", "qh_chung", "#1d4ed8", "phan_khu", "#ea580c", "rgba(0,0,255,0.8)"],
                    "line-width": 2
                  },
                  "source": "{source_code}",
                  "source-layer": "{source_code}"
                }
              ]

        - source_pattern: "layer68"
          layer_url: "http://14.225.210.29:8032/{source_code}/{z}/{x}/{y}.pbf"
          style_config: |
              [
                {
                  "id": "{source_code}_fill",
                  "type": "fill",
                  "paint": {
                    "fill-color": ["match", ["get", "quyhoach"], "dtvt", "#22c55e", "phan_khu", "#f97316", "rgba(0,0,255,0.2)"],
                    "fill-opacity": 0.2
                  },
                  "source": "{source_code}",
                  "maxzoom": 22,
                  "source-layer": "{source_code}"
                },
                {
                  "id": "{source_code}_outline",
                  "type": "line",
                  "paint": {
                    "line-color": ["match", ["get", "quyhoach"], "dtvt", "#16a34a", "qh_chung", "#1d4ed8", "phan_khu", "#ea580c", "rgba(0,0,255,0.8)"],
                    "line-width": 2
                  },
                  "source": "{source_code}",
                  "maxzoom": 22,
                  "source-layer": "{source_code}"
                }
              ]
