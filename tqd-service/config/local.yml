server:
  port: 8230
  http: 8030
  tcp_port: 8219

quota:
    enabled: true
    policy_file: "config/quota_policy.yml"

redis:
    host: 14.225.210.29:6379
    pass: protected_redis_secure_password

database:
  dsn: host=14.225.210.29 user=hieubap password=Matkhau.1 dbname=db_tqd port=5433 sslmode=disable
  
key:
  jwt: key-generate-jwt-token-authentication

jwt:
  key-generate: key-generate-jwt-token-authentication
  tokenPrefix: Bearer
  tokenExpirationAfterDays: 14
  accessExpAfterMinutes: 15 # access token hết hạn 15 phút
  refreshExpAfterMinutes: 129600 # refresh token có hạn là 3 tháng
  listPermit:
  authorizationHeader: Authorization

config-app:
  qhpro:
    domain_api: "http://127.0.0.1:8000"
    domain_file: "https://data.bdspro.com"
    domain_pmtile: "https://data-map.bdspro.com"
    domain_style: "https://map.qhpro.vn"

layer:
    # Base URL configuration
    base_url: "ciproto://data-map.bdspro.com"

    # Default style templates
    default_styles:
        vector:
            - id: "{sourceCode}_fill"
              type: "fill"
              maxzoom: 22
              paint:
                  fill-color: ["get", "color"]
                  fill-opacity: 0.3
              source: "{sourceCode}"
              source-layer: "{sourceCode}"
            - id: "{sourceCode}_outline"
              type: "line"
              minzoom: 16
              paint:
                  line-color: ["get", "color"]
                  line-width: 1
              source: "{sourceCode}"
              source-layer: "{sourceCode}"
            - id: "{sourceCode}_label"
              type: "symbol"
              minzoom: 16
              layout:
                  text-field: ["get", "name"]
                  text-size: 12
                  text-allow-overlap: false
                  text-padding: 12
              paint:
                  text-color: "#ff0000"
                  text-halo-color: "#ffffff"
                  text-halo-width: 2
              source: "{sourceCode}"
              source-layer: "{sourceCode}"

        raster:
            - id: "{sourceCode}"
              type: "raster"
              paint:
                  raster-opacity: 1.0
              source: "{sourceCode}"
qh_planning_classify:
  enabled: true
  interval_sec: 15
  batch_size: 5
  read_content: true
  max_inline_bytes: 15728640
