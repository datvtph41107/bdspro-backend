server:
    port: 8230
    tcp_port: 8219

eureka:
    url: localhost
    port: 8761

database:
    dsn: host=14.225.210.29 user=hieubap password=Matkhau.1 dbname=db_tqd port=5433 sslmode=disable
    # dsn: host=localhost user=admin password=123 dbname=postgres port=5432 sslmode=disable

key:
    jwt: key-generate-jwt-token-authentication

jwt:
    key-generate: key-generate-jwt-token-authentication
    tokenPrefix: Bearer
    tokenExpirationAfterDays: 14
    accessExpAfterMinutes: 1 # access token hết hạn 15 phút
    refreshExpAfterMinutes: 129600 # refresh token có hạn là 3 tháng
    listPermit:
    authorizationHeader: Authorization

quota:
    enabled: true
    policy_file: "config/quota_policy.yml"

layer:
    # Base URL configuration
    base_url: "http://14.225.210.29:8032"

    # Default style templates
    default_styles:
        vector:
            - id: "{sourceCode}_fill"
              type: "fill"
              maxzoom: 22
              paint:
                  fill-color: ["get", "label_stroke_color"]
                  fill-opacity: 0.3
              source: "{sourceCode}"
              source-layer: "{sourceCode}"
            - id: "{sourceCode}_outline"
              type: "line"
              minzoom: 16
              paint:
                  line-color: ["get", "label_stroke_color"]
                  line-width: 1
              source: "{sourceCode}"
              source-layer: "{sourceCode}"

        raster:
            - id: "{sourceCode}"
              type: "raster"
              paint:
                  raster-opacity: 1.0
              source: "{sourceCode}"