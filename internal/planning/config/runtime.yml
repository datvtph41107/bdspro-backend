rpc:
  user:
    address: "localhost:8201"
  auth:
    address: "localhost:8216"
  notification:
    address: "localhost:8204"

server:
    port: 8230
    tcp_port: 8219

eureka:
    url: localhost
    port: 8761

database:
    dsn: ""
    # dsn example intentionally omitted; use an untracked local configuration
key:
    jwt: ""

jwt:
    key-generate: ""
    tokenPrefix: Bearer
    tokenExpirationAfterDays: 14
    accessExpAfterMinutes: 15 # access token hết hạn 15 phút
    refreshExpAfterMinutes: 129600 # refresh token có hạn là 3 tháng
    listPermit:
    authorizationHeader: Authorization

redis:
    host: localhost:6379
    pass: ""

config-app:
    qhpro:
        domain_api: "http://localhost:8000"
        domain_file: "http://localhost:8002"
        domain_pmtile: "http://localhost:8000"
        domain_style: "http://localhost:8000"

# Layer configuration
layer:
    # Base URL configuration
    base_url: "ciproto://localhost:8000"

    # Default style templates
    default_styles:
        vector:
            - id: "{sourceCode}_fill"
              type: "fill"
              maxzoom: 22
              paint:
                  fill-color: ["get", "color"]
                  fill-opacity: 0.8
              source: "{sourceCode}"
              source-layer: "{sourceCode}"
            - id: "{sourceCode}_outline"
              type: "line"
              minzoom: 16
              paint:
                  line-color: ["get", "color"]
                  line-width: 1
              source: "{sourceCode}"
              source-layer: "{sourceCode}"
            - id: "{sourceCode}_label"
              type: "symbol"
              minzoom: 16
              layout:
                  text-field: ["get", "name"]
                  text-size: 13
                  text-allow-overlap: false
                  text-padding: 12
              paint:
                  text-color: "#ff0000"
                  text-halo-color: "#ffffff"
                  text-halo-width: 2
              source: "{sourceCode}"
              source-layer: "{sourceCode}"

        raster:
            - id: "{sourceCode}"
              type: "raster"
              paint:
                  raster-opacity: 1.0
              source: "{sourceCode}"

