root = "."
testdata_dir = "testdata"
tmp_dir = ".tmp/air"

[build]
  args_bin = ["grpc"]
  bin = "./.tmp/air/organization-service"
  cmd = "go build -o ./.tmp/air/organization-service ."
  delay = 1000
  exclude_dir = ["assets", ".tmp", "bin", "vendor", "testdata", "docs"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", "yml", "yaml"]
  include_file = []
  kill_delay = "500ms"
  log = ".tmp/build-errors.log"
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_root = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
