syntax = "proto3";

package chat;

option go_package = "./chatpb";

import "google/protobuf/any.proto";

message ChatMessage {
    uint64 from = 1;
    uint64 to = 2;
    string message = 3;
}

message CreateRoom {
    string room_name = 1;
    repeated uint64 members = 2;
}

message ChatAction {
    string type = 1;
    google.protobuf.Any data = 2;
}

message ChatReturn {
    string type = 1;
    google.protobuf.Any data = 2;
}