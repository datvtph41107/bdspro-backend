# Non-sensitive defaults shared by every deployment. Runtime endpoints and
# secrets are supplied through environment variables.
rpc:
  user:
    address: "localhost:8201"
  notification:
    address: "localhost:8204"
  bdspro:
    address: "localhost:8202"

server:
  port: 8006
  tcp_port: 8209

eureka:
  url: localhost
  port: 8761

database:
  dsn: host=localhost user=postgres password=postgres dbname=db_social port=5432 sslmode=disable

key:
  jwt: key-generate-jwt-token-authentication

jwt:
  key-generate: key-generate-jwt-token-authentication
  tokenPrefix: Bearer
  tokenExpirationAfterDays: 14
  accessExpAfterMinutes: 15 # access token hết hạn 5 phút
  refreshExpAfterMinutes: 129600 # refresh token có hạn là 3 tháng
  listPermit:
  authorizationHeader: Authorization

redis:
  host: localhost:6379
  pass: ""
