syntax = "proto3";

package bdspropb;

import "google/api/annotations.proto";
import "bdspro/common.proto";
import "shared/common.proto";
import "bdspro/tx_type.proto";
import "bdspro/internal_tx.proto";

option go_package = "pb/types/bdspro;bdspropb";

service TxService {
    rpc ListTransactions(TransactionListRequest) returns (TransactionListResponse) {
        option (google.api.http) = {
            get: "/v2.1/transaction/list"
        };
    }

    rpc GetTransaction(sharepb.IdRequest) returns (TransactionResponse) {
        option (google.api.http) = {
            get: "/v2.1/transaction/detail/{id}"
        };
    }

    rpc CreateTransaction(TxCreateTransactionRequest) returns (TransactionResponse) {
        option (google.api.http) = {
            post: "/v2.1/transaction"
            body: "*"
        };
    }

    rpc ApproveTransaction(sharepb.IdRequest) returns (TransactionResponse) {
        option (google.api.http) = {
            post: "/v2.1/transaction/{id}/approve"
            body: "*"
        };
    }

    rpc CreateProductAction(CreateProductActionRequest) returns (ActionResponse) {
        option (google.api.http) = {
            post: "/v2.1/transaction/product/action"
            body: "*"
        };
    }

    rpc ListProductTransactions(sharepb.IdRequest) returns (TransactionListResponse) {
        option (google.api.http) = {
            get: "/v2.1/transaction/deal/{id}"
        };
    }
}

service AdminTxService {
    rpc AdminListTransactions(AdminTransactionListRequest) returns (TransactionListResponse) {
        option (google.api.http) = {
            get: "/v2.1/transaction/admin/list"
        };
    }
}

message TxCreateTransactionRequest {
    string transaction_name = 1;
    string description = 2;
    string transaction_type = 3;
    string transaction_status = 4;
    string transaction_date = 5;
    string transaction_amount = 6;
    string transaction_currency = 7;
}

message CreateTransactionResponse {
    string transaction_id = 1;
}

// message CreateSignTransactionRequest {
//     string transaction_id = 1;
// }

// message CreateSignTransactionResponse {
//     string transaction_id = 1;
// }

message TransactionListRequest {
    uint64 page = 1;
    uint64 size = 2;
    uint64 toId = 3;
    OwnerType toOf = 4;
    TransactionStatus status = 5;
    TransactionMethod method = 6;
}

message AdminTransactionListRequest {
    uint64 page = 1;
    uint64 size = 2;
    uint64 organizationId = 3;
    TransactionStatus status = 4;
    TransactionMethod method = 5;
    string search = 6;
}

message CreateProductActionRequest {
    uint64 transactionId = 1;
    string action = 2;
    string actionStatus = 3;
    string actionDate = 4;
    string actionNote = 5;
    string fromId = 6;
    string toId = 7;
    string actionAmount = 8;
    string actionCurrency = 9;
}

message ContractProcess {
    string statusName = 1;
    string timestamp = 2;
    string code = 3;
    uint64 transactionId = 4;
    string color = 5;
    string bgColor = 6;
    string borderColor = 7;
}
message ContractProcessResponse {
    repeated ContractProcess data = 1;
}