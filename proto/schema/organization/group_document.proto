syntax = "proto3";

package organizationpb;

import "google/api/annotations.proto";

option go_package = "pb/types/organization;organizationpb";

service GroupDocumentService {
    rpc CreateGroupDocument(CreateGroupDocumentRequest) returns (CreateGroupDocumentResponse) {
        option (google.api.http) = {
            post: "/v2/org/group/document"
            body: "*"
        };
    }

    rpc UpdateGroupDocument(UpdateGroupDocumentRequest) returns (UpdateGroupDocumentResponse) {
        option (google.api.http) = {
            put: "/v2/org/group/document/{id}"
            body: "*"
        };
    }

    rpc DeleteGroupDocument(DeleteGroupDocumentRequest) returns (DeleteGroupDocumentResponse) {
        option (google.api.http) = {
            delete: "/v2/org/group/document/{id}"
        };
    }

    rpc GetGroupDocument(GetGroupDocumentRequest) returns (GetGroupDocumentResponse) {
        option (google.api.http) = {
            get: "/v2/org/group/document/detail/{id}"
        };
    }
    
    rpc GetGroupDocuments(GetGroupDocumentsRequest) returns (GetGroupDocumentsResponse) {
        option (google.api.http) = {
            get: "/v2/org/group/document/list/{groupId}"
        };
    }
}

message CreateGroupDocumentRequest {
    uint32 groupId = 1;
    string name = 2;
    string description = 3;
    string fileUrl = 4;
    string fileType = 5;
    uint64 fileSize = 6;
}

message CreateGroupDocumentResponse {
    uint32 id = 1;
}

message UpdateGroupDocumentRequest {
    uint32 id = 1;
    string name = 2;
    string description = 3;
    string fileUrl = 4;
    string fileType = 5;
    uint64 fileSize = 6;
}

message UpdateGroupDocumentResponse {
    uint32 id = 1;
}

message DeleteGroupDocumentRequest {
    uint32 id = 1;
}

message DeleteGroupDocumentResponse {
    uint32 id = 1;
}

message GetGroupDocumentRequest {
    uint32 id = 1;
}

message GetGroupDocumentResponse {
    GroupDocument document = 1;
}

message GetGroupDocumentsRequest {
    uint32 groupId = 1;
    optional uint32 page = 2;
    optional uint32 size = 3;
}

message GetGroupDocumentsResponse {
    repeated GroupDocument data = 1;
    uint32 total = 2;
}

message GroupDocument {
    uint32 id = 1;
    uint32 groupId = 2;
    string name = 3;
    string description = 4;
    string fileUrl = 5;
    string fileType = 6;
    uint64 fileSize = 7;
    string createdAt = 8;
    string updatedAt = 9;
    string uploader = 10;
} 