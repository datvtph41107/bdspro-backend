syntax = "proto3";

package authpb;
option go_package = "pb/types/auth;authpb";

import "google/api/annotations.proto";
import "shared/common.proto";
import "auth/color.proto";

// Role message
message Role {
  uint64 id = 1;
  string roleName = 2;
  string roleDescription = 3;
  string key = 4;
  repeated uint64 permissionIds = 5;
  uint64 organizationId = 6;
  repeated sharepb.Permission permissions = 7;
  bool isDefault = 8;
  string domainType = 9;
  optional uint64 colorId = 10;
  optional sharepb.Color color = 11;
  optional uint64 roleGroupId = 12;
  optional string roleGroupName = 13;
  bool allowAssign = 14;
  uint32 roleKey = 15;
  string createdAt = 16;
  string updatedAt = 17;
}

// Role request/response messages
message RoleRequest {
  // id chỉ dùng cho update, create thì không cần truyền
  uint64 id = 1;
  string roleName = 2;
  string roleDescription = 3;
  string key = 4;
  repeated uint64 permissionIds = 5;
  uint64 organizationId = 6;
  bool isDefault = 7;
  string domainType = 8;
  optional uint64 colorId = 9;
  optional uint64 roleGroupId = 10;
  bool allowAssign = 11;
  uint32 roleKey = 12;
}

message RoleListResponse {
  repeated sharepb.Role data = 1;
  uint32 totalElements = 2;
}

message AddPermissionToRoleRequest {
  uint64 roleId = 1;
  repeated uint64 permissionIds = 2;
}

message PermissionListResponse {
  repeated sharepb.Permission data = 1;
  uint64 totalElements = 2;
}

message RoleSearchRequest {
  uint32 page = 1;
  uint32 size = 2;
  uint32 scope = 3;
  uint32 domainType = 4;
  string name = 5;
  optional bool isDefault = 6;
  optional uint64 roleGroupId = 7;
}

// Role Service
service RoleService {
  rpc GetListRole(RoleSearchRequest) returns (RoleListResponse) {
    option (google.api.http) = {
      get: "/v2/auth/role/list"
    };
  };
  rpc CreateRole(RoleRequest) returns (sharepb.Role) {
    option (google.api.http) = {
      post: "/v2/auth/role"
      body: "*"
    };
  };
  rpc UpdateRole(RoleRequest) returns (sharepb.Role) {
    option (google.api.http) = {
      put: "/v2/auth/role/{id}"
      body: "*"
    };
  };
  rpc DeleteRole(sharepb.IdRequest) returns (sharepb.SubmitResponse) {
    option (google.api.http) = {
      delete: "/v2/auth/role/{id}"
    };
  };
  rpc GetRoleById(sharepb.IdRequest) returns (sharepb.Role) {
    option (google.api.http) = {
      get: "/v2/auth/role/detail/{id}"
    };
  };
  rpc GetRolesByOrganization(sharepb.IdRequest) returns (RoleListResponse) {
    option (google.api.http) = {
      get: "/v2/auth/role/organization/{id}"
    };
  };
  rpc AddPermissionToRole(AddPermissionToRoleRequest) returns (sharepb.SubmitResponse) {
    option (google.api.http) = {
      post: "/v2/auth/role/permissions"
      body: "*"
    };
  };
  rpc GetRolesByGroupKey(GetRolesByGroupKeyRequest) returns (RoleListResponse) {
    option (google.api.http) = {
      get: "/v2/auth/role/by-group/{groupKey}"
    };
  };
  rpc GetRolesByModuleCode(GetRolesByGroupKeyRequest) returns (RoleListResponse) {
    option (google.api.http) = {
      get: "/v2/auth/role/by-module/{code}"
    };
  };
  rpc AssignRoleToUser(AssignRoleToUserRequest) returns (AssignRoleToUserResponse) {
    option (google.api.http) = {
      post: "/v2/auth/role/assign-user"
      body: "*"
    };
  };
}

// Permission Service
service PermissionService {
  rpc GetPermissionById(sharepb.IdRequest) returns (sharepb.Permission);

  // Giữ nguyên contract production: lọc permission theo module.
  rpc GetPermissionsByModule(sharepb.IdRequest) returns (PermissionListResponse) {
    option (google.api.http) = {
      get: "/v2/auth/permission/module/{id}"
    };
  };

  rpc GetAllPermissions(sharepb.IdRequest) returns (PermissionListResponse) {
    option (google.api.http) = {
      get: "/v2/auth/permission/all"
    };
  };
  rpc GetPermissionKeys(sharepb.Empty) returns (PermissionKeysResponse) {
    option (google.api.http) = {
      get: "/v2/auth/permission/me"
    };
  };
  rpc GetPermissionByGroupId(sharepb.IdRequest) returns (PermissionKeysResponse) {
    option (google.api.http) = {
      get: "/v2/auth/permission/group/{id}"
    };
  };
  
  rpc GetPermissionByDealId(sharepb.IdRequest) returns (PermissionKeysResponse) {
    option (google.api.http) = {
      get: "/v2/auth/permission/deal/{id}"
    };
  };
  
  rpc GetPermissionByBranchId(sharepb.IdRequest) returns (PermissionKeysResponse) {
    option (google.api.http) = {
      get: "/v2/auth/permission/branch/{id}"
    };
  };

  // Giữ nguyên contract production cho client quản trị cũ.
  rpc GetPermissionByOrganizationId(sharepb.IdRequest) returns (PermissionKeysResponse) {
    option (google.api.http) = {
      get: "/v2/auth/permission/organization/{id}"
    };
  };
}



message PermissionKeysResponse {
  repeated string keys = 1;
  optional sharepb.Role role = 2;
}

// Get roles by group key request
message GetRolesByGroupKeyRequest {
  uint32 groupKey = 1;
  string code = 2;
}

// Assign role to user messages
message AssignRoleToUserRequest {
  uint64 userId = 1;
  uint64 roleId = 2;
}

message AssignRoleToUserResponse {
  sharepb.Role assignedRole = 1;
  string message = 2;
}
