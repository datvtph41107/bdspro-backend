syntax = "proto3";

package paymentpb;

option go_package = "pb/types/payment;paymentpb";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// AdminCommerceService chỉ chiếu dữ liệu Payment-service sở hữu. Mọi thay
// đổi trạng thái phải đi qua usecase idempotent, không cho frontend ghi DB.
service AdminCommerceService {
  rpc ListPaymentOrders(ListAdminPaymentOrdersRequest) returns (ListAdminPaymentOrdersResponse) {
    option (google.api.http) = { get: "/v2/payment/admin/commercial/orders" };
  }
  rpc GetPaymentOrder(GetAdminPaymentOrderRequest) returns (AdminPaymentOrder) {
    option (google.api.http) = { get: "/v2/payment/admin/commercial/orders/{order_id}" };
  }
  rpc ConfirmPaymentFunds(ConfirmAdminPaymentFundsRequest) returns (ConfirmAdminPaymentFundsResponse) {
    option (google.api.http) = {
      post: "/v2/payment/admin/commercial/orders/{order_id}:confirm-funds"
      body: "*"
    };
  }
  rpc ListFulfillments(ListAdminFulfillmentsRequest) returns (ListAdminFulfillmentsResponse) {
    option (google.api.http) = { get: "/v2/payment/admin/commercial/fulfillments" };
  }
  rpc RedriveFulfillment(RedriveAdminFulfillmentRequest) returns (RedriveAdminFulfillmentResponse) {
    option (google.api.http) = {
      post: "/v2/payment/admin/commercial/fulfillments/{fulfillment_id}:redrive"
      body: "*"
    };
  }
}

message ListAdminPaymentOrdersRequest {
  uint32 page = 1;
  uint32 page_size = 2;
  string subject_kind = 3;
  string subject_id = 4;
  string status = 5;
  string reference = 6;
}

message ListAdminPaymentOrdersResponse {
  repeated AdminPaymentOrder orders = 1;
  uint64 total = 2;
  uint32 page = 3;
  uint32 page_size = 4;
}

message GetAdminPaymentOrderRequest { uint64 order_id = 1; }

message AdminPaymentOrder {
  uint64 order_id = 1;
  string reference = 2;
  string subject_kind = 3;
  string subject_id = 4;
  string product_code = 5;
  string plan_code = 6;
  uint64 plan_version_id = 7;
  string plan_version = 8;
  int32 tier_rank = 9;
  int32 subscription_term_days = 10;
  string terms_checksum = 11;
  string currency = 12;
  int64 amount_minor = 13;
  string status = 14;
  google.protobuf.Timestamp expires_at = 15;
  google.protobuf.Timestamp funds_confirmed_at = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
  repeated AdminPaymentAttempt attempts = 19;
  AdminSettlement settlement = 20;
  AdminFulfillment fulfillment = 21;
  AdminManualPaymentConfirmation manual_confirmation = 22;
}

message AdminManualPaymentConfirmation {
  string actor_id = 1;
  string reason = 2;
  string command_key = 3;
  string outcome = 4;
  google.protobuf.Timestamp created_at = 5;
}

message ConfirmAdminPaymentFundsRequest {
  uint64 order_id = 1;
  string reason = 2;
}

message ConfirmAdminPaymentFundsResponse {
  AdminPaymentOrder order = 1;
  bool changed = 2;
  bool replay = 3;
}

message AdminPaymentAttempt {
  uint64 attempt_id = 1;
  uint64 order_id = 2;
  string command_key = 3;
  string method = 4;
  string provider = 5;
  string provider_reference = 6;
  string status = 7;
  string next_action_kind = 8;
  string failure_code = 9;
  string failure_detail = 10;
  google.protobuf.Timestamp expires_at = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message AdminSettlement {
  uint64 settlement_id = 1;
  uint64 order_id = 2;
  string provider = 3;
  string provider_transaction_id = 4;
  string reference = 5;
  string currency = 6;
  int64 amount_minor = 7;
  google.protobuf.Timestamp occurred_at = 8;
  string status = 9;
  string review_reason = 10;
  google.protobuf.Timestamp created_at = 11;
}

message AdminFulfillment {
  uint64 fulfillment_id = 1;
  uint64 order_id = 2;
  string status = 3;
  int32 attempt_count = 4;
  google.protobuf.Timestamp available_at = 5;
  string locked_by = 6;
  uint64 claim_version = 7;
  google.protobuf.Timestamp lease_until = 8;
  string last_error = 9;
  google.protobuf.Timestamp completed_at = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message ListAdminFulfillmentsRequest {
  uint32 page = 1;
  uint32 page_size = 2;
  string status = 3;
  uint64 order_id = 4;
}

message ListAdminFulfillmentsResponse {
  repeated AdminFulfillmentItem fulfillments = 1;
  uint64 total = 2;
  uint32 page = 3;
  uint32 page_size = 4;
}

message AdminFulfillmentItem {
  AdminFulfillment fulfillment = 1;
  AdminPaymentOrder order = 2;
}

message RedriveAdminFulfillmentRequest {
  uint64 fulfillment_id = 1;
  string reason = 2;
}

message RedriveAdminFulfillmentResponse {
  uint64 fulfillment_id = 1;
  bool changed = 2;
  bool replay = 3;
  string status = 4;
}
