syntax = "proto3";

package notificationpb;
option go_package = "pb/types/notification;notificationpb";
import "notification/property_history.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "shared/common.proto";
import "notification/notification.proto";
import "shared/v3.proto";


// InternalNotificationService định nghĩa các RPC nội bộ cho notification service
service InternalNotificationService {
    // @deprecated: không dùng nữa thay bằng CreateToOwner(NotificationRequest)
    rpc Create (sharepb.NotificationRequest) returns (NotificationDTO);
    rpc SendBatch (NotiBatchRequest) returns (BatchResponse);
    rpc PushByToken (PushTokenRequest) returns (PushResponse);
    rpc PushByTopic (PushTopicRequest) returns (PushResponse);
    rpc PushByUserId (PushByUserIdRequest) returns (PushResponse);
    rpc CreateAdminHistory (AdminHistoryCreateRequest) returns (AdminHistoryDTO);
    rpc CreateAdminHistoryBatch (AdminHistoryBatchRequest) returns (BatchResponse);
    // Tạo deal history (internal RPC)
    rpc CreateDealHistory(CreateDealHistoryRequest) returns (CreateDealHistoryResponse);
    rpc CreateHistoryAuth(HistoryAuthCreateRequest) returns (HistoryAuthDTO);
    
    rpc CreateToOwner(sharepb.NotificationRequest) returns (NotificationDTO);
    rpc RemoveToOwner(sharepb.NotificationRequest) returns (NotificationDTO);
    rpc BatchPersonConfig(BatchPersonConfigRequest) returns (BatchPersonConfigResponse);
    rpc GetPersonConfigs(GetPersonConfigsRequest) returns (GetPersonConfigsResponse);

    // property_history 
    rpc CreatePropertyHistoryActivity(CreatePropertyHistoryRequest) returns (CreatePropertyHistoryResponse);
}

// ===== NOTIFICATION MESSAGES =====
message NotiBatchRequest {
  repeated sharepb.NotificationRequest datas = 1;
  bool sendToDevice = 2;
}

message BatchResponse {
  bool success = 1;
  repeated uint64 data = 2;
}

// ===== ADMIN HISTORY MESSAGES =====
message AdminActionStatsResponse {
  map<string, int32> action_counts = 1;
  int32 total_actions = 2;
}


message AdminHistoryCreateRequest {
    uint64 targetId = 1;
    int32 targetType = 2;
    int32 actionType = 3;
    string title = 4;
    repeated string note = 5;
    string preStage = 6;
    string afterStage = 7;
    uint64 adminId = 8;
    optional uint64 ownerId = 9;
    int32 ownerType = 10;
    bool isInternal = 11;
    string adminRole = 12;
    string ipAddress = 13;
    string userAgent = 14;
}

message AdminHistoryBatchRequest {
    repeated AdminHistoryCreateRequest datas = 1;
}

// ===== DEAL HISTORY MESSAGES =====

// CreateDealHistoryRequest request để tạo deal history
message CreateDealHistoryRequest {
  uint64 deal_id = 1;
  uint64 actor_id = 2;
  string actor_name = 3;
  string actor_avatar = 4;
  string action_type = 5;
  string action_name = 6;
  string content = 7;
  google.protobuf.Struct metadata = 8;
}

// CreateDealHistoryResponse response khi tạo deal history
message CreateDealHistoryResponse {
  bool success = 1;
  string message = 2;
  uint64 id = 3;
}

message HistoryAuthCreateRequest {
  uint64 userId = 1;
  optional uint64 organizationId = 2;
  string actionType = 3;
  string actionName = 4;
  string description = 5;
  bool success = 6;
  string reason = 7;
  string ipAddress = 8;
  string userAgent = 9;
  google.protobuf.Struct metadata = 10;
  optional uint64 performedBy = 11;
  string sessionId = 12;
  string channel = 13;
  string deviceId = 14;
  string location = 15;
  string additionalNote = 16;
  string sourceService = 17;
}

message HistoryAuthDTO {
  uint64 id = 1;
  uint64 userId = 2;
  optional uint64 organizationId = 3;
  string actionType = 4;
  string actionName = 5;
  string description = 6;
  bool success = 7;
  string reason = 8;
  string ipAddress = 9;
  string userAgent = 10;
  google.protobuf.Struct metadata = 11;
  optional uint64 performedBy = 12;
  string sessionId = 13;
  string channel = 14;
  string deviceId = 15;
  string location = 16;
  string additionalNote = 17;
  string sourceService = 18;
  string createdAt = 19;
}

// ===== PERSON CONFIG MESSAGES =====
message BatchPersonConfigRequest {
  repeated sharepb.PersonConfigV3Proto configs = 1;
}

message BatchPersonConfigResponse {
  bool success = 1;
  repeated sharepb.PersonConfigV3Proto data = 2;
}

message GetPersonConfigsRequest {
  uint64 userId = 1;
}

message GetPersonConfigsResponse {
  bool success = 1;
  repeated sharepb.PersonConfigV3Proto data = 2;
}

// ===== PUSH NOTIFICATION MESSAGES =====
message PushByUserIdRequest {
  uint64 userId = 1;
  string title = 2;
  string body = 3;
  map<string, string> data = 4; // Optional data payload
}