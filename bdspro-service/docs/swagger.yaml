basePath: /bdspro
definitions:
  data.NewProductRequest:
    properties:
      area:
        type: number
      code:
        type: string
      description:
        type: string
      name:
        type: string
      note:
        type: string
      price:
        type: integer
    type: object
  data.ProductSaveRequest:
    properties:
      area:
        type: number
      code:
        type: string
      description:
        type: string
      name:
        type: string
      note:
        type: string
      price:
        type: integer
    type: object
  data.StatusRequest:
    type: object
  data.StatusResponse:
    type: object
  models.District:
    properties:
      code:
        type: integer
      id:
        type: integer
      name:
        type: string
      province:
        $ref: '#/definitions/models.Province'
      province_id:
        type: integer
      updated_at:
        type: string
    type: object
  models.DocType:
    properties:
      active:
        description: true = đang sử dụng, false = ẩn
        type: boolean
      createdAt:
        type: string
      createdBy:
        description: gorm.Model
        type: integer
      id:
        type: integer
      name:
        type: string
      updatedAt:
        type: string
      updatedBy:
        type: integer
    type: object
  models.PropertyType:
    properties:
      active:
        description: true = đang sử dụng, false = ẩn
        type: boolean
      createdAt:
        type: string
      createdBy:
        description: gorm.Model
        type: integer
      id:
        type: integer
      name:
        type: string
      updatedAt:
        type: string
      updatedBy:
        type: integer
    type: object
  models.Province:
    properties:
      code:
        type: integer
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  models.Ward:
    properties:
      code:
        type: integer
      district:
        $ref: '#/definitions/models.District'
      district_id:
        type: integer
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
