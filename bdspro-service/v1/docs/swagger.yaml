      note:
        type: string
      parentId:
        type: integer
      price:
        $ref: '#/definitions/models.ProductPrice'
      productPrivate:
        $ref: '#/definitions/models.ProductPrivate'
      projectId:
        type: integer
      propertyTypeId:
        type: integer
      provinceId:
        type: integer
      transactionType:
        type: integer
      wardId:
        type: integer
    required:
    - area
    - name
    - price
    type: object
  u_product_dto.StatusUpdate:
    properties:
      productId:
        type: integer
      status:
        $ref: '#/definitions/enums.ProductStatus'
    required:
    - productId
    - status
    type: object
  u_product_dto.VisibilityUpdate:
    properties:
      productId:
        type: integer
      visibility:
        $ref: '#/definitions/enums.VisibilityStatus'
    required:
    - productId
    - visibility
    type: object
info:
  contact: {}
  description: API phần logic chính của BĐSPro
  title: BDSPRO API
  version: "1.0"
paths:
  /admin/amenity:
    get:
      consumes:
      - application/json
      description: Trả về danh sách tất cả các Tiện ích
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Amenity'
            type: array
        "500":
          description: Không thể lấy danh sách
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lấy danh sách Tiện ích
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: Thêm một Tiện ích mới vào hệ thống
      parameters:
      - description: Thông tin Tiện ích
        in: body
        name: Amenity
        required: true
        schema:
          $ref: '#/definitions/models.Amenity'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Amenity'
        "400":
          description: Dữ liệu không hợp lệ
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Không thể tạo dữ liệu
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Tạo Tiện ích mới
      tags:
      - Admin
  /admin/amenity/{id}:
    delete:
      consumes:
      - application/json
      description: Xóa Tiện ích theo ID (soft delete)
      parameters:
      - description: ID của Tiện ích
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Trạng thái xóa
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: ID không hợp lệ
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Không thể xóa dữ liệu
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Xóa Tiện ích
      tags:
      - Admin
    get:
      consumes:
      - application/json
      description: Trả về thông tin chi tiết của một Tiện ích
      parameters:
      - description: ID của Tiện ích
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Amenity'
        "400":
          description: ID không hợp lệ
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Không tìm thấy dữ liệu
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lấy thông tin Tiện ích theo ID
      tags:
      - Admin
    put:
      consumes:
      - application/json
      description: Cập nhật thông tin Tiện ích theo ID
      parameters:
      - description: ID của Tiện ích
        in: path
        name: id
        required: true
        type: integer
      - description: Thông tin Tiện ích mới
        in: body
        name: Amenity
        required: true
        schema:
          $ref: '#/definitions/models.Amenity'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Amenity'
        "400":
          description: ID không hợp lệ
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Không thể cập nhật dữ liệu
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cập nhật thông tin Tiện ích
      tags:
      - Admin
  /admin/apartment:
    post:
      consumes:
      - application/json
      description: Thêm một Tòa nhà trong dự án mới vào hệ thống
      parameters:
      - description: Thông tin Tòa nhà trong dự án
        in: body
        name: Apartments
        required: true
        schema:
          $ref: '#/definitions/data.ApartmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/data.ApartmentRequest'
        "400":
          description: Dữ liệu không hợp lệ
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Không thể tạo dữ liệu
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Tạo Tòa nhà trong dự án mới
      tags:
