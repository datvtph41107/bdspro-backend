basePath: /bdspro
definitions:
  data.ApartmentRequest:
    properties:
      attribute:
        $ref: '#/definitions/models.ApartmentAttribute'
      buildId:
        type: integer
      elements:
        items:
          $ref: '#/definitions/models.Apartment'
        type: array
    type: object
  data.HouseInfoUpdate:
    properties:
      furniture:
        description: 'Nội thất: "full", "partial", "none"'
        type: string
      numBathroom:
        description: Số WC (optional)
        type: integer
      numBedroom:
        description: house info
        type: integer
      numCarPark:
        description: Số chỗ để ôtô
        type: integer
      numFloor:
        description: Số tầng (optional)
        type: integer
      numFront:
        description: Số mặt tiền
        type: integer
      orientation:
        description: Hướng nhà (Đông, Tây, Nam,...)
        type: string
    type: object
  data.MediaItem:
    properties:
      isMain:
        type: boolean
      mediaType:
        type: string
      mediaUrl:
        type: string
      order:
        type: integer
    type: object
  data.NewProductRequest:
    properties:
      area:
        type: number
      code:
        type: string
      description:
        type: string
      name:
        type: string
      note:
        type: string
      price:
        type: integer
    type: object
  data.ProductSaveRequest:
    properties:
      amenityIds:
        items:
          type: integer
        type: array
      area:
        type: number
      code:
        type: string
      description:
        type: string
      docTypeId:
        type: integer
      houseInfo:
        $ref: '#/definitions/data.HouseInfoUpdate'
      mediaItems:
        items:
          $ref: '#/definitions/data.MediaItem'
        type: array
      name:
        type: string
      note:
        type: string
      price:
        type: integer
      projectId:
        type: integer
      propertyTypeId:
        type: integer
    type: object
  data.StatusRequest:
    type: object
  data.StatusResponse:
    type: object
  models.Amenity:
    properties:
      active:
        type: boolean
      createdAt:
        type: string
      createdBy:
        description: gorm.Model
        type: integer
      id:
        type: integer
      name:
        type: string
      updatedAt:
        type: string
      updatedBy:
        type: integer
    type: object
  models.Apartment:
    properties:
      archived:
        type: integer
      attributeId:
        type: integer
      buildId:
        type: integer
      createdAt:
        type: string
      createdBy:
