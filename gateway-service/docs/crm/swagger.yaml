basePath: /v2/crm
definitions:
  domain.ContactEntity:
    properties:
      createdAt:
        type: string
      createdBy:
        description: gorm.Model
        type: integer
      fullName:
        type: string
      id:
        type: integer
      ownerId:
        type: integer
      ownerType:
        $ref: '#/definitions/enums.EOwnerType'
      phone:
        description: OwnerID   uint64  `gorm:"column:owner_id" json:"ownerId"` =>
          createdBy
        type: string
      updatedAt:
        type: string
      updatedBy:
        type: integer
    required:
    - fullName
    - ownerType
    type: object
  domain.CustomerEntity:
    properties:
      address:
        type: string
      assignNote:
        type: string
      birthday:
        type: string
      chargeId:
        type: integer
      chargeType:
        $ref: '#/definitions/enums.EOwnerType'
      contactId:
        type: integer
      createdAt:
        type: string
      createdBy:
        description: gorm.Model
        type: integer
      customerSource:
        $ref: '#/definitions/enums.ESourceCustomer'
      email:
        type: string
      fullName:
        type: string
      id:
        type: integer
      note:
        type: string
      ownerId:
        type: integer
      ownerType:
        $ref: '#/definitions/enums.EOwnerType'
      phone:
        type: string
      pipelineId:
        type: integer
      stageId:
        type: integer
      updatedAt:
        type: string
      updatedBy:
        type: integer
    required:
    - fullName
    - ownerId
    - ownerType
    type: object
  domain.GroupEntity:
    properties:
      backgroundColor:
        type: string
      createdAt:
        type: string
      createdBy:
        description: gorm.Model
        type: integer
      id:
        type: integer
      name:
        type: string
      textColor:
        type: string
      updatedAt:
        type: string
      updatedBy:
        type: integer
    type: object
  domain.PipelineEntity:
    properties:
      active:
        type: boolean
      color:
        type: string
      createdAt:
        type: string
      createdBy:
        description: gorm.Model
        type: integer
      id:
        type: integer
      ownerId:
        type: integer
      ownerType:
        $ref: '#/definitions/enums.EOwnerType'
      pipelineName:
        type: string
      updatedAt:
        type: string
      updatedBy:
        type: integer
    required:
    - ownerId
    - ownerType
    - pipelineName
    type: object
  domain.RuleEntity:
    properties:
      active:
        type: boolean
      condition:
        $ref: '#/definitions/enums.ECondition'
      conditionValue:
        type: string
      createdAt:
        type: string
      createdBy:
        description: gorm.Model
        type: integer
      id:
        type: integer
      note:
        type: string
      ownerId:
        type: integer
      ownerType:
        $ref: '#/definitions/enums.EOwnerType'
      ruleName:
        type: string
      trigger:
        $ref: '#/definitions/enums.ERule'
      triggerValue:
        type: string
      updatedAt:
        type: string
      updatedBy:
        type: integer
    required:
    - condition
    - conditionValue
    - ruleName
    - trigger
    - triggerValue
    type: object
  domain.StageEntity:
    properties:
      active:
        type: boolean
      createdAt:
        type: string
      createdBy:
        description: gorm.Model
        type: integer
      id:
        type: integer
      orderNumber:
        type: integer
      pipelineId:
        type: integer
      ruleId:
        type: integer
      stageName:
        type: string
      step:
        $ref: '#/definitions/enums.EStep'
      updatedAt:
        type: string
      updatedBy:
        type: integer
    required:
