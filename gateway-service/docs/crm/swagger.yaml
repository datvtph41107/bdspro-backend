  timestamppb.Timestamp:
    properties:
      nanos:
        description: |-
          Non-negative fractions of a second at nanosecond resolution. Negative
          second values with fractions must still have non-negative nanos values
          that count forward in time. Must be from 0 to 999,999,999
          inclusive.
        type: integer
      seconds:
        description: |-
          Represents seconds of UTC time since Unix epoch
          1970-01-01T00:00:00Z. Must be from 0001-01-01T00:00:00Z to
          9999-12-31T23:59:59Z inclusive.
        type: integer
    type: object
info:
  contact: {}
  description: API phần logic chính của CRM. Đã chuyển sang grpc
  title: CRM API
  version: "1.0"
paths:
  /block/{profileId}:
    delete:
      consumes:
      - application/json
      description: Bỏ chặn một người dùng với profileId cụ thể
      parameters:
      - description: ID người dùng cần bỏ chặn
        in: path
        name: profileId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "400":
          description: Yêu cầu không hợp lệ
          schema:
            type: string
        "404":
          description: Không tìm thấy người dùng
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Bỏ chặn một người dùng
      tags:
      - Chặn
    post:
      consumes:
      - application/json
      description: Chặn một người dùng với profileId cụ thể
      parameters:
      - description: ID người dùng cần chặn
        in: path
        name: profileId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "400":
          description: Yêu cầu không hợp lệ
          schema:
            type: string
        "404":
          description: Không tìm thấy người dùng
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Chặn một người dùng
      tags:
      - Chặn
  /block/list:
    get:
      consumes:
      - application/json
      description: Lấy danh sách ID của những người mà người dùng hiện tại đã chặn
      produces:
      - application/json
      responses:
        "400":
          description: Yêu cầu không hợp lệ
          schema:
            type: string
        "404":
          description: Không tìm thấy người dùng
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Lấy danh sách người dùng bị chặn
      tags:
      - Chặn
  /contact:
    post:
      consumes:
      - application/json
      description: Tạo một liên hệ mới với thông tin được cung cấp
      parameters:
      - description: Thông tin cập nhật
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/crmpb.ContactSaveDTO'
      produces:
      - application/json
      responses:
        "400":
          description: Yêu cầu không hợp lệ
          schema:
            type: string
        "409":
          description: Liên hệ đã tồn tại
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Tạo liên hệ mới
      tags:
      - Liên hệ
  /contact/{id}:
    delete:
      consumes:
      - application/json
      description: Xóa một liên hệ khỏi hệ thống
      parameters:
      - description: ID của liên hệ
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Xóa liên hệ
      tags:
      - Liên hệ
    put:
      consumes:
      - application/json
      description: Cập nhật thông tin liên hệ hiện tại
      parameters:
      - description: Thông tin cập nhật
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/crmpb.ContactSaveDTO'
      - description: ID của lời mời kết bạn
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Cập nhật thông tin liên hệ
      tags:
      - Liên hệ
  /contact/detail/{id}:
    get:
      consumes:
      - application/json
      description: Lấy thông tin liên hệ
      parameters:
      - description: ID của liên hệ
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Lấy thông tin liên hệ
