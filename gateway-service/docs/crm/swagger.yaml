info:
  contact: {}
  description: API phần logic chính của CRM. Đã chuyển sang grpc
  title: CRM API
  version: "1.0"
paths:
  /block/{profileId}:
    delete:
      consumes:
      - application/json
      description: Bỏ chặn một người dùng với profileId cụ thể
      parameters:
      - description: ID người dùng cần bỏ chặn
        in: path
        name: profileId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "400":
          description: Yêu cầu không hợp lệ
          schema:
            type: string
        "404":
          description: Không tìm thấy người dùng
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Bỏ chặn một người dùng
      tags:
      - Chặn
    post:
      consumes:
      - application/json
      description: Chặn một người dùng với profileId cụ thể
      parameters:
      - description: ID người dùng cần chặn
        in: path
        name: profileId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "400":
          description: Yêu cầu không hợp lệ
          schema:
            type: string
        "404":
          description: Không tìm thấy người dùng
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Chặn một người dùng
      tags:
      - Chặn
  /block/list:
    get:
      consumes:
      - application/json
      description: Lấy danh sách ID của những người mà người dùng hiện tại đã chặn
      produces:
      - application/json
      responses:
        "400":
          description: Yêu cầu không hợp lệ
          schema:
            type: string
        "404":
          description: Không tìm thấy người dùng
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Lấy danh sách người dùng bị chặn
      tags:
      - Chặn
  /contact:
    post:
      consumes:
      - application/json
      description: Tạo một liên hệ mới với thông tin được cung cấp
      parameters:
      - description: Thông tin cập nhật
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/crmpb.ContactSaveDTO'
      produces:
      - application/json
      responses:
        "400":
          description: Yêu cầu không hợp lệ
          schema:
            type: string
        "409":
          description: Liên hệ đã tồn tại
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Tạo liên hệ mới
      tags:
      - Liên hệ
  /contact/{id}:
    delete:
      consumes:
      - application/json
      description: Xóa một liên hệ khỏi hệ thống
      parameters:
