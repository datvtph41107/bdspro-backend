    - HistoryDelete
    - HistoryAssignRole
    - HistorySettingAuto
    - HistoryReminder
    - HistoryCreateCustomer
    - HistoryUpdateCustomer
    - HistoryDeleteCustomer
    - HistoryAssignCustomer
    - HistorySwitchStage
    - HistoryUpdateNote
    - HistoryPipelineCreate
    - HistoryPipelineUpdate
    - HistoryPipelineDelete
    - HistoryStageCreate
    - HistoryStageUpdate
    - HistoryStageDelete
    - HistoryRuleCreate
    - HistoryRuleUpdate
    - HistoryRuleDelete
    - HistoryRuleEvent
  enums.EOwnerType:
    enum:
    - 10
    - 20
    - 30
    type: integer
    x-enum-varnames:
    - EOwnerTypeMember
    - EOwnerTypeGroup
    - EOwnerTypeOrgnization
  enums.ERule:
    enum:
    - 10
    - 20
    - 30
    - 40
    type: integer
    x-enum-varnames:
    - RuleThenReminder
    - RuleThenLabel
    - RuleThenAssignLead
    - RuleThenSwitchStage
  enums.ESourceCustomer:
    enum:
    - 10
    - 20
    - 30
    - 40
    - 50
    - 60
    type: integer
    x-enum-varnames:
    - SourceCustomerPost
    - SourceCustomerAdvise
    - SourceCustomerContact
    - SourceCustomerZalo
    - SourceCustomerFacebook
    - SourceCustomerOther
  enums.EStep:
    enum:
    - 10
    - 20
    - 30
    - 40
    - 50
    type: integer
    x-enum-varnames:
    - StepNew
    - StepContacted
    - StepNegotiate
    - StepDeposite
    - StepClose
  enums.ETargetHistory:
    enum:
    - 10
    - 20
    - 30
    - 40
    - 50
    type: integer
    x-enum-varnames:
