      security:
      - BearerAuth: []
      summary: Lấy chi tiết news feed
      tags:
      - News Feed
  /news-feed/public:
    get:
      consumes:
      - application/json
      description: Get global news feed
      parameters:
      - in: query
        name: isReel
        type: boolean
      - in: query
        name: page
        type: integer
      - in: query
        name: size
        type: integer
      - in: query
        name: text
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pb_social.ListNewsFeed'
      security:
      - BearerAuth: []
      summary: Lấy danh sách news feed
      tags:
      - News Feed
  /news-feed/user/{userId}:
    get:
      consumes:
      - application/json
      description: Get news feed by userID
      parameters:
      - description: UserId
        in: path
        name: userId
        required: true
        type: integer
      - in: query
        name: isReel
        type: boolean
      - in: query
        name: page
        type: integer
      - in: query
        name: size
        type: integer
      - in: query
        name: text
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pb_social.ListNewsFeed'
      security:
      - BearerAuth: []
      summary: Lấy danh sách news feed theo userID
