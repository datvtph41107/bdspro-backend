      consumes:
      - application/json
      description: Update visibility of news feed
      parameters:
      - description: NewsFeedId
        in: path
        name: newsFeedId
        required: true
        type: integer
      - description: VisibilityRequest
        in: body
        name: visibility
        required: true
        schema:
          $ref: '#/definitions/pb_social.VisibilityRequest'
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Update visibility of news feed
      tags:
      - News Feed
  /news-feed/detail/{newsFeedId}:
