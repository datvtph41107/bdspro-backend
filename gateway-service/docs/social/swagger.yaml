basePath: /v2/social
definitions:
  pb_bdspro.Post:
    properties:
      comment:
        type: integer
      content:
        type: string
      expiredAt:
        type: string
      hidden:
        type: boolean
      id:
        type: integer
      like:
        type: integer
      mediaList:
        items:
          $ref: '#/definitions/pb_bdspro.PostMedia'
        type: array
      mediaType:
        type: string
      mediaUrl:
        type: string
      numDate:
        type: integer
      numView:
        type: integer
      ownerId:
        type: integer
      ownerType:
        description: '1: user, 2: admin'
        type: integer
      packageVisible:
        description: '1: thường, 2: VIP'
        type: integer
      price:
        type: number
      priceType:
        description: '1: chính thức, 2: thỏa thuận'
        type: integer
      productId:
        type: integer
      status:
        type: integer
      title:
        type: string
      transactionType:
        type: string
      type:
        description: '1: normal, 2: feed, 3: share'
        type: string
      visibility:
        type: string
    type: object
  pb_bdspro.PostMedia:
    properties:
      id:
        type: integer
      orderNumber:
        type: integer
      type:
        type: string
      url:
        type: string
    type: object
  pb_social.CommentListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/pb_social.CommentResponse'
        type: array
      total:
        type: integer
    type: object
  pb_social.CommentRequest:
    properties:
      content:
        type: string
      id:
        type: integer
      newsFeedId:
        type: integer
      page:
        type: integer
      parentId:
        type: integer
      size:
        type: integer
    type: object
  pb_social.CommentResponse:
    properties:
      author:
        $ref: '#/definitions/pb_user.ProfileItem'
      content:
        type: string
      createdBy:
        type: integer
      id:
        type: integer
      newsFeedId:
        type: integer
      numDisLike:
        type: integer
      numLike:
        type: integer
      numReply:
        type: integer
      parentId:
        type: integer
      updatedAt:
        type: string
    type: object
  pb_social.Empty:
    type: object
  pb_social.LikeCommentRequest:
    properties:
      commentId:
        type: integer
      dislike:
        type: boolean
    type: object
  pb_social.LikeResponse:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      targetId:
        type: integer
      targetType:
        type: integer
      userId:
        type: integer
    type: object
  pb_social.ListLikeResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/pb_social.LikeResponse'
        type: array
      total:
        type: integer
    type: object
  pb_social.ListNewsFeed:
    properties:
      data:
        items:
          $ref: '#/definitions/pb_social.NewsFeed'
        type: array
      total:
        type: integer
    type: object
  pb_social.NewsFeed:
    properties:
      author:
        $ref: '#/definitions/pb_user.ProfileItem'
      content:
        type: string
      createdBy:
        type: integer
      disLike:
        type: boolean
      friendTagIds:
        items:
          type: integer
        type: array
      friendTags:
        items:
          $ref: '#/definitions/pb_user.ProfileItem'
        type: array
      id:
        type: integer
      image:
        type: string
      isReel:
        type: boolean
      likeAt:
        type: string
      link:
        type: string
      mediaFeeds:
        items:
          $ref: '#/definitions/pb_social.NewsFeedMedia'
        type: array
      numComment:
        type: integer
      numLike:
        type: integer
      numShare:
        type: integer
      numView:
        type: integer
      post:
        $ref: '#/definitions/pb_bdspro.Post'
      postId:
        type: integer
      title:
        type: string
      updatedAt:
        type: string
      visibility:
        type: integer
    type: object
  pb_social.NewsFeedMedia:
    properties:
      id:
        type: integer
      orderNumber:
        type: integer
      type:
        type: string
      url:
        type: string
    type: object
  pb_social.ReportReason:
    properties:
      active:
        type: boolean
      id:
        type: integer
      reasonName:
        type: string
    type: object
  pb_social.ReportReasonResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/pb_social.ReportReason'
        type: array
      total:
        type: integer
    type: object
  pb_social.ReportRequest:
    properties:
      content:
        type: string
      id:
        type: integer
      newsFeedId:
        type: integer
      reasonId:
        type: integer
    type: object
  pb_social.ReportResponse:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      newsFeedId:
        type: integer
      reasonId:
        type: integer
    type: object
  pb_social.ShareRequest:
    properties:
      content:
        type: string
      newsFeedId:
        type: integer
      shareType:
        type: integer
      targetId:
        type: integer
    type: object
  pb_social.ShareResponse:
    properties:
      id:
        type: integer
      success:
        type: boolean
    type: object
  pb_social.VisibilityRequest:
    properties:
      newsFeedId:
        type: integer
      visibility:
        type: integer
    type: object
  pb_user.ProfileItem:
    properties:
      avatar:
        type: string
      fullName:
        type: string
      id:
        type: integer
    type: object
info:
  contact: {}
  description: Social Service
  title: Social Service
  version: "1.0"
paths:
  /comment:
    post:
      consumes:
      - application/json
      parameters:
      - description: CommentRequest
        in: body
        name: comment
        required: true
        schema:
          $ref: '#/definitions/pb_social.CommentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pb_social.CommentResponse'
      security:
      - BearerAuth: []
      tags:
      - Comment
  /comment/{id}:
    delete:
      consumes:
      - application/json
      parameters:
      - in: query
        name: content
        type: string
      - in: query
        name: id
        type: integer
      - in: query
        name: newsFeedId
        type: integer
      - in: query
        name: page
        type: integer
      - in: query
        name: parentId
        type: integer
      - in: query
        name: size
        type: integer
      - description: ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pb_social.CommentResponse'
      security:
      - BearerAuth: []
      tags:
      - Comment
    put:
      consumes:
      - application/json
      parameters:
      - description: CommentRequest
        in: body
        name: comment
        required: true
        schema:
          $ref: '#/definitions/pb_social.CommentRequest'
      - description: ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pb_social.CommentResponse'
      security:
      - BearerAuth: []
      tags:
      - Comment
  /comment/list/{newsFeedId}:
    get:
      consumes:
      - application/json
      parameters:
      - description: NewsFeedId
        in: path
        name: newsFeedId
        required: true
        type: integer
      - in: query
        name: content
        type: string
      - in: query
        name: id
        type: integer
      - in: query
        name: newsFeedId
        type: integer
      - in: query
        name: page
        type: integer
      - in: query
        name: parentId
        type: integer
      - in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pb_social.CommentListResponse'
      tags:
      - Comment
  /like/comment/{commentId}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: CommentId
        in: path
        name: commentId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pb_social.LikeResponse'
      security:
      - BearerAuth: []
      tags:
      - Like
    post:
      consumes:
      - application/json
      parameters:
      - description: CommentId
        in: path
        name: commentId
        required: true
        type: integer
      - description: LikeCommentRequest
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pb_social.LikeCommentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pb_social.LikeResponse'
      security:
      - BearerAuth: []
      tags:
      - Like
  /like/comment/list/{commentId}:
    get:
      consumes:
      - application/json
      parameters:
      - description: CommentId
        in: path
        name: commentId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pb_social.ListLikeResponse'
      security:
      - BearerAuth: []
      tags:
      - Like
  /like/news-feed/{newsFeedId}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: NewsFeedId
        in: path
        name: newsFeedId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pb_social.LikeResponse'
      security:
      - BearerAuth: []
      tags:
      - Like
    post:
      consumes:
      - application/json
      parameters:
      - description: NewsFeedId
        in: path
        name: newsFeedId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pb_social.LikeResponse'
      security:
      - BearerAuth: []
      tags:
      - Like
  /like/news-feed/list/{newsFeedId}:
    get:
      consumes:
      - application/json
      parameters:
      - description: NewsFeedId
        in: path
        name: newsFeedId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pb_social.ListLikeResponse'
      security:
      - BearerAuth: []
      tags:
      - Like
  /news-feed:
    delete:
      consumes:
      - application/json
      description: Xóa news feed
      parameters:
      - description: NewsFeed
        in: body
        name: post
        required: true
        schema:
          $ref: '#/definitions/pb_social.NewsFeed'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pb_social.Empty'
      security:
      - BearerAuth: []
      summary: Xóa news feed
      tags:
      - News Feed
    post:
      consumes:
      - application/json
      description: Create a new news feed
      parameters:
      - description: NewsFeed
        in: body
        name: post
        required: true
        schema:
          $ref: '#/definitions/pb_social.NewsFeed'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pb_social.NewsFeed'
      security:
      - BearerAuth: []
      summary: Create a new news feed
      tags:
      - News Feed
  /news-feed/{id}:
    put:
      consumes:
      - application/json
      description: Update news feed
      parameters:
      - description: NewsFeedId
        in: path
        name: id
        required: true
        type: integer
      - description: NewsFeed
        in: body
        name: post
        required: true
        schema:
          $ref: '#/definitions/pb_social.NewsFeed'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pb_social.NewsFeed'
      security:
      - BearerAuth: []
