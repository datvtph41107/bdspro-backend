      ownerType:
        description: '1: user, 2: admin'
        type: integer
      packageVisible:
        description: '1: thường, 2: VIP'
        type: integer
      postPrice:
        type: number
      priceType:
        description: '1: chính thức, 2: thỏa thuận'
