      parameters:
      - description: Nội dung cần phân tích
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/assistantpb.AnalyzeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/assistantpb.AnalyzeResponse'
      security:
      - BearerAuth: []
      summary: Phân tích văn bản sản phẩm BĐS sử dụng DeepSeek AI
      tags:
      - Assistant
  /v2/assistant/deepseek/chat:
    post:
      consumes:
      - application/json
      description: Thực hiện conversation với DeepSeek AI assistant
      parameters:
      - description: Message và history
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/assistantpb.ChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/assistantpb.ChatResponse'
      security:
      - BearerAuth: []
      summary: Chat với DeepSeek AI assistant
      tags:
      - Assistant
  /v2/assistant/deepseek/generate:
    post:
      consumes:
      - application/json
      description: Tạo nội dung theo template và prompt sử dụng DeepSeek
      parameters:
      - description: Prompt và template
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/assistantpb.GenerateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/assistantpb.GenerateResponse'
      security:
      - BearerAuth: []
      summary: Generate nội dung với DeepSeek
      tags:
      - Assistant
  /v2/assistant/gemini/analyze/product:
    post:
      consumes:
      - application/json
      description: Sử dụng Google Gemini AI để phân tích và trích xuất thông tin từ
        văn bản mô tả sản phẩm
      parameters:
      - description: Nội dung cần phân tích
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/assistantpb.AnalyzeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/assistantpb.AnalyzeResponse'
      security:
      - BearerAuth: []
      summary: Phân tích văn bản sản phẩm BĐS sử dụng Gemini AI
      tags:
      - Assistant
  /v2/assistant/gemini/chat:
    post:
      consumes:
      - application/json
      description: Thực hiện conversation với Google Gemini AI assistant
      parameters:
      - description: Message và history
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/assistantpb.ChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/assistantpb.ChatResponse'
      security:
      - BearerAuth: []
      summary: Chat với Gemini AI assistant
      tags:
      - Assistant
  /v2/assistant/gemini/generate:
    post:
      consumes:
      - application/json
      description: Tạo nội dung theo template và prompt sử dụng Google Gemini
      parameters:
      - description: Prompt và template
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/assistantpb.GenerateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/assistantpb.GenerateResponse'
      security:
      - BearerAuth: []
      summary: Generate nội dung với Gemini
      tags:
      - Assistant
  /v2/assistant/generate:
    post:
      consumes:
      - application/json
      description: Tạo nội dung theo template và prompt
      parameters:
      - description: Prompt và template
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/assistantpb.GenerateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/assistantpb.GenerateResponse'
      security:
      - BearerAuth: []
      summary: Generate nội dung
      tags:
      - Assistant
  /v2/assistant/health:
    get:
      consumes:
      - application/json
      description: Kiểm tra trạng thái service
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/assistantpb.HealthResponse'
      summary: Health check
      tags:
      - Assistant
  /v2/assistant/national-card/extract:
    post:
      consumes:
      - application/json
      description: Nhận vào 2 link ảnh (mặt trước và mặt sau), sử dụng OCR để đọc
        thông tin và MRZ
      parameters:
      - description: Link ảnh căn cước
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/assistantpb.ExtractNationalCardRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Thông tin đã trích xuất
          schema:
            $ref: '#/definitions/assistantpb.ExtractNationalCardResponse'
        "400":
          description: Yêu cầu không hợp lệ
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Trích xuất thông tin từ ảnh căn cước công dân
      tags:
      - Assistant
  /v2/assistant/openai/analyze/product:
    post:
      consumes:
      - application/json
      description: Sử dụng OpenAI GPT để phân tích và trích xuất thông tin từ văn
        bản mô tả sản phẩm
      parameters:
      - description: Nội dung cần phân tích
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/assistantpb.AnalyzeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/assistantpb.AnalyzeResponse'
      security:
      - BearerAuth: []
      summary: Phân tích văn bản sản phẩm BĐS sử dụng OpenAI
      tags:
      - Assistant
  /v2/assistant/openai/chat:
    post:
      consumes:
      - application/json
      description: Thực hiện conversation với OpenAI GPT assistant
      parameters:
      - description: Message và history
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/assistantpb.ChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/assistantpb.ChatResponse'
      security:
      - BearerAuth: []
      summary: Chat với OpenAI AI assistant
      tags:
      - Assistant
  /v2/assistant/openai/generate:
    post:
      consumes:
      - application/json
      description: Tạo nội dung theo template và prompt sử dụng OpenAI GPT
      parameters:
      - description: Prompt và template
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/assistantpb.GenerateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/assistantpb.GenerateResponse'
      security:
      - BearerAuth: []
      summary: Generate nội dung với OpenAI
      tags:
      - Assistant
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
