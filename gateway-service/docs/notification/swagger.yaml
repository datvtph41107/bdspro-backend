info:
  contact: {}
  description: API phần logic thông báo
  title: Notification API
  version: "1.0"
paths:
  /account-warning/acknowledge:
    put:
      consumes:
      - application/json
      description: Đánh dấu cảnh báo đã được xác nhận
      parameters:
      - description: Thông tin xác nhận
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/notificationpb.MarkWarningAsAcknowledgedRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/notificationpb.MarkWarningAsAcknowledgedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/notificationpb.MarkWarningAsAcknowledgedResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/notificationpb.MarkWarningAsAcknowledgedResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/notificationpb.MarkWarningAsAcknowledgedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/notificationpb.MarkWarningAsAcknowledgedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/notificationpb.MarkWarningAsAcknowledgedResponse'
      summary: Đánh dấu cảnh báo đã xác nhận
      tags:
      - Account Warning
  /account-warning/list:
    get:
      consumes:
      - application/json
      description: Lấy danh sách cảnh báo tài khoản với filter
      parameters:
      - description: Trang
        in: query
        name: page
        type: integer
      - description: Kích thước trang
        in: query
        name: size
        type: integer
      - description: ID người nhận
        in: query
        name: targetId
        type: integer
      - description: Loại đối tượng
        in: query
        name: targetType
        type: string
      - description: Loại cảnh báo
        in: query
        name: warningType
        type: string
      - description: Mức độ nghiêm trọng
        in: query
        name: severity
        type: string
      - description: Trạng thái
        in: query
        name: status
        type: string
      - description: ID người gửi
        in: query
        name: sentBy
        type: integer
      - description: Đã đọc
        in: query
        name: isRead
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/notificationpb.GetAccountWarningListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/notificationpb.GetAccountWarningListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/notificationpb.GetAccountWarningListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/notificationpb.GetAccountWarningListResponse'
