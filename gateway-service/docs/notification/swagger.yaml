        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/notificationpb.GetSystemWarningListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/notificationpb.GetSystemWarningListResponse'
      security:
      - BearerAuth: []
      summary: Lấy danh sách cảnh báo hệ thống (Admin)
      tags:
      - System Warning - Admin
    post:
      consumes:
      - application/json
      description: Admin tạo cảnh báo hệ thống gửi tới user
      parameters:
      - description: Thông tin cảnh báo
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/notificationpb.CreateSystemWarningRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/notificationpb.CreateSystemWarningResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/notificationpb.CreateSystemWarningResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/notificationpb.CreateSystemWarningResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/notificationpb.CreateSystemWarningResponse'
      security:
      - BearerAuth: []
      summary: Tạo cảnh báo hệ thống (Admin)
      tags:
      - System Warning - Admin
  /admin/system-warning/{id}:
    delete:
      consumes:
      - application/json
      description: Admin xóa cảnh báo hệ thống
      parameters:
      - description: ID cảnh báo
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/notificationpb.DeleteSystemWarningResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/notificationpb.DeleteSystemWarningResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/notificationpb.DeleteSystemWarningResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/notificationpb.DeleteSystemWarningResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/notificationpb.DeleteSystemWarningResponse'
      security:
      - BearerAuth: []
      summary: Xóa cảnh báo hệ thống (Admin)
      tags:
      - System Warning - Admin
  /count:
    get:
      consumes:
      - application/json
      description: Hiển thị số lượng thông báo chưa đọc của người dùng
      produces:
      - application/json
      responses:
        "200":
          description: count
          schema:
            additionalProperties:
              type: integer
