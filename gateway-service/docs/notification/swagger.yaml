basePath: /v2/notification
definitions:
  pb_noti.GatewayNotiNewRequest:
    properties:
      link:
        type: string
      message:
        type: string
      targetId:
        type: integer
      title:
        type: string
      type:
        type: integer
    type: object
  pb_noti.NotificationDTO:
    properties:
      avatar:
        type: string
      id:
        type: integer
      isRead:
        type: boolean
      link:
        type: string
      message:
        items:
          type: string
        type: array
      timestamp:
        type: string
      title:
        type: string
      type:
        type: integer
      userId:
        type: integer
    type: object
info:
  contact: {}
  description: API phần logic thông báo
  title: Notification API
  version: "1.0"
paths:
  /count:
    get:
      consumes:
      - application/json
      description: Hiển thị số lượng thông báo chưa đọc của người dùng
      produces:
      - application/json
      responses:
        "200":
          description: count
          schema:
            additionalProperties:
              type: integer
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Số thông báo mới chưa đọc
      tags:
      - Notifications
  /list:
    get:
      consumes:
      - application/json
      description: Trả về danh sách thông báo của người dùng
      parameters:
      - description: Trang cần lấy (default = 0)
        in: query
        name: page
        type: integer
      - description: Số lượng trên mỗi trang (default = 200)
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Danh sách thông báo
          schema:
            items:
              $ref: '#/definitions/pb_noti.NotificationDTO'
            type: array
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lấy danh sách thông báo
      tags:
      - Notifications
  /new:
    post:
      consumes:
      - application/json
      description: API này không bắn thông báo tới thiết bị của người dùng, chỉ tạo
        thông báo
      parameters:
      - description: Chi tiết thông báo
        in: body
        name: notification
        required: true
        schema:
          $ref: '#/definitions/pb_noti.GatewayNotiNewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Tạo thông báo mới
      tags:
      - Notifications
  /read-all:
    put:
      consumes:
      - application/json
      description: Đánh dấu tất cả thông báo là đã đọc
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Đánh dấu tất cả thông báo là đã đọc
      tags:
      - Notifications
  /read/{id}:
    put:
      consumes:
      - application/json
      description: Đánh dấu thông báo với ID cụ thể là đã đọc
      parameters:
      - description: ID của thông báo
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Đánh dấu thông báo đã đọc
      tags:
      - Notifications
  /remove/{id}:
    delete:
      consumes:
      - application/json
      description: Xóa thông báo với ID cụ thể
      parameters:
      - description: ID của thông báo
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Xóa thông báo
      tags:
      - Notifications
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
