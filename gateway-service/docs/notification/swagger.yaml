basePath: /v2/notification
definitions:
  notificationpb.GatewayNotiNewRequest:
    properties:
      link:
        type: string
      message:
        type: string
      ownerId:
        type: integer
      title:
        type: string
      type:
        type: integer
    type: object
  notificationpb.NotificationDTO:
    properties:
      avatar:
        type: string
      id:
        type: integer
      isRead:
        type: boolean
      link:
        type: string
      message:
        items:
          type: string
        type: array
      targetId:
        type: integer
      timestamp:
        type: string
      title:
        type: string
      type:
        type: integer
      userId:
        type: integer
    type: object
info:
  contact: {}
  description: API phần logic thông báo
  title: Notification API
  version: "1.0"
paths:
  /count:
    get:
      consumes:
      - application/json
      description: Hiển thị số lượng thông báo chưa đọc của người dùng
      produces:
      - application/json
      responses:
        "200":
          description: count
          schema:
            additionalProperties:
              type: integer
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Số thông báo mới chưa đọc
      tags:
      - Notifications
  /history/contact/{contactId}:
    get:
      consumes:
      - application/json
      description: Lấy lịch sử của liên hệ
      parameters:
      - description: ID của liên hệ
        in: path
        name: contactId
        required: true
        type: integer
      - in: query
        name: actionType
        type: integer
      - in: query
        name: fromDate
        type: string
      - in: query
        name: id
        type: integer
      - in: query
        name: ownerId
        type: integer
      - in: query
        name: ownerType
        type: integer
      - in: query
        name: page
        type: integer
      - in: query
        name: size
        type: integer
      - in: query
        name: targetId
        type: integer
      - in: query
        name: targetType
        type: integer
      - in: query
        name: toDate
        type: string
      - in: query
        name: userId
        type: integer
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Lấy lịch sử của liên hệ
      tags:
      - Lịch sử
  /history/list/{ownerId}/{ownerType}:
    get:
      consumes:
      - application/json
      description: Lấy lịch sử của người dùng
      parameters:
      - description: ID của người dùng
        in: path
        name: ownerId
        required: true
        type: integer
      - description: Loại người dùng
        in: path
        name: ownerType
        required: true
        type: integer
      - in: query
        name: actionType
        type: integer
      - in: query
        name: fromDate
        type: string
      - in: query
        name: id
        type: integer
      - in: query
        name: ownerId
        type: integer
      - in: query
        name: ownerType
        type: integer
      - in: query
        name: page
        type: integer
      - in: query
        name: size
        type: integer
      - in: query
        name: targetId
        type: integer
      - in: query
        name: targetType
        type: integer
      - in: query
        name: toDate
        type: string
      - in: query
        name: userId
        type: integer
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Lấy lịch sử của người dùng
      tags:
      - Lịch sử
  /history/product/child/{productId}:
    get:
      consumes:
      - application/json
      description: Lấy lịch sử của sản phẩm con
      parameters:
      - description: ID của sản phẩm
        in: path
        name: productId
        required: true
        type: integer
      - in: query
        name: actionType
        type: integer
      - in: query
        name: fromDate
        type: string
      - in: query
        name: id
        type: integer
      - in: query
        name: ownerId
        type: integer
      - in: query
        name: ownerType
        type: integer
      - in: query
        name: page
        type: integer
      - in: query
        name: size
        type: integer
      - in: query
        name: targetId
        type: integer
      - in: query
        name: targetType
        type: integer
      - in: query
        name: toDate
        type: string
      - in: query
        name: userId
        type: integer
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Lấy lịch sử của sản phẩm con
      tags:
      - Lịch sử
  /history/rule-event/{ruleEventId}:
    get:
      consumes:
      - application/json
      description: Lấy lịch sử của quy tắc
      parameters:
      - description: ID của quy tắc
        in: path
        name: ruleEventId
        required: true
        type: integer
      - in: query
        name: actionType
        type: integer
      - in: query
        name: fromDate
        type: string
      - in: query
        name: id
        type: integer
      - in: query
        name: ownerId
        type: integer
      - in: query
        name: ownerType
        type: integer
      - in: query
        name: page
        type: integer
      - in: query
        name: size
        type: integer
      - in: query
        name: targetId
        type: integer
      - in: query
        name: targetType
        type: integer
      - in: query
        name: toDate
        type: string
      - in: query
        name: userId
        type: integer
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Lấy lịch sử của quy tắc
      tags:
      - Lịch sử
  /list:
    get:
      consumes:
      - application/json
      description: Trả về danh sách thông báo của người dùng
      parameters:
      - description: Trang cần lấy (default = 0)
        in: query
        name: page
        type: integer
      - description: Số lượng trên mỗi trang (default = 200)
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Danh sách thông báo
          schema:
            items:
              $ref: '#/definitions/notificationpb.NotificationDTO'
            type: array
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lấy danh sách thông báo
      tags:
      - Notifications
  /new:
    post:
      consumes:
      - application/json
      description: API này không bắn thông báo tới thiết bị của người dùng, chỉ tạo
        thông báo
      parameters:
      - description: Chi tiết thông báo
        in: body
        name: notification
        required: true
        schema:
          $ref: '#/definitions/notificationpb.GatewayNotiNewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Tạo thông báo mới
      tags:
      - Notifications
  /read-all:
    put:
      consumes:
      - application/json
      description: Đánh dấu tất cả thông báo là đã đọc
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Đánh dấu tất cả thông báo là đã đọc
      tags:
      - Notifications
  /read/{id}:
    put:
      consumes:
      - application/json
      description: Đánh dấu thông báo với ID cụ thể là đã đọc
      parameters:
      - description: ID của thông báo
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Đánh dấu thông báo đã đọc
      tags:
      - Notifications
  /remove/{id}:
    delete:
      consumes:
      - application/json
      description: Xóa thông báo với ID cụ thể
      parameters:
      - description: ID của thông báo
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Xóa thông báo
      tags:
      - Notifications
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
