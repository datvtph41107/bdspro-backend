      tags:
      - Account Warning
  /account-warning/log/list:
    get:
      consumes:
      - application/json
      description: Lấy danh sách log cảnh báo
      parameters:
      - description: Trang
        in: query
        name: page
        type: integer
      - description: Kích thước trang
        in: query
        name: size
        type: integer
      - description: ID cảnh báo
        in: query
        name: warningId
        type: integer
      - description: ID người nhận
        in: query
        name: targetId
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/notificationpb.GetWarningLogListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/notificationpb.GetWarningLogListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/notificationpb.GetWarningLogListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/notificationpb.GetWarningLogListResponse'
      summary: Lấy danh sách log cảnh báo
      tags:
      - Account Warning Log
  /account-warning/read:
    put:
      consumes:
      - application/json
      description: Đánh dấu cảnh báo đã được đọc
      parameters:
      - description: Thông tin đánh dấu
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/notificationpb.MarkWarningAsReadRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/notificationpb.MarkWarningAsReadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/notificationpb.MarkWarningAsReadResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/notificationpb.MarkWarningAsReadResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/notificationpb.MarkWarningAsReadResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/notificationpb.MarkWarningAsReadResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/notificationpb.MarkWarningAsReadResponse'
      summary: Đánh dấu cảnh báo đã đọc
      tags:
      - Account Warning
  /account-warning/send:
    post:
      consumes:
      - application/json
      description: Gửi cảnh báo, nhắc nhở hoặc hướng dẫn khắc phục lỗi đến tài khoản
        người dùng
      parameters:
      - description: Thông tin cảnh báo
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/notificationpb.SendAccountWarningRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/notificationpb.SendAccountWarningResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/notificationpb.SendAccountWarningResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/notificationpb.SendAccountWarningResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/notificationpb.SendAccountWarningResponse'
      summary: Gửi cảnh báo tài khoản
      tags:
      - Account Warning
  /account-warning/template:
    post:
      consumes:
      - application/json
      description: Tạo mẫu cảnh báo mới
      parameters:
      - description: Thông tin mẫu
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/notificationpb.CreateWarningTemplateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/notificationpb.CreateWarningTemplateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/notificationpb.CreateWarningTemplateResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/notificationpb.CreateWarningTemplateResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/notificationpb.CreateWarningTemplateResponse'
      summary: Tạo mẫu cảnh báo
      tags:
      - Account Warning Template
  /account-warning/template/{id}:
    get:
      consumes:
      - application/json
      description: Lấy chi tiết mẫu cảnh báo theo ID
      parameters:
      - description: ID mẫu cảnh báo
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/notificationpb.GetWarningTemplateDetailResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/notificationpb.GetWarningTemplateDetailResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/notificationpb.GetWarningTemplateDetailResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/notificationpb.GetWarningTemplateDetailResponse'
      summary: Lấy chi tiết mẫu cảnh báo
      tags:
      - Account Warning Template
  /account-warning/template/list:
    get:
      consumes:
      - application/json
      description: Lấy danh sách mẫu cảnh báo
      parameters:
      - description: Trang
        in: query
        name: page
        type: integer
      - description: Kích thước trang
        in: query
        name: size
        type: integer
      - description: Loại cảnh báo
        in: query
        name: warningType
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/notificationpb.GetWarningTemplateListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/notificationpb.GetWarningTemplateListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/notificationpb.GetWarningTemplateListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/notificationpb.GetWarningTemplateListResponse'
      summary: Lấy danh sách mẫu cảnh báo
      tags:
      - Account Warning Template
  /admin-history/search:
    get:
      consumes:
      - application/json
      description: Tìm kiếm lịch sử các hành động của admin
      parameters:
      - description: Trang cần lấy (default = 0)
        in: query
        name: page
        type: integer
      - description: Số lượng trên mỗi trang (default = 20)
        in: query
        name: size
        type: integer
      - description: ID của admin
        in: query
        name: adminId
        type: integer
      - description: ID của owner
        in: query
        name: ownerId
        type: integer
      - description: Loại owner
        in: query
        name: ownerType
        type: integer
      - description: ID của target
        in: query
        name: targetId
        type: integer
      - description: Loại target
        in: query
        name: targetType
        type: integer
      - description: Loại hành động
        in: query
        name: actionType
        type: integer
      - description: Vai trò admin
        in: query
        name: adminRole
        type: string
      - description: Từ ngày (RFC3339 format)
        in: query
        name: fromDate
        type: string
      - description: Đến ngày (RFC3339 format)
        in: query
        name: toDate
        type: string
      - description: Có phải internal không
        in: query
        name: isInternal
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Danh sách lịch sử admin
          schema:
            $ref: '#/definitions/notificationpb.AdminHistoryListResponse'
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Tìm kiếm lịch sử admin
      tags:
      - Admin History
  /admin/system-warning:
    get:
      consumes:
      - application/json
      description: Admin lấy danh sách tất cả cảnh báo hệ thống
      parameters:
      - description: Trang
        in: query
        name: page
        type: integer
      - description: Kích thước trang
        in: query
        name: size
        type: integer
      - description: Sắp xếp
        in: query
        name: sort
        type: string
      - description: Loại cảnh báo
        in: query
        name: warningType
        type: string
      - description: Mức độ nghiêm trọng
        in: query
        name: severity
        type: string
      - description: ID người nhận
        in: query
        name: targetId
        type: integer
      - description: Loại người nhận
        in: query
        name: targetType
        type: string
      - description: Đã đọc chưa
        in: query
        name: isRead
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
