info:
  contact: {}
  description: API phần logic chính của BĐSPro
  title: BDSPRO API
  version: "1.0"
paths:
  /v1/user/auth/delete:
    delete:
      consumes:
      - application/json
      description: API này cho phép xóa người dùng
      produces:
      - application/json
      responses:
        "200":
          description: Cập nhật thành công
          schema:
            $ref: '#/definitions/dto.PublicUserInfo'
      security:
      - BearerAuth: []
      summary: Xóa tài khoản
      tags:
      - Auth
  /v1/user/auth/logout:
    delete:
      description: Đăng xuất, xóa refresh token
      responses: {}
      summary: Logout
      tags:
      - Auth
  /v1/user/auth/otp/request:
    post:
      consumes:
      - application/json
      description: Gửi lại OTP hoặc submit lúc nhập SĐT
      parameters:
      - description: OTP Request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.OtpRequest'
      produces:
      - application/json
      responses: {}
      summary: Gửi OTP
      tags:
      - Auth
  /v1/user/auth/otp/resend:
    post:
      consumes:
      - application/json
      description: Gửi lại OTP mới
      parameters:
      - description: OTP Request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.OtpRequest'
      produces:
      - application/json
      responses: {}
      summary: Resend OTP
      tags:
      - Auth
  /v1/user/auth/otp/verify:
    post:
      consumes:
      - application/json
      description: Xác minh OTP đã nhận
      parameters:
      - description: OTP Verify Request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.OtpVerifyRequest'
      produces:
      - application/json
      responses: {}
      summary: Xác minh OTP
      tags:
      - Auth
  /v1/user/auth/qr/confirm:
    post:
      consumes:
      - application/json
      description: API này xác nhận rằng app đã quét QR và người dùng đã đồng ý đăng
        nhập
      parameters:
      - description: Thông tin xác nhận QR
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SessionQRConfirm'
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Xác nhận QR Login
      tags:
      - Auth
  /v1/user/auth/qr/init:
    post:
      consumes:
      - application/json
