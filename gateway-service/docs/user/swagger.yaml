info:
  contact: {}
  description: API phần logic chính của BĐSPro
  title: BDSPRO API
  version: "1.0"
paths:
  /admin/create:
    post:
      consumes:
      - application/json
      description: Tạo tài khoản admin mới
      parameters:
      - description: Thông tin tạo admin
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/userpb.AdminProfile'
      produces:
      - application/json
      responses: {}
      summary: Create Admin
      tags:
      - Admin
  /admin/delete:
    delete:
      consumes:
      - application/json
      description: Xóa tài khoản admin
      parameters:
      - description: Thông tin xóa admin
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/sharepb.IdRequest'
      produces:
      - application/json
      responses: {}
      summary: Delete Admin
      tags:
      - Admin
  /admin/list:
    get:
      consumes:
      - application/json
      description: Lấy danh sách tất cả admin trong hệ thống với phân trang và thông
        tin role (chỉ dành cho admin)
      parameters:
      - description: Tìm kiếm theo tên, email, phone
        in: query
        name: search
        type: string
      - description: 'Trang hiện tại (mặc định: 1)'
        in: query
        name: page
        type: integer
      - description: 'Số lượng item trên mỗi trang (mặc định: 20, tối đa: 100)'
        in: query
        name: size
        type: integer
      - description: Sắp xếp theo trường (createdAt, fullName, email)
        in: query
        name: sortBy
        type: string
      - description: Thứ tự sắp xếp (asc, desc)
        in: query
        name: sortOrder
        type: string
      - description: 'Lọc theo trạng thái (1: active, 0: inactive)'
        in: query
        name: status
        type: integer
      - description: Lọc theo role type
        in: query
        name: roleType
        type: string
      - description: 'Lọc từ ngày tạo (format: 2006-01-02T15:04:05)'
        in: query
        name: startDate
        type: string
      - description: 'Lọc đến ngày tạo (format: 2006-01-02T15:04:05)'
        in: query
        name: endDate
        type: string
      produces:
      - application/json
      responses: {}
      summary: Lấy danh sách tất cả admin (Admin only)
      tags:
      - Admin
  /admin/plans:
    get:
      consumes:
      - application/json
      description: Lấy tất cả các gói membership (bao gồm ẩn) (Admin only)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/userpb.GetAllPlansResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lấy tất cả gói membership
      tags:
      - Plan
    post:
      consumes:
      - application/json
      description: Tạo một gói membership mới (Admin only)
      parameters:
      - description: Thông tin gói
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/userpb.CreatePlanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/userpb.PlanResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Tạo gói membership mới
      tags:
      - Plan
  /admin/plans/{id}:
    delete:
      consumes:
      - application/json
      description: Xóa mềm gói membership (Admin only)
      parameters:
      - description: Plan ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/userpb.DeletePlanResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Xóa gói membership
      tags:
      - Plan
    get:
      consumes:
      - application/json
      description: Lấy chi tiết một gói membership (Admin only)
      parameters:
      - description: Plan ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/userpb.GetPlanByIdResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lấy thông tin gói membership theo ID
      tags:
      - Plan
    put:
      consumes:
      - application/json
      description: Cập nhật thông tin gói membership (Admin only)
      parameters:
      - description: Thông tin gói cập nhật
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/userpb.UpdatePlanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/userpb.PlanResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cập nhật gói membership
      tags:
      - Plan
  /admin/update:
    put:
      consumes:
      - application/json
      description: Cập nhật thông tin admin
      parameters:
      - description: Thông tin cập nhật admin
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/userpb.AdminProfile'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/userpb.AdminProfile'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/userpb.AdminProfile'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/authpb.AuthSuccessResponse'
      summary: Update Admin
      tags:
      - Admin
  /user/membership/me:
    get:
      consumes:
      - application/json
      description: Lấy thông tin gói membership đang sử dụng của user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/userpb.GetMyMembershipResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lấy thông tin membership của user hiện tại
      tags:
      - Membership
  /user/membership/order:
    post:
      consumes:
      - application/json
      description: Tạo đơn hàng để mua gói membership và nhận link thanh toán
      parameters:
      - description: Thông tin đơn hàng
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/userpb.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/userpb.CreateOrderResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Tạo đơn hàng mua gói membership
      tags:
      - Membership
  /user/membership/verify:
    post:
      consumes:
      - application/json
      description: Webhook từ payment service để xác nhận thanh toán và kích hoạt
        membership
      parameters:
      - description: Thông tin xác nhận thanh toán
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/userpb.VerifyOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/userpb.VerifyOrderResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Xác nhận thanh toán từ payment service
      tags:
      - Membership
  /user/plans:
    get:
      consumes:
      - application/json
      description: Lấy tất cả các gói membership đang hiển thị cho user
      produces:
      - application/json
      responses:
