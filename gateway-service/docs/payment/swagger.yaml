basePath: /v2/payment
definitions:
  domain.Account:
    properties:
      accountNumber:
        type: string
      createdAt:
        type: string
      deletedAt:
        type: string
      fullName:
        type: string
      phone:
        type: string
      updatedAt:
        type: string
      userId:
        type: integer
    required:
    - userId
    type: object
  domain.Transaction:
    properties:
      accountId:
        type: integer
      amount:
        type: number
      deletedAt:
        type: string
      targetId:
        type: integer
      timestamp:
        type: string
      transactionId:
        description: Deposite bool    `json:"deposite"`
        type: integer
      transactionType:
        type: integer
    required:
    - accountId
    - amount
    - targetId
    - transactionType
    type: object
  models.OrderRequest:
    properties:
      amount:
        type: integer
      description:
        type: string
      targetId:
        type: integer
      type:
        $ref: '#/definitions/models.OrderType'
    type: object
  models.OrderType:
    enum:
    - 1
    - 2
    type: integer
    x-enum-varnames:
    - OrderBill
    - OrderMembership
  payos.WebhookDataType:
    properties:
      accountNumber:
        type: string
      amount:
        type: integer
      code:
        type: string
      counterAccountBankId:
        type: string
      counterAccountBankName:
        type: string
      counterAccountName:
        type: string
      counterAccountNumber:
        type: string
      currency:
        type: string
      desc:
        type: string
      description:
        type: string
      orderCode:
        type: integer
      paymentLinkId:
        type: string
      reference:
        type: string
      transactionDateTime:
        type: string
      virtualAccountName:
        type: string
      virtualAccountNumber:
        type: string
    type: object
  payos.WebhookType:
    properties:
      code:
        type: string
      data:
        $ref: '#/definitions/payos.WebhookDataType'
      desc:
        type: string
      signature:
        type: string
      success:
        type: boolean
    type: object
info:
  contact: {}
  description: This is a sample API
  title: Example API
  version: "1.0"
paths:
  /payos/cancel/{orderId}:
    post:
      description: Hủy link thanh toán và cập nhật DB
      parameters:
      - description: ID của đơn hàng
        in: path
        name: orderId
        required: true
        type: integer
      - description: Lý do hủy
        in: query
        name: reason
        type: string
      responses: {}
      security:
      - BearerAuth: []
      summary: Hủy link thanh toán
      tags:
      - PayOS
  /payos/create:
    post:
      consumes:
      - application/json
      description: Tạo link thanh toán và lưu vào DB
      parameters:
      - description: Order thông tin
        in: body
        name: order
        required: true
        schema:
          $ref: '#/definitions/models.OrderRequest'
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Tạo link thanh toán
      tags:
      - PayOS
  /payos/info/{orderId}:
    get:
      description: Lấy thông tin link thanh toán từ PayOS
      parameters:
      - description: ID của đơn hàng
        in: path
        name: orderId
        required: true
        type: integer
      responses: {}
      security:
      - BearerAuth: []
      summary: Lấy thông tin link thanh toán
      tags:
      - PayOS
  /payos/webhook/verify:
    post:
      consumes:
      - application/json
      description: Xác minh Webhook sau khi thanh toán thành công
      parameters:
      - description: Order thông tin
        in: body
        name: order
        required: true
        schema:
          $ref: '#/definitions/payos.WebhookType'
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Xác minh Webhook
      tags:
      - PayOS
  /wallet/:id:
    put:
      consumes:
      - application/json
      parameters:
      - description: Thông tin tài khoản
        in: body
        name: publish
        required: true
        schema:
          $ref: '#/definitions/domain.Account'
      produces:
      - application/json
      responses: {}
      summary: Cập nhật tài khoản
      tags:
      - Account
  /wallet/balance:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Cập nhật tài khoản
      tags:
      - Account
  /wallet/new:
    post:
      consumes:
      - application/json
      parameters:
      - description: Thông tin tài khoản
        in: body
        name: publish
        required: true
        schema:
          $ref: '#/definitions/domain.Account'
      produces:
      - application/json
      responses: {}
      summary: Tạo tài khoản
      tags:
      - Account
  /wallet/transaction:
    post:
      consumes:
      - application/json
      parameters:
      - description: Thông tin tài khoản
        in: body
        name: publish
        required: true
        schema:
          $ref: '#/definitions/domain.Transaction'
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: '[LOCAL]Tạo giao dịch mới'
      tags:
      - Account
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
