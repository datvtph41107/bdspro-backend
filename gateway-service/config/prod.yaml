app:
    environment: production
server:
    port: 8000
logger:
    level: info
gateway:
    allowed_origins:
        - "https://app.example.com"
    public_routes: # chỉ giữ lại các route thực sự public trên prod
        - "/v2/auth/otp"
        - "/v2/auth/token/refresh"
    global_rate_limit: 5000

request_stats:
    spec_urls:
        - /v2/crm/sitemap.xml
