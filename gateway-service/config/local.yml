server:
    port: 8000
    tcp_port: 8800

service:
    domain: localhost
    port:
        gateway: 8000
        user: 8201
        bdspro: 8202
        file: 8203
        notification: 8204
        payment: 8205
        crm: 8206
        organization: 8207
        chat: 8208
        social: 8209
        map: 8210
        search: 8211
        appointment: 8213
        marketing: 8214
        transaction: 8215
        auth: 8216
        feedback: 8217
        assistant: 8218
        hub: 8280
        tqd: 8219
jwt:
    key-generate: key-generate-jwt-token-authentication
    tokenPrefix: Bearer
    tokenExpirationAfterDays: 14
    accessExpAfterMinutes: 15 # access token hết hạn 5 phút
    refreshExpAfterMinutes: 129600 # refresh token có hạn là 3 tháng
    listPermit:
    authorizationHeader: Authorization

# config/local.yml - thêm cấu hình
quota:
    storage: redis # or local
    redis:
        addr: 14.225.210.29:6379
        db: 0
    policies:
        default:
            limit: 1000
            period: monthly # monthly/daily/weekly
            extra_policy: charge_and_allow
        premium:
            limit: 10000
            period: monthly
            extra_policy: allow_and_notify

gateway:
    allowed_origins:
        - "http://127.0.0.1:3000"
        - "http://127.0.0.1:3001"
        - "http://localhost:3000"
        - "http://localhost:3001"
