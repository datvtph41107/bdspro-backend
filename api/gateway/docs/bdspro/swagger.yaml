info:
  contact: {}
  description: API phần logic chính của BĐSPro
  title: BDSPRO API
  version: "1.0"
paths:
  /admin/assets:
    get:
      consumes:
      - application/json
      description: Get assets with advanced filtering
      parameters:
      - description: Page number
        in: query
        name: page
        required: true
        type: integer
      - description: Page size
        in: query
        name: size
        required: true
        type: integer
      - description: Asset name
        in: query
        name: name
        type: string
      - collectionFormat: csv
        description: Asset status
        in: query
        items:
          type: integer
        name: status
        type: array
      - description: Archived status
        in: query
        name: archived
        type: boolean
      - description: From date (ISO format)
        in: query
        name: fromDate
        type: string
      - description: To date (ISO format)
        in: query
        name: toDate
        type: string
      - description: Search text
        in: query
        name: text
        type: string
      - collectionFormat: csv
        description: Province IDs
        in: query
        items:
          type: integer
        name: provinceIds
        type: array
      - collectionFormat: csv
        description: District IDs
        in: query
        items:
          type: integer
        name: districtIds
        type: array
      - collectionFormat: csv
        description: Ward IDs
        in: query
        items:
          type: integer
        name: wardIds
        type: array
      - collectionFormat: csv
        description: Property type IDs
        in: query
        items:
          type: integer
        name: propertyTypeIds
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bdspropb.AdminAssetSearchResponse'
      summary: Get assets
      tags:
      - AdminAsset
    post:
      consumes:
      - application/json
      description: Create a new asset
      parameters:
      - description: Asset to create
        in: body
        name: asset
        required: true
        schema:
          $ref: '#/definitions/bdspropb.SaveAssetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bdspropb.Asset'
      summary: Create a new asset
      tags:
      - AdminAsset
    put:
      consumes:
      - application/json
      description: Update an asset
      parameters:
      - description: Asset to update
        in: body
        name: asset
        required: true
        schema:
          $ref: '#/definitions/bdspropb.SaveAssetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bdspropb.Asset'
      summary: Update an asset
      tags:
      - AdminAsset
  /admin/assets/{id}:
    delete:
      consumes:
      - application/json
      description: Delete an asset
      parameters:
      - description: Asset ID
        in: path
        name: id
