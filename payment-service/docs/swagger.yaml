basePath: /payment
definitions:
  models.OrderRequest:
    properties:
      amount:
        type: integer
      description:
        type: string
    type: object
info:
  contact: {}
  description: This is a sample API
  title: Example API
  version: "1.0"
paths:
  /payos/cancel/{orderId}:
    post:
      description: Hủy link thanh toán và cập nhật DB
      parameters:
      - description: ID của đơn hàng
        in: path
        name: orderId
        required: true
        type: integer
      - description: Lý do hủy
        in: query
        name: reason
        type: string
      responses: {}
      security:
      - BearerAuth: []
      summary: Hủy link thanh toán
      tags:
      - PayOS
  /payos/create:
    post:
      consumes:
      - application/json
      description: Tạo link thanh toán và lưu vào DB
      parameters:
      - description: Order thông tin
        in: body
        name: order
        required: true
        schema:
          $ref: '#/definitions/models.OrderRequest'
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Tạo link thanh toán
      tags:
      - PayOS
  /payos/info/{orderId}:
    get:
      description: Lấy thông tin link thanh toán từ PayOS
      parameters:
      - description: ID của đơn hàng
        in: path
        name: orderId
        required: true
        type: integer
      responses: {}
      security:
      - BearerAuth: []
      summary: Lấy thông tin link thanh toán
      tags:
      - PayOS
  /payos/webhook/verify:
    post:
      consumes:
      - application/json
      description: Xác minh Webhook sau khi thanh toán thành công
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Xác minh Webhook
      tags:
      - PayOS
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
