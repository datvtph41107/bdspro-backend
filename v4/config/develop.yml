tqd:
  layer:
    # Base URL configuration
    base_url: "ciproto://data-map.bdspro.com"

    # Default style templates
    default_styles:
      vector:
        - id: "{sourceCode}_fill"
          type: "fill"
          maxzoom: 22
          paint:
            fill-color: ["get", "color"]
            fill-opacity: 0.8
          source: "{sourceCode}"
          source-layer: "{sourceCode}"
        - id: "{sourceCode}_outline"
          type: "line"
          minzoom: 16
          paint:
            line-color: ["get", "color"]
            line-width: 1
          source: "{sourceCode}"
          source-layer: "{sourceCode}"
        - id: "{sourceCode}_label"
          type: "symbol"
          minzoom: 16
          layout:
            text-field: ["get", "name"]
            text-size: 12
            text-allow-overlap: false
            text-padding: 12
          paint:
            text-color: "#ff0000"
            text-halo-color: "#ffffff"
            text-halo-width: 2
          source: "{sourceCode}"
          source-layer: "{sourceCode}"

      raster:
        - id: "{sourceCode}"
          type: "raster"
          paint:
            raster-opacity: 1.0
          source: "{sourceCode}"

