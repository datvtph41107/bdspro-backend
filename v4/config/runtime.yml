jwt:
  key-generate: key-generate-jwt-token-authentication
  tokenPrefix: Bearer
  tokenExpirationAfterDays: 14
  accessExpAfterMinutes: 150 # access token hết hạn 100 giờ
  refreshExpAfterMinutes: 129600 # refresh token có hạn là 3 tháng
  listPermit:
  authorizationHeader: Authorization

sms:
  endpoint: "https://api.yoursales.vn/api/public/sms/send"
  provider: "twilio" # or other SMS providers
  account_sid: "your_twilio_account_sid"
  auth_token: ""
  from_number: "+1234567890"
  template: "Mã xác thực của bạn là {OTP}. Vui lòng không chia sẻ OTP cho bất kỳ ai."

outbound_messaging:
  enabled: false

zns:
  template_id: 497058
  otp_template_id: 497058 # Template ID riêng cho OTP
  access_token: ""
  refresh_token: ""

otp:
  max-times-resend: 5
  max-times-otp-enter: 3 #số lần nhập OTP
  expired-after-seconds: 600 #10p hết hạn otp
  lock-verify-after: 900 # khóa tài khoản 15p nếu sai OTP/gửi OTP 5 lần
  lock-send-after: 30 # lần gửi OTP tiếp theo trong request hiện tại sau 60s
  lock-request-after: 30 # lần gửi OTP giữa 2 lần request là 1 phút (thay đổi từ 5p → 1p)
  limit-otp-device: 10
  limit-otp-ip: 100
  cooldown-seconds: 300
  ip-cooldown-seconds: 900

