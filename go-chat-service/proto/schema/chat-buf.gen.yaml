version: v1
plugins:
    - name: go
      out: ../types
      opt:
          - paths=source_relative
    - name: go-grpc
      out: ../types
      opt:
          - paths=source_relative
    - name: grpc-gateway
      out: ../types
      opt:
          - paths=source_relative
          - generate_unbound_methods=true
          - grpc_api_configuration=chat/service.yaml
    - name: openapiv2
      out: ../docs
      opt:
          - logtostderr=true
          - grpc_api_configuration=chat/service.yaml
          - version=true
