syntax = "proto3";

package message;

import "google/protobuf/any.proto";
import "chat/chat.proto";

option go_package = "chat/proto/types/message;message";


message SendMessage {
  string type = 1;
  chat.Message data = 2;
}

message CreateRoomData {
  string room_id = 1;
  repeated string members = 2;
}

message CreateRoom {
  string type = 1;
  CreateRoomData data = 2;
}

message JoinRoomData {
  string room_id = 1;
  string user_id = 2;
}

message JoinRoom {
  string type = 1;
  JoinRoomData data = 2;
}

message LeaveRoomData {
  string room_id = 1;
  string user_id = 2;
}

message LeaveRoom {
  string type = 1;
  LeaveRoomData data = 2;
}

message ReadMessageData {
  repeated string message_ids = 1;
  string user_id = 2;
  string room_id = 3;
}

message ReadMessage {
  string type = 1;
  ReadMessageData data = 2;
}

message RecallMessageData {
  string message_id = 1;
  string room_id = 2;

}

message RecallMessage {
  string type = 1;
  RecallMessageData data = 2;
}

message EditMessageData {
  string message_id = 1;
  string new_message = 2;
  string room_id = 3;
}

message EditMessage {
  string type = 1;
  EditMessageData data = 2;
}

message PinMessageData {
  string room_id = 1;
  string message_id = 2;
}

message PinMessage {
  string type = 1;
  PinMessageData data = 2;
}

message ReactMessageData {
  string message_id = 1;
  string emoji = 2;
}

message ReactMessage {
  string type = 1;
  ReactMessageData data = 2;
}

message SeenMessageData {
  string message_id = 1;
  string user_id = 2;
}

message SeenMessage {
  string type = 1;
  SeenMessageData data = 2;
}

message UpdateSettingsData {
  string room_id = 1;
  map<string, string> settings = 2;
}

message UpdateSettings {
  string type = 1;
  UpdateSettingsData data = 2;
}

message DeleteRoomData {
  string room_id = 1;
}

message DeleteRoom {
  string type = 1;
  DeleteRoomData data = 2;
}

message RemoveMemberData {
  string room_id = 1;
  string user_id = 2;
}

message RemoveMember {
  string type = 1;
  RemoveMemberData data = 2;
}

message DeleteViolationMessageData {
  string message_id = 1;
  string reason = 2;
}

message DeleteViolationMessage {
  string type = 1;
  DeleteViolationMessageData data = 2;
}

message UpdateRoomMessageData {
  repeated string members = 1;
  string room_id = 2;
}

message UpdateRoomMessage {
  string type = 1;
  UpdateRoomMessageData data = 2;
}

message ExistedConversationResponse {
  int32 conversation_id = 1;
}

message ReactionMessage {
  string type = 1;
  chat.MessageReaction data = 2;
}