name: Proof W3 User ZNS Token Atomicity

on:
  push:
    branches:
      - proof/w3-zns-token-atomicity

permissions:
  contents: read

jobs:
  prove-user-zns-token-atomicity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout proof candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up canonical Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: false

      - name: Verify exact W3 source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object user-service/internal/interface/repo/auth_config_repo.go)" = "ee80dce77ddf983be28f71982ccffe5886e7c692"
          test "$(git hash-object user-service/infra/postgres/auth_config_postgres.go)" = "7ced58804cf615c1b354ef328daf54b5725375f6"
          test "$(git hash-object user-service/infra/postgres/auth_config_postgres_test.go)" = "bd5a3b7a6f402e594a47801efc9aaa48ffe27270"
          test "$(git hash-object user-service/infra/zns/zns_provider.go)" = "8fe76d62d431fe7a10be64b9ad5cfcf131e1700e"
          test "$(git hash-object user-service/infra/zns/zns_provider_test.go)" = "27db5fea604dea1458a84b2245ee575892f618ef"
          git diff --check HEAD^

      - name: Generate canonical protobuf dependencies
        shell: bash
        run: |
          set -euo pipefail
          source shared/code/development/toolchain.versions
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          go install "github.com/bufbuild/buf/cmd/buf@v${BUF_VERSION}"
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@v${PROTOC_GEN_GO_VERSION}"
          go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v${PROTOC_GEN_GO_GRPC_VERSION}"
          go install "github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@v${GRPC_GATEWAY_VERSION}"
          export PATH="$(go env GOPATH)/bin:$PATH"
          make -C shared/code buf-all
          test -d shared/protobuf/types/shared
          test -d shared/protobuf/types/auth
          test -d shared/protobuf/types/user
          git diff --exit-code -- shared/protobuf/schema

      - name: Prove focused W3 behavior
        shell: bash
        run: |
          set -euo pipefail
          cd user-service
          go test ./infra/postgres ./infra/zns

      - name: Prove full User module
        shell: bash
        run: |
          set -euo pipefail
          cd user-service
          go test ./...
          go vet ./...
          go build ./...
