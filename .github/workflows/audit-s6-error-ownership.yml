name: Audit S6 Batch 3 Ownership Candidates

on:
  push:
    branches:
      - final-acceptance/audit-s6-error-ownership

permissions:
  contents: read

jobs:
  exact-sha-candidate-inventory:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact accepted boundary
        uses: actions/checkout@v4
        with:
          ref: 7c9d5c3bd85bb110e5207c36a9dd8de27b98804b
          fetch-depth: 0

      - name: Verify immutable audit authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7c9d5c3bd85bb110e5207c36a9dd8de27b98804b"
          canonical_remote="$(git ls-remote origin refs/heads/final-acceptance/source-canonicalization | awk '{print $1}')"
          test "$canonical_remote" = "7c9d5c3bd85bb110e5207c36a9dd8de27b98804b"
          test -z "$(git status --porcelain)"
          printf 'AUDIT_SHA=%s\n' "$(git rev-parse HEAD)"

      - name: Rank transport leakage in application and usecase layers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [p for p in Path('.').iterdir() if p.is_dir() and p.name.endswith('-service')]
          excluded = {'organization-service', 'map-service'}
          patterns = {
              'net/http': re.compile(r'"net/http"'),
              'common/routes': re.compile(r'"common/routes"'),
              'common/errors': re.compile(r'"common/errors"'),
              'http.Status': re.compile(r'\bhttp\.Status[A-Za-z]+'),
              '_routes.Except': re.compile(r'\b_routes\.Except\b'),
              'HTTP-named shared exception': re.compile(r'\b_errors\.(?:BadRequestException|UnauthorizedException|ForbiddenException|NotFoundException|ConflictException|TooManyRequestsException|InternalServerException)\b'),
              'grpc status/codes': re.compile(r'"google\.golang\.org/grpc/(?:status|codes)"'),
          }
          rows = []
          for root in roots:
              if root.name in excluded:
                  continue
              for p in root.rglob('*.go'):
                  s = p.as_posix()
                  if not re.search(r'/(?:internal/)?(?:usecase|usecases|application|biz)/', s):
                      continue
                  text = p.read_text(errors='replace')
                  hits = {name: len(rx.findall(text)) for name, rx in patterns.items()}
                  score = sum(hits.values())
                  if score:
                      rows.append((score, s, hits, len(text.splitlines())))
          print('=== RANKED APPLICATION/USECASE TRANSPORT COUPLING ===')
          for score, path, hits, lines in sorted(rows, key=lambda x: (-x[0], x[1])):
              hitstr = ', '.join(f'{k}={v}' for k,v in hits.items() if v)
              print(f'SCORE={score:02d} LINES={lines:04d} {path} :: {hitstr}')
          PY

      - name: Compare Social and BDSPro narrow candidate files
        shell: bash
        run: |
          set -euo pipefail
          echo '=== SOCIAL USECASE TRANSPORT-SHAPED FILES ==='
          git grep -n -E '"net/http"|"common/routes"|"common/errors"|http\.Status[A-Za-z]+|_routes\.Except|_errors\.(BadRequestException|UnauthorizedException|ForbiddenException|NotFoundException|ConflictException|TooManyRequestsException|InternalServerException)' \
            -- 'social-service/internal/usecase/*.go' || true

          echo '=== BDSPRO USECASE TRANSPORT-SHAPED FILES ==='
          git grep -n -E '"net/http"|"common/routes"|"common/errors"|http\.Status[A-Za-z]+|_routes\.Except|_errors\.(BadRequestException|UnauthorizedException|ForbiddenException|NotFoundException|ConflictException|TooManyRequestsException|InternalServerException)' \
            -- 'bdspro-service/internal/usecase/*.go' 'bdspro-service/internal/usecases/*.go' || true

          echo '=== SOCIAL OWNER-LOCAL ERROR MAPPERS / DOMAIN ERRORS ==='
          git grep -n -E 'func .*([Mm]ap.*[Ee]rror|[Ee]rror.*[Gg][Rr][Pp][Cc])|errors\.Is\(|var Err|errors\.New\(' \
            -- 'social-service/infra/**/*.go' 'social-service/internal/domain/*.go' || true

          echo '=== BDSPRO OWNER-LOCAL ERROR MAPPERS / DOMAIN ERRORS ==='
          git grep -n -E 'func .*([Mm]ap.*[Ee]rror|[Ee]rror.*[Gg][Rr][Pp][Cc])|errors\.Is\(|var Err|errors\.New\(' \
            -- 'bdspro-service/infra/**/*.go' 'bdspro-service/internal/domain/*.go' || true

      - name: Inventory shared response filter middleware surfaces and exact import callers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          excluded_prefixes = ('organization-service/', 'map-service/', 'shared/protobuf/')
          go_files = [p for p in Path('.').rglob('*.go') if not p.as_posix().startswith(excluded_prefixes)]
          packages = {
              'common/routes': re.compile(r'"common/routes"'),
              'common/errors': re.compile(r'"common/errors"'),
              'common/pkg/validate/grpcerror': re.compile(r'"common/pkg/validate/grpcerror"'),
          }
          print('=== EXACT IMPORT CALLER COUNTS ===')
          for pkg, rx in packages.items():
              callers = []
              for p in go_files:
                  if rx.search(p.read_text(errors='replace')):
                      callers.append(p.as_posix())
              print(f'{pkg}: callers={len(callers)}')
              for c in sorted(callers):
                  print(f'  {c}')

          print('=== SHARED TRANSPORT-SHAPED SURFACES ===')
          for p in sorted(Path('shared/common').rglob('*.go')):
              s = p.as_posix().lower()
              text = p.read_text(errors='replace')
              named = any(k in s for k in ('error', 'response', 'filter', 'middleware', 'interceptor', 'route'))
              coupled = bool(re.search(r'"net/http"|"github.com/gin-gonic/gin"|"google\.golang\.org/grpc/(?:status|codes)"|pb/types/shared', text))
              if named or coupled:
                  markers = []
                  for label, rx in [
                      ('http', r'"net/http"'), ('gin', r'"github.com/gin-gonic/gin"'),
                      ('grpc', r'"google\.golang\.org/grpc/(?:status|codes)"'), ('sharepb', r'pb/types/shared')]:
                      if re.search(rx, text): markers.append(label)
                  print(f'{p.as_posix()} lines={len(text.splitlines())} markers={",".join(markers) or "name-only"}')
          PY

      - name: Find smallest legacy exception and route-result symbol surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          excluded = ('organization-service/', 'map-service/', 'shared/protobuf/', 'shared/common/errors/', 'shared/common/routes/')
          symbols = [
              'BadRequestException','UnauthorizedException','ForbiddenException','NotFoundException',
              'ConflictException','TooManyRequestsException','InternalServerException',
              'ReturnErrorWithSecond','ReturnError','InvalidRequest','ThrowError','RouteResult'
          ]
          files = [p for p in Path('.').rglob('*.go') if not p.as_posix().startswith(excluded)]
          print('=== LEGACY SYMBOL CALLER COUNTS ===')
          for sym in symbols:
              rx = re.compile(r'\b'+re.escape(sym)+r'\b')
              callers=[]
              occurrences=0
              for p in files:
                  text=p.read_text(errors='replace')
                  n=len(rx.findall(text))
                  if n:
                      callers.append((p.as_posix(),n))
                      occurrences += n
              print(f'{sym}: files={len(callers)} occurrences={occurrences}')
              if len(callers) <= 8:
                  for path,n in sorted(callers): print(f'  {path} x{n}')
          PY

      - name: Final audit immutability check
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7c9d5c3bd85bb110e5207c36a9dd8de27b98804b"
          git diff --exit-code
          test -z "$(git status --porcelain)"
