name: Audit S6 Social Share Error Contract

on:
  push:
    branches:
      - final-acceptance/audit-s6-error-ownership

permissions:
  contents: read

jobs:
  prove-social-share-legacy-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact accepted source
        uses: actions/checkout@v4
        with:
          ref: 1c341ff2a1473eae1ec397c98d0962dda76a64e6
          fetch-depth: 1

      - name: Verify immutable audit authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1c341ff2a1473eae1ec397c98d0962dda76a64e6"
          canonical_remote="$(git ls-remote origin refs/heads/final-acceptance/source-canonicalization | awk '{print $1}')"
          test "$canonical_remote" = "1c341ff2a1473eae1ec397c98d0962dda76a64e6"
          test -z "$(git status --porcelain)"

      - name: Prove bounded caller chain
        shell: bash
        run: |
          set -euo pipefail
          echo '=== RequiredBeforeShare callers ==='
          git grep -n -F 'RequiredBeforeShare(' -- 'social-service/**/*.go' || true
          echo '=== ShareToNewsFeed callers ==='
          git grep -n -F 'ShareToNewsFeed(' -- 'social-service/**/*.go' || true
          echo '=== ShareToChannel callers ==='
          git grep -n -F 'ShareToChannel(' -- 'social-service/**/*.go' || true
          echo '=== ShareNewsFeed RPC/service chain ==='
          git grep -n -F 'ShareNewsFeed(' -- 'social-service/**/*.go' || true
          echo '=== Exact usecase transport leakage ==='
          git grep -n -E '"net/http"|"common/routes"|http\.Status(NotFound|Forbidden)|_routes\.Except' -- 'social-service/internal/usecase/news_feed_share.go'
          echo '=== Social share tests ==='
          find social-service -type f -name '*_test.go' -print | sort || true

      - name: Set up canonical Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: false

      - name: Install canonical protobuf generators
        shell: bash
        run: |
          set -euo pipefail
          source shared/code/development/toolchain.versions
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          go install "github.com/bufbuild/buf/cmd/buf@v${BUF_VERSION}"
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@v${PROTOC_GEN_GO_VERSION}"
          go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v${PROTOC_GEN_GO_GRPC_VERSION}"
          go install "github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@v${GRPC_GATEWAY_VERSION}"

      - name: Generate canonical protobuf
        shell: bash
        run: |
          set -euo pipefail
          make -C shared/code buf-all
          test -d shared/protobuf/types/shared
          git diff --exit-code

      - name: Prove current Except to gRPC semantics
        shell: bash
        working-directory: social-service
        env:
          GOWORK: off
        run: |
          set -euo pipefail
          test "$(go list -m)" = "social"
          cat > /tmp/social_share_error_probe.go <<'EOF'
          package main

          import (
            "fmt"
            _routes "common/routes"
            "google.golang.org/grpc/codes"
            "google.golang.org/grpc/status"
          )

          func verify(code int, message string) {
            err := &_routes.Except{Code: code, Message: message}
            st := status.Convert(err)
            wantMessage := fmt.Sprintf("%d: %s", code, message)
            if st.Code() != codes.Unknown || st.Message() != wantMessage || len(st.Details()) != 0 {
              panic(fmt.Sprintf("unexpected semantics code=%s message=%q details=%d", st.Code(), st.Message(), len(st.Details())))
            }
            fmt.Printf("INPUT_CODE=%d GRPC_CODE=%d GRPC_NAME=%s MESSAGE=%q DETAILS=%d\n", code, int32(st.Code()), st.Code(), st.Message(), len(st.Details()))
          }

          func main() {
            verify(404, "Bài viết không tồn tại")
            verify(403, "Bài viết không thể chia sẻ do không phải công khai")
          }
          EOF
          go run /tmp/social_share_error_probe.go

      - name: Prove Gateway legacy HTTP result for Unknown
        shell: bash
        working-directory: gateway-service
        run: |
          set -euo pipefail
          cat > internal/httperror/social_share_audit_test.go <<'EOF'
          package httperror

          import (
            "encoding/json"
            "net/http"
            "net/http/httptest"
            "testing"

            "google.golang.org/grpc/codes"
            "google.golang.org/grpc/status"
          )

          func TestAuditSocialShareLegacyUnknownContract(t *testing.T) {
            cases := []string{
              "404: Bài viết không tồn tại",
              "403: Bài viết không thể chia sẻ do không phải công khai",
            }
            for _, message := range cases {
              recorder := httptest.NewRecorder()
              WriteGRPC(recorder, status.Error(codes.Unknown, message))
              if recorder.Code != http.StatusInternalServerError {
                t.Fatalf("status=%d want=%d", recorder.Code, http.StatusInternalServerError)
              }
              var body struct {
                Code int32 `json:"code"`
                Message string `json:"message"`
              }
              if err := json.Unmarshal(recorder.Body.Bytes(), &body); err != nil {
                t.Fatal(err)
              }
              if body.Code != int32(codes.Unknown) || body.Message != message {
                t.Fatalf("body=%+v want code=%d message=%q", body, int32(codes.Unknown), message)
              }
              t.Logf("HTTP=%d BODY_CODE=%d MESSAGE=%q", recorder.Code, body.Code, body.Message)
            }
          }
          EOF
          trap 'rm -f internal/httperror/social_share_audit_test.go' EXIT
          go test ./internal/httperror -run TestAuditSocialShareLegacyUnknownContract -count=1 -v
          rm internal/httperror/social_share_audit_test.go
          trap - EXIT

      - name: Verify no source mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1c341ff2a1473eae1ec397c98d0962dda76a64e6"
          git diff --exit-code
          test -z "$(git status --porcelain)"
