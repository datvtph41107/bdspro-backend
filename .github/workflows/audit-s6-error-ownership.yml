name: Audit S6 Social Error Ownership

on:
  push:
    branches:
      - final-acceptance/audit-s6-error-ownership

permissions:
  contents: read

jobs:
  inventory-social-error-ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact accepted source
        uses: actions/checkout@v4
        with:
          ref: 1c341ff2a1473eae1ec397c98d0962dda76a64e6
          fetch-depth: 1

      - name: Verify immutable audit authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1c341ff2a1473eae1ec397c98d0962dda76a64e6"
          canonical_remote="$(git ls-remote origin refs/heads/final-acceptance/source-canonicalization | awk '{print $1}')"
          test "$canonical_remote" = "1c341ff2a1473eae1ec397c98d0962dda76a64e6"
          test -z "$(git status --porcelain)"
          printf 'AUDIT_SHA=%s\n' "$(git rev-parse HEAD)"

      - name: Inventory Social direct transport ownership
        shell: bash
        run: |
          set -euo pipefail
          echo '=== SOCIAL net/http IMPORTS ==='
          git grep -n -F '"net/http"' -- 'social-service/**/*.go' || true
          echo '=== SOCIAL http.Status REFERENCES ==='
          git grep -n -E 'http\.Status[A-Za-z0-9_]+' -- 'social-service/**/*.go' || true
          echo '=== SOCIAL common/routes IMPORTS AND USAGE ==='
          git grep -n -E '"common/routes"|_routes\.(Except|RouteResult|ResponseDTO)|routes\.(Except|RouteResult|ResponseDTO)' -- 'social-service/**/*.go' || true
          echo '=== SOCIAL common/errors IMPORTS AND TRANSPORT-SHAPED HELPERS ==='
          git grep -n -E '"common/errors"|_errors\.(BadRequestException|UnauthorizedException|ForbiddenException|NotFoundException|ConflictException|TooManyRequestsException|InternalServerException|ReturnError|ReturnErrorWithSecond|ThrowError|InvalidRequest)' -- 'social-service/**/*.go' || true
          echo '=== SOCIAL gRPC STATUS/CODES DIRECT USE ==='
          git grep -n -E '"google.golang.org/grpc/(codes|status)"|codes\.[A-Za-z]+|status\.(New|Error|Errorf)' -- 'social-service/**/*.go' || true

      - name: Rank narrow Social leakage candidates
        shell: bash
        run: |
          set -euo pipefail
          echo '=== FILE COUNTS: http.Status ==='
          { git grep -l -E 'http\.Status[A-Za-z0-9_]+' -- 'social-service/**/*.go' || true; } | sort | uniq -c | sort -n
          echo '=== FILE COUNTS: routes.Except ==='
          { git grep -l -E '_routes\.Except|routes\.Except' -- 'social-service/**/*.go' || true; } | sort | uniq -c | sort -n
          echo '=== CANDIDATE FILE LINE COUNTS / FUNCTIONS ==='
          files="$({ git grep -l -E 'http\.Status[A-Za-z0-9_]+|_routes\.Except|routes\.Except' -- 'social-service/**/*.go' || true; } | sort -u)"
          for f in $files; do
            printf '\n--- %s ---\n' "$f"
            wc -l "$f"
            grep -nE '^func |^func \(' "$f" || true
            grep -nE 'http\.Status[A-Za-z0-9_]+|_routes\.Except|routes\.Except' "$f" || true
          done

      - name: Trace Social transport and presenter surfaces
        shell: bash
        run: |
          set -euo pipefail
          echo '=== SOCIAL HANDLER / DELIVERY / TRANSPORT FILES ==='
          find social-service -type f -name '*.go' \
            | grep -Ei '/(handler|handlers|delivery|transport|grpc|http|route|router|presenter|adapter|middleware)/' \
            | sort || true
          echo '=== TRANSPORT MAPPING SYMBOLS ==='
          git grep -n -E 'RouteResult\(|Except\{|errors\.As\(|status\.(New|Error|Errorf)|codes\.[A-Za-z]+|Register.*Server|Register.*Handler|HandleFunc|gin\.' -- 'social-service/**/*.go' || true
          echo '=== USECASE CONSTRUCTORS / HANDLER CALLS ==='
          git grep -n -E 'New[A-Za-z0-9_]*Usecase|New[A-Za-z0-9_]*Handler|Usecase\)|UseCase\)|\.Create|\.Update|\.Delete|\.Get' -- 'social-service/internal/**/*.go' | head -n 800 || true

      - name: Inventory Social tests around errors and transport
        shell: bash
        run: |
          set -euo pipefail
          echo '=== SOCIAL TEST FILES ==='
          find social-service -type f -name '*_test.go' | sort || true
          echo '=== SOCIAL TEST NAMES / ERROR ASSERTIONS ==='
          git grep -n -E '^func Test|require\.(Error|ErrorIs|Equal)|assert\.(Error|ErrorIs|Equal)|http\.Status|codes\.|status\.' -- 'social-service/**/*_test.go' || true

      - name: Verify no source mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1c341ff2a1473eae1ec397c98d0962dda76a64e6"
          git diff --exit-code
          test -z "$(git status --porcelain)"
