name: Audit S6 Error Ownership

on:
  push:
    branches:
      - final-acceptance/audit-s6-error-ownership

permissions:
  contents: read

jobs:
  exact-sha-caller-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact accepted boundary
        uses: actions/checkout@v4
        with:
          ref: 4d40fa37945c9dda541d12397dba9afb5a5ad97d
          fetch-depth: 1

      - name: Verify immutable audit source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4d40fa37945c9dda541d12397dba9afb5a5ad97d"
          test -z "$(git status --porcelain)"
          printf 'AUDIT_SHA=%s\n' "$(git rev-parse HEAD)"

      - name: Trace canonical semantic error slices
        shell: bash
        run: |
          set -euo pipefail
          echo '=== TQD QUOTA DOMAIN ERROR CALLERS ==='
          git grep -n -E 'ErrAccessDenied|ErrQuotaExceeded|ErrInvalidInput|ErrReservationNotFound|ErrReservationCommitted|ErrReservationCanceled|ExhaustedError|AccessDeniedError' -- 'tqd-service/**/*.go' || true
          echo '=== PAYMENT DOMAIN ERROR CALLERS ==='
          git grep -n -E 'ErrInvalidCommercialTerms|ErrInvalidCommand|ErrOrderNotFound|ErrOrderCommandConflict|ErrProviderEvidenceConflict|ErrUnsupportedProviderEvent|ErrFulfillmentNotFound|ErrClaimLost|ErrSubscriptionTransient|ErrSubscriptionPermanent|ErrSubscriptionEffectConflict|ErrAttemptNotFound|ErrAttemptCommandConflict|ErrAttemptNotAllowed|ErrFundsConfirmationNotAllowed|ErrCommandEvidenceConflict|ErrUnsupportedPaymentMethod|ErrProviderUnavailable' -- 'payment-service/**/*.go' || true
          echo '=== BDSPRO DOMAIN ERROR CALLERS ==='
          git grep -n -E 'domain\.(ErrInvalidInput|ErrNotFound|ErrUnauthorized|ErrForbidden|ErrDuplicate|ErrConcurrentUpdate)' -- 'bdspro-service/**/*.go' || true

      - name: Trace transport presenters around canonical slices
        shell: bash
        run: |
          set -euo pipefail
          echo '=== TQD QUOTA ERRORS NEAR TRANSPORT ==='
          git grep -n -E 'quota\.(Err|ExhaustedError|AccessDeniedError)|errors\.Is\([^\n]*quota\.' -- 'tqd-service/infra/**/*.go' 'tqd-service/internal/**/*.go' || true
          echo '=== PAYMENT ERRORS NEAR TRANSPORT ==='
          git grep -n -E 'paymentdomain\.Err|domain\.Err' -- 'payment-service/infra/**/*.go' 'payment-service/internal/**/*.go' || true
          echo '=== ERROR MAPPING FUNCTIONS ==='
          git grep -n -E 'func .*([Mm]ap|[Pp]resent|[Tt]oGRPC|[Tt]oHTTP|[Ee]rror).*error|status\.(Error|New)|codes\.' -- 'tqd-service/**/*.go' 'payment-service/**/*.go' 'bdspro-service/**/*.go' ':!**/*_test.go' || true

      - name: Trace legacy shared coupling by layer
        shell: bash
        run: |
          set -euo pipefail
          echo '=== COMMON ERRORS IN USECASE/DOMAIN ==='
          git grep -n -F '"common/errors"' -- '*-service/internal/**/*.go' ':!organization-service/**' ':!map-service/**' || true
          echo '=== COMMON ROUTES IN USECASE/DOMAIN ==='
          git grep -n -F '"common/routes"' -- '*-service/internal/**/*.go' ':!organization-service/**' ':!map-service/**' || true
          echo '=== DIRECT HTTP STATUS IN USECASE/DOMAIN ==='
          git grep -n -E 'http\.Status(BadRequest|Unauthorized|Forbidden|NotFound|Conflict|UnprocessableEntity|InternalServerError|ServiceUnavailable)' -- '*-service/internal/**/*.go' ':!organization-service/**' ':!map-service/**' || true

      - name: Trace narrow shared error symbols
        shell: bash
        run: |
          set -euo pipefail
          echo '=== NewAppError CALLERS ==='
          git grep -n -E 'NewAppError\(' -- '*.go' ':!shared/common/errors/**' || true
          echo '=== ErrorHandlerMiddleware CALLERS ==='
          git grep -n -E 'ErrorHandlerMiddleware' -- '*.go' ':!shared/common/errors/**' || true
          echo '=== common/errors exception.go API CALLERS ==='
          git grep -n -E '(BadRequestException|UnauthorizedException|ForbiddenException|NotFoundException|ConflictException|TooManyRequestsException|InternalServerException)\(' -- '*.go' ':!shared/common/errors/**' ':!organization-service/**' ':!map-service/**' || true
