name: Audit S6 Error Ownership

on:
  push:
    branches:
      - final-acceptance/audit-s6-error-ownership

permissions:
  contents: read

jobs:
  exact-sha-chat-v1-wire-semantics:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact accepted boundary
        uses: actions/checkout@v4
        with:
          ref: 4d40fa37945c9dda541d12397dba9afb5a5ad97d
          fetch-depth: 1

      - name: Verify immutable audit source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4d40fa37945c9dda541d12397dba9afb5a5ad97d"
          test -z "$(git status --porcelain)"
          printf 'AUDIT_SHA=%s\n' "$(git rev-parse HEAD)"

      - name: Set up canonical Go patch version
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: false

      - name: Install canonical protobuf generators
        shell: bash
        run: |
          set -euo pipefail
          source shared/code/development/toolchain.versions
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          go install "github.com/bufbuild/buf/cmd/buf@v${BUF_VERSION}"
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@v${PROTOC_GEN_GO_VERSION}"
          go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v${PROTOC_GEN_GO_GRPC_VERSION}"
          go install "github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@v${GRPC_GATEWAY_VERSION}"

      - name: Generate canonical protobuf
        shell: bash
        run: |
          set -euo pipefail
          make -C shared/code buf-all
          test -d shared/protobuf/types/shared

      - name: Determine exact AppError wire semantics
        shell: bash
        run: |
          set -euo pipefail
          cd chat-v1-service
          cat > /tmp/app_error_probe.go <<'EOF'
          package main
          import (
            "fmt"
            "net/http"
            _errors "common/errors"
            "google.golang.org/grpc/status"
          )
          func main() {
            for _, e := range []error{
              _errors.NewAppError(http.StatusBadRequest, "receiverId is required"),
              _errors.NewAppError(http.StatusInternalServerError, "redis failed"),
              _errors.BadRequestException("receiverId is required"),
              _errors.InternalServerException("redis failed"),
            } {
              s := status.Convert(e)
              fmt.Printf("TYPE=%T CODE=%d CODE_NAME=%s MESSAGE=%q DETAILS=%d\n", e, int32(s.Code()), s.Code(), s.Message(), len(s.Details()))
            }
          }
          EOF
          go run /tmp/app_error_probe.go

      - name: Prove generated files only and source remained immutable
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4d40fa37945c9dda541d12397dba9afb5a5ad97d"
          changed="$(git status --porcelain)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^[? ][? ] shared/protobuf/|^.. shared/protobuf/' | grep -q .; then
            echo 'Audit unexpectedly modified non-generated source' >&2
            exit 1
          fi
