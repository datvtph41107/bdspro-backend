name: Materialize S6 Social Share Error Ownership Proof

on:
  push:
    branches:
      - final-acceptance/audit-s6-error-ownership

permissions:
  contents: write

jobs:
  materialize-proof-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact accepted source
        uses: actions/checkout@v4
        with:
          ref: 1c341ff2a1473eae1ec397c98d0962dda76a64e6
          fetch-depth: 0

      - name: Guard canonical and proof branch authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1c341ff2a1473eae1ec397c98d0962dda76a64e6"
          canonical_remote="$(git ls-remote origin refs/heads/final-acceptance/source-canonicalization | awk '{print $1}')"
          proof_remote="$(git ls-remote origin refs/heads/final-acceptance/proof-s6-social-share-errors | awk '{print $1}')"
          test "$canonical_remote" = "1c341ff2a1473eae1ec397c98d0962dda76a64e6"
          test "$proof_remote" = "1c341ff2a1473eae1ec397c98d0962dda76a64e6"
          test -z "$(git status --porcelain)"

      - name: Apply exact bounded source change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # 1) Domain owns semantic share errors, without transport codes/messages.
          domain = Path('social-service/internal/domain/news_feed_share.go')
          text = domain.read_text()
          old_import = '''import (
          \t_models "common/models"
          \t"social/internal/enums"
          )'''
          new_import = '''import (
          \t_models "common/models"
          \t"errors"
          \t"social/internal/enums"
          )'''
          assert text.count(old_import) == 1, text.count(old_import)
          text = text.replace(old_import, new_import, 1)
          marker = '''type NewsFeedShare struct {'''
          sentinels = '''var (
          \tErrShareNewsFeedNotFound  = errors.New("share news feed not found")
          \tErrShareNewsFeedNotPublic = errors.New("share news feed is not public")
          )

          '''
          assert text.count(marker) == 1, text.count(marker)
          text = text.replace(marker, sentinels + marker, 1)
          domain.write_text(text)

          # 2) Usecase returns semantic errors and no longer owns HTTP/routes policy.
          usecase = Path('social-service/internal/usecase/news_feed_share.go')
          text = usecase.read_text()
          assert text.count('\t_routes "common/routes"\n') == 1
          assert text.count('\t"net/http"\n') == 1
          text = text.replace('\t_routes "common/routes"\n', '', 1)
          text = text.replace('\t"net/http"\n', '', 1)
          old_not_found = '''\tif newsFeed.ID == 0 {
          \t\treturn nil, &_routes.Except{
          \t\t\tCode:    http.StatusNotFound,
          \t\t\tMessage: "Bài viết không tồn tại",
          \t\t}
          \t}'''
          old_not_public = '''\tif newsFeed.Visibility != enums.VisibilityPublic {
          \t\treturn nil, &_routes.Except{
          \t\t\tCode:    http.StatusForbidden,
          \t\t\tMessage: "Bài viết không thể chia sẻ do không phải công khai",
          \t\t}
          \t}'''
          assert text.count(old_not_found) == 1, text.count(old_not_found)
          assert text.count(old_not_public) == 1, text.count(old_not_public)
          text = text.replace(old_not_found, '''\tif newsFeed.ID == 0 {
          \t\treturn nil, domain.ErrShareNewsFeedNotFound
          \t}''', 1)
          text = text.replace(old_not_public, '''\tif newsFeed.Visibility != enums.VisibilityPublic {
          \t\treturn nil, domain.ErrShareNewsFeedNotPublic
          \t}''', 1)
          usecase.write_text(text)

          # 3) Social gRPC transport owns mapping back to exact legacy wire semantics.
          service = Path('social-service/infra/service/news_feed.go')
          text = service.read_text()
          assert text.count('\t"context"\n') == 1
          assert 'stderrors "errors"' not in text
          text = text.replace('\t"context"\n', '\t"context"\n\tstderrors "errors"\n', 1)
          import_marker = '\t"golang.org/x/sync/errgroup"\n'
          assert text.count(import_marker) == 1, text.count(import_marker)
          text = text.replace(import_marker, import_marker + '\t"google.golang.org/grpc/codes"\n\t"google.golang.org/grpc/status"\n', 1)

          share_comment = '// @Summary Share news feed\n'
          assert text.count(share_comment) == 1, text.count(share_comment)
          helper = '''// mapShareNewsFeedError keeps the established Social share wire contract while
          // moving business-state ownership out of the usecase. The Unknown code and
          // exact legacy messages are compatibility behavior, not domain semantics.
          func mapShareNewsFeedError(err error) error {
          \tswitch {
          \tcase stderrors.Is(err, domain.ErrShareNewsFeedNotFound):
          \t\treturn status.Error(codes.Unknown, "404: Bài viết không tồn tại")
          \tcase stderrors.Is(err, domain.ErrShareNewsFeedNotPublic):
          \t\treturn status.Error(codes.Unknown, "403: Bài viết không thể chia sẻ do không phải công khai")
          \tdefault:
          \t\treturn err
          \t}
          }

          '''
          text = text.replace(share_comment, helper + share_comment, 1)

          old_call = '''\tnewsFeedShare, err := s.newsFeedShareUsecase.ShareNewsFeed(ctx,
          \t\treq.NewsFeedId,
          \t\treq.TargetId,
          \t\treq.Content,
          \t\tenums.ShareType(req.ShareType),
          \t)
          \tif err != nil {
          \t\treturn nil, err
          \t}'''
          new_call = '''\tnewsFeedShare, err := s.newsFeedShareUsecase.ShareNewsFeed(ctx,
          \t\treq.NewsFeedId,
          \t\treq.TargetId,
          \t\treq.Content,
          \t\tenums.ShareType(req.ShareType),
          \t)
          \tif err != nil {
          \t\treturn nil, mapShareNewsFeedError(err)
          \t}'''
          assert text.count(old_call) == 1, text.count(old_call)
          text = text.replace(old_call, new_call, 1)
          service.write_text(text)

          # 4) Lock the compatibility mapping in Social itself.
          test = Path('social-service/infra/service/news_feed_share_error_test.go')
          assert not test.exists()
          test.write_text('''package service

          import (
          \t"errors"
          \t"testing"

          \t"social/internal/domain"

          \t"google.golang.org/grpc/codes"
          \t"google.golang.org/grpc/status"
          )

          func TestMapShareNewsFeedErrorPreservesLegacyWireContract(t *testing.T) {
          \ttests := []struct {
          \t\tname    string
          \t\terr     error
          \t\tmessage string
          \t}{
          \t\t{
          \t\t\tname:    "not found",
          \t\t\terr:     domain.ErrShareNewsFeedNotFound,
          \t\t\tmessage: "404: Bài viết không tồn tại",
          \t\t},
          \t\t{
          \t\t\tname:    "not public",
          \t\t\terr:     domain.ErrShareNewsFeedNotPublic,
          \t\t\tmessage: "403: Bài viết không thể chia sẻ do không phải công khai",
          \t\t},
          \t}

          \tfor _, tt := range tests {
          \t\tt.Run(tt.name, func(t *testing.T) {
          \t\t\tgot := status.Convert(mapShareNewsFeedError(tt.err))
          \t\t\tif got.Code() != codes.Unknown {
          \t\t\t\tt.Fatalf("code = %s, want %s", got.Code(), codes.Unknown)
          \t\t\t}
          \t\t\tif got.Message() != tt.message {
          \t\t\t\tt.Fatalf("message = %q, want %q", got.Message(), tt.message)
          \t\t\t}
          \t\t\tif len(got.Details()) != 0 {
          \t\t\t\tt.Fatalf("details = %d, want 0", len(got.Details()))
          \t\t\t}
          \t\t})
          \t}
          }

          func TestMapShareNewsFeedErrorPassesThroughUnrelatedError(t *testing.T) {
          \twant := errors.New("repository failure")
          \tif got := mapShareNewsFeedError(want); got != want {
          \t\tt.Fatalf("got %v, want original error", got)
          \t}
          }
          ''')
          PY

          gofmt -w \
            social-service/internal/domain/news_feed_share.go \
            social-service/internal/usecase/news_feed_share.go \
            social-service/infra/service/news_feed.go \
            social-service/infra/service/news_feed_share_error_test.go

          git diff --check
          test -z "$(git grep -n -E '"'"'"net/http"'"'"|"'"'"common/routes"'"'"|http\.Status(NotFound|Forbidden)|_routes\.Except' -- social-service/internal/usecase/news_feed_share.go || true)"
          grep -Fq 'domain.ErrShareNewsFeedNotFound' social-service/internal/usecase/news_feed_share.go
          grep -Fq 'domain.ErrShareNewsFeedNotPublic' social-service/internal/usecase/news_feed_share.go
          grep -Fq 'status.Error(codes.Unknown, "404: Bài viết không tồn tại")' social-service/infra/service/news_feed.go
          grep -Fq 'status.Error(codes.Unknown, "403: Bài viết không thể chia sẻ do không phải công khai")' social-service/infra/service/news_feed.go
          grep -Fq 'return nil, mapShareNewsFeedError(err)' social-service/infra/service/news_feed.go

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            social-service/infra/service/news_feed.go \
            social-service/infra/service/news_feed_share_error_test.go \
            social-service/internal/domain/news_feed_share.go \
            social-service/internal/usecase/news_feed_share.go | sort)"
          test "$changed" = "$expected"
          git diff --stat
          git diff -- \
            social-service/infra/service/news_feed.go \
            social-service/infra/service/news_feed_share_error_test.go \
            social-service/internal/domain/news_feed_share.go \
            social-service/internal/usecase/news_feed_share.go

      - name: Create one semantic commit on proof branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BDSPro Acceptance'
          git config user.email '116329073+datvtph41107@users.noreply.github.com'
          git add \
            social-service/infra/service/news_feed.go \
            social-service/infra/service/news_feed_share_error_test.go \
            social-service/internal/domain/news_feed_share.go \
            social-service/internal/usecase/news_feed_share.go
          git commit -m 'refactor(social): localize share error transport mapping'
          test "$(git rev-parse HEAD^)" = "1c341ff2a1473eae1ec397c98d0962dda76a64e6"
          proof_remote="$(git ls-remote origin refs/heads/final-acceptance/proof-s6-social-share-errors | awk '{print $1}')"
          canonical_remote="$(git ls-remote origin refs/heads/final-acceptance/source-canonicalization | awk '{print $1}')"
          test "$proof_remote" = "1c341ff2a1473eae1ec397c98d0962dda76a64e6"
          test "$canonical_remote" = "1c341ff2a1473eae1ec397c98d0962dda76a64e6"
          git push origin HEAD:refs/heads/final-acceptance/proof-s6-social-share-errors
          printf 'PROOF_SOURCE_SHA=%s\n' "$(git rev-parse HEAD)"
