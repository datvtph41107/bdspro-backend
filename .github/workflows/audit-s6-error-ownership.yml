name: Prove S6 Social Share Error Ownership

on:
  push:
    branches:
      - final-acceptance/audit-s6-error-ownership

permissions:
  contents: read

jobs:
  prove-social-share-error-ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact proof source SHA
        uses: actions/checkout@v4
        with:
          ref: 7c9d5c3bd85bb110e5207c36a9dd8de27b98804b
          fetch-depth: 0

      - name: Verify immutable proof authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7c9d5c3bd85bb110e5207c36a9dd8de27b98804b"
          test "$(git rev-parse HEAD^)" = "1c341ff2a1473eae1ec397c98d0962dda76a64e6"
          canonical_remote="$(git ls-remote origin refs/heads/final-acceptance/source-canonicalization | awk '{print $1}')"
          proof_remote="$(git ls-remote origin refs/heads/final-acceptance/proof-s6-social-share-errors | awk '{print $1}')"
          test "$canonical_remote" = "1c341ff2a1473eae1ec397c98d0962dda76a64e6"
          test "$proof_remote" = "7c9d5c3bd85bb110e5207c36a9dd8de27b98804b"
          test -z "$(git status --porcelain)"

      - name: Verify bounded ownership delta
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only 1c341ff2a1473eae1ec397c98d0962dda76a64e6..HEAD | sort)"
          expected="$(printf '%s\n' \
            social-service/infra/service/news_feed.go \
            social-service/infra/service/news_feed_share_error_test.go \
            social-service/internal/domain/news_feed_share.go \
            social-service/internal/usecase/news_feed_share.go | sort)"
          test "$changed" = "$expected"
          git diff --check 1c341ff2a1473eae1ec397c98d0962dda76a64e6..HEAD

          test -z "$(git grep -n -E '"'"'"net/http"'"'"|"'"'"common/routes"'"'"|http\.Status(NotFound|Forbidden)|_routes\.Except' -- social-service/internal/usecase/news_feed_share.go || true)"
          grep -Fq 'ErrShareNewsFeedNotFound' social-service/internal/domain/news_feed_share.go
          grep -Fq 'ErrShareNewsFeedNotPublic' social-service/internal/domain/news_feed_share.go
          grep -Fq 'return nil, domain.ErrShareNewsFeedNotFound' social-service/internal/usecase/news_feed_share.go
          grep -Fq 'return nil, domain.ErrShareNewsFeedNotPublic' social-service/internal/usecase/news_feed_share.go
          grep -Fq 'status.Error(codes.Unknown, "404: Bài viết không tồn tại")' social-service/infra/service/news_feed.go
          grep -Fq 'status.Error(codes.Unknown, "403: Bài viết không thể chia sẻ do không phải công khai")' social-service/infra/service/news_feed.go
          grep -Fq 'return nil, mapShareNewsFeedError(err)' social-service/infra/service/news_feed.go

          # Existing transport-owned request validation remains intentionally untouched.
          grep -Fq 'Message: "newsFeedId or shareType is required"' social-service/infra/service/news_feed.go

      - name: Set up canonical Go patch version
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: false

      - name: Install canonical protobuf generators
        shell: bash
        run: |
          set -euo pipefail
          source shared/code/development/toolchain.versions
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          go install "github.com/bufbuild/buf/cmd/buf@v${BUF_VERSION}"
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@v${PROTOC_GEN_GO_VERSION}"
          go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v${PROTOC_GEN_GO_GRPC_VERSION}"
          go install "github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@v${GRPC_GATEWAY_VERSION}"

      - name: Generate canonical protobuf reproducibly
        shell: bash
        run: |
          set -euo pipefail
          make -C shared/code buf-all
          test -d shared/protobuf/types/shared
          test -d shared/protobuf/types/social
          git diff --exit-code

      - name: Test Social owner-local mapping
        shell: bash
        run: |
          set -euo pipefail
          go test ./social-service/infra/service -run 'TestMapShareNewsFeedError' -count=1 -v

      - name: Test race vet and build Social
        shell: bash
        run: |
          set -euo pipefail
          make -C social-service test
          make -C social-service test-race
          make -C social-service vet
          make -C social-service build

      - name: Prove Gateway HTTP compatibility from proof mapping
        shell: bash
        working-directory: gateway-service
        run: |
          set -euo pipefail
          cat > internal/httperror/social_share_proof_test.go <<'EOF'
          package httperror

          import (
            "encoding/json"
            "net/http"
            "net/http/httptest"
            "testing"

            "google.golang.org/grpc/codes"
            "google.golang.org/grpc/status"
          )

          func TestProofSocialShareLegacyUnknownContract(t *testing.T) {
            cases := []string{
              "404: Bài viết không tồn tại",
              "403: Bài viết không thể chia sẻ do không phải công khai",
            }
            for _, message := range cases {
              recorder := httptest.NewRecorder()
              WriteGRPC(recorder, status.Error(codes.Unknown, message))
              if recorder.Code != http.StatusInternalServerError {
                t.Fatalf("status=%d want=%d", recorder.Code, http.StatusInternalServerError)
              }
              var body struct {
                Code int32 `json:"code"`
                Message string `json:"message"`
              }
              if err := json.Unmarshal(recorder.Body.Bytes(), &body); err != nil {
                t.Fatal(err)
              }
              if body.Code != int32(codes.Unknown) || body.Message != message {
                t.Fatalf("body=%+v want code=%d message=%q", body, int32(codes.Unknown), message)
              }
              t.Logf("HTTP=%d BODY_CODE=%d MESSAGE=%q", recorder.Code, body.Code, body.Message)
            }
          }
          EOF
          trap 'rm -f internal/httperror/social_share_proof_test.go' EXIT
          go test ./internal/httperror -run TestProofSocialShareLegacyUnknownContract -count=1 -v
          rm internal/httperror/social_share_proof_test.go
          trap - EXIT

      - name: Final source immutability check
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7c9d5c3bd85bb110e5207c36a9dd8de27b98804b"
          git diff --exit-code
          test -z "$(git status --porcelain)"
