name: Audit S6 Error Ownership

on:
  push:
    branches:
      - final-acceptance/audit-s6-error-ownership

permissions:
  contents: read

jobs:
  exact-sha-chat-v1-error-trace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact accepted boundary
        uses: actions/checkout@v4
        with:
          ref: 4d40fa37945c9dda541d12397dba9afb5a5ad97d
          fetch-depth: 1

      - name: Verify immutable audit source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4d40fa37945c9dda541d12397dba9afb5a5ad97d"
          test -z "$(git status --porcelain)"
          printf 'AUDIT_SHA=%s\n' "$(git rev-parse HEAD)"

      - name: Locate AppError definition and all consumers
        shell: bash
        run: |
          set -euo pipefail
          echo '=== APPERROR DEFINITIONS ==='
          git grep -n -E 'type AppError|func NewAppError|ErrorHandlerMiddleware' -- '*.go' || true
          echo '=== APPERROR / NEWAPPERROR ALL REFERENCES ==='
          git grep -n -E 'AppError|NewAppError' -- '*.go' || true
          echo '=== SHARED ERRORS FILES ==='
          find shared/common/errors -maxdepth 2 -type f -name '*.go' -print | sort

      - name: Show chat-v1 NewAppError surrounding context
        shell: bash
        run: |
          set -euo pipefail
          echo '=== CHAT-V1 CALLSITE WINDOWS ==='
          f=chat-v1-service/infrastructure/handlers/chat_handler.go
          nl -ba "$f" | sed -n '360,425p'
          echo '--- second ---'
          nl -ba "$f" | sed -n '835,900p'
          echo '=== CHAT-V1 ERROR IMPORTS / STATUS USAGE ==='
          git grep -n -E 'common/errors|status\.|codes\.|NewAppError|BadRequestException|InternalServerException|ReturnError' -- 'chat-v1-service/**/*.go' || true

      - name: Trace return path and transport registration
        shell: bash
        run: |
          set -euo pipefail
          echo '=== CHAT-V1 HANDLER TYPES / RPC METHODS ==='
          git grep -n -E '^func \(.*Handler.*\)|Register.*Server|grpc\.NewServer|UnaryInterceptor|ErrorHandler' -- 'chat-v1-service/**/*.go' || true
          echo '=== CHAT-V1 TESTS AROUND ERROR CASES ==='
          git grep -n -E 'receiverId is required|receiverId|NewAppError|BadRequest|InternalServer|codes\.(InvalidArgument|Internal)|status\.Code' -- 'chat-v1-service/**/*_test.go' || true
          echo '=== GATEWAY ROUTES/CLIENTS FOR CHAT V1 ==='
          git grep -n -Ei 'chat[-_]?v1|ChatService|chat service' -- 'gateway-service/**/*.go' 'gateway-service/**/*.yml' 'gateway-service/**/*.yaml' || true

      - name: Inspect shared AppError source bytes
        shell: bash
        run: |
          set -euo pipefail
          for f in shared/common/errors/*.go; do
            if grep -Eq 'type AppError|func NewAppError|ErrorHandlerMiddleware' "$f"; then
              echo "=== $f ==="
              nl -ba "$f"
            fi
          done
