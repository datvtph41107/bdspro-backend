name: Audit S6 Error Ownership

on:
  push:
    branches:
      - final-acceptance/audit-s6-error-ownership

permissions:
  contents: write

jobs:
  materialize-bounded-proof-candidate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact accepted boundary
        uses: actions/checkout@v4
        with:
          ref: 4d40fa37945c9dda541d12397dba9afb5a5ad97d
          fetch-depth: 0

      - name: Guard canonical and proof branch authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4d40fa37945c9dda541d12397dba9afb5a5ad97d"
          canonical_remote="$(git ls-remote origin refs/heads/final-acceptance/source-canonicalization | awk '{print $1}')"
          proof_remote="$(git ls-remote origin refs/heads/final-acceptance/proof-s6-chat-app-error | awk '{print $1}')"
          test "$canonical_remote" = "4d40fa37945c9dda541d12397dba9afb5a5ad97d"
          test "$proof_remote" = "4d40fa37945c9dda541d12397dba9afb5a5ad97d"

      - name: Apply exact bounded source change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          handler = Path('chat-v1-service/infrastructure/handlers/chat_handler.go')
          text = handler.read_text()

          old_import = '\t"net/http"\n'
          old_bad = 'return nil, _errors.NewAppError(http.StatusBadRequest, "receiverId is required")'
          old_internal = 'return nil, _errors.NewAppError(http.StatusInternalServerError, err.Error())'

          assert text.count(old_import) == 1, text.count(old_import)
          assert text.count(old_bad) == 1, text.count(old_bad)
          assert text.count(old_internal) == 1, text.count(old_internal)

          text = text.replace(old_import, '')
          text = text.replace(old_bad, 'return nil, fmt.Errorf("receiverId is required")')
          text = text.replace(old_internal, 'return nil, fmt.Errorf("%s", err.Error())')
          handler.write_text(text)

          legacy = Path('shared/common/errors/exception.go')
          legacy_text = legacy.read_text()
          assert 'type AppError struct {' in legacy_text
          assert 'func NewAppError(' in legacy_text
          assert 'func ErrorHandlerMiddleware() gin.HandlerFunc' in legacy_text
          legacy.unlink()
          PY

          gofmt -w chat-v1-service/infrastructure/handlers/chat_handler.go
          git diff --check

          test ! -f shared/common/errors/exception.go
          ! git grep -n -E 'AppError|NewAppError|ErrorHandlerMiddleware' -- '*.go'
          ! grep -Fq '"net/http"' chat-v1-service/infrastructure/handlers/chat_handler.go
          grep -Fq 'fmt.Errorf("receiverId is required")' chat-v1-service/infrastructure/handlers/chat_handler.go
          grep -Fq 'fmt.Errorf("%s", err.Error())' chat-v1-service/infrastructure/handlers/chat_handler.go

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' chat-v1-service/infrastructure/handlers/chat_handler.go shared/common/errors/exception.go | sort)"
          test "$changed" = "$expected"
          git diff --stat
          git diff -- chat-v1-service/infrastructure/handlers/chat_handler.go shared/common/errors/exception.go

      - name: Create one semantic commit on proof branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BDSPro Acceptance'
          git config user.email '116329073+datvtph41107@users.noreply.github.com'
          git add chat-v1-service/infrastructure/handlers/chat_handler.go shared/common/errors/exception.go
          git commit -m 'refactor(chat): retire shared AppError surface'
          test "$(git rev-parse HEAD^)" = "4d40fa37945c9dda541d12397dba9afb5a5ad97d"
          proof_remote="$(git ls-remote origin refs/heads/final-acceptance/proof-s6-chat-app-error | awk '{print $1}')"
          test "$proof_remote" = "4d40fa37945c9dda541d12397dba9afb5a5ad97d"
          git push origin HEAD:refs/heads/final-acceptance/proof-s6-chat-app-error
          printf 'PROOF_SOURCE_SHA=%s\n' "$(git rev-parse HEAD)"
