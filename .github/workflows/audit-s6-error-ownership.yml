name: Audit S6 Error Ownership

on:
  push:
    branches:
      - final-acceptance/audit-s6-error-ownership

permissions:
  contents: read

jobs:
  exact-sha-chat-v1-presenter-trace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact accepted boundary
        uses: actions/checkout@v4
        with:
          ref: 4d40fa37945c9dda541d12397dba9afb5a5ad97d
          fetch-depth: 1

      - name: Verify immutable audit source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4d40fa37945c9dda541d12397dba9afb5a5ad97d"
          test -z "$(git status --porcelain)"
          printf 'AUDIT_SHA=%s\n' "$(git rev-parse HEAD)"

      - name: Locate and print chat-v1 presenter middleware
        shell: bash
        run: |
          set -euo pipefail
          echo '=== PRESENTER MIDDLEWARE REFERENCES ==='
          git grep -n -E 'PresenterMiddleware|AppError|NewAppError|ErrorHandlerMiddleware' -- 'chat-v1-service/**/*.go' 'shared/common/**/*.go' || true
          echo '=== MIDDLEWARE FILES ==='
          find chat-v1-service/infrastructure/middleware -type f -name '*.go' -print | sort
          for f in chat-v1-service/infrastructure/middleware/*.go; do
            echo "=== $f ==="
            nl -ba "$f"
          done

      - name: Inspect chat-v1 delivery error adapters
        shell: bash
        run: |
          set -euo pipefail
          echo '=== DELIVERY ERROR FILES ==='
          find chat-v1-service/infrastructure/delivery -type f -path '*errors*' -name '*.go' -print | sort || true
          for f in $(find chat-v1-service/infrastructure/delivery -type f -path '*errors*' -name '*.go' | sort); do
            echo "=== $f ==="
            nl -ba "$f"
          done
          echo '=== CALLERS OF DELIVERY ERROR PACKAGE ==='
          git grep -n -E 'delivery/errors|errors\.(New|From|To|Map|GRPC|Status)' -- 'chat-v1-service/**/*.go' || true

      - name: Inspect gateway Chat registration and error path
        shell: bash
        run: |
          set -euo pipefail
          for f in gateway-service/internal/grpcgateway/chat.go gateway-service/internal/httperror/grpc.go gateway-service/internal/httpresponse/marshaler.go; do
            if test -f "$f"; then
              echo "=== $f ==="
              nl -ba "$f"
            fi
          done
          echo '=== GATEWAY ERROR/PRESENTER OPTIONS ==='
          git grep -n -E 'WithErrorHandler|WithForwardResponseOption|WithMarshalerOption|httperror|httpresponse|WriteGRPC' -- 'gateway-service/**/*.go' || true

      - name: Determine AppError wire semantics with grpc status conversion
        shell: bash
        run: |
          set -euo pipefail
          cd chat-v1-service
          cat > /tmp/app_error_probe.go <<'EOF'
          package main
          import (
            "fmt"
            "net/http"
            _errors "common/errors"
            "google.golang.org/grpc/status"
          )
          func main() {
            for _, e := range []error{
              _errors.NewAppError(http.StatusBadRequest, "receiverId is required"),
              _errors.NewAppError(http.StatusInternalServerError, "redis failed"),
              _errors.BadRequestException("receiverId is required"),
              _errors.InternalServerException("redis failed"),
            } {
              s := status.Convert(e)
              fmt.Printf("TYPE=%T CODE=%s MESSAGE=%q DETAILS=%d\n", e, s.Code(), s.Message(), len(s.Details()))
            }
          }
          EOF
          go run /tmp/app_error_probe.go
