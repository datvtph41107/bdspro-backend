name: Audit S6 Batch 7 Deal Invitation Contract

on:
  push:
    branches:
      - final-acceptance/proof-s6-product-asset-unlink-harness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@v4
        with:
          ref: 97ec02d6e676cb060b70e40fb953be3013b99d87
          fetch-depth: 0

      - name: Exact authority guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "97ec02d6e676cb060b70e40fb953be3013b99d87"
          git fetch origin final-acceptance/source-canonicalization --quiet
          test "$(git rev-parse origin/final-acceptance/source-canonicalization)" = "97ec02d6e676cb060b70e40fb953be3013b99d87"
          test "$(sha256sum shared/code/deploy.sh | awk '{print $1}')" = "80b70e3ea1375b4a959438da92011574c084bdb14d6ee2399ff3d7ddf023e56e"

      - name: Trace exact Deal Invitation vertical
        shell: bash
        run: |
          set -euo pipefail
          echo '=== DUPLICATE INVITATION ERROR SITE ==='
          git grep -nF 'invitation already exists for this user' -- '*.go' || true
          echo '=== SEND INVITATION SYMBOLS ==='
          git grep -nE 'SendDealInvitation|SendInvitation\(' -- 'bdspro-service/**/*.go' 'shared/protobuf/**/*.proto' || true
          echo '=== DEAL MEMBER RPC / HTTP CONTRACT ==='
          git grep -n -B4 -A8 -E 'rpc[[:space:]]+SendDealInvitation|SendDealInvitation' -- 'shared/protobuf/**/*.proto' || true
          echo '=== HANDLER REGISTRATION ==='
          git grep -nE 'RegisterDealMemberServiceServer|NewDealInvitationHandler' -- 'bdspro-service/**/*.go' || true

      - name: Trace ReturnError and Gateway presentation
        shell: bash
        run: |
          set -euo pipefail
          echo '=== RETURNERROR IMPLEMENTATION ==='
          git grep -n -A18 -F 'func ReturnError(' -- 'shared/common/errors/*.go' || true
          echo '=== GATEWAY ERROR RESPONSE DETAIL CONSUMERS ==='
          git grep -nE 'ErrorResponse|status\.FromError|Details\(\)|HTTPStatusFromCode|runtime\.HTTPStatusFromCode' -- 'gateway-service/**/*.go' 'shared/**/*.go' || true

      - name: Set up canonical Go patch version
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: false

      - name: Install canonical protobuf generators
        shell: bash
        run: |
          set -euo pipefail
          source shared/code/development/toolchain.versions
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          go install "github.com/bufbuild/buf/cmd/buf@v${BUF_VERSION}"
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@v${PROTOC_GEN_GO_VERSION}"
          go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v${PROTOC_GEN_GO_GRPC_VERSION}"
          go install "github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@v${GRPC_GATEWAY_VERSION}"

      - name: Generate canonical protobuf
        shell: bash
        run: |
          set -euo pipefail
          make -C shared/code buf-all
          git diff --exit-code

      - name: Prove legacy gRPC and Gateway contract
        shell: bash
        run: |
          set -euo pipefail
          cat > gateway-service/internal/httperror/s6_batch7_audit_test.go <<'EOF'
          package httperror

          import (
              "encoding/json"
              "net/http"
              "net/http/httptest"
              "testing"

              commonerrors "common/errors"
              sharepb "pb/types/shared"
              "google.golang.org/grpc/codes"
              "google.golang.org/grpc/status"
          )

          func TestAuditDuplicateInvitationLegacyContract(t *testing.T) {
              const msg = "invitation already exists for this user"
              err := commonerrors.ReturnError(400, msg)

              st, ok := status.FromError(err)
              if !ok { t.Fatal("expected gRPC status") }
              if st.Code() != codes.Internal { t.Fatalf("code=%v", st.Code()) }
              if st.Message() != msg { t.Fatalf("message=%q", st.Message()) }
              ds := st.Details()
              if len(ds) != 1 { t.Fatalf("details=%d", len(ds)) }
              d, ok := ds[0].(*sharepb.ErrorResponse)
              if !ok { t.Fatalf("detail type=%T", ds[0]) }
              if d.Code != 400 || d.Message != msg || d.Second != nil {
                  t.Fatalf("detail=%+v", d)
              }

              rr := httptest.NewRecorder()
              WriteGRPC(rr, err)
              if rr.Code != http.StatusOK { t.Fatalf("http=%d body=%s", rr.Code, rr.Body.String()) }
              var body struct {
                  Code int32 `json:"code"`
                  Message string `json:"message"`
                  Second *int32 `json:"second"`
              }
              if decodeErr := json.Unmarshal(rr.Body.Bytes(), &body); decodeErr != nil { t.Fatal(decodeErr) }
              if body.Code != 400 || body.Message != msg || body.Second != nil {
                  t.Fatalf("body=%+v", body)
              }
          }
          EOF
          trap 'rm -f gateway-service/internal/httperror/s6_batch7_audit_test.go' EXIT
          (cd gateway-service && go test ./internal/httperror -run TestAuditDuplicateInvitationLegacyContract -count=1)

      - name: Final immutability
        shell: bash
        run: |
          set -euo pipefail
          rm -f gateway-service/internal/httperror/s6_batch7_audit_test.go
          test "$(git rev-parse HEAD)" = "97ec02d6e676cb060b70e40fb953be3013b99d87"
          test -z "$(git status --porcelain)"
