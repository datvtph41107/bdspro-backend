name: Refactor Observability and Error Contracts

on:
  push:
    branches:
      - refactor/canonical-observability-errors-a6d0722a
  pull_request:
    paths:
      - 'shared/common/fault/**'
      - 'shared/common/httpresponse/**'
      - 'shared/common/jwt/**'
      - 'shared/common/logging/**'
      - 'shared/code/development/audit-observability-errors.py'
      - 'shared/code/development/test_audit_observability_errors.py'
      - 'shared/code/development/root.mk'
      - 'shared/code/development/query-structured-logs.py'
      - 'shared/code/development/test_query_structured_logs.py'
      - 'shared/code/development/test-structured-log-query.sh'
      - 'shared/code/development/verify-source-layout.sh'
      - 'gateway-service/**'
      - 'user-service/**'
      - 'payment-service/**'
      - 'tqd-service/**'
      - '.github/workflows/refactor-observability-errors.yml'

permissions:
  contents: read

concurrency:
  group: refactor-observability-errors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test observability/error inventory detector
        run: python3 shared/code/development/test_audit_observability_errors.py
      - name: Test native runtime ownership contract
        run: bash shared/code/development/test-native-stack-ownership.sh
      - name: Test DEV raw process-stream mirror contract
        run: bash shared/code/development/test-dev-stream-mirror.sh
      - name: Test structured runtime log query contract
        run: |
          python3 shared/code/development/test_query_structured_logs.py
          bash shared/code/development/test-structured-log-query.sh
      - name: Build full-repository migration inventory and enforce ratchets
        run: python3 shared/code/development/audit-observability-errors.py --enforce-ratchets
      - name: Upload migration inventory
        uses: actions/upload-artifact@v4
        with:
          name: observability-error-inventory-${{ github.sha }}
          path: |
            .tmp/observability-errors/inventory.tsv
            .tmp/observability-errors/summary.json
          if-no-files-found: error
          retention-days: 30

  common-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: true
          cache-dependency-path: shared/common/go.sum
      - name: Test shared fault, HTTP response, JWT, and logging contracts
        working-directory: shared/common
        env:
          GOWORK: 'off'
        run: go test ./fault ./httpresponse ./jwt ./logging ./request ./requestlog

  boundary-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install repository setup prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Materialize canonical toolchain and generated contracts once
        run: make setup
      - name: Test Gateway response and observability boundaries
        working-directory: gateway-service
        env:
          GOWORK: 'off'
        run: |
          "$HOME/.cache/qhpro/toolchain/go1.25.10/bin/go" test \
            ./internal/httperror \
            ./internal/httpresponse \
            ./internal/httpmiddleware \
            ./internal/observability \
            ./cmd/http
      - name: Test User typed PlanVersion faults through gRPC boundary
        working-directory: user-service
        env:
          GOWORK: 'off'
        run: |
          "$HOME/.cache/qhpro/toolchain/go1.25.10/bin/go" test \
            ./internal/usecase/plan/admin \
            ./infra/handler/grpc
      - name: Test Payment typed admin faults through gRPC boundary
        working-directory: payment-service
        env:
          GOWORK: 'off'
        run: |
          "$HOME/.cache/qhpro/toolchain/go1.25.10/bin/go" test \
            ./internal/usecase/admin \
            ./infra/handler/grpc
      - name: Test TQD typed faults through gRPC boundary
        working-directory: tqd-service
        env:
          GOWORK: 'off'
        run: |
          "$HOME/.cache/qhpro/toolchain/go1.25.10/bin/go" test ./internal/usecase -run '^(TestQHAuthorityIssuring|TestQHLayerFamily|TestQHLabel|TestQHLayerLegend|TestQHLandUse|TestRegion|TestWorkspaceMap|TestImportRegion)'
          "$HOME/.cache/qhpro/toolchain/go1.25.10/bin/go" test ./infra/handler/grpc -run '^(TestQHAuthorityIssuring|TestQHLayerFamily|TestQHLabel|TestQHLayerLegend|TestQHLandUse|TestRegion|TestWorkspaceMap|TestImportRegion)'
          "$HOME/.cache/qhpro/toolchain/go1.25.10/bin/go" test ./infra/handler/http -run '^TestImportRegion'
          "$HOME/.cache/qhpro/toolchain/go1.25.10/bin/go" test ./internal/usecase/discovery/application -run '^TestDiscovery'
          "$HOME/.cache/qhpro/toolchain/go1.25.10/bin/go" test ./infra/handler/http/discovery -run '^TestDiscovery'
