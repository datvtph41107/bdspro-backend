name: Refactor Observability and Error Contracts

on:
  push:
    branches:
      - refactor/canonical-observability-errors-a6d0722a
  pull_request:
    paths:
      - 'shared/common/fault/**'
      - 'shared/common/logging/**'
      - 'shared/code/development/audit-observability-errors.py'
      - 'gateway-service/**'
      - 'user-service/**'
      - '.github/workflows/refactor-observability-errors.yml'

permissions:
  contents: read

concurrency:
  group: refactor-observability-errors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build full-repository migration inventory and enforce ratchets
        run: python3 shared/code/development/audit-observability-errors.py --enforce-ratchets
      - name: Upload migration inventory
        uses: actions/upload-artifact@v4
        with:
          name: observability-error-inventory-${{ github.sha }}
          path: |
            .tmp/observability-errors/inventory.tsv
            .tmp/observability-errors/summary.json
          if-no-files-found: error
          retention-days: 30

  common-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: true
          cache-dependency-path: shared/common/go.sum
      - name: Test shared fault and logging contracts
        working-directory: shared/common
        env:
          GOWORK: 'off'
        run: go test ./fault ./logging ./request ./requestlog

  gateway-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install repository setup prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Materialize canonical toolchain and generated contracts
        run: make setup
      - name: Test gateway response and observability boundaries
        working-directory: gateway-service
        env:
          GOWORK: 'off'
        run: |
          "$HOME/.cache/qhpro/toolchain/go1.25.10/bin/go" test \
            ./internal/httperror \
            ./internal/httpresponse \
            ./internal/httpmiddleware \
            ./internal/observability \
            ./cmd/http

  user-plan-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install repository setup prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Materialize canonical toolchain and generated contracts
        run: make setup
      - name: Test typed PlanVersion faults through gRPC boundary
        working-directory: user-service
        env:
          GOWORK: 'off'
        run: |
          "$HOME/.cache/qhpro/toolchain/go1.25.10/bin/go" test \
            ./internal/usecase/plan/admin \
            ./infra/handler/grpc
