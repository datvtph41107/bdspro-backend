name: Refactor Observability and Error Contracts

on:
  push:
    branches:
      - refactor/canonical-observability-errors-a6d0722a
  pull_request:
    paths:
      - 'shared/common/fault/**'
      - 'shared/common/logging/**'
      - 'gateway-service/**'
      - 'user-service/**'
      - '.github/workflows/refactor-observability-errors.yml'

permissions:
  contents: read

jobs:
  common-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: true
          cache-dependency-path: shared/common/go.sum
      - name: Test shared fault and logging contracts
        working-directory: shared/common
        env:
          GOWORK: 'off'
        run: go test ./fault ./logging ./request ./requestlog

  gateway-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize canonical toolchain and generated contracts
        run: make setup
      - name: Test gateway response and observability boundaries
        working-directory: gateway-service
        env:
          GOWORK: 'off'
        run: "$HOME/.cache/qhpro/toolchain/go1.25.10/bin/go" test ./internal/httperror ./internal/httpresponse ./internal/httpmiddleware ./internal/observability ./cmd/http

  user-plan-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize canonical toolchain and generated contracts
        run: make setup
      - name: Test typed PlanVersion faults through gRPC boundary
        working-directory: user-service
        env:
          GOWORK: 'off'
        run: "$HOME/.cache/qhpro/toolchain/go1.25.10/bin/go" test ./internal/usecase/plan/admin ./infra/handler/grpc
