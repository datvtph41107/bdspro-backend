name: Materialize S6 ProductAsset Unlink Candidate

on:
  push:
    branches:
      - final-acceptance/proof-s6-product-asset-unlink-harness
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout harness controls
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false

      - name: Checkout exact accepted source SHA
        uses: actions/checkout@v4
        with:
          ref: 516d82f678c8ddd3b02a81ae6857fff99a6dfa50
          fetch-depth: 0
          path: source
          persist-credentials: true

      - name: Guard source and candidate authority
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "516d82f678c8ddd3b02a81ae6857fff99a6dfa50"
          test "$(git ls-remote origin refs/heads/final-acceptance/source-canonicalization | awk '{print $1}')" = "516d82f678c8ddd3b02a81ae6857fff99a6dfa50"
          test "$(git ls-remote origin refs/heads/final-acceptance/proof-s6-product-asset-unlink | awk '{print $1}')" = "516d82f678c8ddd3b02a81ae6857fff99a6dfa50"
          test -d shared/protobuf
          test -d organization-service
          test -d map-service
          echo "80b70e3ea1375b4a959438da92011574c084bdb14d6ee2399ff3d7ddf023e56e  shared/code/deploy.sh" | sha256sum -c -

      - name: Apply bounded ownership patch
        shell: bash
        run: python3 harness/.github/scripts/materialize_s6_product_asset_unlink.py source

      - name: Format and verify bounded delta
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          gofmt -w bdspro-service/internal/domain/errors.go bdspro-service/internal/usecases/product_asset_usecase.go bdspro-service/infra/handler/product_handler.go bdspro-service/infra/handler/product_asset_unlink_error_test.go
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' bdspro-service/infra/handler/product_asset_unlink_error_test.go bdspro-service/infra/handler/product_handler.go bdspro-service/internal/domain/errors.go bdspro-service/internal/usecases/product_asset_usecase.go | sort)"
          test "$changed" = "$expected"
          test -z "$(git grep -n 'Message: \"Lỗi kiểm tra liên kết\"' -- bdspro-service/internal/usecases/product_asset_usecase.go || true)"
          test -z "$(git grep -n 'Message: \"Liên kết không tồn tại\"' -- bdspro-service/internal/usecases/product_asset_usecase.go || true)"
          test -z "$(git grep -n 'Message: \"Lỗi hủy liên kết\"' -- bdspro-service/internal/usecases/product_asset_usecase.go || true)"
          grep -Fq 'return nil, mapProductAssetUnlinkError(err)' bdspro-service/infra/handler/product_handler.go
          grep -Fq 'status.Error(codes.Unknown, "404: Liên kết không tồn tại")' bdspro-service/infra/handler/product_handler.go
          echo "80b70e3ea1375b4a959438da92011574c084bdb14d6ee2399ff3d7ddf023e56e  shared/code/deploy.sh" | sha256sum -c -

      - name: Commit and push clean semantic candidate
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          git config user.name datvtph41107
          git config user.email 116329073+datvtph41107@users.noreply.github.com
          git checkout -B final-acceptance/proof-s6-product-asset-unlink
          git add bdspro-service/internal/domain/errors.go bdspro-service/internal/usecases/product_asset_usecase.go bdspro-service/infra/handler/product_handler.go bdspro-service/infra/handler/product_asset_unlink_error_test.go
          git commit -m 'refactor(bdspro): localize product asset unlink error mapping'
          test "$(git rev-parse HEAD^)" = "516d82f678c8ddd3b02a81ae6857fff99a6dfa50"
          git push origin HEAD:refs/heads/final-acceptance/proof-s6-product-asset-unlink
