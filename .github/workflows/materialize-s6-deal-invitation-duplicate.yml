name: Materialize S6 Deal Invitation Duplicate Candidate

on:
  push:
    branches:
      - final-acceptance/proof-s6-product-asset-unlink-harness
    paths:
      - .github/workflows/materialize-s6-deal-invitation-duplicate.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CANONICAL_SHA: 97ec02d6e676cb060b70e40fb953be3013b99d87
      CANDIDATE_BRANCH: final-acceptance/proof-s6-deal-invitation-duplicate
    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@v4
        with:
          ref: 97ec02d6e676cb060b70e40fb953be3013b99d87
          fetch-depth: 0

      - name: Authority and branch guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANONICAL_SHA"
          test "$(git ls-remote origin refs/heads/final-acceptance/source-canonicalization | awk '{print $1}')" = "$CANONICAL_SHA"
          if git ls-remote --exit-code --heads origin "refs/heads/$CANDIDATE_BRANCH" >/dev/null 2>&1; then
            echo "candidate branch already exists" >&2
            exit 1
          fi
          test "$(sha256sum shared/code/deploy.sh | awk '{print $1}')" = "80b70e3ea1375b4a959438da92011574c084bdb14d6ee2399ff3d7ddf023e56e"

      - name: Materialize bounded Deal Invitation source change
        shell: bash
        env:
          MAPPER_B64: 
          TEST_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path

          domain_path = Path('bdspro-service/internal/domain/errors.go')
          text = domain_path.read_text()
          marker = '\tErrDuplicate                   = errors.New("duplicate")\n'
          assert text.count(marker) == 1
          text = text.replace(marker, marker + '\tErrDealInvitationAlreadyExists = errors.New("deal invitation already exists")\n')
          domain_path.write_text(text)

          usecase_path = Path('bdspro-service/internal/usecases/deal_invitation_usecase.go')
          text = usecase_path.read_text()
          assert text.count('\t_errors "common/errors"\n') == 1
          old_error = '_errors.ReturnError(400, "invitation already exists for this user")'
          assert text.count(old_error) == 1
          text = text.replace('\t_errors "common/errors"\n', '')
          text = text.replace(old_error, 'domain.ErrDealInvitationAlreadyExists')
          usecase_path.write_text(text)

          handler_path = Path('bdspro-service/infra/handler/deal_invitation_handler.go')
          text = handler_path.read_text()
          assert text.count('\t"context"\n') == 1
          text = text.replace('\t"context"\n', '\t"context"\n\t"errors"\n')
          assert text.count('\t"bdspro/internal/usecases"\n') == 1
          text = text.replace('\t"bdspro/internal/usecases"\n', '\t"bdspro/internal/domain"\n\t"bdspro/internal/usecases"\n')
          assert text.count('\tbdspropb "pb/types/bdspro"\n') == 1
          text = text.replace('\tbdspropb "pb/types/bdspro"\n', '\tbdspropb "pb/types/bdspro"\n\tsharepb "pb/types/shared"\n\n\t"google.golang.org/grpc/codes"\n\t"google.golang.org/grpc/status"\n')
          old = '\tif err != nil {\n\t\treturn nil, err\n\t}\n\n\treturn h.dealInvitationTransformer.EntityToSendInvitationResponse(createdInvitation), nil\n'
          assert text.count(old) == 1
          text = text.replace(old, '\tif err != nil {\n\t\treturn nil, mapDealInvitationSendError(err)\n\t}\n\n\treturn h.dealInvitationTransformer.EntityToSendInvitationResponse(createdInvitation), nil\n', 1)
          marker = '// @Summary Xác nhận lời mời\n'
          assert text.count(marker) == 1
          mapper = base64.b64decode(os.environ['MAPPER_B64']).decode()
          text = text.replace(marker, mapper + marker)
          handler_path.write_text(text)

          Path('bdspro-service/infra/handler/deal_invitation_error_test.go').write_bytes(base64.b64decode(os.environ['TEST_B64']))
          PY

          gofmt -w bdspro-service/internal/domain/errors.go bdspro-service/internal/usecases/deal_invitation_usecase.go bdspro-service/infra/handler/deal_invitation_handler.go bdspro-service/infra/handler/deal_invitation_error_test.go
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          expected=(bdspro-service/infra/handler/deal_invitation_error_test.go bdspro-service/infra/handler/deal_invitation_handler.go bdspro-service/internal/domain/errors.go bdspro-service/internal/usecases/deal_invitation_usecase.go)
          printf 'candidate paths:\n%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
          ! printf '%s\n' "${changed[@]}" | grep -Eq '^(shared/protobuf|organization-service|map-service|shared/code/deploy\.sh)($|/)'
          test "$(sha256sum shared/code/deploy.sh | awk '{print $1}')" = "80b70e3ea1375b4a959438da92011574c084bdb14d6ee2399ff3d7ddf023e56e"

      - name: Create one semantic commit and push non-force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name datvtph41107
          git config user.email 116329073+datvtph41107@users.noreply.github.com
          git add bdspro-service/internal/domain/errors.go bdspro-service/internal/usecases/deal_invitation_usecase.go bdspro-service/infra/handler/deal_invitation_handler.go bdspro-service/infra/handler/deal_invitation_error_test.go
          git commit -m 'refactor(bdspro): localize duplicate deal invitation error mapping'
          test "$(git rev-parse HEAD^)" = "$CANONICAL_SHA"
          test "$(git rev-list --count "$CANONICAL_SHA"..HEAD)" = "1"
          test -z "$(git status --porcelain)"
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          echo "candidate=$(git rev-parse HEAD)"
