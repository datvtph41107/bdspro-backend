name: S1 User Seed Behavior Exact SHA Proof

on:
  push:
    branches:
      - final-acceptance/proof-s1-user-seed-90b9b9

permissions:
  contents: read

jobs:
  user-seed-behavior-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: user_service
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d user_service"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TARGET_SHA: 90b9b9ebe60e1f649eb987c595bff1a94380de76
      USER_DATABASE_URL: postgres://postgres:postgres@localhost:5432/user_service?sslmode=disable
      MIGRATION_URL: postgres://postgres:postgres@localhost:5432/user_service?sslmode=disable
      QHPRO_TOOLCHAIN_ROOT: /tmp/qhpro-toolchain

    steps:
      - name: Checkout exact acceptance candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Assert exact source identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "target=$TARGET_SHA"
          echo "actual=$actual"
          test "$actual" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up canonical Go patch version
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: false

      - name: Prepare canonical service toolchain view
        shell: bash
        run: |
          set -euo pipefail
          source shared/code/development/toolchain.versions
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          go install -tags postgres "github.com/golang-migrate/migrate/v4/cmd/migrate@v${MIGRATE_VERSION}"

          mkdir -p "$QHPRO_TOOLCHAIN_ROOT/bin"
          ln -sfn "$(go env GOROOT)" "$QHPRO_TOOLCHAIN_ROOT/go${GO_VERSION}"
          ln -sfn "$(go env GOPATH)/bin/migrate" "$QHPRO_TOOLCHAIN_ROOT/bin/migrate"
          test -x "$QHPRO_TOOLCHAIN_ROOT/go${GO_VERSION}/bin/go"
          test -x "$QHPRO_TOOLCHAIN_ROOT/bin/migrate"

      - name: Fresh PostgreSQL migrations from zero
        working-directory: user-service
        shell: bash
        run: |
          set -euo pipefail
          until docker run --rm --network host postgres:17-alpine pg_isready -h localhost -p 5432 -U postgres -d user_service; do sleep 1; done
          make migrateup
          make migrate-version

      - name: Prove DatabaseSeeder is successful and side-effect free
        working-directory: user-service
        shell: bash
        run: |
          set -euo pipefail

          pre_acceptance="$(docker run --rm --network host postgres:17-alpine psql "$USER_DATABASE_URL" -Atc "SELECT COUNT(*) FROM auth_method WHERE auth_name ILIKE 'qhpro_acceptance_%' OR email ILIKE 'qhpro-%@e.invalid';")"
          echo "acceptance identities before seed=$pre_acceptance"
          test "$pre_acceptance" = "0"

          docker run --rm --network host postgres:17-alpine pg_dump "$USER_DATABASE_URL" \
            --data-only --no-owner --no-privileges --inserts --restrict-key=S1SeedProof \
            > /tmp/user-before-seed.sql
          sha256sum /tmp/user-before-seed.sql

          seed_output="$(make seed 2>&1)"
          printf '%s\n' "$seed_output"
          grep -q 'User DatabaseSeeder complete: seeders=0' <<<"$seed_output"

          post_acceptance="$(docker run --rm --network host postgres:17-alpine psql "$USER_DATABASE_URL" -Atc "SELECT COUNT(*) FROM auth_method WHERE auth_name ILIKE 'qhpro_acceptance_%' OR email ILIKE 'qhpro-%@e.invalid';")"
          echo "acceptance identities after seed=$post_acceptance"
          test "$post_acceptance" = "0"

          docker run --rm --network host postgres:17-alpine pg_dump "$USER_DATABASE_URL" \
            --data-only --no-owner --no-privileges --inserts --restrict-key=S1SeedProof \
            > /tmp/user-after-seed.sql
          sha256sum /tmp/user-after-seed.sql

          if ! cmp -s /tmp/user-before-seed.sql /tmp/user-after-seed.sql; then
            echo "Database data changed across intentionally empty DatabaseSeeder run" >&2
            diff -u /tmp/user-before-seed.sql /tmp/user-after-seed.sql >&2 || true
            exit 1
          fi

      - name: Record proof summary
        if: always()
        shell: bash
        run: |
          {
            echo '## S1 User Seed Behavior Exact-SHA Proof'
            echo
            echo "- acceptance candidate: \`$TARGET_SHA\`"
            echo "- runner checkout: \`$(git rev-parse HEAD 2>/dev/null || echo unavailable)\`"
            echo '- PostgreSQL server/client major: 17 (container image)'
            echo '- repeatable dump key: S1SeedProof'
            echo '- companion exact-SHA proof run 34215856050 already passed protobuf generation, User tests/vet/build, Wire reproducibility, and fresh migrations'
            echo '- this focused run closes only the remaining seed-behavior gate and does not imply FINAL ACCEPTED for the whole repository'
          } >> "$GITHUB_STEP_SUMMARY"
