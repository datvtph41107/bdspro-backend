name: S1 User Seed Exact SHA Proof

on:
  push:
    branches:
      - final-acceptance/proof-s1-user-seed-29aaf8

permissions:
  contents: read

jobs:
  user-seed-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: user_service
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d user_service"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TARGET_SHA: 29aaf8dc054ccb3e65b38de1afefe5dbdeb8fdfe
      USER_DATABASE_URL: postgres://postgres:postgres@localhost:5432/user_service?sslmode=disable
      MIGRATION_URL: postgres://postgres:postgres@localhost:5432/user_service?sslmode=disable
      PGPASSWORD: postgres
      QHPRO_TOOLCHAIN_ROOT: /home/runner/.cache/qhpro/toolchain

    steps:
      - name: Checkout exact acceptance candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Assert exact source identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "target=$TARGET_SHA"
          echo "actual=$actual"
          test "$actual" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"

      - name: Install host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client python3-venv unzip

      - name: Bootstrap repository-pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          bash shared/code/development/toolchain.sh bootstrap
          bash shared/code/development/toolchain.sh verify
          echo "$QHPRO_TOOLCHAIN_ROOT/bin" >> "$GITHUB_PATH"
          echo "$QHPRO_TOOLCHAIN_ROOT/protoc35.0/bin" >> "$GITHUB_PATH"
          echo "$QHPRO_TOOLCHAIN_ROOT/go1.25.10/bin" >> "$GITHUB_PATH"

      - name: Generate canonical protobuf dependencies
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$QHPRO_TOOLCHAIN_ROOT/bin:$QHPRO_TOOLCHAIN_ROOT/protoc35.0/bin:$QHPRO_TOOLCHAIN_ROOT/go1.25.10/bin:$PATH"
          make -C shared/code buf-all

      - name: Compile test and vet User with pinned service contract
        shell: bash
        run: |
          set -euo pipefail
          make -C user-service test
          make -C user-service vet
          make -C user-service build
          (
            cd user-service
            GOROOT="$QHPRO_TOOLCHAIN_ROOT/go1.25.10" \
            GOTOOLCHAIN=local \
            GOWORK=off \
            PATH="$QHPRO_TOOLCHAIN_ROOT/bin:$QHPRO_TOOLCHAIN_ROOT/go1.25.10/bin:$PATH" \
            "$QHPRO_TOOLCHAIN_ROOT/go1.25.10/bin/go" build -o /tmp/bdspro-user-seed ./cmd/seed
            GOROOT="$QHPRO_TOOLCHAIN_ROOT/go1.25.10" \
            GOTOOLCHAIN=local \
            GOWORK=off \
            PATH="$QHPRO_TOOLCHAIN_ROOT/bin:$QHPRO_TOOLCHAIN_ROOT/go1.25.10/bin:$PATH" \
            "$QHPRO_TOOLCHAIN_ROOT/go1.25.10/bin/go" build -o /tmp/bdspro-bootstrap-admin ./cmd/bootstrap-admin
          )

      - name: Prove User Wire is reproducible
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- user-service/wire
          make -C user-service wire
          git diff --exit-code -- user-service/wire

      - name: Fresh PostgreSQL migrations from zero
        shell: bash
        run: |
          set -euo pipefail
          until pg_isready -h localhost -p 5432 -U postgres -d user_service; do sleep 1; done
          make -C user-service migrateup
          make -C user-service migrate-version

      - name: Prove DatabaseSeeder has zero scenario side effects
        shell: bash
        run: |
          set -euo pipefail

          pre_acceptance="$(psql "$USER_DATABASE_URL" -Atc "SELECT COUNT(*) FROM auth_method WHERE auth_name ILIKE 'qhpro_acceptance_%' OR email ILIKE 'qhpro-%@e.invalid';")"
          echo "acceptance identities before seed=$pre_acceptance"
          test "$pre_acceptance" = "0"

          pg_dump "$USER_DATABASE_URL" --data-only --no-owner --no-privileges --inserts > /tmp/user-before-seed.sql
          sha256sum /tmp/user-before-seed.sql

          seed_output="$(make -C user-service seed 2>&1)"
          printf '%s\n' "$seed_output"
          grep -q 'User DatabaseSeeder complete: seeders=0' <<<"$seed_output"

          post_acceptance="$(psql "$USER_DATABASE_URL" -Atc "SELECT COUNT(*) FROM auth_method WHERE auth_name ILIKE 'qhpro_acceptance_%' OR email ILIKE 'qhpro-%@e.invalid';")"
          echo "acceptance identities after seed=$post_acceptance"
          test "$post_acceptance" = "0"

          pg_dump "$USER_DATABASE_URL" --data-only --no-owner --no-privileges --inserts > /tmp/user-after-seed.sql
          sha256sum /tmp/user-after-seed.sql

          if ! cmp -s /tmp/user-before-seed.sql /tmp/user-after-seed.sql; then
            echo "Database data changed across intentionally empty DatabaseSeeder" >&2
            diff -u /tmp/user-before-seed.sql /tmp/user-after-seed.sql >&2 || true
            exit 1
          fi

      - name: Record proof summary
        if: always()
        shell: bash
        run: |
          {
            echo '## S1 User Seed Exact-SHA Proof'
            echo
            echo "- acceptance candidate: \`$TARGET_SHA\`"
            echo "- runner checkout: \`$(git rev-parse HEAD 2>/dev/null || echo unavailable)\`"
            echo '- repository-pinned toolchain bootstrap is part of this proof'
            echo '- proof-control workflow is not part of the acceptance candidate'
            echo '- this proof never implies FINAL ACCEPTED for the whole project'
          } >> "$GITHUB_STEP_SUMMARY"
