name: Acceptance Hub Runtime Ownership

on:
  push:
    branches:
      - final-acceptance/source-canonicalization
      - 'final-acceptance/proof-s5-hub-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-hub-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub-runtime:
    name: Hub runtime ownership
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read canonical Go patch version
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          source tools/development/toolchain.versions
          printf 'go_version=%s\n' "$GO_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up canonical Go patch version
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache: false

      - name: Install canonical generators
        shell: bash
        run: |
          set -euo pipefail
          source tools/development/toolchain.versions
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          go install "github.com/bufbuild/buf/cmd/buf@v${BUF_VERSION}"
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@v${PROTOC_GEN_GO_VERSION}"
          go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v${PROTOC_GEN_GO_GRPC_VERSION}"
          go install "github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@v${GRPC_GATEWAY_VERSION}"
          go install "github.com/google/wire/cmd/wire@v${WIRE_VERSION}"

      - name: Verify Hub typed runtime ownership
        shell: bash
        run: |
          set -euo pipefail

          test -f internal/hub/config/runtime.go
          test -f internal/hub/config/runtime_test.go
          test -f internal/hub/infra/db/provider.go

          readers="$(
            grep -RInE \
              'os\.(Getenv|LookupEnv)|viper\.(Get|GetString|GetInt|GetBool|GetDuration|GetStringSlice)|configloader\.RequiredString|rpcenv\.LoadTransportConfig' \
              hub-service \
              --include='*.go' \
              --exclude='*_test.go' \
              --exclude='wire_gen.go' \
            || true
          )"
          printf '%s\n' "$readers"

          escaped="$(
            printf '%s\n' "$readers" \
            | grep -v '^internal/hub/config/' \
            || true
          )"
          if [ -n "$escaped" ]; then
            echo 'Hub runtime reader escaped canonical config ownership:' >&2
            printf '%s\n' "$escaped" >&2
            exit 1
          fi

          if grep -nE \
            'GetEncryptedSystemConfigByKey|GetEncryptedUserSettingsByGroup|CONFIG_ENCRYPTION_PASSPHRASE|encryption\.enabled|GetGlobalKeyManager|InitializeWithPassphrase' \
            internal/hub/internal/usecase/system_config_usecase.go
          then
            echo 'Dormant Hub system-config encryption ownership reappeared' >&2
            exit 1
          fi

          test "$(
            grep -RIl 'rpcenv\.LoadTransportConfig' hub-service \
              --include='*.go' --exclude='*_test.go' --exclude='wire_gen.go' \
            | sort
          )" = 'internal/hub/config/runtime.go'

          grep -Fq 'type Runtime struct {' internal/hub/config/runtime.go
          grep -Fq 'Transport             qhprorpc.TransportConfig' internal/hub/config/runtime.go
          grep -Fq 'runtime, err := config.NewRuntime()' internal/hub/cmd/grpc/main.go
          grep -Fq 'wire.InitializeApp(runtime)' internal/hub/cmd/grpc/main.go
          grep -Fq 'runtime.GRPCPort' internal/hub/cmd/grpc/main.go
          grep -Fq 'qhprorpc.ServerTransport(runtime.Transport)' internal/hub/cmd/grpc/main.go

          if grep -Eq 'viper\.|configloader\.|rpcenv\.LoadTransportConfig|os\.(Getenv|LookupEnv)' \
            internal/hub/main.go \
            internal/hub/cmd/grpc/main.go \
            internal/hub/initial/startup.go \
            internal/hub/infra/rpc/providers.go \
            internal/hub/infra/rpc/user.go \
            internal/hub/infra/db/provider.go \
            internal/hub/infra/redis/provider.go \
            internal/hub/infra/middleware/api_key_interceptor.go
          then
            echo 'Hub composition/infra reads process runtime directly' >&2
            exit 1
          fi

          grep -Fq 'common_db.Open(common_db.DatabaseConfig{' internal/hub/infra/db/provider.go
          grep -Fq 'common_redis.Open(common_redis.Config{' internal/hub/infra/redis/provider.go
          grep -Fq 'func NewRedisService(runtime config.Runtime)' internal/hub/infra/redis/provider.go
          grep -Fq 'func NewRedisProvider(service *common_redis.RedisService)' internal/hub/infra/redis/provider.go
          grep -Fq 'runtime.BDSProRPCTarget' internal/hub/infra/rpc/providers.go
          grep -Fq 'runtime.NotificationRPCTarget' internal/hub/infra/rpc/providers.go
          grep -Fq 'runtime.UserRPCTarget' internal/hub/infra/rpc/user.go
          grep -Fq 'runtime.Transport' internal/hub/infra/rpc/providers.go
          grep -Fq 'runtime.Transport' internal/hub/infra/rpc/user.go

          grep -Fq 'protectedMethods []string' internal/hub/infra/middleware/api_key_interceptor.go
          if grep -Fq 'config.AppProperties' internal/hub/infra/middleware/api_key_interceptor.go; then
            echo 'Hub API-key middleware still reads global AppProperties' >&2
            exit 1
          fi

          grep -Fq 'logging.Configure("hub-service")' internal/hub/main.go
          if grep -RIn 'flogging\.' hub-service --include='*.go' --exclude='*_test.go' --exclude='wire_gen.go'; then
            echo 'Hub legacy Fabric logging ownership reappeared' >&2
            exit 1
          fi
          if grep -Fq 'viper.AutomaticEnv()' internal/hub/main.go; then
            echo 'Hub root duplicates configloader Viper setup' >&2
            exit 1
          fi

          grep -Fq '"notification" || "$SERVICE" == "tqd" || "$SERVICE" == "hub"' tools/development/script.sh
          grep -Fq 'hub_infra_redis.NewRedisService' internal/hub/wire/wire.go
          grep -Fq 'hub_infra_redis.NewRedisProvider' internal/hub/wire/wire.go
          if grep -Fq '_provider.SyncProviderSet' internal/hub/wire/wire.go; then
            echo 'Hub authored Wire graph still imports legacy shared Redis provider set' >&2
            exit 1
          fi

          grep -Fq '../../database/migrations/000001_hub_schema.up.sql' internal/hub/infra/db/migrate_contract_test.go
          grep -Fq 'MIGRATION_DIR := database/migrations' internal/hub/Makefile

          git diff --check

      - name: Generate canonical protobuf and Wire graph
        shell: bash
        run: |
          set -euo pipefail
          make -C tools/development buf-all

          rm -f internal/hub/wire/wire_gen.go
          make -C tools/development wire hub

          test -f internal/hub/wire/wire_gen.go
          git check-ignore -q internal/hub/wire/wire_gen.go

          grep -Fq 'func InitializeApp(runtime config.Runtime)' internal/hub/wire/wire_gen.go
          grep -Fq 'NewDB(runtime)' internal/hub/wire/wire_gen.go
          grep -Fq 'NewBdsproRPCClient(runtime)' internal/hub/wire/wire_gen.go
          grep -Fq 'NewNotificationRPCClient(runtime)' internal/hub/wire/wire_gen.go
          grep -Fq 'NewAdminUserProfileClient(runtime)' internal/hub/wire/wire_gen.go
          grep -Fq 'NewRedisService(runtime)' internal/hub/wire/wire_gen.go
          grep -Fq 'NewRedisProvider(' internal/hub/wire/wire_gen.go
          grep -Fq 'NewInitialApp(' internal/hub/wire/wire_gen.go

          wire_source_first="$(sha256sum internal/hub/wire/wire.go | awk '{print $1}')"
          wire_gen_first="$(sha256sum internal/hub/wire/wire_gen.go | awk '{print $1}')"

          make -C tools/development wire hub

          wire_source_second="$(sha256sum internal/hub/wire/wire.go | awk '{print $1}')"
          wire_gen_second="$(sha256sum internal/hub/wire/wire_gen.go | awk '{print $1}')"

          test "$wire_source_first" = "$wire_source_second"
          test "$wire_gen_first" = "$wire_gen_second"

          git diff --exit-code
          git diff --check

      - name: Prove Hub runtime behavior
        shell: bash
        working-directory: internal/hub
        run: |
          set -euo pipefail
          go test ./config ./infra/db ./infra/rpc ./infra/redis ./infra/middleware

      - name: Compile Hub
        shell: bash
        working-directory: internal/hub
        run: |
          set -euo pipefail
          go test ./...
          go test -race ./...
          go vet ./...
          go build ./...
