name: Proof Failure Recovery A6D0722A

on:
  push:
    branches:
      - proof/failure-recovery-a6d0722a
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proof-failure-recovery-a6d0722a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notification-broker-recovery:
    name: Canonical RabbitMQ Notification recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout exact proof commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify canonical ancestry and harness-only scope
        shell: bash
        run: |
          set -euo pipefail
          canonical=a6d0722a36090148829ca5ff02f03f409d753bad
          workflow=.github/workflows/proof-failure-recovery-a6d0722a.yml

          test "$(git merge-base "$canonical" HEAD)" = "$canonical"
          test "$(git diff --name-only "$canonical" HEAD)" = "$workflow"
          git diff --check "$canonical" HEAD
          test "$(git diff --name-only "$canonical" HEAD -- shared/protobuf organization-service map-service shared/code/deploy.sh)" = ''
          test "$(sha256sum shared/code/deploy.sh | awk '{print $1}')" = '80b70e3ea1375b4a959438da92011574c084bdb14d6ee2399ff3d7ddf023e56e'
          test "$(git hash-object shared/code/development/root.mk)" = 'a7ec870107c6d68807006c02a9d270ef14133429'
          test "$(git hash-object shared/code/development/recovery-notification-broker.sh)" = 'e813de03361c8570620cc2f4f922351964bd8fb9'
          test "$(git hash-object shared/code/development/native-stack.sh)" = 'b1d2444dba9e1902052764e1d6429ea745f2210b'
          test "$(git hash-object integration-test/qhpro_value_chain_runtime_test.go)" = '0b348263cb35e772af6af2a9b796a256ef9a3eea'
          grep -Fq 'runtime-notification-broker-recovery: env-check' shared/code/development/root.mk
          grep -Fq 'accept-backend: accept-code-backend verify-runtime-backend runtime-notification-broker-recovery runtime-value-chain-acceptance runtime-admin-acceptance' shared/code/development/root.mk
          echo 'Failure/recovery exact-source identity and protected-scope gate PASS'

      - name: Install host runtime prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv ffmpeg curl ripgrep \
            libpango-1.0-0 libpangoft2-1.0-0

      - name: Materialize canonical setup
        shell: bash
        run: |
          set -euo pipefail
          make setup
          make doctor

      - name: Start from clean local data
        shell: bash
        run: |
          set -euo pipefail
          make reset CONFIRM=reset-development-data

      - name: Establish canonical native runtime
        shell: bash
        run: |
          set -euo pipefail
          make verify-runtime-backend 2>&1 | tee /tmp/recovery-runtime.log

      - name: Execute canonical RabbitMQ Notification recovery
        shell: bash
        run: |
          set -euo pipefail
          before_pid="$(bash shared/code/development/native-stack.sh pid notification)"
          test -n "$before_pid"
          make runtime-notification-broker-recovery 2>&1 | tee /tmp/recovery-broker.log
          after_pid="$(bash shared/code/development/native-stack.sh pid notification)"
          test "$after_pid" = "$before_pid"
          grep -Fq 'Notification broker recovery PASS (native API stayed alive; consumer reconnected)' /tmp/recovery-broker.log
          echo "Notification PID preserved across RabbitMQ restart: $before_pid"

      - name: Prove durable event flow after broker recovery
        shell: bash
        run: |
          set -euo pipefail
          make runtime-value-chain-acceptance 2>&1 | tee /tmp/recovery-value-chain.log
          grep -Fq 'PASS value chain:' /tmp/recovery-value-chain.log
          grep -Fq -- '--- PASS: TestQHPROValueChainRuntime' /tmp/recovery-value-chain.log
          echo 'Failure/recovery value-chain PASS'

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          make status > /tmp/recovery-status.txt 2>&1 || true
          if test -f .env; then
            docker compose --env-file .env -f compose.yaml ps -a > /tmp/recovery-compose-ps.txt 2>&1 || true
            docker compose --env-file .env -f compose.yaml logs --no-color rabbitmq postgres redis > /tmp/recovery-dependency-logs.txt 2>&1 || true
            docker compose --env-file .env -f compose.yaml exec -T rabbitmq rabbitmqctl list_connections name > /tmp/recovery-rabbit-connections.txt 2>&1 || true
          fi
          find .tmp/development -maxdepth 2 -type f -print -exec tail -n 260 {} \; > /tmp/recovery-native-logs.txt 2>&1 || true

      - name: Upload failure/recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-recovery-a6d0722a-${{ github.sha }}
          path: |
            /tmp/recovery-runtime.log
            /tmp/recovery-broker.log
            /tmp/recovery-value-chain.log
            /tmp/recovery-status.txt
            /tmp/recovery-compose-ps.txt
            /tmp/recovery-dependency-logs.txt
            /tmp/recovery-rabbit-connections.txt
            /tmp/recovery-native-logs.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          if test -f .env; then
            make down || true
            docker compose --env-file .env -f compose.yaml down --volumes --remove-orphans || true
          fi
