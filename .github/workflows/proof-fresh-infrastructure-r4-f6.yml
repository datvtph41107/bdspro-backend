name: Proof Fresh Infrastructure R4 F6

on:
  push:
    branches:
      - proof/fresh-infrastructure-r4-f6-assistant-wire-owner
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proof-fresh-infrastructure-r4-f6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assistant-wire-owner:
    name: Canonical setup owns Assistant Wire generation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout proof commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify proof ancestry and protected scope
        shell: bash
        run: |
          set -euo pipefail
          base=65449ee2d11743b028f9e55aeb27294689f5d460
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base" HEAD
          test "$(git diff --name-only "$base" HEAD -- shared/protobuf organization-service map-service shared/code/deploy.sh)" = ''
          echo 'F6 ancestry/protected scope PASS'

      - name: Materialize bounded source candidate
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = [
              (
                  Path('shared/code/development/root.mk'),
                  'WIRE_SERVICES := user organization tqd notification',
                  'WIRE_SERVICES := user organization tqd notification assistant',
              ),
              (
                  Path('shared/code/script.sh'),
                  'if [[ "$SERVICE" == "notification" || "$SERVICE" == "tqd" || "$SERVICE" == "hub" ]]; then',
                  'if [[ "$SERVICE" == "notification" || "$SERVICE" == "tqd" || "$SERVICE" == "hub" || "$SERVICE" == "assistant" ]]; then',
              ),
          ]

          for path, old, new in replacements:
              text = path.read_text()
              if new in text:
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one bounded replacement owner')
              path.write_text(text.replace(old, new, 1))
          PY

          git diff --check -- shared/code/development/root.mk shared/code/script.sh
          changed="$(git diff --name-only -- shared/code/development/root.mk shared/code/script.sh)"
          if test -n "$changed"; then
            test "$changed" = $'shared/code/development/root.mk\nshared/code/script.sh'
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add shared/code/development/root.mk shared/code/script.sh
            git commit -m 'fix(setup): generate Assistant Wire from canonical owner'
            git push origin HEAD:proof/fresh-infrastructure-r4-f6-assistant-wire-owner
            echo 'pushed=true' >> "$GITHUB_OUTPUT"
            echo 'F6 bounded source candidate pushed; exact-SHA proof will run on the new commit.'
          else
            echo 'pushed=false' >> "$GITHUB_OUTPUT"
            echo 'F6 source candidate already materialized on this exact SHA.'
          fi

      - name: Verify exact F6 source scope
        if: steps.materialize.outputs.pushed == 'false'
        shell: bash
        run: |
          set -euo pipefail
          base=65449ee2d11743b028f9e55aeb27294689f5d460
          actual="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/proof-fresh-infrastructure-r4-f6.yml' \
            'shared/code/development/root.mk' \
            'shared/code/script.sh' | sort)"
          test "$actual" = "$expected" || {
            echo 'Unexpected F6 scope:' >&2
            printf '%s\n' "$actual" >&2
            exit 4
          }
          grep -Fxq 'WIRE_SERVICES := user organization tqd notification assistant' shared/code/development/root.mk
          grep -Fq '"$SERVICE" == "assistant"' shared/code/script.sh
          echo 'F6 exact source scope PASS'

      - name: Install host runtime prerequisites
        if: steps.materialize.outputs.pushed == 'false'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv ffmpeg curl ripgrep \
            libpango-1.0-0 libpangoft2-1.0-0

      - name: Prove Assistant Wire generation and build
        if: steps.materialize.outputs.pushed == 'false'
        shell: bash
        run: |
          set -euo pipefail
          test ! -e assistant-service/wire/wire_gen.go
          cp assistant-service/wire/wire.go /tmp/assistant-wire-before.go

          make setup

          test -f assistant-service/wire/wire_gen.go
          cmp -s /tmp/assistant-wire-before.go assistant-service/wire/wire.go || {
            echo 'Assistant wire.go changed during canonical generation' >&2
            diff -u /tmp/assistant-wire-before.go assistant-service/wire/wire.go || true
            exit 3
          }
          make -C assistant-service build
          echo 'Assistant generated Wire build PASS'

      - name: Capture Assistant Wire evidence
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/f6-wire
          cp /tmp/assistant-wire-before.go /tmp/f6-wire/wire-before.go 2>/dev/null || true
          cp assistant-service/wire/wire.go /tmp/f6-wire/wire-after.go 2>/dev/null || true
          cp assistant-service/wire/wire_gen.go /tmp/f6-wire/wire_gen.go 2>/dev/null || true
          git status --short -- assistant-service/wire shared/code/development/root.mk shared/code/script.sh > /tmp/f6-wire/git-status.txt || true
          git diff -- assistant-service/wire shared/code/development/root.mk shared/code/script.sh > /tmp/f6-wire/tracked-diff.txt || true
          sha256sum /tmp/f6-wire/* > /tmp/f6-wire/SHA256SUMS 2>/dev/null || true

      - name: Upload Assistant Wire evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f6-assistant-wire-${{ github.sha }}
          path: /tmp/f6-wire
          if-no-files-found: warn
          retention-days: 14