name: Acceptance Shared Runtime Ownership

on:
  push:
    branches:
      - final-acceptance/source-canonicalization
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-shared-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-runtime:
    name: Shared runtime ownership
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up canonical Go patch version
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: false

      - name: Verify legacy shared runtime framework is retired
        shell: bash
        run: |
          set -euo pipefail

          test ! -e shared/common/setup.go

          cat > /tmp/verify_shared_runtime.go <<'EOF'
          package main

          import (
              "fmt"
              "go/ast"
              "go/parser"
              "go/token"
              "io/fs"
              "os"
              "path/filepath"
              "strconv"
          )

          var forbiddenFunctions = map[string]bool{
              "SetupGRPCServer": true,
              "SetupRestfulAPI": true,
              "LoadConfig": true,
              "LoadYMLConfigFile": true,
              "ProfileIDInterceptor": true,
              "GetPrefixProtobufUrl": true,
          }

          func main() {
              fset := token.NewFileSet()
              failed := false
              err := filepath.WalkDir(".", func(path string, entry fs.DirEntry, walkErr error) error {
                  if walkErr != nil {
                      return walkErr
                  }
                  if entry.IsDir() {
                      if entry.Name() == ".git" || entry.Name() == "vendor" {
                          return filepath.SkipDir
                      }
                      return nil
                  }
                  if filepath.Ext(path) != ".go" {
                      return nil
                  }

                  file, err := parser.ParseFile(fset, path, nil, parser.SkipObjectResolution)
                  if err != nil {
                      return fmt.Errorf("parse %s: %w", path, err)
                  }

                  for _, imp := range file.Imports {
                      importPath, err := strconv.Unquote(imp.Path.Value)
                      if err != nil {
                          return fmt.Errorf("decode import in %s: %w", path, err)
                      }
                      if importPath == "common" {
                          fmt.Printf("live root common import: %s\n", path)
                          failed = true
                      }
                  }

                  if filepath.Clean(filepath.Dir(path)) == filepath.Clean("shared/common") {
                      for _, decl := range file.Decls {
                          switch d := decl.(type) {
                          case *ast.FuncDecl:
                              if forbiddenFunctions[d.Name.Name] {
                                  fmt.Printf("legacy shared runtime function declaration: %s:%s\n", path, d.Name.Name)
                                  failed = true
                              }
                          case *ast.GenDecl:
                              for _, spec := range d.Specs {
                                  if typeSpec, ok := spec.(*ast.TypeSpec); ok && typeSpec.Name.Name == "SetupParameters" {
                                      fmt.Printf("legacy shared runtime type declaration: %s:%s\n", path, typeSpec.Name.Name)
                                      failed = true
                                  }
                              }
                          }
                      }
                  }
                  return nil
              })
              if err != nil {
                  fmt.Fprintln(os.Stderr, err)
                  os.Exit(2)
              }
              if failed {
                  os.Exit(1)
              }
          }
          EOF

          go run /tmp/verify_shared_runtime.go

          echo 'Comment-only legacy references (informational):'
          git grep -n -E 'SetupGRPCServer|SetupRestfulAPI|LoadYMLConfigFile|ProfileIDInterceptor|GetPrefixProtobufUrl|SetupParameters' -- '*.go' || true

          echo 'AutoMigrate inventory (informational; not mutated by S3):'
          git grep -n -E 'AutoMigrate\(' -- '*.go' || true

          git diff --check

      - name: Prove shared common module after framework retirement
        shell: bash
        run: |
          set -euo pipefail
          cd shared/common
          go test ./...
          go vet ./...
          go build ./...
