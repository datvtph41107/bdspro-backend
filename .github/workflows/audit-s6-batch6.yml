name: Audit S6 Closure Candidates

on:
  push:
    branches:
      - final-acceptance/proof-s6-product-asset-unlink-harness
    paths:
      - .github/workflows/audit-s6-batch6.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CANONICAL_SHA: 391cc2608cfdf48a6361741333d3144f7f53e0e6
    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@v4
        with:
          ref: 391cc2608cfdf48a6361741333d3144f7f53e0e6
          fetch-depth: 0

      - name: Exact authority and protected guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANONICAL_SHA"
          git fetch origin final-acceptance/source-canonicalization --quiet
          test "$(git rev-parse origin/final-acceptance/source-canonicalization)" = "$CANONICAL_SHA"
          test "$(sha256sum shared/code/deploy.sh | awk '{print $1}')" = "80b70e3ea1375b4a959438da92011574c084bdb14d6ee2399ff3d7ddf023e56e"
          echo "EXACT_SHA=$(git rev-parse HEAD)"

      - name: Verify Batch 8 ownership is closed
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'var ErrRoleGroupNotFound = errors.New("role group not found")' user-service/internal/domain/access/role_group.go
          grep -Fq 'return nil, access.ErrRoleGroupNotFound' user-service/internal/usecase/role_group_registry.go
          ! grep -Fq '"common/errors"' user-service/internal/usecase/role_group_registry.go
          grep -Fq 'mapGetRolesByModuleCodeError' user-service/infra/handler/role_handler.go

      - name: Rank residual small internal transport-shaped files
        shell: bash
        run: |
          set -euo pipefail
          echo '=== FILES WITH <=3 LIVE TRANSPORT-SHAPED CALLS ==='
          while IFS= read -r f; do
            count=$(git grep -nE 'ReturnError\(|ReturnErrorWithSecond\(|_(errors|routes)\.(UnauthorizedException|BadRequestException|ConflictException|ForbiddenException|InternalServerException|NotFoundException)|&_routes\.Except\{' -- "$f" | grep -v '^[^:]*:[0-9]*:[[:space:]]*//' | wc -l || true)
            if [ "$count" -gt 0 ] && [ "$count" -le 3 ]; then
              printf '%s\t%s\n' "$count" "$f"
            fi
          done < <(git grep -lE '"common/(errors|routes)"' -- '*-service/internal/**/*.go' ':!organization-service/**' ':!map-service/**' | sort) | sort -n -k1,1 -k2,2

          echo '=== REMAINING RAW INTERNAL GRPC STATUS ==='
          git grep -nE 'status\.(Error|Errorf|New)\(codes\.' -- '*-service/internal/**/*.go' ':!organization-service/**' ':!map-service/**' || true

      - name: Trace smallest residual candidate classes
        shell: bash
        run: |
          set -euo pipefail
          echo '=== HUB UpdateBundleVersion ==='
          git grep -nE 'UpdateBundleVersion' -- 'hub-service/**/*.go' 'shared/protobuf/schema/hub/**/*.proto' || true
          echo '=== CRM Owner GetOwnerInfo ==='
          git grep -nE 'GetOwnerInfo\(' -- 'crm-service/**/*.go' || true
          echo '=== Notification PersonConfig ==='
          git grep -nE 'PersonConfig|person_config' -- 'notification-service/**/*.go' 'shared/protobuf/schema/notification/**/*.proto' || true
          echo '=== Notification PropertyHistory ==='
          git grep -nE 'PropertyHistory|property_history' -- 'notification-service/**/*.go' 'shared/protobuf/schema/notification/**/*.proto' || true
          echo '=== CRM Rate ==='
          git grep -nE 'RateUsecase|GetRate|CreateRate|UpdateRate' -- 'crm-service/**/*.go' || true

      - name: Show residual small-file policy sites
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            hub-service/internal/usecase/version_usecase.go \
            crm-service/internal/usecase/owner_usecase.go \
            notification-service/internal/usecase/person_config_usecase.go \
            notification-service/internal/usecase/property_history_usecase.go \
            crm-service/internal/usecase/rate_usecase.go \
            social-service/internal/usecase/like.go \
            bdspro-service/internal/usecases/product_asset_usecase.go; do
              test -f "$f" || continue
              echo "--- $f ---"
              git grep -nE 'ReturnError\(|ReturnErrorWithSecond\(|UnauthorizedException|BadRequestException|ConflictException|ForbiddenException|InternalServerException|NotFoundException|&_routes\.Except\{' -- "$f" || true
          done

      - name: Verify broad and prior residual classifications
        shell: bash
        run: |
          set -euo pipefail
          echo -n 'common/errors files excluding protected: '
          git grep -l '"common/errors"' -- '*.go' ':!organization-service/**' ':!map-service/**' | wc -l
          echo -n 'common/routes files excluding protected: '
          git grep -l '"common/routes"' -- '*.go' ':!organization-service/**' ':!map-service/**' | wc -l
          echo -n 'BDSPro ProductAsset Link policy sites: '
          git grep -nE 'ReturnError\(|&_routes\.Except\{' -- bdspro-service/internal/usecases/product_asset_usecase.go | awk -F: '$2 < 120 {c++} END {print c+0}'
          echo -n 'Social Like policy sites: '
          git grep -nE 'ReturnError\(|&_routes\.Except\{' -- social-service/internal/usecase/like.go | wc -l
          echo -n 'BDSPro Intent transport-shaped sites: '
          git grep -nE 'ReturnError\(|&_routes\.Except\{' -- bdspro-service/internal/usecases/intent_usecase.go | wc -l || true
          echo -n 'BDSPro Intent production callers: '
          git grep -n 'DetectIntent(' -- ':!bdspro-service/internal/usecases/intent_usecase.go' '*.go' | wc -l || true

      - name: Final immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANONICAL_SHA"
          test -z "$(git status --porcelain)"
