name: Audit S6 Final Closure Candidate

on:
  push:
    branches:
      - final-acceptance/proof-s6-product-asset-unlink-harness
    paths:
      - .github/workflows/audit-s6-batch6.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CANONICAL_SHA: 391cc2608cfdf48a6361741333d3144f7f53e0e6
    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@v4
        with:
          ref: 391cc2608cfdf48a6361741333d3144f7f53e0e6
          fetch-depth: 0

      - name: Exact authority and protected guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANONICAL_SHA"
          git fetch origin final-acceptance/source-canonicalization --quiet
          test "$(git rev-parse origin/final-acceptance/source-canonicalization)" = "$CANONICAL_SHA"
          test "$(sha256sum shared/code/deploy.sh | awk '{print $1}')" = "80b70e3ea1375b4a959438da92011574c084bdb14d6ee2399ff3d7ddf023e56e"

      - name: Trace User UpdateGroupPermissions exact callers
        shell: bash
        run: |
          set -euo pipefail
          echo '=== METHOD DEFINITION AND ALL CALLERS ==='
          git grep -nE 'UpdateGroupPermissions\(' -- 'user-service/**/*.go' || true
          echo '=== ROLE GROUP HANDLERS / RPC REGISTRATION ==='
          git grep -nE 'RoleGroup|GroupPermissions|Update.*Permissions' -- 'user-service/infra/handler/**/*.go' 'user-service/cmd/**/*.go' 'user-service/initial/**/*.go' || true
          echo '=== PROTO CONTRACT REFERENCES ==='
          git grep -nE 'RoleGroup|GroupPermissions|Update.*Permissions' -- 'shared/protobuf/schema/**/*.proto' || true
          echo '=== GATEWAY ROUTES / CLIENT REFERENCES ==='
          git grep -nE 'RoleGroup|GroupPermissions|Update.*Permissions|role-group|role_group' -- 'gateway-service/**/*.go' 'gateway-service/**/*.yaml' 'gateway-service/**/*.yml' || true

      - name: Inspect User selected method neighborhood and transport owner
        shell: bash
        run: |
          set -euo pipefail
          sed -n '1,100p' user-service/internal/usecase/role_group_usecase.go
          for f in user-service/infra/handler/*.go; do
            if grep -qE 'UpdateGroupPermissions|RoleGroupUsecase' "$f"; then
              echo "--- $f ---"
              grep -nE -C 12 'UpdateGroupPermissions|RoleGroupUsecase' "$f" || true
            fi
          done

      - name: Classify BDSPro AssetCost generic fanout
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ASSET COST HANDLER CALLS ==='
          git grep -nE 'AssetCostUsecase|\.AssetCost|GetByID\(|Detail\(|Update\(|Delete\(' -- bdspro-service/infra/handler/asset_cost_handler.go || true
          echo '=== ASSET COST TYPE HANDLER CALLS ==='
          git grep -nE 'AssetCostTypeUsecase|\.AssetCostType|GetByID\(|Detail\(|Update\(|Delete\(' -- bdspro-service/infra/handler/asset_cost_type_handler.go || true
          echo '=== GENERIC OWNER METHODS USING CheckPermission ==='
          grep -nE -C 4 'CheckPermission\(' bdspro-service/internal/common/owner_usecase.go
          echo '=== REGISTRATION / PROTO REFERENCES ==='
          git grep -nE 'AssetCost|AssetCostType' -- 'bdspro-service/cmd/**/*.go' 'shared/protobuf/schema/bdspro/**/*.proto' || true

      - name: Classify other one-site residuals
        shell: bash
        run: |
          set -euo pipefail
          echo '=== USER ROLE GROUP SITE ==='
          git grep -nE 'ReturnError\(|UpdateGroupPermissions\(' -- user-service/internal/usecase/role_group_usecase.go || true
          echo '=== NOTIFICATION PERSON CONFIG SITE ==='
          git grep -nE 'ReturnError\(|ListByUserID\(' -- notification-service/internal/usecase/person_config_usecase.go notification-service/infra/handler/internal_handler.go || true
          echo '=== HUB USER GUIDE SITE ==='
          git grep -nE 'ReturnError\(|NotFoundException|GetByKey\(' -- hub-service/internal/usecase/user_guide_usecase.go hub-service/infra/handler/*.go || true
          echo '=== INTENT CALLER COUNT ==='
          git grep -n 'DetectIntent(' -- ':!bdspro-service/internal/usecases/intent_usecase.go' '*.go' | wc -l || true

      - name: Closure invariants census
        shell: bash
        run: |
          set -euo pipefail
          echo -n 'common/errors files excluding protected: '
          git grep -l '"common/errors"' -- '*.go' ':!organization-service/**' ':!map-service/**' | wc -l
          echo -n 'common/routes files excluding protected: '
          git grep -l '"common/routes"' -- '*.go' ':!organization-service/**' ':!map-service/**' | wc -l
          echo -n 'ProductAsset Link policy sites: '
          git grep -nE 'ReturnError\(|&_routes\.Except\{' -- bdspro-service/internal/usecases/product_asset_usecase.go | awk -F: '$2 < 120 {c++} END {print c+0}'
          echo -n 'Social Like policy sites: '
          git grep -nE 'ReturnError\(|&_routes\.Except\{' -- social-service/internal/usecase/like.go | wc -l

      - name: Final immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANONICAL_SHA"
          test -z "$(git status --porcelain)"
