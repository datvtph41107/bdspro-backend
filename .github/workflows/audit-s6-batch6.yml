name: Audit S6 Role Group Permissions Legacy Contract

on:
  push:
    branches:
      - final-acceptance/proof-s6-product-asset-unlink-harness
    paths:
      - .github/workflows/audit-s6-batch6.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CANONICAL_SHA: 391cc2608cfdf48a6361741333d3144f7f53e0e6
      QHPRO_TOOLCHAIN_ROOT: /tmp/qhpro-toolchain
    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@v4
        with:
          ref: 391cc2608cfdf48a6361741333d3144f7f53e0e6
          fetch-depth: 0

      - name: Exact authority and protected guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANONICAL_SHA"
          git fetch origin final-acceptance/source-canonicalization --quiet
          test "$(git rev-parse origin/final-acceptance/source-canonicalization)" = "$CANONICAL_SHA"
          test "$(sha256sum shared/code/deploy.sh | awk '{print $1}')" = "80b70e3ea1375b4a959438da92011574c084bdb14d6ee2399ff3d7ddf023e56e"
          grep -Fq 'return _errors.ReturnError(404, "Group không tồn tại")' user-service/internal/usecase/role_group_usecase.go
          grep -Fq 'err := h.RoleGroupUsecase.UpdateGroupPermissions(ctx, req.GroupId, req.PermissionIds)' user-service/infra/handler/role_group_handler.go

      - name: Set up canonical Go patch version
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.10'
          cache: false

      - name: Install pinned protobuf generators and materialize pb
        shell: bash
        run: |
          set -euo pipefail
          source shared/code/development/toolchain.versions
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          go install "github.com/bufbuild/buf/cmd/buf@v${BUF_VERSION}"
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@v${PROTOC_GEN_GO_VERSION}"
          go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v${PROTOC_GEN_GO_GRPC_VERSION}"
          go install "github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@v${GRPC_GATEWAY_VERSION}"
          mkdir -p "$QHPRO_TOOLCHAIN_ROOT/bin"
          ln -sfn "$(go env GOROOT)" "$QHPRO_TOOLCHAIN_ROOT/go${GO_VERSION}"
          for tool in buf protoc-gen-go protoc-gen-go-grpc protoc-gen-grpc-gateway; do
            ln -sfn "$(go env GOPATH)/bin/$tool" "$QHPRO_TOOLCHAIN_ROOT/bin/$tool"
          done
          make -C shared/code buf-all
          git diff --exit-code

      - name: Prove User missing-group legacy gRPC contract
        shell: bash
        run: |
          set -euo pipefail
          testfile=user-service/internal/usecase/role_group_permissions_legacy_contract_test.go
          trap 'rm -f "$testfile"' EXIT
          cat > "$testfile" <<'EOF'
          package usecase

          import (
              "context"
              "testing"

              sharepb "pb/types/shared"
              "user/internal/domain/access"
              "user/internal/interface/repo"

              "google.golang.org/grpc/codes"
              "google.golang.org/grpc/status"
          )

          type legacyRoleGroupRepo struct {
              repo.RoleGroupRepository
              group *access.RoleGroup
              getErr error
              updateCalled bool
          }

          func (r *legacyRoleGroupRepo) GetByID(context.Context, uint64) (*access.RoleGroup, error) {
              return r.group, r.getErr
          }

          func (r *legacyRoleGroupRepo) UpdateGroupPermissions(context.Context, uint64, []uint64) error {
              r.updateCalled = true
              return nil
          }

          func TestLegacyUpdateGroupPermissionsMissingGroupContract(t *testing.T) {
              fake := &legacyRoleGroupRepo{}
              uc := NewRoleGroupUsecase(fake, nil)
              err := uc.UpdateGroupPermissions(context.Background(), 999, []uint64{1, 2})
              if err == nil {
                  t.Fatal("expected missing-group error")
              }
              if fake.updateCalled {
                  t.Fatal("update must not run after missing group")
              }
              st, ok := status.FromError(err)
              if !ok {
                  t.Fatalf("expected gRPC status, got %T: %v", err, err)
              }
              if st.Code() != codes.Internal {
                  t.Fatalf("code=%v want=%v", st.Code(), codes.Internal)
              }
              if st.Message() != "Group không tồn tại" {
                  t.Fatalf("message=%q", st.Message())
              }
              details := st.Details()
              if len(details) != 1 {
                  t.Fatalf("details=%d want=1", len(details))
              }
              d, ok := details[0].(*sharepb.ErrorResponse)
              if !ok {
                  t.Fatalf("detail type=%T", details[0])
              }
              if d.Code != 404 || d.Message != "Group không tồn tại" || d.Second != nil {
                  t.Fatalf("detail=%+v", d)
              }
          }
          EOF
          gofmt -w "$testfile"
          (cd user-service && go test ./internal/usecase -run '^TestLegacyUpdateGroupPermissionsMissingGroupContract$' -count=1 -v)
          rm "$testfile"
          trap - EXIT

      - name: Prove handler passes selected legacy error unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('user-service/infra/handler/role_group_handler.go').read_text()
          block = '''\terr := h.RoleGroupUsecase.UpdateGroupPermissions(ctx, req.GroupId, req.PermissionIds)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n'''
          assert text.count(block) == 1, 'handler must pass UpdateGroupPermissions error unchanged'
          print('handler passthrough contract: SUCCESS')
          PY

      - name: Prove Gateway HTTP compatibility
        shell: bash
        run: |
          set -euo pipefail
          testfile=gateway-service/internal/httperror/role_group_permissions_legacy_contract_test.go
          trap 'rm -f "$testfile"' EXIT
          cat > "$testfile" <<'EOF'
          package httperror

          import (
              "encoding/json"
              "net/http"
              "net/http/httptest"
              "testing"

              sharepb "pb/types/shared"

              "google.golang.org/grpc/codes"
              "google.golang.org/grpc/status"
          )

          func TestLegacyRoleGroupPermissionsGatewayContract(t *testing.T) {
              const message = "Group không tồn tại"
              st := status.New(codes.Internal, message)
              withDetails, err := st.WithDetails(&sharepb.ErrorResponse{Code: 404, Message: message})
              if err != nil {
                  t.Fatal(err)
              }
              rr := httptest.NewRecorder()
              WriteGRPC(rr, withDetails.Err())
              if rr.Code != http.StatusOK {
                  t.Fatalf("HTTP=%d want=200 body=%s", rr.Code, rr.Body.String())
              }
              var body struct {
                  Code int32 `json:"code"`
                  Message string `json:"message"`
                  Second *int32 `json:"second"`
              }
              if err := json.Unmarshal(rr.Body.Bytes(), &body); err != nil {
                  t.Fatal(err)
              }
              if body.Code != 404 || body.Message != message || body.Second != nil {
                  t.Fatalf("body=%+v", body)
              }
          }
          EOF
          gofmt -w "$testfile"
          (cd gateway-service && go test ./internal/httperror -run '^TestLegacyRoleGroupPermissionsGatewayContract$' -count=1 -v)
          rm "$testfile"
          trap - EXIT

      - name: Reconfirm candidate boundedness against alternatives
        shell: bash
        run: |
          set -euo pipefail
          test "$(git grep -nE 'RoleGroupUsecase\.UpdateGroupPermissions\(' -- 'user-service/**/*.go' | wc -l)" -eq 1
          test "$(git grep -n 'DetectIntent(' -- ':!bdspro-service/internal/usecases/intent_usecase.go' '*.go' | wc -l)" -eq 0
          test "$(git grep -nE 'ReturnError\(|&_routes\.Except\{' -- bdspro-service/internal/usecases/product_asset_usecase.go | awk -F: '$2 < 120 {c++} END {print c+0}')" -eq 8
          test "$(git grep -nE 'ReturnError\(|&_routes\.Except\{' -- social-service/internal/usecase/like.go | wc -l)" -eq 5
          echo 'candidate boundedness: SUCCESS'

      - name: Final immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANONICAL_SHA"
          git diff --exit-code
          test -z "$(git status --porcelain)"
