name: Audit S6 Batch 6 Ownership Candidates

on:
  push:
    branches:
      - final-acceptance/proof-s6-product-asset-unlink-harness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@v4
        with:
          ref: 0e7ff07db4d61d0b26f5f792237270fdadf52a7f
          fetch-depth: 0

      - name: Exact-SHA Assistant versus Intent trace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0e7ff07db4d61d0b26f5f792237270fdadf52a7f"
          echo '=== EXACT SHA ==='
          git rev-parse HEAD

          echo '=== ASSISTANT ANALYZE CALL/REGISTRATION SURFACE ==='
          git grep -n 'AnalyzeProductText' -- '*.go' '*.proto' '*.yaml' '*.yml' || true
          echo '-- BdsproInternal.GetSuggest --'
          git grep -n 'BdsproInternal.GetSuggest\|GetSuggest(ctx' -- '*.go' || true
          echo '-- exact legacy assistant message --'
          git grep -n 'failed to get product suggest\|failed to analyze:' -- '*.go' || true
          echo '-- Assistant handler registration/server construction --'
          git grep -n 'NewAssistantHandler\|RegisterAssistantServiceServer\|AssistantHandler' -- 'assistant-service/**/*.go' || true

          echo '=== BDSPRO INTENT CALL/REGISTRATION SURFACE ==='
          git grep -n 'DetectIntent' -- '*.go' '*.proto' '*.yaml' '*.yml' || true
          echo '-- IntentUsecase all occurrences --'
          git grep -n 'IntentUsecase' -- '*.go' || true
          echo '-- intent protobuf/service/http route symbols --'
          git grep -niE 'intent(service|handler)|/.*intent|DetectIntent|ExecuteIntent|GetIntentHistory|GetSuggestions' -- 'shared/protobuf/**/*.proto' 'bdspro-service/**/*.go' || true
          echo '-- exact legacy intent validation message --'
          git grep -n 'User input không được rỗng' -- '*.go' || true

          echo '=== GATEWAY ERROR PRESENTATION SURFACE ==='
          git grep -n 'ErrorResponse\|runtime.HTTPStatusFromCode\|HTTPStatusFromCode\|ForwardResponse' -- 'gateway-service/**/*.go' 'gateway-service/**/*.yaml' 'gateway-service/**/*.yml' || true

          echo '=== SHARED RETURNERROR CONTRACT ==='
          git grep -n 'func ReturnError\|status.New(codes.Internal' -- 'shared/common/errors/*.go' || true

          echo '=== PROTECTED HASH ==='
          sha256sum shared/code/deploy.sh
          test "$(sha256sum shared/code/deploy.sh | awk '{print $1}')" = "80b70e3ea1375b4a959438da92011574c084bdb14d6ee2399ff3d7ddf023e56e"
