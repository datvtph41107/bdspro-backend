name: Build S4 BDSPro Redis Candidate v2

on:
  push:
    branches:
      - final-acceptance/proof-s4-bdspro-redis-c8b2857
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s4-build-candidate-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-candidate-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_SHA: c8b2857f6e88761ba7bd39470ffaa8487a3321e7
      CANDIDATE_BRANCH: final-acceptance/s4-bdspro-redis-candidate
      QHPRO_TOOLCHAIN_ROOT: /tmp/qhpro-toolchain

    steps:
      - name: Checkout proof branch and extract deterministic patch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract proven v1 patch script
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/s4-build-candidate.yml').read_text()
          marker = '      - name: Build exact S4 source candidate\n'
          start = source.index(marker)
          run_marker = '        run: |\n'
          start = source.index(run_marker, start) + len(run_marker)
          end = source.index('\n      - name: Generate canonical protobuf and Wire output', start)
          block = source[start:end]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          Path('/tmp/build_s4_candidate.sh').write_text('\n'.join(lines) + '\n')
          PY
          chmod +x /tmp/build_s4_candidate.sh
          test "$(grep -c 'ensureSyncCache' /tmp/build_s4_candidate.sh)" -ge 2

      - name: Set up canonical Go patch version
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: false

      - name: Install canonical generators
        shell: bash
        run: |
          set -euo pipefail
          source shared/code/development/toolchain.versions
          test "$(go env GOVERSION)" = "go${GO_VERSION}"

          retry_install() {
            pkg="$1"
            attempt=1
            while [ "$attempt" -le 3 ]; do
              if go install "$pkg"; then
                return 0
              fi
              echo "go install failed for $pkg (attempt $attempt/3); checksum verification remains enabled" >&2
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
            return 1
          }

          retry_install "github.com/bufbuild/buf/cmd/buf@v${BUF_VERSION}"
          retry_install "google.golang.org/protobuf/cmd/protoc-gen-go@v${PROTOC_GEN_GO_VERSION}"
          retry_install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v${PROTOC_GEN_GO_GRPC_VERSION}"
          retry_install "github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@v${GRPC_GATEWAY_VERSION}"
          retry_install "github.com/google/wire/cmd/wire@v${WIRE_VERSION}"

          mkdir -p "$QHPRO_TOOLCHAIN_ROOT/bin"
          ln -sfn "$(go env GOROOT)" "$QHPRO_TOOLCHAIN_ROOT/go${GO_VERSION}"
          for tool in buf protoc-gen-go protoc-gen-go-grpc protoc-gen-grpc-gateway wire; do
            ln -sfn "$(go env GOPATH)/bin/$tool" "$QHPRO_TOOLCHAIN_ROOT/bin/$tool"
          done

      - name: Apply final bounded S4 correction
        shell: bash
        run: |
          set -euo pipefail
          /tmp/build_s4_candidate.sh

          # Keep lifecycle ownership at the composition root: Wire owns Redis cleanup.
          git checkout "$TARGET_SHA" -- bdspro-service/initial/runtime.go bdspro-service/cmd/grpc/main.go
          rm -f bdspro-service/infra/providers/redis_provider.go
          rm -f .github/workflows/acceptance-bdspro-redis.yml

          python3 <<'PY'
          from pathlib import Path

          p = Path('bdspro-service/wire/wire.go')
          s = p.read_text()
          needle = '\tbdspro_infra_providers.NewRedisProvider,\n'
          if needle not in s:
              raise SystemExit('dead Redis provider registration anchor missing')
          p.write_text(s.replace(needle, '', 1))

          p = Path('bdspro-service/infra/redis/runtime.go')
          s = p.read_text()
          old_sig = 'func NewClient() (*RedisClient, error) {'
          if old_sig not in s:
              raise SystemExit('Redis constructor signature anchor missing')
          s = s.replace(old_sig, 'func NewClient() (*RedisClient, func(), error) {', 1)
          old_return = '\treturn rc, nil\n}\n\nfunc (r *RedisClient) Client'
          new_return = '''\tcleanup := func() {\n\t\tif err := rc.Close(); err != nil {\n\t\t\tlogger.Warnf("Failed to close Redis client: %v", err)\n\t\t}\n\t}\n\treturn rc, cleanup, nil\n}\n\nfunc (r *RedisClient) Client'''
          if old_return not in s:
              raise SystemExit('Redis constructor return anchor missing')
          p.write_text(s.replace(old_return, new_return, 1))

          p = Path('bdspro-service/internal/usecases/shared/product_usecase.go')
          s = p.read_text()
          guarded = '''\tif pageToken == "" {\n\t\tif err := uc.ensureSyncCache(ctx, profileID); err != nil {\n\t\t\treturn nil, err\n\t\t}\n\t}\n'''
          unconditional = '''\tif err := uc.ensureSyncCache(ctx, profileID); err != nil {\n\t\treturn nil, err\n\t}\n'''
          if guarded not in s:
              raise SystemExit('page-scoped cache readiness anchor missing')
          s = s.replace(guarded, unconditional, 1)

          seed_anchor = '''\tuserHash := cache.UserSyncProductsKey(profileID)\n\tchangeZSet := cache.UserProductsChangeKey(profileID)\n\n\tvar lastID uint64\n'''
          seed_repl = '''\tuserHash := cache.UserSyncProductsKey(profileID)\n\tchangeZSet := cache.UserProductsChangeKey(profileID)\n\n\tclient, clientErr := uc.redisClient.Client(ctx)\n\tif clientErr != nil {\n\t\treturn clientErr\n\t}\n\t// A missing generation marker means Redis state is not authoritative.\n\t// Rebuild from PostgreSQL instead of merging with potentially stale cache keys.\n\tif err := client.Del(ctx, userHash, changeZSet).Err(); err != nil {\n\t\treturn err\n\t}\n\n\tvar lastID uint64\n'''
          if seed_anchor not in s:
              raise SystemExit('seedFromDB rebuild anchor missing')
          p.write_text(s.replace(seed_anchor, seed_repl, 1))
          PY

          gofmt -w \
            bdspro-service/infra/redis/runtime.go \
            bdspro-service/internal/usecases/shared/product_usecase.go \
            bdspro-service/wire/wire.go

      - name: Generate canonical protobuf and Wire output
        shell: bash
        run: |
          set -euo pipefail
          make -C shared/code buf-all
          make -C shared/code wire bdspro
          git diff --check

      - name: Verify final S4 ownership and recovery invariants
        shell: bash
        run: |
          set -euo pipefail
          test ! -e bdspro-service/infra/providers/redis_provider.go
          ! git grep -n 'NewRedisProvider' -- bdspro-service
          count="$(git grep -n 'redis.NewClient(' -- bdspro-service | wc -l)"
          echo "redis.NewClient constructors=$count"
          test "$count" = "1"
          grep -Fq 'func NewClient() (*RedisClient, func(), error)' bdspro-service/infra/redis/runtime.go
          grep -q 'return r.client.Close()' bdspro-service/infra/redis/runtime.go
          ! grep -q 'connected bool' bdspro-service/infra/redis/runtime.go
          ! grep -q 'ensureConnection' bdspro-service/infra/redis/runtime.go
          grep -q 'UserSyncTimeKey(profileID)' bdspro-service/internal/usecases/shared/product_usecase.go
          grep -q 'ensureSyncCache(ctx, profileID)' bdspro-service/internal/usecases/shared/product_usecase.go
          grep -q 'client.Del(ctx, userHash, changeZSet)' bdspro-service/internal/usecases/shared/product_usecase.go
          grep -q 'GetAllTimestampsForSync' bdspro-service/internal/usecases/shared/product_usecase.go
          ! grep -q 'len(results) == 0 && pageToken == "" && lastSync == 0' bdspro-service/internal/usecases/shared/product_usecase.go
          grep -q 'redis_cli.NewClient()' bdspro-service/wire/wire_gen.go

      - name: Compile test and vet exact candidate
        shell: bash
        working-directory: bdspro-service
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
          go build ./...

      - name: Commit exact source candidate from accepted parent
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BDSPro Acceptance Proof'
          git config user.email 'acceptance-proof@users.noreply.github.com'
          git add \
            bdspro-service/infra/providers/redis_provider.go \
            bdspro-service/infra/redis/runtime.go \
            bdspro-service/internal/usecases/shared/product_usecase.go \
            bdspro-service/wire/wire.go \
            bdspro-service/wire/wire_gen.go
          git commit -m 'refactor(bdspro): canonicalize Redis runtime ownership'
          test "$(git rev-parse HEAD^)" = "$TARGET_SHA"
          mapfile -t changed < <(git diff --name-only "$TARGET_SHA" HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = "5"
          remote_acceptance="$(git ls-remote origin refs/heads/final-acceptance/source-canonicalization | awk '{print $1}')"
          test "$remote_acceptance" = "$TARGET_SHA"
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
