name: Materialize S6 Assistant Product Suggest Candidate

on:
  push:
    branches:
      - final-acceptance/proof-s6-product-asset-unlink-harness
    paths:
      - .github/workflows/materialize-s6-assistant-product-suggest.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CANONICAL_SHA: 0e7ff07db4d61d0b26f5f792237270fdadf52a7f
      CANDIDATE_BRANCH: final-acceptance/proof-s6-assistant-product-suggest
    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@v4
        with:
          ref: 0e7ff07db4d61d0b26f5f792237270fdadf52a7f
          fetch-depth: 0

      - name: Authority and branch guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANONICAL_SHA"
          test "$(git ls-remote origin refs/heads/final-acceptance/source-canonicalization | awk '{print $1}')" = "$CANONICAL_SHA"
          if git ls-remote --exit-code --heads origin "refs/heads/$CANDIDATE_BRANCH" >/dev/null 2>&1; then
            echo "candidate branch already exists" >&2
            exit 1
          fi
          test "$(sha256sum shared/code/deploy.sh | awk '{print $1}')" = "80b70e3ea1375b4a959438da92011574c084bdb14d6ee2399ff3d7ddf023e56e"

      - name: Materialize bounded Assistant source change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          usecase_path = Path('assistant-service/internal/usecases/assistant_usecase.go')
          text = usecase_path.read_text()
          assert text.count('\t_errors "common/errors"\n') == 1
          text = text.replace('\t_errors "common/errors"\n', '')
          assert text.count('\t"context"\n') == 1
          text = text.replace('\t"context"\n', '\t"context"\n\t"errors"\n')
          marker = 'type AssistantUsecase struct {'
          assert text.count(marker) == 1
          text = text.replace(marker, 'var ErrProductSuggestUnavailable = errors.New("failed to get product suggest")\n\n' + marker)
          old_return = 'return nil, "", 0, _errors.ReturnError(500, "failed to get product suggest")'
          assert text.count(old_return) == 1
          text = text.replace(old_return, 'return nil, "", 0, ErrProductSuggestUnavailable')
          usecase_path.write_text(text)
          handler_path = Path('assistant-service/infra/handler/assistant_handler.go')
          text = handler_path.read_text()
          assert text.count('\t"context"\n') == 1
          text = text.replace('\t"context"\n', '\t"context"\n\t"errors"\n')
          insertion = 'func mapAnalyzeProductTextError(prefix string, err error) error {\n\tif errors.Is(err, usecases.ErrProductSuggestUnavailable) {\n\t\terr = status.Error(codes.Internal, "failed to get product suggest")\n\t}\n\treturn status.Errorf(codes.Internal, "%s: %v", prefix, err)\n}\n\n'
          marker = '// AnalyzeProductText - Phân tích văn bản sản phẩm BĐS\n'
          assert text.count(marker) == 1
          text = text.replace(marker, insertion + marker)
          old = 'return nil, status.Errorf(codes.Internal, "failed to analyze: %v", err)'
          assert text.count(old) == 1
          text = text.replace(old, 'return nil, mapAnalyzeProductTextError("failed to analyze", err)')
          old = 'return nil, status.Errorf(codes.Internal, "failed to analyze with deepseek: %v", err)'
          assert text.count(old) == 1
          text = text.replace(old, 'return nil, mapAnalyzeProductTextError("failed to analyze with deepseek", err)')
          handler_path.write_text(text)
          test_path = Path('assistant-service/infra/handler/assistant_product_suggest_error_test.go')
          test_content = 'package handler\n\nimport (\n\tstderrors "errors"\n\t"testing"\n\n\t"assistant/internal/usecases"\n\n\t"google.golang.org/grpc/codes"\n\t"google.golang.org/grpc/status"\n)\n\nfunc TestMapAnalyzeProductTextErrorProductSuggestUnavailable(t *testing.T) {\n\tcases := []struct {\n\t\tname string\n\t\tprefix string\n\t\twant string\n\t}{\n\t\t{name: "primary analyze rpc", prefix: "failed to analyze", want: "failed to analyze: rpc error: code = Internal desc = failed to get product suggest"},\n\t\t{name: "deepseek alias rpc", prefix: "failed to analyze with deepseek", want: "failed to analyze with deepseek: rpc error: code = Internal desc = failed to get product suggest"},\n\t}\n\tfor _, tc := range cases {\n\t\tt.Run(tc.name, func(t *testing.T) {\n\t\t\tgot := mapAnalyzeProductTextError(tc.prefix, usecases.ErrProductSuggestUnavailable)\n\t\t\tst, ok := status.FromError(got)\n\t\t\tif !ok { t.Fatalf("expected gRPC status, got %T: %v", got, got) }\n\t\t\tif st.Code() != codes.Internal { t.Fatalf("code = %v, want %v", st.Code(), codes.Internal) }\n\t\t\tif st.Message() != tc.want { t.Fatalf("message = %q, want %q", st.Message(), tc.want) }\n\t\t\tif len(st.Details()) != 0 { t.Fatalf("details = %d, want 0", len(st.Details())) }\n\t\t})\n\t}\n}\n\nfunc TestMapAnalyzeProductTextErrorGenericWrapping(t *testing.T) {\n\tgot := mapAnalyzeProductTextError("failed to analyze", stderrors.New("boom"))\n\tst, ok := status.FromError(got)\n\tif !ok { t.Fatalf("expected gRPC status, got %T: %v", got, got) }\n\tif st.Code() != codes.Internal { t.Fatalf("code = %v, want %v", st.Code(), codes.Internal) }\n\tif st.Message() != "failed to analyze: boom" { t.Fatalf("message = %q", st.Message()) }\n\tif len(st.Details()) != 0 { t.Fatalf("details = %d, want 0", len(st.Details())) }\n}\n'
          test_path.write_text(test_content)
          PY
          gofmt -w assistant-service/internal/usecases/assistant_usecase.go assistant-service/infra/handler/assistant_handler.go assistant-service/infra/handler/assistant_product_suggest_error_test.go
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          expected=(assistant-service/infra/handler/assistant_handler.go assistant-service/infra/handler/assistant_product_suggest_error_test.go assistant-service/internal/usecases/assistant_usecase.go)
          printf 'candidate paths:\n%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
          ! printf '%s\n' "${changed[@]}" | grep -Eq '^(shared/protobuf|organization-service|map-service|shared/code/deploy\.sh)($|/)'
          test "$(sha256sum shared/code/deploy.sh | awk '{print $1}')" = "80b70e3ea1375b4a959438da92011574c084bdb14d6ee2399ff3d7ddf023e56e"

      - name: Create one semantic commit and push non-force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name datvtph41107
          git config user.email 116329073+datvtph41107@users.noreply.github.com
          git add assistant-service/internal/usecases/assistant_usecase.go assistant-service/infra/handler/assistant_handler.go assistant-service/infra/handler/assistant_product_suggest_error_test.go
          git commit -m 'refactor(assistant): localize product suggest error mapping'
          test "$(git rev-parse HEAD^)" = "$CANONICAL_SHA"
          test "$(git rev-list --count "$CANONICAL_SHA"..HEAD)" = "1"
          test -z "$(git status --porcelain)"
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          echo "candidate=$(git rev-parse HEAD)"
