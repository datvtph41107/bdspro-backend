name: Acceptance Source Integrity

on:
  push:
    branches:
      - final-acceptance/source-canonicalization
      - architecture/source-migration-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-source-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-integrity:
    name: Source integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify protected repository invariants
        shell: bash
        run: |
          set -euo pipefail
          test -d proto
          test ! -e contracts
          test -d internal/organization-legacy
          test -d internal/map-legacy
          echo "80b70e3ea1375b4a959438da92011574c084bdb14d6ee2399ff3d7ddf023e56e  tools/development/deploy.sh" | sha256sum -c -
          if git ls-files | grep -Eq '(^|/)\.env($|\.local$|\.runtime$)'; then
            echo 'Tracked runtime .env file detected' >&2
            git ls-files | grep -E '(^|/)\.env($|\.local$|\.runtime$)' >&2
            exit 1
          fi
          git diff --check
          make help >/dev/null
          python3 tools/development/verify-source-topology.py
          python3 tools/development/verify-docker-topology.py

      - name: Verify User migration authority
        shell: bash
        run: |
          set -euo pipefail
          test -d internal/user/database/migrations
          test ! -e internal/user/migrate
          test "$(find internal/user/database/migrations -maxdepth 1 -type f -name '*.up.sql' | wc -l)" -eq 10
          test "$(find internal/user/database/migrations -maxdepth 1 -type f -name '*.down.sql' | wc -l)" -eq 10
          test -f internal/user/database/migrations/000010_add_payment_funds_confirm_permission.up.sql
          grep -Fq 'MIGRATION_DIR := database/migrations' internal/user/Makefile
          grep -Fq './internal/user/database/migrations:/migrations:ro' compose.yaml
          grep -Fq 'user:internal/user/database/migrations' tools/development/verify-migrations.sh

      - name: Verify Payment migration authority
        shell: bash
        run: |
          set -euo pipefail
          test -d internal/payment/database/migrations
          test ! -e internal/payment/migrate
          test "$(find internal/payment/database/migrations -maxdepth 1 -type f -name '*.up.sql' | wc -l)" -eq 7
          test "$(find internal/payment/database/migrations -maxdepth 1 -type f -name '*.down.sql' | wc -l)" -eq 7
          test -f internal/payment/database/migrations/000007_canonical_order_reference.up.sql
          grep -Fq 'MIGRATION_DIR := database/migrations' internal/payment/Makefile
          grep -Fq 'payment:internal/payment/database/migrations' tools/development/verify-migrations.sh
          grep -Fq './internal/payment/database/migrations:/migrations:ro' compose.yaml

      - name: Verify TQD migration authority
        shell: bash
        run: |
          set -euo pipefail
          test -d internal/planning/database/migrations
          test ! -e internal/planning/migrate
          test "$(find internal/planning/database/migrations -maxdepth 1 -type f -name '*.up.sql' | wc -l)" -eq 44
          test "$(find internal/planning/database/migrations -maxdepth 1 -type f -name '*.down.sql' | wc -l)" -eq 44
          test -f internal/planning/database/migrations/000044_canonicalize_vn_administrative_catalog.up.sql
          grep -Fq 'MIGRATION_DIR := database/migrations' internal/planning/Makefile
          grep -Fq 'tqd:internal/planning/database/migrations' tools/development/verify-migrations.sh
          grep -Fq './internal/planning/database/migrations:/migrations:ro' compose.yaml

      - name: Verify Notification migration authority
        shell: bash
        run: |
          set -euo pipefail
          test -d internal/notification/database/migrations
          test ! -e internal/notification/migrate
          test "$(find internal/notification/database/migrations -maxdepth 1 -type f -name '*.up.sql' | wc -l)" -eq 2
          test "$(find internal/notification/database/migrations -maxdepth 1 -type f -name '*.down.sql' | wc -l)" -eq 2
          test -f internal/notification/database/migrations/000002_payment_eventing.up.sql
          grep -Fq 'MIGRATION_DIR := database/migrations' internal/notification/Makefile
          grep -Fq 'notification:internal/notification/database/migrations' tools/development/verify-migrations.sh
          grep -Fq './internal/notification/database/migrations:/migrations:ro' compose.yaml

      - name: Verify File migration authority
        shell: bash
        run: |
          set -euo pipefail
          test -d internal/file/database/migrations
          test ! -e internal/file/migrate
          test "$(find internal/file/database/migrations -maxdepth 1 -type f -name '*.up.sql' | wc -l)" -eq 4
          test "$(find internal/file/database/migrations -maxdepth 1 -type f -name '*.down.sql' | wc -l)" -eq 4
          test -f internal/file/database/migrations/000004_drop_physical_path_authority.up.sql
          grep -Fq 'MIGRATION_DIR := database/migrations' internal/file/Makefile
          grep -Fq 'file:internal/file/database/migrations' tools/development/verify-migrations.sh
          grep -Fq './internal/file/database/migrations:/migrations:ro' compose.yaml

      - name: Verify Hub migration authority
        shell: bash
        run: |
          set -euo pipefail
          test -d internal/hub/database/migrations
          test ! -e internal/hub/migrate
          test "$(find internal/hub/database/migrations -maxdepth 1 -type f -name '*.up.sql' | wc -l)" -eq 3
          test "$(find internal/hub/database/migrations -maxdepth 1 -type f -name '*.down.sql' | wc -l)" -eq 3
          test -f internal/hub/database/migrations/000003_hub_fix_planning_faq_link.up.sql
          grep -Fq 'MIGRATION_DIR := database/migrations' internal/hub/Makefile
          grep -Fq 'hub:internal/hub/database/migrations' tools/development/verify-migrations.sh
          grep -Fq './internal/hub/database/migrations:/migrations:ro' compose.yaml

      - name: Verify BDSPro migration authority
        shell: bash
        run: |
          set -euo pipefail
          test -d internal/property/database/migrations
          test ! -e internal/property/infra/db/migrations/v2
          test "$(find internal/property/database/migrations -maxdepth 1 -type f -name '*.up.sql' | wc -l)" -eq 3
          test "$(find internal/property/database/migrations -maxdepth 1 -type f -name '*.down.sql' | wc -l)" -eq 3
          test -f internal/property/database/migrations/000003_create_property_partition_table.up.sql
          test -f internal/property/database/migrations/000003_create_property_partition_table.down.sql
          grep -Fq 'MIGRATION_DIR := database/migrations' internal/property/Makefile
          grep -Fq 'bdspro:internal/property/database/migrations' tools/development/verify-migrations.sh

      - name: Verify CRM migration authority
        shell: bash
        run: |
          set -euo pipefail
          test -d internal/crm/database/migrations
          test ! -e internal/crm/infra/db/migrate_v2
          test "$(find internal/crm/database/migrations -maxdepth 1 -type f -name '*.up.sql' | wc -l)" -eq 25
          test "$(find internal/crm/database/migrations -maxdepth 1 -type f -name '*.down.sql' | wc -l)" -eq 25
          test -f internal/crm/database/migrations/000025_payment_event_inbox.up.sql
          test -f internal/crm/database/migrations/000025_payment_event_inbox.down.sql
          grep -Fq 'MIGRATION_DIR := database/migrations' internal/crm/Makefile
          grep -Fq 'crm:internal/crm/database/migrations' tools/development/verify-migrations.sh

      - name: Verify canonical root migration mounts
        shell: bash
        run: |
          set -euo pipefail
          for row in \
            "payment:internal/payment" \
            "tqd:internal/planning" \
            "notification:internal/notification" \
            "file:internal/file" \
            "hub:internal/hub"; do
            service="${row%%:*}"
            dir="${row#*:}"
            test ! -e "${dir}/migrate"
            test "$(grep -Fc "./${dir}/database/migrations:/migrations:ro" compose.yaml)" -eq 1
          done
          if grep -Eq '\./(payment|tqd|notification|file|hub)-service/migrate:/migrations:ro' compose.yaml; then
            echo 'legacy root migration mount detected' >&2
            grep -En '\./(payment|tqd|notification|file|hub)-service/migrate:/migrations:ro' compose.yaml >&2
            exit 1
          fi
          test "$(grep -Fc './internal/organization-legacy/migrate:/migrations:ro' compose.yaml)" -eq 1

      - name: Build tracked-source manifest evidence
        shell: bash
        run: |
          set -euo pipefail
          bash tools/development/source-manifest.sh SOURCE-MANIFEST.ci.sha256
          git ls-files -s > SOURCE-MANIFEST.ci.git-index.txt
          sha256sum SOURCE-MANIFEST.ci.sha256 SOURCE-MANIFEST.ci.git-index.txt > SOURCE-MANIFEST.ci.evidence.sha256

      - name: Upload source manifest evidence
        uses: actions/upload-artifact@v4
        with:
          name: source-manifest-${{ github.sha }}
          path: |
            SOURCE-MANIFEST.ci.sha256
            SOURCE-MANIFEST.ci.git-index.txt
            SOURCE-MANIFEST.ci.evidence.sha256
          if-no-files-found: error
          retention-days: 30
