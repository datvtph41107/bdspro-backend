syntax = "proto3";

package userpb;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

option go_package = "pb/types/user;userpb";

// AdminOrganizationService is the User-owned control plane for organization
// identity. Membership authorization lives beside this directory, not in Auth
// or CRM.
service AdminOrganizationService {
  rpc ListOrganizations(ListAdminOrganizationsRequest) returns (ListAdminOrganizationsResponse) {
    option (google.api.http) = { get: "/v2/user/admin/organizations" };
  }
  rpc GetOrganization(GetAdminOrganizationRequest) returns (AdminOrganizationProjection) {
    option (google.api.http) = { get: "/v2/user/admin/organizations/{id}" };
  }
  rpc CreateOrganization(CreateAdminOrganizationRequest) returns (AdminOrganizationProjection) {
    option (google.api.http) = {
      post: "/v2/user/admin/organizations"
      body: "*"
    };
  }
  rpc UpdateOrganization(UpdateAdminOrganizationRequest) returns (AdminOrganizationProjection) {
    option (google.api.http) = {
      patch: "/v2/user/admin/organizations/{id}"
      body: "*"
    };
  }
  rpc ArchiveOrganization(ArchiveAdminOrganizationRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/v2/user/admin/organizations/{id}" };
  }
}

message AdminOrganization {
  uint64 id = 1;
  string code = 2;
  string name = 3;
  string type = 4;
  string tax_code = 5 [json_name = "taxCode"];
  string phone = 6;
  string email = 7;
  string address = 8;
  string website = 9;
  string description = 10;
  string status = 11;
  string verification_status = 12 [json_name = "verificationStatus"];
  string warning_level = 13 [json_name = "warningLevel"];
  uint32 warning_count = 14 [json_name = "warningCount"];
  uint64 owner_profile_id = 15 [json_name = "ownerProfileId"];
  string created_at = 16 [json_name = "createdAt"];
  string updated_at = 17 [json_name = "updatedAt"];
}

message AdminOrganizationProjection {
  AdminOrganization organization = 1;
  uint64 total_members = 2 [json_name = "totalMembers"];
}

message ListAdminOrganizationsRequest {
  uint32 page = 1;
  uint32 size = 2;
  string search_text = 3 [json_name = "searchText"];
  string type = 4;
  string status = 5;
  string verification_status = 6 [json_name = "verificationStatus"];
  string warning_level = 7 [json_name = "warningLevel"];
}

message ListAdminOrganizationsResponse {
  repeated AdminOrganizationProjection data = 1;
  uint64 total = 2;
  uint32 page = 3;
  uint32 size = 4;
}

message GetAdminOrganizationRequest { uint64 id = 1; }

message CreateAdminOrganizationRequest {
  string code = 1;
  string name = 2;
  string type = 3;
  string tax_code = 4 [json_name = "taxCode"];
  string phone = 5;
  string email = 6;
  string address = 7;
  string website = 8;
  string description = 9;
}

message UpdateAdminOrganizationRequest {
  uint64 id = 1;
  optional string code = 2;
  optional string name = 3;
  optional string type = 4;
  optional string tax_code = 5 [json_name = "taxCode"];
  optional string phone = 6;
  optional string email = 7;
  optional string address = 8;
  optional string website = 9;
  optional string description = 10;
  optional string status = 11;
  optional string verification_status = 12 [json_name = "verificationStatus"];
  optional string warning_level = 13 [json_name = "warningLevel"];
}

message ArchiveAdminOrganizationRequest { uint64 id = 1; }
