syntax = "proto3";

package userpb;

import "shared/common.proto";
import "google/api/annotations.proto";
import "auth/role.proto";

option go_package = "pb/types/user;userpb";

service AdminProfileService {
    // Admin Management
    rpc CreateAdmin(AdminProfile) returns (AdminProfile) {
        option (google.api.http) = {
            post: "/v2/user/admin-profile/create"
            body: "*"
        };
    }

    rpc UpdateAdmin(AdminProfile) returns (AdminProfile) {
        option (google.api.http) = {
            put: "/v2/user/admin-profile/update/{id}"
            body: "*"
        };
    }

    rpc DeleteAdmin(sharepb.IdRequest) returns (DeleteAdminResponse) {
        option (google.api.http) = {
            delete: "/v2/user/admin-profile/delete/{id}"
        };
    }

    // rpc AssignRole(AssignRoleRequest) returns (AssignRoleResponse) {
    //     option (google.api.http) = {
    //         post: "/v2/user/admin-profile/assign-role"
    //         body: "*"
    //     };
    // }

    rpc ListAdmins(AdminListRequest) returns (AdminListResponse) {
        option (google.api.http) = {
            get: "/v2/user/admin-profile/list"
        };
    }

    rpc GetDetail(sharepb.IdRequest) returns (AdminProfile) {
        option (google.api.http) = {
            get: "/v2/user/admin-profile/detail/{id}"
        };
    }
}


message AdminProfile {
    uint64 id = 1;
    string fullName = 2;
    string email = 3;
    string phone = 4;
    string avatar = 5;
    string address = 6;
    optional uint32 gender = 7;
    string birth = 8;
    string createdAt = 9;
    string updatedAt = 10;
    uint32 status = 11;
    string roleType = 12;
    string roleRealEstate = 13;
    string position = 14;
    uint64 departmentId = 15;
    bool bookmark = 16;
    bool tickVerified = 17;
    string lastLoginAt = 18;
    uint32 totalLogin = 19;
    string verifiedAt = 20;
    string lockedAt = 21;
    repeated string attachments = 22;
    string internalNotes = 23;
    bool sendNotification = 24;
    string jobTitle = 25;
    string workAt = 26;
    string roleKey = 27;
    optional uint64 roleId = 28;
    optional authpb.Role role = 29;
    string username = 30;
    string password = 31;
}

message ListAdminRequest {
    uint32 page = 1;
    uint32 size = 2;
}

message ListAdminResponse {
    repeated AdminProfile data = 1;
    uint32 total = 2;
}


