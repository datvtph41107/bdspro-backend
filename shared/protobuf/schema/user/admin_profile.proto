message UpdateAdminRequest {
    uint64 authId = 1;
    string fullName = 2;
    string email = 3;
    string phone = 4;
    string avatar = 5;
}

message DeleteAdminRequest {
    uint64 id = 1;
}

message DeleteAdminResponse {
    string message = 1;
}

message AssignRoleRequest {
    uint64 authId = 1;
    string roleKey = 2;
}

message AssignRoleResponse {
    string message = 1;
}

message AdminListRequest {
    uint32 page = 1;
    uint32 size = 2;
    uint64 roleId = 3;
    string name = 4;
}

message AdminListResponse {
    repeated AdminProfile data = 1;
    int32 total = 2;
}

