syntax = "proto3";

package userpb;

option go_package = "pb/types/user;userpb";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// AdminCatalogService quản trị bản hợp đồng catalog đã được version hoá.
// API này không thay đổi quota runtime hoặc usage lịch sử.
service AdminCatalogService {
  // CreateDraft creates a new immutable-version candidate. Stable product and
  // plan identities may already exist; terms belong only to the new version.
  rpc CreatePlanVersionDraft(CreateCatalogPlanVersionDraftRequest) returns (CatalogPlanVersion) {
    option (google.api.http) = {
      post: "/v2/user/admin/catalog/plan-versions"
      body: "*"
    };
  }

  rpc ListPlanVersions(ListCatalogPlanVersionsRequest) returns (ListCatalogPlanVersionsResponse) {
    option (google.api.http) = {
      get: "/v2/user/admin/catalog/plan-versions"
    };
  }

  rpc GetPlanVersion(GetCatalogPlanVersionRequest) returns (CatalogPlanVersion) {
    option (google.api.http) = {
      get: "/v2/user/admin/catalog/plan-versions/{plan_version_id}"
    };
  }

  // UpdateDraft replaces the complete draft terms atomically. Published terms
  // are deliberately immutable and must be superseded by another version.
  rpc UpdatePlanVersionDraft(UpdateCatalogPlanVersionDraftRequest) returns (CatalogPlanVersion) {
    option (google.api.http) = {
      put: "/v2/user/admin/catalog/plan-versions/{plan_version_id}"
      body: "*"
    };
  }

  rpc ValidatePlanVersionDraft(ValidateCatalogPlanVersionDraftRequest) returns (ValidateCatalogPlanVersionDraftResponse) {
    option (google.api.http) = {
      post: "/v2/user/admin/catalog/plan-versions/{plan_version_id}:validate"
      body: "*"
    };
  }

  rpc DeletePlanVersionDraft(DeleteCatalogPlanVersionDraftRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v2/user/admin/catalog/plan-versions/{plan_version_id}"
    };
  }

  // Publish chỉ chuyển draft hợp lệ sang active và lưu publisher/checksum.
  rpc PublishPlanVersion(PublishCatalogPlanVersionRequest) returns (PublishCatalogPlanVersionResponse) {
    option (google.api.http) = {
      post: "/v2/user/admin/catalog/plan-versions/{plan_version_id}:publish"
      body: "*"
    };
  }

  // Retire removes an active version from the selling catalog. Existing
  // orders, subscriptions and usage keep their immutable version snapshot.
  rpc RetirePlanVersion(RetireCatalogPlanVersionRequest) returns (CatalogPlanVersion) {
    option (google.api.http) = {
      post: "/v2/user/admin/catalog/plan-versions/{plan_version_id}:retire"
      body: "*"
    };
  }
}

message CatalogPlanVersionDraft {
  string product_code = 1;
  string product_display_name = 2;
  string plan_code = 3;
  string version = 4;
  string display_name = 5;
  string subject_scope = 6;
  int32 tier_rank = 7;
  int32 subscription_term_days = 8;
  repeated CatalogEntitlement entitlements = 9;
  repeated CatalogPriceItem prices = 10;
  repeated CatalogOperationPolicy operations = 11;
}

message CreateCatalogPlanVersionDraftRequest {
  CatalogPlanVersionDraft draft = 1;
}

message UpdateCatalogPlanVersionDraftRequest {
  uint64 plan_version_id = 1;
  CatalogPlanVersionDraft draft = 2;
}

message ValidateCatalogPlanVersionDraftRequest {
  uint64 plan_version_id = 1;
}

message ValidateCatalogPlanVersionDraftResponse {
  bool valid = 1;
  string terms_checksum = 2;
}

message DeleteCatalogPlanVersionDraftRequest {
  uint64 plan_version_id = 1;
}

message RetireCatalogPlanVersionRequest {
  uint64 plan_version_id = 1;
}

message ListCatalogPlanVersionsRequest {
  uint32 page = 1;
  uint32 page_size = 2;
  string product_code = 3;
  string plan_code = 4;
  string status = 5;
}

message ListCatalogPlanVersionsResponse {
  repeated CatalogPlanVersion plan_versions = 1;
  uint64 total = 2;
}

message GetCatalogPlanVersionRequest {
  uint64 plan_version_id = 1;
}

message PublishCatalogPlanVersionRequest {
  uint64 plan_version_id = 1;
  google.protobuf.Timestamp effective_from = 2;
  google.protobuf.Timestamp effective_until = 3;
}

message PublishCatalogPlanVersionResponse {
  CatalogPlanVersion plan_version = 1;
  string terms_checksum = 2;
  google.protobuf.Timestamp published_at = 3;
}

message CatalogPlanVersion {
  uint64 id = 1;
  string product_code = 2;
  string product_display_name = 3;
  string plan_code = 4;
  string version = 5;
  string display_name = 6;
  string status = 7;
  string subject_scope = 8;
  google.protobuf.Timestamp effective_from = 9;
  google.protobuf.Timestamp effective_until = 10;
  google.protobuf.Timestamp published_at = 11;
  string terms_checksum = 12;
  repeated CatalogEntitlement entitlements = 13;
  repeated CatalogPriceItem prices = 14;
  repeated CatalogOperationPolicy operations = 15;
  int32 tier_rank = 16;
  int32 subscription_term_days = 17;
}

message CatalogEntitlement {
  string code = 1;
  string kind = 2;
  string feature_code = 3;
  string meter_code = 4;
  int64 amount = 5;
  bool unlimited = 6;
  string period = 7;
}

message CatalogPriceItem {
  string code = 1;
  string kind = 2;
  string currency = 3;
  int64 amount_minor = 4;
  string billing_unit = 5;
  string meter_code = 6;
  int64 quantity = 7;
}

message CatalogOperationPolicy {
  string code = 1;
  string feature_code = 2;
  string meter_code = 3;
  int64 units_per_action = 4;
}
