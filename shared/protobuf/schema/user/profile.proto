syntax = "proto3";

package userpb;
import "google/api/annotations.proto";
import "shared/common.proto";
import "auth/role.proto";

option go_package = "pb/types/user;userpb";

service ProfileService {
    rpc GetProfileByIds(sharepb.GetProfileByIdsRequest) returns (sharepb.GetProfileByIdsResponse);
    rpc GetProfileByPhones(GetProfileByPhonesRequest) returns (sharepb.GetProfileByIdsResponse);
    rpc GetProfileInfo(IdRequest) returns (ProfilePublicInfo) {
        option (google.api.http) = {
            get: "/v2/user/profile/info/{id}"
        };
    }
    rpc GetProfileInfoMe(sharepb.Empty) returns (ProfilePublicInfo) {
        option (google.api.http) = {
            get: "/v2/user/profile/info/me"
        };
    }
    rpc ListAccountMe(sharepb.Empty) returns (AccountInfoResponse) {
        option (google.api.http) = {
            get: "/v2/user/profile/accounts/me"
        };
    }
    rpc SetInfo(SetInfoRequest) returns (sharepb.Empty) {
        option (google.api.http) = {
            put: "/v2/user/profile/set-info"
            body: "*"
        };
    }
    rpc SearchProfilePublic(SearchProfilePublicRequest) returns (SearchProfilePublicResponse) {
        option (google.api.http) = {
            get: "/v2/user/profile/search/public"
        };
    }
    
    // Admin API - Lấy danh sách tất cả user với phân trang và tìm kiếm
    rpc ListAllUsers(ListAllUsersRequest) returns (ListAllUsersResponse) {
        option (google.api.http) = {
            get: "/v2/user/admin/users"
        };
    }
    
    // Admin API - Khóa tài khoản user
    rpc BlockUser(BlockUserRequest) returns (sharepb.Empty) {
        option (google.api.http) = {
            post: "/v2/user/admin/users/{profileId}/block"
            body: "*"
        };
    }
    
    // Admin API - Mở khóa tài khoản user
    rpc UnblockUser(UnblockUserRequest) returns (sharepb.Empty) {
        option (google.api.http) = {
            post: "/v2/user/admin/users/{profileId}/unblock"
            body: "*"
        };
    }
    
    // Admin API - Duyệt tài khoản user
    rpc ApproveUser(ApproveUserRequest) returns (sharepb.Empty) {
        option (google.api.http) = {
            post: "/v2/user/admin/users/{profileId}/approve"
            body: "*"
        };
    }
    
    // Admin API - Gửi cảnh báo cho user
    rpc SendWarningToUser(SendWarningRequest) returns (SendWarningResponse) {
        option (google.api.http) = {
            post: "/v2/user/admin/warning/send"
            body: "*"
        };
    }
}

message ProfileItem {
    uint64 id = 1;
    string fullName = 2;
    string avatar = 4;
}

message Profile {
    uint64 id = 1;
    string fullName = 2;
    string email = 3;
    string avatar = 4;
    string cover = 5;
    string phone = 6;
    string address = 7;
    uint32 gender = 8;
    string birthDate = 9;
    string createdAt = 10;
    string updatedAt = 11;
}

message ProfilePublicInfo {
    uint64 profileId = 1;
    string fullName = 2;
    string avatar = 3;
    string phone = 5;
    string phone2 = 6;
    string email = 7;
    string taxCode = 8;
    string address = 9;
    string backgroundImage = 10;
    string referralCode = 11;
    string referralBy = 12;
    uint32 roleRealEstate = 13;
    string position = 14;
    uint64 departmentId = 15;
    string birth = 16;
    string startDate = 17;
    string frontIdentify = 18;
    string backIdentify = 19;
    string slogan = 20;
    string website = 21;
    string facebook = 22;
    string instagram = 23;
    string twitter = 24;
    string linkedin = 25;
    string youtube = 26;
    string introduction = 27;
    uint32 statusOnline = 28;
    repeated CertificationItem certifications = 29;
    repeated ProfessionItem professions = 30;
    RateStats rateStats = 31;
    sharepb.FriendItem friendStatus = 32;
    bool following = 33;
    uint32 tabDefault = 34;
    uint32 visibility = 35;
    uint32 profileVisibility = 36;
}

message RateStats {
	uint64 totalReviews = 1;
	float averageScore = 2;
	uint64 star1Count = 3;
	uint64 star2Count = 4;
	uint64 star3Count = 5;
	uint64 star4Count = 6;
	uint64 star5Count = 7;
}

message IdRequest {
    uint64 id = 1;
}

message GetProfileByPhonesRequest {
    repeated string phones = 1;
}

message AccountInfoResponse {
    repeated AccountInfo data = 1;
    int32 total = 2;
}

message AccountInfo {
    optional uint64 profileId = 1;
    optional string fullName = 2;
    optional string avatar = 3;
    optional string phone = 4;
    optional string email = 5;
    optional string backgroundImage = 8;
    optional uint32 organizationId = 9;
    optional uint32 groupId = 10;
    optional uint32 ownerType = 11;
}

message SetInfoRequest {
    string phone = 1;
    string phone2 = 2;
    string email = 3;
    string taxCode = 4;
    string fullName = 5;
    string address = 6;
    string avatar = 7;
    string backgroundImage = 8;
    string position = 9;
    uint64 departmentId = 10;
    string birth = 11;
    string startDate = 12;
    string frontIdentify = 13;
    string backIdentify = 14;
    string slogan = 15;
    string website = 16;
    string facebook = 17;
    string instagram = 18;
    string twitter = 19;
    string linkedin = 20;
    string youtube = 21;
    string introduction = 22;
    uint32 visibility = 23;
    uint32 profileVisibility = 24;
    uint32 statusOnline = 25;
    uint32 tabDefault = 26;
    uint32 roleRealEstate = 27;

    repeated CertificationItem certifications = 28;
    repeated uint64 certificationRemoveIds = 29;
    repeated ProfessionItem professions = 30;
    repeated uint64 professionRemoveIds = 31;
}

message CertificationItem {
    uint64 id = 1;
    string name = 2;
    string issuer = 3;
    string fileUrl = 4;
    string fileType = 5;
    string fileName = 6;
    string issueDate = 7;
}

message ProfessionItem {
    uint64 id = 1;
    string name = 2;
    string issuer = 3;
    string issueDate = 4;
    uint32 verifiedStatus = 5;
}

message UserSearchItem {
    uint64 profileId = 1;
    string fullName = 2;
    string avatar = 3;
    optional sharepb.FriendItem friendStatus = 4;
}

message SearchProfilePublicRequest {
    string text = 1;
    uint32 page = 2;
    uint32 size = 3;
}

message SearchProfilePublicResponse {
    repeated UserSearchItem data = 1;
    int32 total = 2;
}

// Admin API Messages
message ListAllUsersRequest {
    string search = 1;           // Tìm kiếm theo tên, email, phone
    uint32 page = 2;             // Trang hiện tại
    uint32 size = 3;             // Số lượng item trên mỗi trang
    string sortBy = 4;           // Sắp xếp theo trường (created_at, full_name, email)
    string sortOrder = 5;        // Thứ tự sắp xếp (asc, desc)
    uint32 status = 6;           // Lọc theo trạng thái (1: active, 0: inactive)
    string roleType = 7;         // Lọc theo role type
    string startDate = 8;        // Lọc từ ngày tạo
    string endDate = 9;          // Lọc đến ngày tạo
    bool bookmark = 10;          // Lọc theo bookmark
}

message ListAllUsersResponse {
    repeated AdminUserItem data = 1;
    int32 total = 2;
    uint32 page = 3;
    uint32 size = 4;
    uint32 totalPages = 5;
}

message AdminUserItem {
    uint64 profileId = 1;
    string fullName = 2;
    string email = 3;
    string phone = 4;
    string avatar = 5;
    string address = 6;
    uint32 gender = 7;
    string birth = 8;
    string createdAt = 9;
    string updatedAt = 10;
    uint32 status = 11;          // 1: active, 0: inactive
    string roleType = 12;        // Role type của user
    string roleRealEstate = 13;  // Role real estate
    string position = 14;
    uint64 departmentId = 15;
    bool bookmark = 16;        // true nếu user này được admin bookmark
    bool tickVerified = 17;      // Tài khoản đã xác thực
    string lastLoginAt = 18;     // Lần đăng nhập cuối
    uint32 totalLogin = 19;      // Tổng số lần đăng nhập
    string verifiedAt = 20;      // Thời gian xác thực
    string lockedAt = 21;        // Thời gian khóa tài khoản
    optional authpb.Role role = 22;        // Role của user
}

// Admin API Request Messages
message BookmarkUsersRequest {
    uint32 page = 1;             // Số trang
    uint32 size = 2;             // Số lượng item mỗi trang
    string search = 3;           // Tìm kiếm theo tên, email, phone
    string roleType = 4;         // Lọc theo role type
    string startDate = 5;        // Lọc từ ngày tạo
    string endDate = 6;          // Lọc đến ngày tạo
}

message BlockUserRequest {
    uint64 profileId = 1;
    string reason = 2;           // Lý do khóa tài khoản
}

message UnblockUserRequest {
    uint64 profileId = 1;
    string reason = 2;           // Lý do mở khóa tài khoản
}

message ApproveUserRequest {
    uint64 profileId = 1;
    string note = 2;             // Ghi chú khi duyệt
}

// Warning/Alert API Messages
message SendWarningRequest {
    uint64 userId = 1;           // ID của user nhận cảnh báo
    WarningType warningType = 2; // Loại cảnh báo
    string content = 3;          // Nội dung cảnh báo
    string title = 4;            // Tiêu đề cảnh báo (optional)
}

message SendWarningResponse {
    bool success = 1;
    string message = 2;
    uint64 notificationId = 3;   // ID của notification được tạo
}

// Enum cho loại cảnh báo
enum WarningType {
    WARNING_VIOLATION = 0;       // Cảnh báo vi phạm
    WARNING_REMINDER = 1;        // Nhắc nhở chung
    WARNING_GUIDANCE = 2;        // Hướng dẫn sử dụng
}

