version: v1
plugins:
  - plugin: go
    out: ../types
    opt: paths=source_relative
  - plugin: go-grpc
    out: ../types
    opt: paths=source_relative
  - plugin: grpc-gateway
    out: ../types
    opt:
      - paths=source_relative
      - generate_unbound_methods=true
  - plugin: openapiv2
    out: ../docs
    opt: logtostderr=true

