syntax = "proto3";

package hubpb;

option go_package = "pb/types/hub;hubpb";
import "google/api/annotations.proto";
import "shared/common.proto";
import "shared/v3.proto";

// ========== Messages ==========

// Location message - represents Province, District, or Ward
message Location {
  uint64 id = 1;
  string name = 2;
  int32 type = 3;
  string typeText = 4;
  int32 level = 5; // 1=Province, 2=District, 3=Ward
  optional string parentId = 6; // Province ID for District, District ID for Ward
  string createdAt = 7;
  string updatedAt = 8;
}

message GetLocationsByIdsRequest {
  repeated uint64 ids = 1; // List of location IDs (Province, District, or Ward)
}

message GetLocationsByIdsResponse {
  repeated Location data = 1; // List of locations
}

message GetAddressV2ByIdsRequest {
  optional uint64 provinceId = 1;
  optional uint64 wardId = 2;
}

message AddressV2Info {
  optional uint64 provinceId = 1;
  optional string provinceName = 2;
  optional string provinceCode = 3;
  optional string provinceType = 4;
  optional uint64 wardId = 5;
  optional string wardName = 6;
  optional string wardCode = 7;
  optional string wardType = 8;
  optional string fullAddress = 9;
}

message GetAddressV2ByIdsResponse {
  AddressV2Info data = 1;
}

message InferAddressFromTextRequest {
  string text = 1; // Raw address text to analyze
}

message InferAddressFromTextResponse {
  repeated AddressV2Info data = 1; // List of inferred address candidates
}

message ProductStatsViewRequest {
  uint64 product_id = 1;
  int64  from_time  = 2;
}

message ProductStatsViewResponse {
  uint64 view_count     = 1;
  uint64 total_duration = 2;
  int64  max_event_time = 3;
}

// ========== Service Definition ==========

service HubInternalService {
  rpc HealthCheck (sharepb.Empty) returns (sharepb.SubmitResponse) {
    option (google.api.http) = {
      get: "/v2/hub/health"
    };
  };

  // Get Product View Stats - Internal RPC for other services
  rpc GetProductViewStats(ProductStatsViewRequest)returns (ProductStatsViewResponse);

  // Get Locations by IDs - Internal RPC for other services
  rpc GetLocationsByIds (GetLocationsByIdsRequest) returns (GetLocationsByIdsResponse);

  // Get Address V2 by Province and Ward IDs - Returns full address information
  rpc GetAddressV2ByIds (GetAddressV2ByIdsRequest) returns (GetAddressV2ByIdsResponse);

  // Infer address information (province, ward, etc.) from free text input
  rpc InferAddressFromText (sharepb.RequestV3Proto) returns (sharepb.AddressV3Proto);
}

