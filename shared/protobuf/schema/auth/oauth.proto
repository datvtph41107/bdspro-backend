syntax = "proto3";

package authpb;
import "shared/common.proto";
import "google/api/annotations.proto";

option go_package = "pb/types/auth;authpb";

service OAuthService {
    // OAuth Provider Login
    rpc GetLoginURL(GetLoginURLRequest) returns (GetLoginURLResponse) {
        option (google.api.http) = {
            get: "/v2/auth/oauth/{provider}/login"
        };
    }

    // OAuth Callback
    rpc HandleCallback(HandleCallbackRequest) returns (HandleCallbackResponse) {
        option (google.api.http) = {
            get: "/v2/auth/oauth/{provider}/callback"
        };
    }
}

message GetLoginURLRequest {
    string provider = 1; // google, facebook, zalo
}

message GetLoginURLResponse {
    string url = 1;
    string state = 2;
}

message HandleCallbackRequest {
    string provider = 1; // google, facebook, zalo
    string code = 2;
    string state = 3;
    string platform = 4;
}

message HandleCallbackResponse {
    uint64 authId = 1;
    uint64 profileId = 2;
    string accessToken = 3;
    string refreshToken = 4;
    string fullName = 5;
    string avatar = 6;
    string email = 7;
    string phone = 8;
    string provider = 9;
}
