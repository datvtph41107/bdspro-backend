syntax = "proto3";

package sharepb;
option go_package = "pb/types/shared;sharepb";

import "google/protobuf/timestamp.proto";

message ArchivedRequest {
  uint64 id = 1;
  bool archived = 2;
}

message FriendListRequest {
  int32 page = 1;
    int32 size = 2;
    string text = 3;
    optional uint64 organizationId = 4;
    optional uint64 dealId = 5;
    optional uint64 groupId = 6;
}

message IdRequest {
  uint64 id = 1;
  uint32 page = 2;
  uint32 size = 3;
  string sort = 4;
  string text = 5;
  repeated uint64 ids = 6;
}

message IdDTO {
  uint64 id = 1;
}

message Empty {}

message SubmitResponse {
  uint64 id = 1;
  string message = 2;
  repeated uint64 ids = 3;
}

message FriendItem {
	uint64 id = 1;
	uint64 receiverId = 2;
	optional uint64 createdBy = 3;
	uint32 status = 4;
}

message ProfileItem {
	uint64 id = 1;
	string fullName = 2;
	string avatar = 3;
  bool tickVerified = 4;
  string phone = 5;
  bool isMember = 6;
  string joinedAt = 7;
}

message GetProfileByIdsRequest {
  repeated uint64 ids = 1;
}

message GetProfileByIdsResponse {
  repeated ProfileItem profiles = 1;
}

message NotificationRequest {
  string link = 1;
  string message = 2;
  string title = 3;
  int32 type = 4;
  uint64 targetId = 5;
  int32 targetType = 6;
  google.protobuf.Timestamp visibleAt = 7;
  bool sendToDevice = 8;
  repeated string attachData = 9;
  bool isMerge = 10;
  uint64 ownerId = 11;
}

message SetCookie {
  string name = 1;
  string value = 2;
  string path = 3;
  string domain = 4;
  bool http_only = 5;
  bool secure = 6;
  int64 max_age = 7;
}

message CommonResponse {
  int32 code = 1;
  string message = 2;
  repeated SetCookie cookies = 3;
  string redirect_url = 4;
  bytes data = 5;
}

enum OwnerOf {
  unknown = 0;
  user = 10;
  group = 20;
  organization = 30;
}


message GetStatsRequest {
  string firstDate = 1;
  string secondDate = 2;
}

message GetStatsResponse {
  string firstDate = 1;
  string secondDate = 2;
  uint32 firstDateCount = 3;
  uint32 secondDateCount = 4;
}