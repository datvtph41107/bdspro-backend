syntax = "proto3";

package organizationpb;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "shared/common.proto";
import "organization/color.proto";
import "organization/organization_role.proto";

option go_package = "pb/types/organization;organizationpb";

service DealInvitationService {
  rpc SendInvitation(SendInvitationRequest) returns (SendInvitationResponse) {
    option (google.api.http) = {
      post: "/v2/org/deal-invitation"
      body: "*"
    };
  }

  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse) {
    option (google.api.http) = {
      post: "/v2/org/deal-invitation/accept"
      body: "*"
    };
  }

  rpc RejectInvitation(RejectInvitationRequest) returns (RejectInvitationResponse) {
    option (google.api.http) = {
      post: "/v2/org/deal-invitation/reject"
      body: "*"
    };
  }

  rpc ResendInvitation(ResendInvitationRequest) returns (ResendInvitationResponse) {
    option (google.api.http) = {
      post: "/v2/org/deal-invitation/resend"
      body: "*"
    };
  }

  rpc GetAcceptedMembers(GetAcceptedMembersRequest) returns (GetAcceptedMembersResponse) {
    option (google.api.http) = {
      get: "/v2/org/deal-invitation/{dealId}/accepted-members"
    };
  }

  rpc WithdrawFromDeal(WithdrawFromDealRequest) returns (WithdrawFromDealResponse) {
    option (google.api.http) = {
      post: "/v2/org/deal-invitation/withdraw"
      body: "*"
    };
  }

  rpc RemoveFromDeal(RemoveFromDealRequest) returns (RemoveFromDealResponse) {
    option (google.api.http) = {
      post: "/v2/org/deal-invitation/remove"
      body: "*"
    };
  }

  rpc ConfirmWithdrawal(ConfirmWithdrawalRequest) returns (ConfirmWithdrawalResponse) {
    option (google.api.http) = {
      post: "/v2/org/deal-invitation/confirm-withdrawal"
      body: "*"
    };
  }

  rpc SearchMembers(SearchMembersRequest) returns (SearchMembersResponse) {
    option (google.api.http) = {
      get: "/v2/org/deal-invitation/{dealId}/search-members"
    };
  }

  rpc GetInvitation(GetInvitationRequest) returns (GetInvitationResponse) {
    option (google.api.http) = {
      get: "/v2/org/deal-invitation/{id}"
    };
  }

  rpc GetPendingInvitations(GetPendingInvitationsRequest) returns (GetPendingInvitationsResponse) {
    option (google.api.http) = {
      get: "/v2/org/deal-invitation/pending"
    };
  }

  rpc GetInvitationsByDeal(GetInvitationsByDealRequest) returns (GetInvitationsByDealResponse) {
    option (google.api.http) = {
      get: "/v2/org/deal-invitation/list/{dealId}"
    };
  }
}

message SendInvitationRequest {
  uint64 dealId = 1;
  uint64 inviterId = 2;
  uint64 inviteeId = 3;
  string message = 4;
  uint64 roleId = 5;
  optional uint32 colorId = 6;
}

message SendInvitationResponse {
  uint64 invitationId = 1;
  bool success = 2;
  string message = 3;
  uint64 roleId = 4;
}

message AcceptInvitationRequest {
  uint64 invitationId = 1;
}

message AcceptInvitationResponse {
  uint64 invitationId = 1;
  bool success = 2;
}

message RejectInvitationRequest {
  uint64 invitationId = 1;
  string reason = 2;
}

message RejectInvitationResponse {
  uint64 invitationId = 1;
  bool success = 2;
}

message ResendInvitationRequest {
  uint64 invitationId = 1;
}

message ResendInvitationResponse {
  uint64 invitationId = 1;
  bool success = 2;
  string message = 3;
}

message GetAcceptedMembersRequest {
  uint64 dealId = 1;
}

message GetAcceptedMembersResponse {
  repeated DealInvitationMember members = 1;
}

message WithdrawFromDealRequest {
  uint64 invitationId = 1;
  string reason = 2;
}

message WithdrawFromDealResponse {
  uint64 invitationId = 1;
  bool success = 2;
}

message RemoveFromDealRequest {
  uint64 invitationId = 1;
  string reason = 2;
}

message RemoveFromDealResponse {
  uint64 invitationId = 1;
  bool success = 2;
}

message ConfirmWithdrawalRequest {
  uint64 invitationId = 1;
}

message ConfirmWithdrawalResponse {
  uint64 invitationId = 1;
  bool success = 2;
}

message SearchMembersRequest {
  uint64 dealId = 1;
  string keyword = 2;
  int32 page = 3;
  int32 size = 4;
}

message SearchMembersResponse {
  repeated DealInvitationMember members = 1;
  int64 total = 2;
}

message GetInvitationRequest {
  uint64 id = 1;
}

message GetInvitationResponse {
  DealInvitation invitation = 1;
}

message GetPendingInvitationsRequest {
  uint64 inviteeId = 1;
  int32 page = 2;
  int32 size = 3;
}

message GetPendingInvitationsResponse {
  repeated DealInvitation data = 1;
  int64 total = 2;
}

message GetInvitationsByDealRequest {
  uint64 dealId = 1;
  int32 page = 2;
  int32 size = 3;
}

message GetInvitationsByDealResponse {
  repeated DealInvitation data = 1;
  int64 total = 2;
}

message DealInvitation {
  uint64 id = 1;
  uint64 dealId = 2;
  uint64 inviterId = 3;
  uint64 inviteeId = 4;
  uint32 status = 5;
  string message = 6;
  optional organizationpb.Role role = 7;
  string reason = 8;
  string createdAt = 9;
  string updatedAt = 10;
  optional sharepb.ProfileItem profile = 11;
  optional Color color = 12;
}

message DealInvitationMember {
  uint64 userId = 1;
  string name = 2;
  string email = 3;
  uint64 roleId = 4;
  string joinedAt = 5;
  uint32 status = 6;
} 