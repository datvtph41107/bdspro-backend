syntax = "proto3";

package organizationpb;

import "google/api/annotations.proto";

option go_package = "pb/types/organization;organizationpb";

service GroupNotificationService {
    rpc GetGroupNotifications(GetGroupNotificationsRequest) returns (GetGroupNotificationsResponse) {
        option (google.api.http) = {
            get: "/v2/org/group-notification"
        };
    }
}

message GetGroupNotificationsRequest {
    uint32 groupId = 1;
    optional uint32 page = 2;
    optional uint32 size = 3;
}

message GetGroupNotificationsResponse {
    repeated GroupNotification notifications = 1;
    uint32 total = 2;
}

message GroupNotification {
    uint32 id = 1;
    uint32 groupId = 2;
    string type = 3;
    string content = 4; 
    string createdAt = 5;
    string updatedAt = 6;
}