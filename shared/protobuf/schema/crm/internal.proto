syntax = "proto3";

package crmpb;

option go_package = "pb/types/crm;crmpb";

import "shared/common.proto";
import "shared/v3.proto";

service CrmInternalService {
    rpc FriendStatusByProfileIds(FriendStatusByProfileIdsRequest) returns (FriendStatusByProfileIdsResponse);
    rpc GetFriendInfoByProfileId(sharepb.IdRequest) returns (sharepb.ContactInfoV3Proto);

    rpc RegisterEntity(FeedbackRegistry) returns (sharepb.SubmitResponse);
    rpc GetRateStats(sharepb.IdRequest) returns (sharepb.RateStatsV3Proto);
}

message FriendStatusByProfileIdsRequest {
    repeated uint64 profileIds = 1;
    uint64 currentProfileId = 2;
}

message FriendStatusByProfileIdsResponse {
    repeated sharepb.FriendItem friendStatus = 1;
}

// Internal Messages
message FeedbackRegistry {
    uint32 registry_key = 1;
    string registry_name = 2;
    int32 port = 3;
    string service = 4;
  }
  