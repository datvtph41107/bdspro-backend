syntax = "proto3";

package crmpb;
option go_package = "pb/types/crm;crmpb";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/wrappers.proto";

message SeoDocumentRequest {
  string module = 1;
  string slug = 2;
}

message RenderedSeoPageRequest {
  string path = 1;
}

message ContentQueryRequest {
  int32 page = 1;
  int32 size = 2;
  string search = 3;
  string q = 4;
  string query = 5;
  string keyword = 6;
  repeated string kinds = 7;
  string domain = 8;
  string domain_code = 9;
  string category = 10;
  string category_code = 11;
  int32 visible_on = 12;
  int32 limit = 13;
  string cursor = 14;
  string sort_by = 15;
  string sort_order = 16;
}

message ContentFeedRequest {
  string feed = 1;
  int32 page = 2;
  int32 size = 3;
  int32 limit = 4;
  string cursor = 5;
  string domain = 6;
  string category = 7;
}

message PlanningNewsQueryRequest {
  int32 page = 1;
  int32 size = 2;
  string search = 3;
  string keyword = 4;
  string q = 5;
  optional uint32 visible_on = 6;
  // deprecated: không dùng để lọc; dùng categoryId
  string category = 7 [deprecated = true];
  string topic = 8;
  string domain = 9;
  string location = 10;
  string range = 11;
  string sort_by = 12;
  string sort_order = 13;
  // Danh sách visible_on cách nhau bởi dấu phẩy, ví dụ: "10,20"
  string visibleOns = 14;
  // Filter theo primary seo_category.id (thay cho categoryCode)
  uint64 categoryId = 15;
  // Sort dạng gộp, ví dụ: updated_desc | published_desc | updated_asc | published_asc
  string sort = 16;
  // Lọc theo seo_domain.ref_type (100/200/300/400/500/600/700/800)
  uint32 refType = 17;
  // Lọc theo seo_domain.province_id (province_v2.id)
  uint64 provinceId = 18;
}

message PlanningNewsSlugRequest {
  string slug = 1;
}

message SavedPlanningNewsQueryRequest {
  int32 page = 1;
  int32 size = 2;
}

message PlanningNewsSaveRequest {
  uint64 id = 1;
}

message FollowedSeoCategoryQueryRequest {
  int32 page = 1;
  int32 size = 2;
}

message SeoCategoryFollowRequest {
  uint64 id = 1;
}

message UpdatePlanningNewsVisibilityRequest {
  uint64 id = 1;
  uint32 visible_on = 2;}

message AssignPlanningNewsCategoryRequest {
  uint64 id = 1;
  uint64 categoryId = 2;
}

message SetPlanningNewsTopRequest {
  uint64 id = 1;
}

message CreateSeoCategoryRequest {
  uint64 domainId = 1;
  string domain = 2;
  string code = 3;
  string slug = 4;
  string name = 5;
  string description = 6;
  string status = 7;
  int32 sortOrder = 8;
}

message UpdateSeoCategoryRequest {
  uint64 id = 1;
  optional uint64 domainId = 2;
  optional string domain = 3;
  optional string code = 4;
  optional string slug = 5;
  optional string name = 6;
  optional string description = 7;
  optional string status = 8;
  optional int32 sortOrder = 9;
}

message DeleteSeoCategoryRequest {
  uint64 id = 1;
}

message TrackSeoClickRequest {
  uint64 refId = 1;
  uint32 refType = 2;
}

// Canonical CRM public content and SEO contract. Gateway registers generated HTTP handlers; CRM exposes gRPC only.
service CRMPublicContentService {
  rpc GetPublicSeoDocument(SeoDocumentRequest) returns (google.protobuf.BytesValue) {
    option (google.api.http) = {
      get: "/v2/crm/public/seo/documents/{module}/{slug=**}"
      additional_bindings {
        custom {
          kind: "HEAD"
          path: "/v2/crm/public/seo/documents/{module}/{slug=**}"
        }
      }
    };
  }
  rpc GetGovernanceSeoDocument(SeoDocumentRequest) returns (google.protobuf.BytesValue) {
    option (google.api.http) = {
      get: "/v2/crm/admin/seo-governance/documents/{module}/{slug=**}"
      additional_bindings {
        custom {
          kind: "HEAD"
          path: "/v2/crm/admin/seo-governance/documents/{module}/{slug=**}"
        }
      }
    };
  }
  rpc GetOperatingSystemManifest(google.protobuf.Empty) returns (google.protobuf.BytesValue) {
    option (google.api.http) = {
      get: "/v2/crm/admin/seo-governance/operating-system/v2u"
      additional_bindings {
        custom {
          kind: "HEAD"
          path: "/v2/crm/admin/seo-governance/operating-system/v2u"
        }
      }
    };
  }
  rpc GetRenderedSeoPage(RenderedSeoPageRequest) returns (google.protobuf.BytesValue) {
    option (google.api.http) = {
      get: "/v2/crm/public/content/page/{path=**}"
      additional_bindings {
        custom {
          kind: "HEAD"
          path: "/v2/crm/public/content/page/{path=**}"
        }
      }
    };
  }
  rpc GetSitemap(google.protobuf.Empty) returns (google.protobuf.BytesValue) {
    option (google.api.http) = {
      get: "/v2/crm/public/content/sitemap.xml"
      additional_bindings {
        custom {
          kind: "HEAD"
          path: "/v2/crm/public/content/sitemap.xml"
        }
      }
      additional_bindings {
        get: "/v2/crm/sitemap.xml"
      }
      additional_bindings {
        custom {
          kind: "HEAD"
          path: "/v2/crm/sitemap.xml"
        }
      }
    };
  }
  rpc ListContentDomains(ContentQueryRequest) returns (google.protobuf.BytesValue) {
    option (google.api.http) = {
      get: "/v2/crm/public/content/domains"
    };
  }
  rpc ListContentCategories(ContentQueryRequest) returns (google.protobuf.BytesValue) {
    option (google.api.http) = {
      get: "/v2/crm/public/content/categories"
    };
  }
  rpc ListContentFeed(ContentFeedRequest) returns (google.protobuf.BytesValue) {
    option (google.api.http) = {
      get: "/v2/crm/public/content/feeds/{feed}"
    };
  }
  rpc SearchContent(ContentQueryRequest) returns (google.protobuf.BytesValue) {
    option (google.api.http) = {
      get: "/v2/crm/public/content/search"
    };
  }
  rpc ListPlanningNews(PlanningNewsQueryRequest) returns (google.protobuf.BytesValue) {
    option (google.api.http) = {
      get: "/v2/crm/public/seo/news"
    };
  }
  rpc GetPlanningNews(PlanningNewsSlugRequest) returns (google.protobuf.BytesValue) {
    option (google.api.http) = {
      get: "/v2/crm/public/seo/news/{slug}"
    };
  }
  rpc ListSavedPlanningNews(SavedPlanningNewsQueryRequest) returns (google.protobuf.BytesValue) {
    option (google.api.http) = {
      get: "/v2/crm/client/content/planning-news/saved"
    };
  }
  rpc SavePlanningNews(PlanningNewsSaveRequest) returns (google.protobuf.BytesValue) {
    option (google.api.http) = {
      post: "/v2/crm/client/content/planning-news/{id}/saved"
    };
  }
  rpc UnsavePlanningNews(PlanningNewsSaveRequest) returns (google.protobuf.BytesValue) {
    option (google.api.http) = {
      delete: "/v2/crm/client/content/planning-news/{id}/saved"
    };
  }
  rpc ListFollowedSeoCategories(FollowedSeoCategoryQueryRequest) returns (google.protobuf.BytesValue) {
    option (google.api.http) = {
      get: "/v2/crm/client/content/categories/followed"
    };
  }
  rpc FollowSeoCategory(SeoCategoryFollowRequest) returns (google.protobuf.BytesValue) {
    option (google.api.http) = {
      post: "/v2/crm/client/content/categories/{id}/followed"
    };
  }
  rpc UnfollowSeoCategory(SeoCategoryFollowRequest) returns (google.protobuf.BytesValue) {
    option (google.api.http) = {
      delete: "/v2/crm/client/content/categories/{id}/followed"
    };
  }
  rpc UpdatePlanningNewsVisibility(UpdatePlanningNewsVisibilityRequest) returns (google.protobuf.BytesValue) {
    option (google.api.http) = {
      patch: "/v2/crm/admin/content/planning-news/{id}/visibility"
      body: "*"
    };
  }
  rpc AssignPlanningNewsCategory(AssignPlanningNewsCategoryRequest) returns (google.protobuf.BytesValue) {
    option (google.api.http) = {
      put: "/v2/crm/admin/content/planning-news/{id}/category"
      body: "*"
    };
  }
  rpc SetPlanningNewsTop(SetPlanningNewsTopRequest) returns (google.protobuf.BytesValue) {
    option (google.api.http) = {
      post: "/v2/crm/admin/content/planning-news/{id}/set-top"
      body: "*"
    };
  }
  rpc CreateSeoCategory(CreateSeoCategoryRequest) returns (google.protobuf.BytesValue) {
    option (google.api.http) = {
      post: "/v2/crm/admin/content/categories"
      body: "*"
    };
  }
  rpc UpdateSeoCategory(UpdateSeoCategoryRequest) returns (google.protobuf.BytesValue) {
    option (google.api.http) = {
      put: "/v2/crm/admin/content/categories/{id}"
      body: "*"
    };
  }
  rpc DeleteSeoCategory(DeleteSeoCategoryRequest) returns (google.protobuf.BytesValue) {
    option (google.api.http) = {
      delete: "/v2/crm/admin/content/categories/{id}"
    };
  }
  rpc ProvisionAdministrativeUnit(google.protobuf.Struct) returns (google.protobuf.BytesValue) {
    option (google.api.http) = {
      post: "/v2/crm/admin/seo-governance/administrative-units/provision"
      body: "*"
    };
  }
  rpc IngestRuntimeEvent(google.protobuf.Struct) returns (google.protobuf.BytesValue) {
    option (google.api.http) = {
      post: "/v2/crm/internal/seo/measurement/events"
      body: "*"
    };
  }
  rpc TrackSeoClick(TrackSeoClickRequest) returns (google.protobuf.BytesValue) {
    option (google.api.http) = {
      post: "/v2/crm/public/seo/click"
      body: "*"
    };
  }
}
