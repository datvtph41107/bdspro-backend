syntax = "proto3";

package crmpb;

option go_package = "pb/types/crm;crmpb";

import "google/api/annotations.proto";

service SeoStrategyService {
  rpc CreateSeoObjective(CreateSeoObjectiveRequest)
      returns (SeoObjectiveResponse) {
    option (google.api.http) = {
      post: "/v2/crm/admin/seo/strategy/objectives"
      body: "*"
    };
  }

  rpc GetSeoObjective(GetSeoObjectiveRequest)
      returns (SeoObjectiveResponse) {
    option (google.api.http) = {
      get: "/v2/crm/admin/seo/strategy/objectives/{id}"
    };
  }

  rpc GetSeoObjectiveList(GetSeoObjectiveListRequest)
      returns (GetSeoObjectiveListResponse) {
    option (google.api.http) = {
      get: "/v2/crm/admin/seo/strategy/objectives"
    };
  }

  rpc UpdateSeoObjectiveDefinition(
      UpdateSeoObjectiveDefinitionRequest)
      returns (SeoObjectiveResponse) {
    option (google.api.http) = {
      put: "/v2/crm/admin/seo/strategy/objectives/{id}"
      body: "*"
    };
  }

  rpc AddSeoObjectiveEvidence(
      AddSeoObjectiveEvidenceRequest)
      returns (SeoObjectiveResponse) {
    option (google.api.http) = {
      post: "/v2/crm/admin/seo/strategy/objectives/{objectiveId}/evidence"
      body: "*"
    };
  }

  rpc UpsertSeoObjectiveMetric(
      UpsertSeoObjectiveMetricRequest)
      returns (SeoObjectiveResponse) {
    option (google.api.http) = {
      put: "/v2/crm/admin/seo/strategy/objectives/{objectiveId}/metrics/{metricCode}"
      body: "*"
    };
  }

  rpc EvaluateSeoObjectiveReadiness(
      GetSeoObjectiveRequest)
      returns (SeoObjectiveReadinessResponse) {
    option (google.api.http) = {
      get: "/v2/crm/admin/seo/strategy/objectives/{id}/readiness"
    };
  }

  rpc ActivateSeoObjective(
      SeoObjectiveCommandRequest)
      returns (SeoObjectiveResponse) {
    option (google.api.http) = {
      post: "/v2/crm/admin/seo/strategy/objectives/{id}/activate"
      body: "*"
    };
  }

  rpc PauseSeoObjective(
      SeoObjectiveCommandRequest)
      returns (SeoObjectiveResponse) {
    option (google.api.http) = {
      post: "/v2/crm/admin/seo/strategy/objectives/{id}/pause"
      body: "*"
    };
  }

  rpc ArchiveSeoObjective(
      SeoObjectiveCommandRequest)
      returns (SeoObjectiveResponse) {
    option (google.api.http) = {
      post: "/v2/crm/admin/seo/strategy/objectives/{id}/archive"
      body: "*"
    };
  }

  // AUDIENCE RPCS
  rpc CreateSeoAudienceSegment(CreateSeoAudienceSegmentRequest) returns (SeoAudienceSegmentResponse) {
    option (google.api.http) = { 
      post: "/v2/crm/admin/seo/strategy/audiences" body: "*" 
    };
  }
  rpc GetSeoAudienceSegment(GetSeoAudienceSegmentRequest) returns (SeoAudienceSegmentResponse) {
    option (google.api.http) = {
       get: "/v2/crm/admin/seo/strategy/audiences/{id}" };
  }
  rpc GetSeoAudienceSegmentList(GetSeoAudienceSegmentListRequest) returns (GetSeoAudienceSegmentListResponse) {
    option (google.api.http) = {
       get: "/v2/crm/admin/seo/strategy/audiences" };
  }
  rpc UpdateSeoAudienceSegment(UpdateSeoAudienceSegmentRequest) returns (SeoAudienceSegmentResponse) {
    option (google.api.http) = {
       put: "/v2/crm/admin/seo/strategy/audiences/{id}" body: "*" };
  }
  rpc ActivateSeoAudienceSegment(SeoAudienceCommandRequest) returns (SeoAudienceSegmentResponse) {
    option (google.api.http) = {
       post: "/v2/crm/admin/seo/strategy/audiences/{id}/activate" body: "*" };
  }
  rpc PauseSeoAudienceSegment(SeoAudienceCommandRequest) returns (SeoAudienceSegmentResponse) {
    option (google.api.http) = {
       post: "/v2/crm/admin/seo/strategy/audiences/{id}/pause" body: "*" };
  }
  rpc ArchiveSeoAudienceSegment(SeoAudienceCommandRequest) returns (SeoAudienceSegmentResponse) {
    option (google.api.http) = {
       post: "/v2/crm/admin/seo/strategy/audiences/{id}/archive" body: "*" };
  }

  // USER NEED RPCS
  rpc CreateSeoUserNeed(CreateSeoUserNeedRequest) returns (SeoUserNeedResponse) {
    option (google.api.http) = {
       post: "/v2/crm/admin/seo/strategy/user-needs" body: "*" };
  }
  rpc GetSeoUserNeed(GetSeoUserNeedRequest) returns (SeoUserNeedResponse) {
    option (google.api.http) = {
       get: "/v2/crm/admin/seo/strategy/user-needs/{id}" };
  }
  rpc GetSeoUserNeedList(GetSeoUserNeedListRequest) returns (GetSeoUserNeedListResponse) {
    option (google.api.http) = {
       get: "/v2/crm/admin/seo/strategy/user-needs" 
    };
  }
  rpc UpdateSeoUserNeed(UpdateSeoUserNeedRequest) returns (SeoUserNeedResponse) {
    option (google.api.http) = {
       put: "/v2/crm/admin/seo/strategy/user-needs/{id}" body: "*" 
    };
  }
  rpc LinkSeoUserNeedEvidence(LinkSeoUserNeedEvidenceRequest) returns (SeoUserNeedResponse) {
    option (google.api.http) = {
       post: "/v2/crm/admin/seo/strategy/user-needs/{userNeedId}/evidence" body: "*" 
    };
  }
  rpc UnlinkSeoUserNeedEvidence(UnlinkSeoUserNeedEvidenceRequest) returns (SeoUserNeedResponse) {
    option (google.api.http) = {
       delete: "/v2/crm/admin/seo/strategy/user-needs/{userNeedId}/evidence/{evidenceId}" 
    };
  }
  rpc EvaluateSeoUserNeedReadiness(GetSeoUserNeedRequest) returns (SeoUserNeedReadinessResponse) {
    option (google.api.http) = {
       get: "/v2/crm/admin/seo/strategy/user-needs/{id}/readiness" 
    };
  }
  rpc ActivateSeoUserNeed(SeoUserNeedCommandRequest) returns (SeoUserNeedResponse) {
    option (google.api.http) = {
       post: "/v2/crm/admin/seo/strategy/user-needs/{id}/activate" body: "*" 
    };
  }
  rpc PauseSeoUserNeed(SeoUserNeedCommandRequest) returns (SeoUserNeedResponse) {
    option (google.api.http) = {
       post: "/v2/crm/admin/seo/strategy/user-needs/{id}/pause" body: "*" 
    };
  }
  rpc ArchiveSeoUserNeed(SeoUserNeedCommandRequest) returns (SeoUserNeedResponse) {
    option (google.api.http) = {
       post: "/v2/crm/admin/seo/strategy/user-needs/{id}/archive" body: "*" 
    };
  }
}

message CreateSeoObjectiveRequest {
  string code = 1;
  string name = 2;
}

message GetSeoObjectiveRequest {
  uint64 id = 1;
}

message GetSeoObjectiveListRequest {
  string keyword = 1;
  string status = 2;
  string confidence = 3;
  uint32 page = 4;
  uint32 size = 5;
}

message GetSeoObjectiveListResponse {
  repeated SeoObjectiveSummaryResponse data = 1;
  int64 total = 2;
}

message UpdateSeoObjectiveDefinitionRequest {
  uint64 id = 1;
  uint32 expectedVersion = 2;

  string name = 3;

  string audienceSummary = 4;
  string situation = 5;
  string problemStatement = 6;

  string userOutcome = 7;
  string productOutcome = 8;
  string businessOutcome = 9;

  repeated string nonGoals = 10;
  repeated string constraints = 11;

  string confidence = 12;
  string ownerCode = 13;
  optional string reviewDueAt = 14;
}

message AddSeoObjectiveEvidenceRequest {
  uint64 objectiveId = 1;

  string evidenceType = 2;
  string stance = 3;

  string sourceSystem = 4;
  string sourceReference = 5;

  string finding = 6;
  string confidence = 7;

  optional string observedAt = 8;
  optional string validUntil = 9;

  string metadataJson = 10;
}

message UpsertSeoObjectiveMetricRequest {
  uint64 objectiveId = 1;

  string metricCode = 2;
  string metricName = 3;

  string metricLayer = 4;
  string description = 5;

  string sourceSystem = 6;
  string calculationMethod = 7;

  string unit = 8;
  string targetDirection = 9;

  optional double baselineValue = 10;
  optional double targetValue = 11;

  bool isPrimary = 12;

  string instrumentationStatus = 13;
  string status = 14;
}

message SeoObjectiveCommandRequest {
  uint64 id = 1;
  uint32 expectedVersion = 2;
  string reason = 3;
}

message SeoObjectiveSummaryResponse {
  uint64 id = 1;
  string code = 2;
  string name = 3;

  string status = 4;
  string confidence = 5;

  string ownerCode = 6;
  string userOutcome = 7;

  uint32 lockVersion = 8;

  string createdAt = 9;
  string updatedAt = 10;
}

message SeoObjectiveResponse {
  uint64 id = 1;
  string code = 2;
  string name = 3;

  string audienceSummary = 4;
  string situation = 5;
  string problemStatement = 6;

  string userOutcome = 7;
  string productOutcome = 8;
  string businessOutcome = 9;

  repeated string nonGoals = 10;
  repeated string constraints = 11;

  string status = 12;
  string confidence = 13;

  string ownerCode = 14;
  optional string reviewDueAt = 15;

  uint32 lockVersion = 16;

  repeated SeoObjectiveEvidenceResponse evidence = 17;
  repeated SeoObjectiveMetricResponse metrics = 18;

  SeoObjectiveReadinessResponse readiness = 19;

  string createdAt = 20;
  string updatedAt = 21;
}

message SeoObjectiveEvidenceResponse {
  uint64 id = 1;
  uint64 objectiveId = 2;

  string evidenceType = 3;
  string stance = 4;

  string sourceSystem = 5;
  string sourceReference = 6;

  string finding = 7;
  string confidence = 8;

  optional string observedAt = 9;
  optional string validUntil = 10;

  string status = 11;
  string metadataJson = 12;

  string createdAt = 13;
  string updatedAt = 14;
}

message SeoObjectiveMetricResponse {
  uint64 id = 1;
  uint64 objectiveId = 2;

  string metricCode = 3;
  string metricName = 4;

  string metricLayer = 5;
  string description = 6;

  string sourceSystem = 7;
  string calculationMethod = 8;

  string unit = 9;
  string targetDirection = 10;

  optional double baselineValue = 11;
  optional double targetValue = 12;

  bool isPrimary = 13;

  string instrumentationStatus = 14;
  string status = 15;

  string createdAt = 16;
  string updatedAt = 17;
}

message SeoObjectiveReadinessIssueResponse {
  string code = 1;
  string message = 2;
}

message SeoObjectiveReadinessResponse {
  bool ready = 1;
  repeated SeoObjectiveReadinessIssueResponse blockers = 2;
  repeated SeoObjectiveReadinessIssueResponse warnings = 3;
}

message CreateSeoAudienceSegmentRequest { 
  string code = 1; string name = 2;
}

message GetSeoAudienceSegmentRequest { 
  uint64 id = 1; 
}

message GetSeoAudienceSegmentListRequest {
  string keyword = 1;
  string status = 2;
  string decisionRole = 3;
  uint32 page = 4;
  uint32 size = 5;
}

message UpdateSeoAudienceSegmentRequest {
  uint64 id = 1;
  uint32 expectedVersion = 2;
  string name = 3;
  string description = 4;
  string decisionRole = 5;
  string knowledgeLevel = 6;
  string ownerCode = 7;
  optional string reviewDueAt = 8;
}

message SeoAudienceCommandRequest { 
  uint64 id = 1; 
  uint32 expectedVersion = 2; 
  string reason = 3; 
}

message SeoAudienceReadinessIssueResponse { 
  string code = 1; string message = 2; 
}

message SeoAudienceReadinessResponse {
  bool ready = 1;
  repeated SeoAudienceReadinessIssueResponse blockers = 2;
  repeated SeoAudienceReadinessIssueResponse warnings = 3;
}

message SeoAudienceSegmentSummaryResponse {
  uint64 id = 1;
  string code = 2;
  string name = 3;
  string decisionRole = 4;
  string knowledgeLevel = 5;
  string status = 6;
  string ownerCode = 7;
  uint32 lockVersion = 8;
  string createdAt = 9;
  string updatedAt = 10;
}

message SeoAudienceSegmentResponse {
  uint64 id = 1;
  string code = 2;
  string name = 3;
  string description = 4;
  string decisionRole = 5;
  string knowledgeLevel = 6;
  string status = 7;
  string ownerCode = 8;
  optional string reviewDueAt = 9;
  uint32 lockVersion = 10;
  SeoAudienceReadinessResponse readiness = 11;
  string createdAt = 12;
  string updatedAt = 13;
}
message GetSeoAudienceSegmentListResponse {
  repeated SeoAudienceSegmentSummaryResponse data = 1;
  int64 total = 2;
}

message CreateSeoUserNeedRequest {
  uint64 objectiveId = 1;
  uint64 audienceSegmentId = 2;
  string code = 3;
  string name = 4;
}

message GetSeoUserNeedRequest { 
  uint64 id = 1; 
}

message GetSeoUserNeedListRequest {
  uint64 objectiveId = 1;
  uint64 audienceId = 2;
  string keyword = 3;
  string status = 4;
  string confidence = 5;
  string priority = 6;
  uint32 page = 7;
  uint32 size = 8;
}
message UpdateSeoUserNeedRequest {
  uint64 id = 1;
  uint32 expectedVersion = 2;
  string name = 3;
  string decisionStage = 4;
  string situation = 5;
  string triggerStatement = 6;
  string jobToBeDone = 7;
  string barrierStatement = 8;
  string currentAlternative = 9;
  string desiredOutcome = 10;
  string failureImpact = 11;
  string riskLevel = 12;
  string priority = 13;
  string confidence = 14;
  string ownerCode = 15;
  optional string reviewDueAt = 16;
}
message LinkSeoUserNeedEvidenceRequest {
  uint64 userNeedId = 1;
  uint64 evidenceId = 2;
  string relationType = 3;
  string relevanceNote = 4;
}
message UnlinkSeoUserNeedEvidenceRequest { 
  uint64 userNeedId = 1; 
  uint64 evidenceId = 2; 
}

message SeoUserNeedCommandRequest { 
  uint64 id = 1; 
  uint32 expectedVersion = 2; 
  string reason = 3; 
}

message SeoUserNeedReadinessIssueResponse {
  string code = 1; string message = 2; 
}

message SeoUserNeedReadinessResponse {
  bool ready = 1;
  repeated SeoUserNeedReadinessIssueResponse blockers = 2;
  repeated SeoUserNeedReadinessIssueResponse warnings = 3;
}
message SeoUserNeedLinkedEvidenceResponse {
  uint64 evidenceId = 1;
  string relationType = 2;
  string relevanceNote = 3;
  string evidenceType = 4;
  string stance = 5;
  string sourceSystem = 6;
  string sourceReference = 7;
  string finding = 8;
  string confidence = 9;
  string status = 10;
  optional string observedAt = 11;
  optional string validUntil = 12;
  string createdAt = 13;
}

message SeoUserNeedSummaryResponse {
  uint64 id = 1;
  uint64 objectiveId = 2;
  uint64 audienceSegmentId = 3;
  string code = 4;
  string name = 5;
  string decisionStage = 6;
  string riskLevel = 7;
  string priority = 8;
  string status = 9;
  string confidence = 10;
  string ownerCode = 11;
  uint32 lockVersion = 12;
  string createdAt = 13;
  string updatedAt = 14;
}

message SeoUserNeedResponse {
  uint64 id = 1;
  uint64 objectiveId = 2;
  uint64 audienceSegmentId = 3;
  string code = 4;
  string name = 5;
  string decisionStage = 6;
  string situation = 7;
  string triggerStatement = 8;
  string jobToBeDone = 9;
  string barrierStatement = 10;
  string currentAlternative = 11;
  string desiredOutcome = 12;
  string failureImpact = 13;
  string riskLevel = 14;
  string priority = 15;
  string status = 16;
  string confidence = 17;
  string ownerCode = 18;
  optional string reviewDueAt = 19;
  uint32 lockVersion = 20;
  SeoObjectiveSummaryResponse objective = 21;
  SeoAudienceSegmentSummaryResponse audience = 22;
  repeated SeoUserNeedLinkedEvidenceResponse evidence = 23;
  SeoUserNeedReadinessResponse readiness = 24;
  string createdAt = 25;
  string updatedAt = 26;
}

message GetSeoUserNeedListResponse {
  repeated SeoUserNeedSummaryResponse data = 1;
  int64 total = 2;
}
