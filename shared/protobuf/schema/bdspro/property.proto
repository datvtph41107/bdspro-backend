syntax = "proto3";

package bdspropb;
option go_package = "pb/types/bdspro;bdspropb";
import "google/protobuf/timestamp.proto";
import "bdspro/common.proto";
import "bdspro/asset.proto";
import "bdspro/product.proto";
import "google/api/annotations.proto";
import "shared/common.proto";
import "shared/v3.proto";
import "bdspro/post.proto";

service PropertyService {
  rpc GetList(PropertySearchRequest) returns (PropertyListResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/property/list"
    };
  };
  
  rpc GetDetail(PropertyDetailRequest) returns (PropertyResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/property/detail/{id}"
    };
  };
  
  rpc GetAssets(PropertyAssetsRequest) returns (PropertyAssetsResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/property/{id}/assets"
    };
  };
  
  rpc GetProducts(PropertyProductsRequest) returns (PropertyProductsResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/property/{id}/products"
    };
  };
  
  rpc GetRelation(PropertyRelationRequest) returns (PropertyRelationResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/property/{id}/relation"
    };
  };
  
  rpc CreateProperty (CreatePropertyRequest) returns (Response) {
    option (google.api.http) = {
      post: "/v2/bdspro/property/new"
      body: "*"
    };
  };
  
  rpc UpdateProperty (UpdatePropertyRequest) returns (Response) {
    option (google.api.http) = {
      put: "/v2/bdspro/v2/property/{id}"
      body: "*"
    };
  };
}

message PropertySearchRequest {
  uint32 page = 1;
  uint32 size = 2;
  string sort = 3;
  string text = 4;
  optional uint64 propertyTypeId = 5;
  optional uint64 locationId = 6;
  optional uint64 projectId = 7;
  optional string recordStatus = 8;
}

message PropertyDetailRequest {
  uint64 id = 1;
}

message PropertyAssetsRequest {
  uint64 id = 1;
  uint32 page = 2;
  uint32 size = 3;
}

message PropertyProductsRequest {
  uint64 id = 1;
  uint32 page = 2;
  uint32 size = 3;
}

message PropertyListResponse {
  repeated PropertyResponse data = 1;
  int64 total = 2;
}

message PropertyResponse {
  uint64 id = 1;
  optional uint64 propertyTypeId = 2;
  string title = 3;
  optional uint64 locationId = 4;
  string addressText = 5;
  optional double latitude = 6;
  optional double longitude = 7;
  string mapUrl = 8;
  optional uint64 projectId = 9;
  string buildingBlock = 10;
  string level = 11;
  string unitCode = 12;
  optional double areaTotal = 13;
  optional double areaLand = 14;
  optional double areaResidential = 15;
  uint32 legalStatus = 16;
  string legalNote = 17;
  optional bool hasBuilding = 18;
  uint32 recordStatus = 19;
  string createdAt = 20;
  string updatedAt = 21;
  optional uint32 productCount = 22;
  optional uint32 assetCount = 23;
  optional uint32 postCount = 24;
  string legalStatusName = 25;
  string recordStatusName = 26;
  optional sharepb.AddressV3Proto address = 27;
  optional string projectName = 28;
  optional PropertyBuildingInfo buildingInfo = 29;
  string propertyTypeName = 30;
  optional PropertyMediaItem avatar = 31;
  repeated bdspropb.MediaItem mediaList = 32;
  optional sharepb.TagItem project = 33;
  optional sharepb.TagItem propertyType = 34;
  optional PropertyLandInfo landInfo = 35;
  repeated sharepb.TagItem amenities = 36;
}

message PropertyAssetsResponse {
  repeated Asset data = 1;
  int64 total = 2;
}

message PropertyProductsResponse {
  repeated ProductResponse data = 1;
  int64 total = 2;
}

message PropertyRelationRequest {
  uint64 id = 1;
}

message PropertyRelation {
  uint64 id = 1;
  uint64 propertyId = 2;
  uint64 relationId = 3;
  uint64 relationType = 4;
  optional Asset asset = 5;
  optional ProductResponse product = 6;
  optional Post post = 7;
}

message PropertyRelationResponse {
  repeated PropertyRelation data = 1;
  int64 total = 2;
}

message CreatePropertyRequest {
  // Thông tin Product
  ProductSaveRequest product = 1;
  
  // Thông tin Property
  PropertyInfo property = 2;
  
  // Thông tin đất (PropertyLandInfo)
  PropertyLandInfo landInfo = 3;
  
  // Thông tin nhà/công trình (PropertyBuildingInfo)
  PropertyBuildingInfo buildingInfo = 4;
  
  // Thông tin AssetLegal (giấy tờ pháp lý)
  repeated AssetLegalItem legalInfo = 5;
  
  // Thông tin PropertyMedia
  repeated PropertyMediaItem mediaList = 6;
  
  // Tags
  repeated uint64 tagIds = 7;
  
  // Thông tin Post
  PostSaveWithProduct post = 8;
  
  // Thông tin Asset
  AssetCreateWithProduct asset = 9;
  
  // Ghi chú
  string note = 10;
}

message PropertyInfo {
  optional uint64 propertyTypeId = 1;      // Loại BĐS
  string title = 2;                        // Tiêu đề Property
  optional uint64 locationId = 3;          // ID địa điểm
  string addressText = 4;                  // Địa chỉ văn bản
  optional double latitude = 5;             // Vĩ độ (GPS)
  optional double longitude = 6;            // Kinh độ (GPS)
  string mapUrl = 7;                       // URL bản đồ
  optional uint64 projectId = 8;            // ID dự án
  string level = 9;                       // Tầng
  string unitCode = 10;                    // Mã căn hộ/đơn vị
  optional double areaTotal = 11;           // Tổng diện tích (m²)
  optional double areaLand = 12;            // Diện tích đất (m²)
  optional double areaResidential = 13;    // Diện tích ở (m²)
  uint32 legalStatus = 14;                 // Tình trạng pháp lý
  string legalNote = 15;                   // Ghi chú pháp lý
  optional bool hasBuilding = 16;           // Có nhà/công trình
  uint32 recordStatus = 17;                // Trạng thái bản ghi (active, inactive, etc.)
  optional uint64 provinceId = 18;         // ID tỉnh/thành phố
  optional uint64 wardId = 19;             // ID phường/xã
  optional sharepb.AddressV3Proto address = 20;
  optional string projectName = 21;
}

message PropertyLandInfo {
  optional double frontage = 1;            // Mặt tiền (m)
  optional double depth = 2;               // Chiều sâu (m)
  optional double roadWidth = 3;           // Độ rộng đường (m)
  string landNote = 4;                    // Ghi chú về đất
}

message AssetLegalItem {
  string documentName = 1;                 // Tên giấy tờ
  string documentUrl = 2;                  // URL giấy tờ
  string documentType = 3;                  // Loại giấy tờ
  optional int64 issuedDate = 4;            // Ngày cấp (timestamp)
  optional int64 expiryDate = 5;            // Ngày hết hạn (timestamp)
  string description = 6;                   // Mô tả
  optional uint64 relatedSplitMergeId = 7;  // ID liên quan đến chia/tách
}

message PropertyMediaItem {
  string mediaType = 1;                     // Loại media (image, video)
  string url = 2;                          // URL ảnh/video
  string thumbUrl = 3;                     // URL thumbnail
  int32 sortOrder = 4;                     // Thứ tự sắp xếp
  bool isCover = 5;                        // Ảnh bìa
}

message UpdatePropertyRequest {
  uint64 id = 1;                            // ID Property cần cập nhật
  
  // Thông tin Property cơ bản
  optional uint64 propertyTypeId = 2;        // Loại BĐS
  optional string title = 3;                 // Tiêu đề Property
  optional uint64 locationId = 4;             // ID địa điểm
  optional string addressText = 5;           // Địa chỉ văn bản
  optional double latitude = 6;             // Vĩ độ (GPS)
  optional double longitude = 7;             // Kinh độ (GPS)
  optional string mapUrl = 8;                // URL bản đồ
  optional uint64 projectId = 9;            // ID dự án
  optional string level = 10;                // Tầng
  optional string unitCode = 11;             // Mã căn hộ/đơn vị
  optional double areaTotal = 12;            // Tổng diện tích (m²)
  optional double areaLand = 13;            // Diện tích đất (m²)
  optional double areaResidential = 14;      // Diện tích ở (m²)
  optional uint32 legalStatus = 15;          // Tình trạng pháp lý
  optional string legalNote = 16;            // Ghi chú pháp lý
  optional bool hasBuilding = 17;            // Có nhà/công trình
  optional uint32 recordStatus = 18;         // Trạng thái bản ghi
  optional uint64 provinceId = 19;           // ID tỉnh/thành phố
  optional uint64 wardId = 20;               // ID phường/xã
  optional sharepb.AddressV3Proto address = 21;  // Địa chỉ chi tiết
  optional string projectName = 22;          // Tên dự án
  
  // Thông tin đất (PropertyLandInfo) - optional
  optional PropertyLandInfo landInfo = 23;
  
  // Thông tin nhà/công trình (PropertyBuildingInfo) - optional
  optional PropertyBuildingInfo buildingInfo = 24;
  repeated uint64 amenityIds = 25;
}
