syntax = "proto3";

package bdspropb;
option go_package = "pb/types/bdspro;bdspropb";
import "google/protobuf/timestamp.proto";
import "bdspro/common.proto";
import "bdspro/developer.proto";
import "bdspro/asset.proto";
import "bdspro/product.proto";
import "google/api/annotations.proto";
import "shared/common.proto";
import "shared/v3.proto";
import "bdspro/post.proto";
import "bdspro/project.proto";

service PropertyService {
  rpc CreatePropertyUser(ClonePropertyRequest) returns (Response) {
    option (google.api.http) = {
      post: "/v2/bdspro/v2/property/{propertyId}/clone"
    };
  }
  rpc GetList(PropertySearchRequest) returns (PropertyListResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/property/list/{owned}"
    };
  };

  rpc ListMe(sharepb.SyncRequest) returns (PropertyListResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/property/me"
    };
  };
  
  rpc GetDetail(sharepb.SyncRequest) returns (PropertyDetailResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/property/detail/{id}"
    };
  };

  // GetPropertyTimestamps trả về timestamp của detail và history cho FE check cache/sync.
  rpc GetPropertyTimestamps(sharepb.IdRequest) returns (PropertyTimestampsResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/property/{id}/timestamp"
    };
  };
  
  rpc GetAssets(PropertyAssetsRequest) returns (PropertyAssetsResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/property/{id}/assets"
    };
  };
  
  rpc GetProducts(PropertyProductsRequest) returns (PropertyProductsResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/property/{id}/products"
    };
  };
  
  rpc GetRelation(PropertyRelationRequest) returns (PropertyRelationResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/property/{id}/relation"
    };
  };
  
  rpc CreateProperty(CreatePropertyRequest) returns (Response) {
    option (google.api.http) = {
      post: "/v2/bdspro/property/new"
      body: "*"
    };
  };
  

  
  rpc SearchTags(TagSearchRequest) returns (TagListResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/tags/search"
    };
  }

  rpc GetPropertyAmenities(GetPropertyAmenitiesRequest)
      returns (GetPropertyAmenitiesResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/property/{propertyId}/amenities"
    };
  };

  rpc UpdateProperty(UpdatePropertyRequest) returns (Response) {
    option (google.api.http) = {
      put: "/v2/bdspro/v2/property/{id}"
      body: "*"
    };
  };

  rpc UpdatePropertyAmenities(UpdatePropertyAmenitiesRequest)
      returns (Response) {
    option (google.api.http) = {
      put: "/v2/bdspro/v2/property/{propertyId}/amenities"
      body: "*"
    };
  };

  rpc DeleteProperties(DeletePropertiesRequest) returns (Response) {
    option (google.api.http) = {
      post: "/v2/bdspro/v2/property/batch"
      body: "*"
    };
  };

  rpc ArchiveProperties(ArchivePropertiesRequest) returns (Response) {
    option (google.api.http) = {
      post: "/v2/bdspro/v2/property/archive"
      body: "*"
    };
  };

  rpc ArchiveProducts(ArchiveProductUsersRequest) returns (Response) {
    option (google.api.http) = {
      post: "/v2/bdspro/v2/product/user/archive"
      body: "*"
    };
  };
}

// PropertyTimestampsResponse: map key -> timestamp (ms) cho FE check cache
message PropertyTimestampsResponse {
  map<string, int64> timestamps = 1;
}

message ClonePropertyRequest {
  uint64 propertyId = 1;
}

message PropertySearchRequest {
  uint32 page = 1;
  uint32 size = 2;
  string sort = 3;               // "updated_at_desc", "title_asc", "priority_product", "priority_asset", "priority_listing", "identified_first", "verified_first"
  string text = 4;                // tìm kiếm

  // Filter cơ bản
  optional uint64 propertyTypeId = 5;
  optional uint64 locationId = 6;       // deprecated, dùng provinceId + districtId + wardId
  optional uint64 projectId = 7;
  optional string recordStatus = 8;     // "active", "inactive", "archived"

  // [ADDED] Các filter mới từ UI
  optional string scope = 9;             // "private", "shared", "public"
  optional bool identified = 10;         // true: đã định danh, false: chưa
  optional bool nationalVerified = 11;   // true: đã xác thực QG, false: chưa

  // [ADDED] Địa chỉ hành chính
  optional uint64 provinceId = 12;
  optional uint64 districtId = 13;
  optional uint64 wardId = 14;

  optional bool hasAsset = 15;           // Có tài sản
  optional bool hasProduct = 16;         // Có sản phẩm
  optional bool hasListing = 17;          // Có tin đăng

  optional string createdFrom = 18;      
  optional string createdTo = 19;
  optional string updatedFrom = 20;
  optional string updatedTo = 21;
  optional uint32 sourceType = 22;
  string owned = 23;
  uint64 regionID = 24;
}

message UpdatePropertyRequest {
  uint64 id = 1;                            // ID Property cần cập nhật
  
  // Thông tin Property cơ bản
  optional uint64 propertyTypeId = 2;        // Loại BĐS
  string title = 3;                 // Tiêu đề Property
  optional uint64 locationId = 4;             // ID địa điểm
  string addressDetail = 5;           // Địa chỉ văn bản
  optional double latitude = 6;             // Vĩ độ (GPS)
  optional double longitude = 7;             // Kinh độ (GPS)
  string mapUrl = 8;                // URL bản đồ
  optional uint64 projectId = 9;            // ID dự án
  string level = 10;                // Tầng
  string unitCode = 11;             // Mã căn hộ/đơn vị
  optional double areaTotal = 12;            // Tổng diện tích (m²)
  optional double areaLand = 13;            // Diện tích đất (m²)
  optional double areaResidential = 14;      // Diện tích ở (m²)
  uint32 legalStatus = 15;          // Tình trạng pháp lý
  string legalNote = 16;            // Ghi chú pháp lý
  optional uint64 buildingInfoId = 17;            // Có nhà/công trình
  uint32 recordStatus = 18;         // Trạng thái bản ghi
  optional uint64 provinceId = 19;           // ID tỉnh/thành phố
  optional uint64 wardId = 20;               // ID phường/xã
  optional sharepb.AddressV3Proto address = 21;  // Địa chỉ chi tiết
  optional string projectName = 22;          // Tên dự án
  
  // Thông tin đất (PropertyLandInfo) - optional
  optional PropertyLandInfo landInfo = 23;
  
  optional PropertyBuildingInfo buildingInfo = 24;
  repeated uint64 amenityIds = 25;

  // Các trường mới bổ sung từ UI
  optional string scope = 26;                // "private", "shared", "public"
  optional string nationalId = 27;           // Mã định danh quốc gia
  optional bool nationalIdVerified = 28;     // Đã xác thực quốc gia?
  optional uint64 districtId = 29;           // ID quận/huyện
  optional uint64 buildingId = 30;           // ID tòa nhà (nếu có)
  uint32 sourceType = 31;
}

message PropertyAmenityItem {
  uint64 id = 1;
  string name = 2;
  bool active = 3;   
  bool checked = 4; 
}

message GetPropertyAmenitiesRequest {
  uint64 propertyId = 1;
  uint32 sourceType = 2;
}

message GetPropertyAmenitiesResponse {
  repeated PropertyAmenityItem data = 1;
}

message UpdatePropertyAmenitiesRequest {
  uint64 propertyId = 1;
  repeated uint64 amenityIds = 2;
}

message DeletePropertiesRequest {
  repeated uint64 ids = 1;
}

message ArchivePropertiesRequest {
  repeated uint64 ids = 1;
  bool archived = 2;
  uint32 sourceType = 3;
}

message ArchiveProductUsersRequest {
  repeated uint64 ids = 1;
  bool archived = 2;
}

message TagResponse {
  uint64 id = 1;
  string name = 2;
  string type = 3;
  string description = 4;
  string icon = 5;
}

message TagSearchRequest {
  uint32 page = 1;
  uint32 size = 2;
  string keyword = 3;
  string type = 4;
}

message TagListResponse {
  repeated TagResponse data = 1;
  int64 total = 2;
}

message PropertyDetailRequest {
  uint64 id = 1;
  uint32 sourceType = 2;
}

// PropertyDetailResponse - chi tiết đầy đủ BĐS cho màn detail
message PropertyDetailResponse {
  uint64 id = 1;
  optional PropertyInfo info = 2;    // PID, version - mã BDSPro
  optional PropertyLocationInfo location = 3;     // Địa chỉ chi tiết
  optional PropertyLandInfoDetail landInfo = 4;   // Thông tin đất/GCN
  optional PropertyBuildingInfo buildingInfo = 5; // Thông tin nhà/công trình
  optional PropertyEdvidenceInfo edvidence = 6;   // Chứng minh thực tế
  PropertyLineageInfo lineage = 7;                // nationalId, verifiedNationalAt
  repeated bdspropb.MediaItem mediaList = 8;
  repeated sharepb.TagItem amenities = 9;
  optional PropertyStatistic statistic = 10;
  string createdAt = 11;
  string updatedAt = 12;
  optional MediaItem avatar = 13;
  optional Project project = 14;
  optional Developer developer = 15;  // Chủ đầu tư (từ project)
}

message PropertyStatistic {
  uint64 id = 1;
  optional int64 productCount = 2;
  optional int64 assetCount = 3;
  optional int64 listingCount = 4;
}

message PropertyIdentify {
  uint64 id = 1;
  uint64 pid = 2;
  uint32 version = 3;
  string identifier = 4;  // mã BDSPro format: BDS{pid}
}

message PropertyLocationInfo {
  uint64 id = 1;
  string detail = 2;
  optional uint64 regionId = 3;
  optional uint64 provinceId = 4;
  optional uint64 districtId = 5;
  optional uint64 wardId = 6;
  optional double latitude = 7;
  optional double longitude = 8;
  string mapUrl = 9;
  string provinceName = 10;
  string districtName = 11; 
  string wardName = 12;
}

message PropertyLandInfoDetail {
  uint64 id = 1;
  optional uint32 documentType = 2;
  string documentNo = 3;
  string issuringAuth = 4;
  optional uint32 plot = 5;
  optional uint32 sheet = 6;
  optional double areaTotal = 7;
  optional double areaLand = 8;
  optional double areaPlant = 9;
  optional string expiredLand = 10;
  optional string expiredPlant = 11;
  optional uint32 purposeUsed = 12;
  string note = 13;
  optional double frontWidth = 14;
  optional double depth = 15;
  optional double streetWidth = 16;
  string landNote = 17;
}

message PropertyEdvidenceInfo {
  uint64 id = 1;
  string title = 2;
  optional uint64 fileId = 3;
  string description = 4;
}

message PropertyLineageInfo {
  string nationalId = 1;
  optional int64 verifiedNationalAt = 2;
}

message PropertyAssetsRequest {
  uint64 id = 1;
  uint32 page = 2;
  uint32 size = 3;
}

message PropertyProductsRequest {
  uint64 id = 1;
  uint32 page = 2;
  uint32 size = 3;
}

message PropertyListResponse {
  repeated PropertyDetailResponse data = 1;
  Pagination pagination = 2; 
}

message PropertyAssetsResponse {
  repeated Asset data = 1;
  Pagination pagination = 2; 
}

message PropertyProductsResponse {
  repeated ProductResponse data = 1;
  Pagination pagination = 2;    
}

message Pagination {
  int32 page = 1;
  int32 size = 2;
  int64 total = 3;
  int32 pages = 4;
  bool hasNext = 5;
  bool hasPrevious = 6;
}

message PropertyRelationRequest {
  uint64 id = 1;
}

message PropertyRelation {
  uint64 id = 1;
  uint64 propertyId = 2;
  uint64 relationId = 3;
  uint64 relationType = 4;
  optional Asset asset = 5;
  optional ProductResponse product = 6;
  optional Post post = 7;
}

message PropertyRelationResponse {
  repeated PropertyRelation data = 1;
  int64 total = 2;
}

// CreatePropertyRequest - khớp với dto.CreatePropertyProductRequest
message CreatePropertyRequest {
  // BasicInfo (PropertyIdentify) - optional, server tạo default nếu null
  optional PropertyInfo info = 1;
  // Location - địa chỉ BĐS
  optional PropertyLocationCreate location = 2;
  // Thông tin đất (PropertyLandInfo)
  optional PropertyLandInfoCreate landInfo = 3;
  // Thông tin nhà/công trình
  optional PropertyBuildingInfoCreate buildingInfo = 4;
  // Tham chiếu ngoài
  optional PropertyExternalRefCreate externalRef = 5;
  // Chứng minh thực tế
  optional PropertyEdvidenceCreate edvidence = 6;
  // Lineage - nationalId, verifiedAt (tạo cuối)
  optional PropertyLineageCreate lineage = 7;
  // Thông tin PropertyMedia
  repeated PropertyMediaItem mediaList = 8;
  // Thông tin AssetLegal (giấy tờ pháp lý)
  repeated AssetLegalItem legalInfo = 9;
  repeated uint64 amenityIds = 10;
  repeated uint64 tagIds = 11;
  PostSaveWithProduct post = 12;
  ProductSaveRequest product = 13;
  AssetCreateWithProduct asset = 14;
  string note = 15;
}

// PropertyIdentifyCreate - PID, Version (server set default nếu không có)
message PropertyIdentifyCreate {
  optional uint64 pid = 1;
  optional uint32 version = 2;
}

// PropertyLocationCreate - địa chỉ chi tiết
message PropertyLocationCreate {
  string addressDetail = 1;
  optional uint64 regionId = 2;
  optional uint64 provinceId = 3;
  optional uint64 districtId = 4;
  optional uint64 wardId = 5;
  optional double latitude = 6;
  optional double longitude = 7;
  string mapUrl = 8;
  optional sharepb.AddressV3Proto address = 9;
}

// PropertyLandInfoCreate - thông tin đất/GCN
message PropertyLandInfoCreate {
  optional uint32 documentType = 1;
  string documentNo = 2;
  string issuringAuth = 3;
  optional uint32 plot = 4;
  optional uint32 sheet = 5;
  optional double areaTotal = 6;
  optional double areaLand = 7;
  optional double areaPlant = 8;
  optional string expiredLand = 9;   // timestamp ms
  optional string expiredPlant = 10; // timestamp ms
  optional uint32 purposeUsed = 11; // enum EPurposeUsed
  string note = 12;
  optional double frontWidth = 13;  // Mặt tiền
  optional double depth = 14;
  optional double streetWidth = 15;
  string landNote = 16;
}

// PropertyBuildingInfoCreate - thông tin nhà/công trình
message PropertyBuildingInfoCreate {
  optional uint32 buildingType = 1;     // enum EBuildingType
  optional uint32 buildStatus = 2;      // enum EBuildStatus
  optional double areaActual = 3;
  optional double areaFloor = 4;
  optional double areaConstruction = 5;
  optional uint32 floors = 6;
  optional uint32 roomNumber = 7;
  optional uint32 bedrooms = 8;
  optional uint32 bathrooms = 9;
  optional uint32 direction = 10;       // enum EHouseOrient
  optional uint32 balconyDirection = 11;
  string note = 12;
}

// PropertyExternalRefCreate - tham chiếu nguồn ngoài
message PropertyExternalRefCreate {
  optional uint64 externalRefId = 1;
  optional uint32 sourceSystem = 2;     // enum ERefSourceSys
  string sourceCode = 3;
  optional uint32 confidence = 4;
  optional uint32 syncStatus = 5;       // enum ESyncStatus
  string note = 6;
}

// PropertyEdvidenceCreate - chứng minh thực tế
message PropertyEdvidenceCreate {
  string title = 1;
  optional uint64 fileId = 2;
  string description = 3;
}

// PropertyLineageCreate - NationalID, VerifiedAt
message PropertyLineageCreate {
  optional string nationalId = 1;
  optional int64 verifiedNationalAt = 2;  // timestamp ms
}

message PropertyInfo {
  optional uint64 propertyIdentifyId = 1; // Liên kết với Property
	// Để lấy được thông tin của property identify
	optional uint32 sourceType = 2;
	optional uint64 propertyTypeId = 3;
	optional uint64 projectId = 4;
	optional uint32 legalStatus = 5;
	optional uint32 privacyLevel = 6;
	optional uint32 recordStatus = 7;
	optional string note = 8;
	optional string unitCode = 9;
	optional string identifier = 10;
	optional string level = 11;
	optional uint64 avatarId = 12;
	optional string scope = 13;
	optional uint32 visibility = 14;
  optional string title = 15;
  optional bdspropb.MediaItem avatar = 16;
}

message AssetLegalItem {
  string documentName = 1;                 // Tên giấy tờ
  string documentUrl = 2;                  // URL giấy tờ
  string documentType = 3;                  // Loại giấy tờ
  optional int64 issuedDate = 4;            // Ngày cấp (timestamp)
  optional int64 expiryDate = 5;            // Ngày hết hạn (timestamp)
  string description = 6;                   // Mô tả
  optional uint64 relatedSplitMergeId = 7;  // ID liên quan đến chia/tách
}

