syntax = "proto3";

package bdspropb;

import "bdspro/asset.proto";
import "bdspro/common.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "shared/common.proto";
import "shared/v3.proto";

option go_package = "pb/types/bdspro;bdspropb";

service PostService {
  rpc GetPostByID (GetPostByIDRequest) returns (Post);
  rpc OwnerPost(OwnerPostRequest) returns (OwnerPostResponse);
  rpc GetPostByIDs(GetPostByIDsRequest) returns (GetPostByIDsResponse);
  rpc CreatePost(PostSaveRequest) returns (Post) {
    option (google.api.http) = {
      post: "/v2/bdspro/v2/post"
      body: "*"
    };
  };
  rpc NewExpiredPost(PostExpiredRequest) returns (Post) {
    option (google.api.http) = {
      post: "/v2/bdspro/v2/post/new-expired"
      body: "*"
    };
  };
  rpc GetDetail(IdRequest) returns (PostDetailResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/post/detail/{id}"
    };
  };
  rpc UpdatePost(PostSaveRequest) returns (Post) {
    option (google.api.http) = {
      put: "/v2/bdspro/v2/post/{id}"
      body: "*"
    };
  };
  rpc Delete(IdRequest) returns (Response) {
    option (google.api.http) = {
      delete: "/v2/bdspro/v2/post/{id}"
    };
  };
  rpc UpdateHidden(UpdateHiddenRequest) returns (Response) {
    option (google.api.http) = {
      put: "/v2/bdspro/v2/post/hidden"
      body: "*"
    };
  };
  rpc GetPersonalPost(PostSearchRequest) returns (PostListResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/post/personal"
    };
  };
  rpc GetPersonalPosts(sharepb.RequestV3Proto) returns (PostListResponse) {
    option (google.api.http) = {
      get: "/v3/bdspro/post/personal/{id}"
    };
  };
  rpc GetGlobalPost(PostSearchRequest) returns (PostListResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/post/global"
    };
  };
  rpc GetPublish(PostPublishSearch) returns (PostListResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/post/publish/{profileId}"
    };
  };
  // rpc GetMarketing(GetMarketingRequest) returns (Post);
  // rpc GetUpVip(GetUpVipRequest) returns (Post);
  // rpc GetExport(GetExportRequest) returns (Post);
  
  // Post Management APIs for Organizations
  rpc CreatePostOrganization (PostSaveRequest) returns (Post) {
    option (google.api.http) = {
      post: "/v2/bdspro/v2/post/organization"
      body: "*"
    };
  };
  rpc CurrentOrganizationPosts (PostSearchRequest) returns (PostListResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/post/organization"
    };
  };
  rpc GetTodayPost (sharepb.Empty) returns (PostListResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/dashboard/today/post"
    };
  };
}

message OwnerPostRequest {
  uint64 postId = 1;
  uint64 profileId = 2;
}

message OwnerPostResponse {
  bool success = 1;
}

message GetPostByIDRequest {
  uint64 id = 1;
}

message GetPostByIDsRequest {
  repeated uint64 ids = 1;
}

message GetPostByIDsResponse {
  repeated Post posts = 1;
}

message Post {
  uint64 id = 1;
  uint64 productId = 2;
  string expiredAt = 3;
  uint32 status = 4;
  uint32 visibility = 5;
  bool hidden = 6;
  string content = 7;
  uint32 transactionType = 8;
  string title = 9;
  int32 numDate = 10;
  string type = 11; // 1: normal, 2: feed, 3: share
  double postPrice = 12;
  uint32 priceType = 13; // 1: chính thức, 2: thỏa thuận
  uint32 packageVisible = 14; // 1: thường, 2: VIP
  uint64 like = 15;
  uint64 comment = 16;
  uint64 numView = 17;
  uint64 ownerId = 18;
  uint32 ownerType = 19; // 1: user, 2: admin
  repeated PostMedia mediaList = 20;
  string mediaUrl = 21;
  string mediaType = 22;
  string provinceName = 23;
  string districtName = 24;
  string wardName = 25;
  optional sharepb.ProfileItem owner = 26;
  optional ProductResponse product = 27;
  uint32 transactionStatus = 28;
  uint32 visibleStatus = 29;
  optional uint64 provinceId = 30;
  optional uint64 wardId = 31;
  double area = 32;
}

message PostMedia {
  uint64 id = 1;
  string mediaUrl = 2;
  string mediaType = 3;
  bool isMain = 4;
  int32 sortOrder = 5;
}
