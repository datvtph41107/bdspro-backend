message PostSearchRequest {
	uint32 page = 1;
	uint32 size = 2;
	string content = 3;
	uint32 transactionType = 4;
	string text = 5;
	string title = 6;
	optional string expiredFrom = 7;
	optional string expiredTo = 8;
	optional bool hidden = 9;
	repeated uint64 status = 10;
	repeated uint64 types = 11; // 1: hiển thị, 2: hết hạn; 3: tạm ẩn
	repeated uint64 packageVisibles = 12;
}

message PostListResponse {
	repeated Post data = 1;
	int32 total = 2;
}

message PostPublishSearch {
	uint32 page = 1;
	uint32 size = 2;
	uint64 profileId = 3;
}

message UpdateHiddenRequest {
  uint64 postId = 1;
  bool hidden = 2;
}

message PostExpiredRequest {
  uint64 postId = 1;
  uint64 numDay = 2;
}

message PostSaveRequest {
	uint64 productId = 1;
	string title = 2;
	string content = 3;
	double price = 4;
	uint32 transactionType = 5;
	uint32 visibility = 6;
	uint32 packageVisible = 7;
	string expiredAt = 8;
	uint32 numDate = 9;
	optional bool hidden = 10;
	repeated PostMedia mediaList = 11;
	uint32 status = 12;
	uint64 id = 13;
	uint32 priceType = 14;
}

message PostDetailResponse {
	Post post = 1;
	ProductResponse productInfo = 2;
	Asset assetInfo = 3;
	sharepb.ProfileItem owner = 4;
}