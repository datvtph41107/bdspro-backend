message ListItemResponse {
    repeated ItemResponse data = 1;
    uint32 total = 2;
}

message SearchQueryRequest {
    uint32 page = 1;
    uint32 size = 2;
    string text = 3;
    optional uint64 parentId = 4;
}

message PublicUserProductSearch {
  uint64 profileId = 1;
  uint32 page = 2;
  uint32 size = 3;
  string sort = 4;
  string text = 5;
  optional uint64 parentId = 6;
  optional uint64 propertyTypeId = 7;
  optional uint64 docTypeId = 8;
  optional uint64 projectId = 9;
  optional uint64 provinceId = 10;
  optional uint64 districtId = 11;
  optional uint64 wardId = 12;
  optional int32 transactionType = 13;
  optional int32 saleStatus = 14;
  optional int32 rentStatus = 15;
  optional int32 saleVisibility = 16;
  optional int32 rentVisibility = 17;
  optional int32 sourceType = 18;
  optional int32 transactionPrice = 19;
  optional int32 salePrice = 20;
  optional int32 rentPrice = 21;
  optional int32 saleCommission = 22;
  optional int32 rentCommission = 23;
  optional int32 rentPaymentCycle = 24;
  optional bool archived = 25;
}

message EnumItem {
  uint32 value = 1;
  string name = 2;
}

message GetEnumResponse {
  repeated EnumItem data = 1;
  string key = 2;
}

message GetEnumsResponse {
  repeated GetEnumResponse enums = 1;
  int64 timestamp = 2;
  bool lastest = 3;
}

message PropertyType {
  uint64 id = 1;
  string name = 2;
  string createdAt = 3;
  string updatedAt = 4;
  bool active = 5;
  uint32 classifyProperty = 6;
  string fieldStrs = 7;
}

message PropertyTypeListResponse {
  repeated PropertyType data = 1;
  int64 totalElements = 2;
}