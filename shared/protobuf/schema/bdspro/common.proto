syntax = "proto3";

package bdspropb;
import "user/profile.proto";
import "google/protobuf/timestamp.proto";
import "bdspro/project.proto";
import "bdspro/developer.proto";
import "bdspro/amenity.proto";
import "bdspro/doc_type.proto";
import "bdspro/region.proto";
import "bdspro/deposite.proto";
import "bdspro/apartment.proto";
import "bdspro/apartment_attribute.proto";
import "bdspro/attribute_product.proto";
import "bdspro/transaction.proto";
import "shared/common.proto";
option go_package = "pb/types/bdspro;bdspropb";

message ArchivedRequest {
    uint64 id = 1;
    bool archived = 2;
}

message MediaItem {
    uint64 id = 1;
    string mediaUrl = 2;
    string mediaType = 3;
    bool isMain = 4;
    int32 order = 5;
    int32 targetType = 6;
    uint64 targetId = 7;
}

message IdRequest {
    uint64 id = 1;
    uint32 page = 2;
    uint32 size = 3;
    string sort = 4;
    string text = 5;
    uint32 ownerType = 6;
    repeated uint64 ids = 7;
}


message Response {
    uint64 id = 1;
    string message = 2;
}

