syntax = "proto3";

package bdspropb;

import "google/api/annotations.proto";
import "bdspro/common.proto";
import "shared/common.proto";
import "bdspro/tx_type.proto";

option go_package = "pb/types/bdspro;bdspropb";

enum TransactionType {
    TRANSACTION_TYPE_UNKNOWN = 0;
    TRANSACTION_TYPE_EXPENSE = 10; // Chi phí
    TRANSACTION_TYPE_REVENUE = 20; // Doanh thu
    TRANSACTION_TYPE_BUY = 30; // Mua
    TRANSACTION_TYPE_SELL = 40; // Bán
    TRANSACTION_TYPE_RENT = 50; // Thuê
    TRANSACTION_TYPE_NEGOTIATE = 60; // Góp vốn
}

service InternalTransactionService {
    rpc CreateProductTransaction(CreateProductTransactionRequest) returns (TransactionResponse);
    rpc CreateAction(CreateActionRequest) returns (ActionResponse);
    rpc CreateDepositAction(CreateActionRequest) returns (ActionResponse);
    rpc CreateSignAction(CreateActionRequest) returns (ActionResponse);
    rpc CreatePaymentAction(CreateActionRequest) returns (ActionResponse);
    rpc CreateHandoverAction(CreateActionRequest) returns (ActionResponse);
    rpc GetTransaction(GetTransactionRequest) returns (TransactionListResponse);
    rpc GetTransactionDetail(sharepb.IdRequest) returns (TransactionResponse);
    rpc GetTransactionByIDs(sharepb.IdRequest) returns (TransactionListResponse);
    rpc GetDealTransactionsByIds(sharepb.IdRequest) returns (GetDealTransactionsByIdsResponse);
    rpc GetDealStatisticByDealIds(sharepb.IdRequest) returns (StatisticDealsResponse);
}

message CreateActionRequest {
    uint64 id = 1;
    uint32 action = 2;
    string note = 3;
    uint64 fromId = 4;
    OwnerType fromOf = 5;
    uint64 toId = 6;
    OwnerType toOf = 7;
    double amount = 8;
    string currency = 9;
    uint64 transactionId = 10;
}

message ActionResponse {
    uint64 transactionId = 1;
    string createdAt = 2;
    uint64 fromId = 3;
    OwnerType fromOf = 4;
    uint64 toId = 5;
    OwnerType toOf = 6;
    uint32 action = 7;
    double value = 8;
    string note = 9;
    string actionName = 10;
    string message = 11;
}

message SaveTransactionRequest {
    uint64 id = 1;
    string transaction_name = 2;
    string description = 3;
    string transactionType = 4;
    string transactionStatus = 5;
    string timestamp = 6;
    string value = 7;
    string currency = 8;
}

message ApproveRequest {
    uint64 id = 1;
    string note = 2;
}

message RejectRequest {
    uint64 id = 1;
    string note = 2;
}

message CreateProductTransactionRequest {
    uint64 fromId = 1;
    uint64 toId = 2;
    double amount = 3;
    string currency = 4;
    string note = 5;
    string transactionType = 6;
    uint64 dealId = 7;
    uint64 customerId = 8;
    uint64 productId = 9;
    OwnerType fromOf = 10;
    OwnerType toOf = 11;
    ActionResponse action = 12;
    optional CreateActionRequest actionRequest = 13;
}

message TransactionResponse {
    uint64 transactionId = 1;
    string transactionName = 2;
    TransactionStatus status = 3;
    TransactionMethod method = 4;
    double value = 5;
    uint64 fromId = 6;
    OwnerType fromOf = 7;
    uint64 toId = 8;
    OwnerType toOf = 9;
    sharepb.ProfileItem profile = 10;
    string createdAt = 11;
    repeated ActionResponse actions = 12;
}

message TransactionListResponse {
    repeated TransactionResponse data = 1;
    int64 total = 2;
}

message GetTransactionRequest {
    uint32 page = 1;
    uint32 size = 2;
    uint64 dealId = 3;
    uint64 productId = 5;
    string fromDate = 6;
    string toDate = 7;
    string status = 8;
}

message DealContractResponse {
    uint64 transactionId = 1;
    uint64 dealId = 2;
    string transactionName = 3;
    double amount = 4;
    uint64 customerId = 5;
    sharepb.ProfileItem customer = 6;
    uint64 productId = 7;
    bdspropb.ProductAttachment product = 8;
    uint64 staffId = 9;
    string staffName = 10;
    string createdAt = 11;
    uint64 status = 12;
    string statusName = 13;
    string note = 14;
    TransactionResponse transaction = 15;
    TransactionType transactionType = 16;
    string typeName = 17;
    uint64 contractId = 18;
    string code = 19;
}

message GetDealTransactionsByIdsResponse {
    repeated DealContractResponse dealTransactions = 1;
}

message StatisticDealsResponse {
    repeated uint64 dealIds = 1;
    double amountTxt = 2;
    double amountRevenue = 3;
    double amountCost = 4;
    double totalProfit = 5;
}