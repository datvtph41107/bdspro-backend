syntax = "proto3";

package bdspropb;
option go_package = "pb/types/bdspro;bdspropb";

import "bdspro/common.proto";
import "bdspro/product.proto";
import "shared/common.proto";
import "google/api/annotations.proto";

service AdminProductService {
  rpc GetProducts(AdminProductSearchRequest) returns (AdminProductSearchResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/admin/products"
    };
  };
  rpc CreateProduct(ProductSaveRequest) returns (ProductResponse) {
    option (google.api.http) = {
      post: "/v2/bdspro/admin/products"
      body: "*"
    };
  };
  rpc UpdateProduct(ProductSaveRequest) returns (ProductResponse) {
    option (google.api.http) = {
      put: "/v2/bdspro/admin/products/{id}"
      body: "*"
    };
  };
  rpc DeleteProduct(sharepb.IdRequest) returns (Response) {
    option (google.api.http) = {
      delete: "/v2/bdspro/admin/products/{id}"
    };
  };
  rpc ApproveProduct(sharepb.IdRequest) returns (Response) {
    option (google.api.http) = {
      post: "/v2/bdspro/admin/products/{id}/approve"
    };
  };
  rpc RejectProduct(sharepb.IdRequest) returns (Response) {
    option (google.api.http) = {
      post: "/v2/bdspro/admin/products/{id}/reject"
    };
  };
  rpc GetProductById(sharepb.IdRequest) returns (ProductResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/admin/products/{id}"
    };
  };
  rpc GetProductHistory(sharepb.IdRequest) returns (ProductHistoryResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/admin/products/{id}/history"
    };
  };
  rpc UpdateProductNote(UpdateProductNoteRequest) returns (Response) {
    option (google.api.http) = {
      put: "/v2/bdspro/admin/products/{id}/note"
      body: "*"
    };
  };
}

message ProductRequest {
  string id = 1;
  string name = 2;
  string description = 3;
}

// AdminProductSearchResponse response riêng cho admin search products
message AdminProductSearchResponse {
  repeated AdminProductItem data = 1;
  int64 total = 2;
}

// AdminProductItem thông tin sản phẩm cho admin view
message AdminProductItem {
  uint64 id = 1;
  string name = 2;
  double area = 3;
  uint32 transactionType = 4;
  string provinceName = 5;
  string districtName = 6;
  string wardName = 7;
  optional double salePrice = 8;
  optional double rentPrice = 9;
  uint32 rentStatus = 10;
  uint32 saleStatus = 11;
  sharepb.ProfileItem owner = 12;
  string createdAt = 13;
  string updatedAt = 14;
  optional uint64 assetId = 15;
  repeated uint64 postIds = 16;
  optional string assetCode = 17;
  repeated string postCodes = 18;
  string propertyTypeName = 19;
}


message AdminProductSearchRequest {
  uint32 page = 1;
  uint32 size = 2;
  string name = 3;
  optional double areaFrom = 4;
  optional double areaTo = 5;
  repeated uint32 transactionTypes = 6;
  repeated uint32 saleStatus = 7;
  repeated uint32 rentStatus = 8;
  repeated uint64 propertyTypeIds = 9;
  repeated uint64 provinceIds = 10;
  string fromDate = 11;
  string toDate = 12;
}

// Update Product Note Request
message UpdateProductNoteRequest {
  uint64 id = 1;
  string note = 2;
}

// Product History Response
message ProductHistoryResponse {
  repeated ProductHistory data = 1;
  uint64 total = 2;
}

// Product History Item
message ProductHistory {
  uint64 id = 1;
  uint64 action = 2;
  uint64 parentId = 3;
  uint64 productId = 4;
  repeated uint64 childIds = 5;
  uint64 createdUserId = 6;
  sharepb.ProfileItem createdUser = 7;
  repeated ProductInfo childs = 8;
  string createdAt = 9;
  string updatedAt = 10;
}
