syntax = "proto3";

package bdspropb;

import "bdspro/product.proto";
import "shared/common.proto";
option go_package = "pb/types/bdspro;bdspropb";

import "google/api/annotations.proto";

service BdsproDashboardService {
    rpc GetCashProfit(GetCashProfitRequest) returns (GetCashProfitResponse) {
        option (google.api.http) = {
            get: "/v2/bdspro/v2/dashboard/cash-profit/type"
        };
    };
    rpc GetCashProfitTime(GetCashProfitRequest) returns (GetCashProfitTimeResponse) {
        option (google.api.http) = {
            get: "/v2/bdspro/v2/dashboard/cash-profit/time"
        };
    };

    rpc GetAssetStats(sharepb.GetStatsRequest) returns (sharepb.GetStatsResponse) {
        option (google.api.http) = {
            get: "/v2/bdspro/v2/dashboard/asset-stats"
        };
    };
    rpc GetProductStats(sharepb.GetStatsRequest) returns (sharepb.GetStatsResponse) {
        option (google.api.http) = {
            get: "/v2/bdspro/v2/dashboard/product-stats"
        };
    };
    rpc GetPostStats(sharepb.GetStatsRequest) returns (sharepb.GetStatsResponse) {
        option (google.api.http) = {
            get: "/v2/bdspro/v2/dashboard/post-stats"
        };
    };
}

message GetCashProfitRequest {
    string fromDate = 1;
    string toDate = 2;
    uint64 costTypeId = 3;
    uint32 quarter = 4;
}

message CashProfit {
    string name = 1;
    double amountIn = 2;
    double amountOut = 3;
    double profit = 4;
}

message GetCashProfitResponse {
    repeated CashProfit data = 1;
}

message CashProfitTime {
    string time = 1;
    double amountIn = 2;
    double amountOut = 3;
    double profit = 4;
}


message GetCashProfitTimeResponse {
    repeated CashProfitTime data = 1;
}