syntax = "proto3";

package bdspropb;
import "bdspro/asset.proto";
import "bdspro/common.proto";
import "google/api/annotations.proto";
import "user/profile.proto";
import "bdspro/post.proto";
import "bdspro/deposite.proto";
import "bdspro/transaction.proto";
import "shared/common.proto";
import "bdspro/deal.proto";

option go_package = "pb/types/bdspro;bdspropb";

service ProductService {
  rpc GetDetailByIds (IdRequest) returns (ProductInternalResponse);
  rpc GetProductAttachmentByIds (IdRequest) returns (ProductAttachmentResponse);
  rpc ArchiveProduct (ArchivedRequest) returns (Response) {
    option (google.api.http) = {
      put: "/v2/bdspro/v2/product/archived"
      body: "*"
    };
  };
  rpc ChildDevideProduct (DevideChildRequest) returns (Response) {
    option (google.api.http) = {
      post: "/v2/bdspro/v2/product/child/devide"
      body: "*"
    };
  };
  // rpc ChildHistories (IdRequest) returns (HistoryResponse) {
  //   option (google.api.http) = {
  //     get: "/v2/bdspro/v2/product/child/history/{id}"
  //   };
  // };
  rpc ChildMergeProduct (MergeChildRequest) returns (Response) {
    option (google.api.http) = {
      post: "/v2/bdspro/v2/product/child/merge"
      body: "*"
    };
  };
  rpc ChildMergeAll (IdRequest) returns (Response) {
    option (google.api.http) = {
      post: "/v2/bdspro/v2/product/child/merge-all/{id}"
      body: "*"
    };
  };
  rpc ChildSplit (SaveChildRequest) returns (Response) {
    option (google.api.http) = {
      post: "/v2/bdspro/v2/product/child/split"
      body: "*"
    };
  };
  rpc ProductDeposite (DepositeRequest) returns (bdspropb.Transaction) {
    option (google.api.http) = {
      post: "/v2/bdspro/v2/product/deposite"
      body: "*"
    };
  };
  rpc DeleteDeposite (IdRequest) returns (Response) {
    option (google.api.http) = {
      delete: "/v2/bdspro/v2/product/deposite/{id}"
    };
  };
  rpc ExportProduct (IdRequest) returns (Response) {
    option (google.api.http) = {
      post: "/v2/bdspro/v2/product/export/{id}"
      body: "*"
    };
  };
  rpc ProductMe(ProductSearch) returns (SearchResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/product/me"
    };
  };
  // deprecated
  rpc ProductNew (ProductSaveRequest) returns (Response) {
    option (google.api.http) = {
      post: "/v2/bdspro/v2/product/new"
      body: "*"
    };
  };
  rpc RentStatus (StatusRequest) returns (Response) {
    option (google.api.http) = {
      put: "/v2/bdspro/v2/product/rent-status"
      body: "*"
    };
  };
  rpc RentVisibility (VisibilityRequest) returns (Response) {
    option (google.api.http) = {
      put: "/v2/bdspro/v2/product/rent-visibility"
      body: "*"
    };
  };
  rpc SaleStatus (StatusRequest) returns (Response) {
    option (google.api.http) = {
      put: "/v2/bdspro/v2/product/sale-status"
      body: "*"
    };
  };
  rpc SaleVisibility (VisibilityRequest) returns (Response) {
    option (google.api.http) = {
      put: "/v2/bdspro/v2/product/sale-visibility"
      body: "*"
    };
  };
  rpc Suggest (SuggestRequest) returns (ProductResponse) {
    option (google.api.http) = {
      post: "/v2/bdspro/v2/product/suggest"
      body: "*"
    };
  };
  rpc SuggestDeepseek (SuggestRequest) returns (ProductResponse) {
    option (google.api.http) = {
      post: "/v2/bdspro/v2/product/suggest/deepseek"
      body: "*"
    };
  };
  rpc GetDetail (IdRequest) returns (ProductResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/product/{id}/detail"
    };
  };
  rpc CreateProductForUser (CreateProductForUserRequest) returns (CreateProductResponse) {
    option (google.api.http) = {
      post: "/v2/bdspro/v2/product/create-for-user"
      body: "*"
    };
  };
  rpc CreateProductForOrg (CreateProductForOrgRequest) returns (CreateProductResponse) {
    option (google.api.http) = {
      post: "/v2/bdspro/v2/product/create-for-org"
      body: "*"
    };
  };
  // rpc GetHistories (IdRequest) returns (HistoryResponse) {
  //   option (google.api.http) = {
  //     get: "/v2/bdspro/v2/product/{id}/histories"
  //   };
  // };
  rpc GetMembers (IdRequest) returns (MemberResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/product/{id}/members"
    };
  };
  rpc GetPosts (IdRequest) returns (PostResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/product/{id}/posts"
    };
  };
  rpc GetDeals (IdRequest) returns (GetOrganizationDealsResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/product/{id}/deals"
    };
  };
  rpc UpdateProduct(UpdateProductRequest) returns (Response) {
    option (google.api.http) = {
      put: "/v2/bdspro/v2/product/edit/{id}"
      body: "*"
    };
  };
  rpc DeleteProduct (IdRequest) returns (Response) {
    option (google.api.http) = {
      delete: "/v2/bdspro/v2/product/{id}"
    };
  };
  rpc AreaInfo (IdRequest) returns (AreaInfoResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/product/area-info/{id}"
    };
  };
  
  rpc GetGroupProducts (GroupProductSearch) returns (SearchResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/product/group/{groupId}"
    };
  };

  rpc CurrentOrganizationProducts (ProductSearch) returns (SearchResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/product/organization/current"
    };
  };
  rpc CreateOrganizationProduct (ProductSaveRequest) returns (Response) {
    option (google.api.http) = {
      post: "/v2/bdspro/v2/product/organization"
      body: "*"
    };
  };
  rpc GetUserProducts (UserProductSearch) returns (SearchResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/product/user/{userId}"
    };
  };
  rpc ProductSummary (ProductSearch) returns (ProductSummaryResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/product/summary"
    };
  };
  
  // API liên kết Product với Asset
  rpc LinkProductAsset (LinkProductAssetRequest) returns (Response) {
    option (google.api.http) = {
      post: "/v2/bdspro/v2/product/link-asset"
      body: "*"
    };
  };
  
  rpc UnlinkProductAsset (UnlinkProductAssetRequest) returns (Response) {
    option (google.api.http) = {
      post: "/v2/bdspro/v2/product/unlink-asset"
      body: "*"
    };
  };
  
  rpc GetAssetsByProduct (sharepb.IdRequest) returns (ProductAssetListResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/product/{id}/assets"
    };
  };
  
  rpc GetPriceHistory (PriceHistoryRequest) returns (PriceHistoryResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/product/{id}/price-history"
    };
  };
  
  rpc GetProductNavigation (sharepb.IdRequest) returns (ProductNavigationResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/product/{id}/navigation"
    };
  };

  rpc ApplyPriceUpdate(ApplyPriceUpdateRequest)
    returns (ApplyPriceUpdateResponse) {
    option (google.api.http) = {
      post: "/v2/bdspro/v2/property/{productId}/apply-price"
      body: "*"
    };
  };

   rpc UpdateProductSource(UpdateProductSourceRequest) returns (Response) {
      option (google.api.http) = {
        put: "/v2/bdspro/product/{productId}/source"
        body: "*"
      };
  }
}

enum ProductTransactionType {
  PRODUCT_TRANSACTION_TYPE_UNSPECIFIED = 0;
  PRODUCT_TRANSACTION_TYPE_SALE = 10;
  PRODUCT_TRANSACTION_TYPE_RENT = 20;
}


enum ProductPriceStatus {
  PRICE_STATUS_UNSPECIFIED = 0;
  PRICE_STATUS_FIXED = 1;     
  PRICE_STATUS_NEGOTIABLE = 2;
  PRICE_STATUS_CONTACT = 3;   
}

message ApplyPriceUpdateRequest {
  uint64 productId = 1;
  double price = 2;
  ProductPriceStatus priceStatus = 3;
  optional string changeNote = 4;
}

message ApplyPriceUpdateResponse {
  uint64 productId = 1;
  double oldPrice = 2;
  double newPrice = 3;
  double pricePerM2 = 4;
  string updatedAt = 5;
}

message UpdateProductRequest {
  uint64 id = 1;
  // Basic fields
  optional string name = 2;
  optional uint32 saleStatus = 3;
  optional uint32 rentStatus = 4;
  optional uint32 visibility = 5;
  optional uint32 saleVisibility = 6;
  optional uint32 rentVisibility = 7;
  optional string description = 8;
  optional string internalNote = 9;
  optional string note = 10;
  optional uint32 mode = 11;
  optional uint32 scope = 12;
  // Property fields
  optional uint64 propertyId = 13;
  optional PropertyUpdateRequest property = 14;
  // Amenity
  repeated uint64 amenityIds = 15;
  // Price
  optional ProductPrice priceData = 16;
  // Private data
  optional ProductPrivate productPrivate = 17;
  // Commission (trong priceData, nhưng có thể override riêng)
  optional double saleCommission = 18;
  optional double rentCommission = 19;
  // Channel
  optional bool channelPrice = 20;
  // Media
  repeated MediaItem mediaList = 21;
  // Source fields
  optional uint32 sourceType = 22;
  optional uint64 sourceContactId = 23;
  optional string sourceContactNote = 24;
  // Other fields from ProductSaveRequest
  optional uint64 propertyTypeId = 25;
  optional uint64 docTypeId = 26;
  optional uint64 projectId = 27;
  optional uint64 provinceId = 28;
  optional uint64 districtId = 29;
  optional uint64 wardId = 30;
  optional int32 transactionType = 31;
  optional HouseInfo houseInfo = 32;
  optional string googleMapLink = 33;
  optional uint64 imageId = 34;
  optional string certificateHouseNote = 35;
  optional PropertyBuildingInfo buildingInfo = 36;
  optional PropertyLandInfo landInfo = 37;
}

message PropertyUpdateRequest {
  optional uint64 propertyTypeId = 1;
  optional string title = 2;
  optional uint64 locationId = 3;
  optional string addressDetail = 4;
  optional double latitude = 5;
  optional double longitude = 6;
  optional string mapUrl = 7;
  optional uint64 projectId = 8;
  optional string buildingBlock = 9;
  optional string level = 10;
  optional string unitCode = 11;
  optional double areaTotal = 12;
  optional double areaLand = 13;
  optional double areaResidential = 14;
  optional uint32 legalStatus = 15;
  optional string legalNote = 16;
  optional uint64 buildingInfoId = 17;
  optional uint32 recordStatus = 18;
}

message UpdateProductSourceRequest {
  uint64 productId = 1;
  uint32 sourceType = 2;
  uint64 sourceContactId = 3;
  string sourceContactNote = 4;
  // uint64 assignedUserId = 5;
  uint32 priority = 6;
  repeated uint64 sourceTagIds = 7;
}


message PingResponse {}
message ProductInternalRequest {
  int32 page = 1;
  int32 size = 2;
  string sort = 3;
  string text = 4;
}
message ProductInternalResponse {
  repeated ProductResponse data = 1;
}

message ProductAttachmentResponse {
  repeated ProductAttachment data = 1;
}

message StatusRequest {
  uint64 id = 1;
  int32 status = 2;
  uint64 contactId = 3;
  string note = 4;
  double amount = 5;
  string phone = 6;
}

message VisibilityRequest {
  uint64 id = 1;
  int32 visibility = 2;
}

message DeleteDepositeRequest {
  uint64 id = 1;
}

message SaveChildRequest {
  uint64 parentId = 1;
  string name = 2;
  string code = 3;
  double area = 4;
  string description = 5;
  string note = 6;
  optional uint64 propertyTypeId = 7;
  optional uint64 docTypeId = 8;
  repeated uint64 amenityIds = 9;
  optional uint64 projectId = 10;
  optional uint64 provinceId = 11;
  optional uint64 districtId = 12;
  optional uint64 wardId = 13;
  int32 transactionType = 14;
  ProductPrice priceData = 15;
  repeated MediaItem mediaItems = 16;
  HouseInfo houseInfo = 17;
  ProductPrivate productPrivate = 18;
  string googleMapLink = 19;
  uint32 sourceType = 20;
  uint32 saleStatus = 21;
  uint32 rentStatus = 22;
  PostSaveWithProduct post = 23;
  AssetCreateWithProduct asset = 24;
  int32 saleVisibility = 25;
  int32 rentVisibility = 26;
  optional uint64 imageId = 27;
  optional uint64 sourceContactId = 28;
  string sourceContactNote = 29;
}

message PostSaveWithProduct {
  uint64 productId = 1;
  string title = 2;
  string content = 3;
  double postPrice = 4;
  int32 transactionType = 5;
  int32 visibility = 6;
  int32 packageVisible = 7;
  int32 expiredAt = 8;
  int32 numDate = 9;
  bool hidden = 10;
  repeated MediaItem metadatas = 11;
}

message AssetCreateWithProduct {
  double purchasePrice = 1;
  int32 purchaseDate = 2;
  int32 legalStatus = 3;
  int32 rentStatus = 4;
  string description = 5;
  repeated LegalItem legalItems = 6;
}


message ProductSearch {
  uint32 page = 1;
  uint32 size = 2;
  string sort = 3;
  string text = 4;
  uint64 ownerId = 5;
  uint64 ownerType = 6;
  optional uint64 parentId = 7;
  uint64 propertyTypeId = 8;
  uint64 docTypeId = 9;
  uint64 projectId = 10;
  optional uint64 provinceId = 11;
  optional uint64 districtId = 12;
  optional uint64 wardId = 13;
  int32 transactionType = 14;
  int32 saleStatus = 15;
  int32 rentStatus = 16;
  int32 saleVisibility = 17;
  int32 rentVisibility = 18;
  int32 sourceType = 19;
  int32 transactionPrice = 20;
  int32 salePrice = 21;
  int32 rentPrice = 22;
  int32 saleCommission = 23;
  int32 rentCommission = 24;
  int32 rentPaymentCycle = 25;
  optional bool archived = 26;
  string transactionTypes = 27;
  string propertyTypeIds = 28;
  string projectIds = 29;
  string saleStatuses = 30;
  string rentStatuses = 31;
  string saleVisibilities = 32;
  string rentVisibilities = 33;
  string sourceTypeIds = 34;
  string visibilities = 35;
  string provinceIds = 36;
  string wardIds = 37;
}

message GroupProductSearch {
  uint64 groupId = 1;
  uint32 page = 2;
  uint32 size = 3;
  string sort = 4;
  string text = 5;
  optional uint64 parentId = 6;
  optional uint64 propertyTypeId = 7;
  optional uint64 docTypeId = 8;
  optional uint64 projectId = 9;
  optional uint64 provinceId = 10;
  optional uint64 districtId = 11;
  optional uint64 wardId = 12;
  optional int32 transactionType = 13;
  optional int32 saleStatus = 14;
  optional int32 rentStatus = 15;
  optional int32 saleVisibility = 16;
  optional int32 rentVisibility = 17;
  optional int32 sourceType = 18;
  optional int32 transactionPrice = 19;
  optional int32 salePrice = 20;
  optional int32 rentPrice = 21;
  optional int32 saleCommission = 22;
  optional int32 rentCommission = 23;
  optional int32 rentPaymentCycle = 24;
  optional bool archived = 25;
}

message UserProductSearch {
  uint64 userId = 1;
  uint32 page = 2;
  uint32 size = 3;
  string sort = 4;
  string text = 5;
  optional uint64 parentId = 6;
  optional uint64 propertyTypeId = 7;
  optional uint64 docTypeId = 8;
  optional uint64 projectId = 9;
  optional uint64 provinceId = 10;
  optional uint64 districtId = 11;
  optional uint64 wardId = 12;
  optional int32 transactionType = 13;
  optional int32 saleStatus = 14;
  optional int32 rentStatus = 15;
  optional int32 saleVisibility = 16;
  optional int32 rentVisibility = 17;
  optional int32 sourceType = 18;
  optional int32 transactionPrice = 19;
  optional int32 salePrice = 20;
  optional int32 rentPrice = 21;
  optional int32 saleCommission = 22;
  optional int32 rentCommission = 23;
  optional int32 rentPaymentCycle = 24;
  optional bool archived = 25;
}

message SearchResponse {
  repeated ProductResponse data = 1;
  int64 totalElements = 2;
}

message MemberResponse {
  repeated ProductAccess data = 1;
}

message ProductAccess {
  uint64 id = 1;
	uint64 productId = 2;
	string fields = 3;
	uint32 targetType = 4;
	uint64 targetId = 5;
	float commission = 6;
	string targetName = 7;
	string avatar = 8;
}

message PostResponse {
  repeated Post data = 1;
}


message AreaInfoResponse {
  double totalArea = 1;
	double avaiableArea = 2;
	double splitArea = 3;
}

message DevideChildRequest {
  uint64 parentId = 1;
  repeated SaveChildRequest childs = 2;
}

message MergeChildRequest {
  uint64 parentId = 1;
  repeated uint64 childIds = 2;
}


message ProductSaveRequest {
	optional uint64 parentId = 1;
	string name = 2;
	string code = 3;
	double area = 4;
	string description = 5;
	string note = 6;
	optional uint64 propertyTypeId = 7;
	optional uint64 docTypeId = 8;
	repeated uint64 amenityIds = 9;
	optional uint64 projectId = 10;
	optional uint64 provinceId = 11;
	optional uint64 districtId = 12;
	optional uint64 wardId = 13;
	int32 transactionType = 14;
	ProductPrice priceData = 15;
	repeated MediaItem mediaItems = 16;
	HouseInfo houseInfo = 17;
	ProductPrivate productPrivate = 18;
	string googleMapLink = 19;
	uint32 sourceType = 20;
	uint32 saleStatus = 21;
	uint32 rentStatus = 22;
	PostSaveWithProduct post = 23;
	AssetCreateWithProduct asset = 24;
	uint32 saleVisibility = 25;
	uint32 rentVisibility = 26;
	uint32 ownerType = 27;
  uint64 id = 28;
  uint64 ownerId = 29;
  uint32 visibility = 30;
  optional uint64 imageId = 31;
	optional uint64 sourceContactId = 32;
	string sourceContactNote = 33;
  string certificateHouseNote = 34;
}


message SuggestRequest {
  string content = 1;
}

message CreateProductForUserRequest {
  ProductSaveRequest product = 1;
  uint64 profileId = 2;
  bool isOwner = 3;
  uint64 roleId = 4;
}

message CreateProductForOrgRequest {
  ProductSaveRequest product = 1;
  uint64 organizationId = 2;
  bool isOwner = 3;
  uint64 roleId = 4;
}

message CreateProductResponse {
  uint64 productId = 1;
  string message = 2;
}

message EmptyRequest {}

message ProductSummaryResponse {
  int64 totalProducts = 1;
  int64 sellingProducts = 2;
  double totalValue = 3;
}

// Messages cho Product-Asset linking
message LinkProductAssetRequest {
  repeated uint64 productIds = 1; // Nhiều sản phẩm
  uint64 assetId = 2;             // 1 tài sản
}

message UnlinkProductAssetRequest {
  uint64 productId = 1;
  uint64 assetId = 2;
}

message ProductAssetListResponse {
  repeated Asset data = 1;
}

message PriceHistoryRequest {
  uint64 id = 1;
  uint32 page = 2;
  uint32 size = 3;
}

message PriceHistoryResponse {
  repeated PriceHistoryItem data = 1;
  int64 total = 2;
}

message PriceHistoryItem {
  uint64 id = 1;
  uint64 productId = 2;
  ProductTransactionType transactionType = 3;
  string currency = 4;
  double old = 5;
  double new = 6;
  string createdAt = 7;
  sharepb.ProfileItem createdBy = 8;
  string changeNote = 9;
}

message Price {
  SalePrice sale = 1;
  RentPrice rent = 2;
}

message SalePrice {
  double price = 1;
  double commission = 2;
  uint32 commission_type = 3;
  double deposit = 4;
}

message RentPrice {
  double price = 1;
  double commission = 2;
  uint32 commission_type = 3;
  uint32 payment_cycle = 4;
}

message ProductNavigationResponse {
  uint64 previousId = 1; // ID sản phẩm trước đó (0 nếu không có)
  uint64 nextId = 2;     // ID sản phẩm tiếp theo (0 nếu không có)
}