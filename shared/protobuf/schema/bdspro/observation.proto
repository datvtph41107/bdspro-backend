syntax = "proto3";

package bdspropb;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "shared/common.proto";

option go_package = "pb/types/bdspro;bdspropb";

service ObservationService {
  rpc TrackObservation(TrackObservationRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v2/bdspro/v2/observation"
      body: "events"
    };
  };

  rpc GetProductStatsObservation(GetProductStatsRequest) returns (ProductStatsResponse) {
    option (google.api.http) = {
      get: "/v2/bdspro/v2/product/{productId}/stats"
    };
  };
}

message ObservationEvent {
  string event      = 1; // view_post | view_profile | etc.
  uint64 ref_id     = 2; // id của entity được reference
  uint64 start_time = 3; // timestamp bắt đầu event
  uint64 end_time   = 4; // timestamp kết thúc event (optional)
  uint32 duration   = 5; // thời gian duration (ms) (optional)
  string screen     = 6; // tên screen (optional)
}

message TrackObservationRequest {
  repeated ObservationEvent events = 1; // danh sách các events
}

message GetProductStatsRequest {
  uint64 productId = 1;
}

message ProductStatsResponse {
  uint64 productId     = 1;
  uint64 viewCount     = 2; // số người xem unique
  uint64 totalDuration = 3; // tổng thời gian xem (giây)
}
