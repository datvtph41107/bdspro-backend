syntax = "proto3";

package appointment;

import "google/protobuf/empty.proto";
import "organization/organization.proto";
import "organization/deal.proto";
import "organization/deal_invitation.proto";
import "bdspro/common.proto";
import "shared/common.proto";
import "transaction/internal.proto";

option go_package = "github.com/tuandq2112/protobuf/schema/appointment";

import "google/api/annotations.proto";


service AppointmentService {

  rpc CreateAppointment(CreateAppointmentRequest) returns (Appointment) {
    option (google.api.http) = {
        post: "/v2/appointment"
        body: "*"
    };
  }
  rpc GetAppointment(GetAppointmentRequest) returns (Appointment) {
    option (google.api.http) = {
        get: "/v2/appointment/{id}"
    };
  }

  rpc UpdateAppointment(UpdateAppointmentRequest) returns (Appointment) {
    option (google.api.http) = {
        put: "/v2/appointment/{id}"
        body: "*"
    };
  }

  rpc DeleteAppointment(DeleteAppointmentRequest) returns (DeleteAppointmentResponse) {
    option (google.api.http) = {
        delete: "/v2/appointment/{id}"
    };
  }
  
  rpc ListAppointments(ListAppointmentsRequest) returns (ListAppointmentsResponse) {
    option (google.api.http) = {
        get: "/v2/appointment"
    };
  }
}

message Appointment {
  uint32 id = 1;
  string title = 2;
  string startTime = 4;
  string endTime = 5;
  string place = 6;
  repeated uint32 participantIds = 7;
  uint32 dealId = 8;
  repeated uint32 productIds = 9;
  string description = 10;
  uint32 reminderSchedule = 11;
  uint32 mode = 12;
  repeated uint32 transactionIds = 13;
  organizationpb.GroupDeal deal = 14;
  repeated transactionpb.DealContractResponse dealTransactions = 15;
  repeated sharepb.ProfileItem participants = 16;
  repeated pb_bdspro.ProductAttachment products = 17;
  uint32 optionExtend = 18;
  uint32 status = 19;
}

message CreateAppointmentRequest {
  string title = 1;
  string startTime = 2;
  string endTime = 3;
  string place = 4;
  repeated uint32 participantIds = 5;
  uint32 dealId = 6;
  repeated uint32 productIds = 7;
  string description = 8;
  uint32 reminderSchedule = 9;
  uint32 mode = 10;
  uint32 optionExtend = 11;
  repeated uint32 transactionIds = 12; 
  uint32 status = 13;
}

message GetAppointmentRequest {
  uint32 id = 1;
}

message UpdateAppointmentRequest {
  uint32 id = 1;
  string title = 2;
  string startTime = 3;
  string endTime = 4;
  string place = 5;
  repeated uint32 participantIds = 6;
  uint32 dealId = 7;
  repeated uint32 productIds = 8;
  string description = 9;
  uint32 reminderSchedule = 10;
  uint32 mode = 11;
  repeated uint32 transactionIds = 12;
  uint32 optionExtend = 13;
  uint32 status = 14;
}

message DeleteAppointmentRequest {
  uint32 id = 1;
}

message DeleteAppointmentResponse {
  uint32 id = 1;
}

message ListAppointmentsRequest {
  string title = 1;
  uint32 status = 2;
  string startTime = 3;
  string endTime = 4;
  optional int32 page = 5;
  optional int32 size = 6;
}

message ListAppointmentsResponse {
  repeated Appointment data = 1;
  int32 total = 2;
} 