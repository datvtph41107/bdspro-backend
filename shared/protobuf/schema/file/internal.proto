syntax = "proto3";

package filepb;

option go_package = "pb/types/file;filepb";

// InternalFileService chỉ dùng giữa các backend service qua gRPC.
// Proto này không có HTTP annotation.
service InternalFileService {
  rpc UploadFile(UploadFileRequest) returns (UploadFileResponse);
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
}

message UploadFileRequest {
  bytes content = 1;
  string filename = 2;
  string contentType = 3;
  string description = 4;
  bool secure = 5;
}

message UploadFileResponse {
  uint64 fileId = 1;
  string path = 2;
  string filename = 3;
  string contentType = 4;
  int64 size = 5;
}

message ReadFileRequest {
  string path = 1;
}

message ReadFileResponse {
  bytes content = 1;
  string contentType = 2;
}
