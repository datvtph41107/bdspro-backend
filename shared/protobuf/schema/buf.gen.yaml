version: v1
plugins:
    - name: go
      out: ../types
      opt:
          - paths=source_relative
    - name: go-grpc
      out: ../types
      opt:
          - paths=source_relative
    - name: grpc-gateway
      out: ../types
      opt:
          - paths=source_relative
          - generate_unbound_methods=true
