syntax = "proto3";

package feedbackpb;

option go_package = "pb/types/feedback;feedbackpb";

import "shared/common.proto";
import "shared/v3.proto";

// Internal Service - Internal operations for feedback service
service InternalService {
  rpc RegisterEntity(FeedbackRegistry) returns (sharepb.SubmitResponse);
  rpc GetRateStats(sharepb.IdRequest) returns (sharepb.RateStatsV3Proto);
  rpc GetReportIdByOwnerIdAndUserId(GetReportIdRequest) returns (GetReportIdResponse);
}

// Internal Messages
message FeedbackRegistry {
  uint32 registry_key = 1;
  string registry_name = 2;
  int32 port = 3;
  string service = 4;
}
