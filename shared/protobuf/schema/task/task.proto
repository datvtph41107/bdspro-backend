syntax = "proto3";

package pb_task;
option go_package = "types/task";

service TaskService {
  rpc MakeTask (TaskBatchRequest) returns (TaskResponse);
}

message Empty {}

message TaskBatchRequest {
  repeated TaskRequest data = 1;
}

message TaskRequest {
    int32 type = 1;
    uint64 targetId = 2;
    string service = 3;
}

message TaskResponse {
  uint64 id = 1;
  string name = 2;
  string code = 3;
}