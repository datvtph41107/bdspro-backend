syntax = "proto3";

package tqdpb;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

option go_package = "pb/types/tqd;tqdpb";

service QHLayerLandUseGroupService {

  rpc CreateLayerLandUseGroup(CreateLayerLandUseGroupRequest) returns (QHLayerLandUseGroupResponse) {
    option (google.api.http) = {
      post: "/v2/tqd/qh/admin/layer-land-use-groups"
      body: "*"
    };
  }

  rpc BatchCreateLayerLandUseGroups(BatchCreateLayerLandUseGroupsRequest) returns (BatchCreateLayerLandUseGroupsResponse) {
    option (google.api.http) = {
      post: "/v2/tqd/qh/admin/layer-land-use-groups/batch"
      body: "*"
    };
  }

  rpc GetLayerLandUseGroup(GetLayerLandUseGroupRequest) returns (QHLayerLandUseGroupResponse) {
    option (google.api.http) = {
      get: "/v2/tqd/qh/admin/layer-land-use-groups/{id}"
    };
  }

  rpc UpdateLayerLandUseGroup(UpdateLayerLandUseGroupRequest) returns (QHLayerLandUseGroupResponse) {
    option (google.api.http) = {
      put: "/v2/tqd/qh/admin/layer-land-use-groups/{id}"
      body: "*"
    };
  }

  rpc DeleteLayerLandUseGroup(DeleteLayerLandUseGroupRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v2/tqd/qh/admin/layer-land-use-groups/{id}"
    };
  }

  rpc ListLayerLandUseGroups(ListLayerLandUseGroupsRequest) returns (ListLayerLandUseGroupsResponse) {
    option (google.api.http) = {
      get: "/v2/tqd/qh/admin/layer-land-use-groups/list"
    };
  }

  rpc ListClientLayerLandUseGroups(ListClientLayerLandUseGroupsRequest) returns (ListLayerLandUseGroupsResponse) {
    option (google.api.http) = {
      get: "/v2/tqd/client/layers/{layerId}/land-use-groups"
    };
  }
}

message CreateLayerLandUseGroupRequest {
  uint64 layerId = 1;
  uint64 landUseGroupId = 2;
  string note = 3;
  int32 displayOrder = 4;
  bool isVisible = 5;
  string color = 6;
}

message BatchCreateLayerLandUseGroupItem {
  uint64 landUseGroupId = 1;
  string note = 2;
  int32 displayOrder = 3;
  bool isVisible = 4;
  string color = 5;
}

message BatchCreateLayerLandUseGroupsRequest {
  uint64 layerId = 1;
  repeated BatchCreateLayerLandUseGroupItem items = 2;
}

message BatchCreateLayerLandUseGroupsResponse {
  repeated QHLayerLandUseGroupResponse created = 1;
  repeated uint64 skippedGroupIds = 2;
}

message GetLayerLandUseGroupRequest {
  uint64 id = 1;
}

message UpdateLayerLandUseGroupRequest {
  uint64 id = 1;
  optional uint64 layerId = 2;
  optional uint64 landUseGroupId = 3;
  optional string note = 4;
  optional int32 displayOrder = 5;
  optional bool isVisible = 6;
  optional string color = 7;
}

message DeleteLayerLandUseGroupRequest {
  uint64 id = 1;
}

message ListLayerLandUseGroupsRequest {
  uint32 page = 1;
  uint32 size = 2;
  optional uint64 layerId = 3;
  optional uint64 landUseGroupId = 4;
}

message ListClientLayerLandUseGroupsRequest {
  uint64 layerId = 1;
  uint32 page = 2;
  uint32 size = 3;
}

message QHLayerLandUseGroupResponse {
  uint64 id = 1;
  uint64 layerId = 2;
  uint64 landUseGroupId = 3;
  string note = 4;
  int32 displayOrder = 5;
  bool isVisible = 6;
  string color = 7;
  optional LandUseGroupInfo landUseGroupInfo = 8;
  string createdAt = 9;
  string updatedAt = 10;
}

message LandUseGroupInfo {
  uint64 id = 1;
  string code = 2;
  string name = 3;
  string description = 4;
  string color = 5;
  bool canBuild = 6;
  int32 priority = 7;
}

message ListLayerLandUseGroupsResponse {
  repeated QHLayerLandUseGroupResponse data = 1;
  int64 total = 2;
  int32 page = 3;
  int32 pageSize = 4;
}
