syntax = "proto3";

package tqdpb;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "tqd/region.proto";
import "tqd/qh_label.proto";

option go_package = "pb/types/tqd;tqdpb";

// =====================================================
// REGION LABEL SERVICE
// =====================================================

service RegionLabelService {
  
  // ========== Gán label ==========
  
  // AssignLabelsToRegion - Gán label (THAY THẾ toàn bộ)
  rpc AssignLabelsToRegion(AssignLabelsToRegionRequest) returns (AssignLabelsToRegionResponse) {
    option (google.api.http) = {
      put: "/v2/tqd/admin/regions/{regionId}/labels"
      body: "*"
    };
  }
  
  // AddLabelsToRegion - THÊM label (giữ nguyên label cũ)
  rpc AddLabelsToRegion(AddLabelsToRegionRequest) returns (AddLabelsToRegionResponse) {
    option (google.api.http) = {
      post: "/v2/tqd/admin/regions/{regionId}/labels"
      body: "*"
    };
  }
  
  // RemoveLabelFromRegion - Gỡ label
  rpc RemoveLabelFromRegion(RemoveLabelFromRegionRequest) returns (RemoveLabelFromRegionResponse) {
    option (google.api.http) = {
      delete: "/v2/tqd/admin/regions/{regionId}/labels/{labelId}"
    };
  }
  
  // ========== Truy vấn ==========
  
  // GetLabelsByRegion - Lấy labels của region
  rpc GetLabelsByRegion(GetLabelsByRegionRequest) returns (GetLabelsByRegionResponse) {
    option (google.api.http) = {
      get: "/v2/tqd/admin/regions/{regionId}/labels"
    };
  }
  
  // GetRegionsByLabel - Lấy regions theo label
  rpc GetRegionsByLabel(GetRegionsByLabelRequest) returns (GetRegionsByLabelResponse) {
    option (google.api.http) = {
      get: "/v2/tqd/admin/labels/{labelId}/regions"
    };
  }
  
  // ========== Batch ==========
  
  // BatchAssignLabels - Gán label hàng loạt
  rpc BatchAssignLabels(BatchAssignLabelsRequest) returns (BatchAssignLabelsResponse) {
    option (google.api.http) = {
      post: "/v2/tqd/admin/regions/labels/batch"
      body: "*"
    };
  }
}

// =====================================================
// REQUEST MESSAGES
// =====================================================

message AssignLabelsToRegionRequest {
  uint64 regionId = 1;
  repeated uint64 labelIds = 2;
  optional string notes = 3;
}

message AssignLabelsToRegionResponse {
  bool success = 1;
  string message = 2;
  uint64 regionId = 3;
  repeated uint64 labelIds = 4;
}

message AddLabelsToRegionRequest {
  uint64 regionId = 1;
  repeated uint64 labelIds = 2;
  optional string notes = 3;
}

message AddLabelsToRegionResponse {
  bool success = 1;
  string message = 2;
  uint64 regionId = 3;
  repeated uint64 labelIds = 4;
}

message RemoveLabelFromRegionRequest {
  uint64 regionId = 1;
  uint64 labelId = 2;
}

message RemoveLabelFromRegionResponse {
  bool success = 1;
  string message = 2;
  uint64 regionId = 3;
  uint64 labelId = 4;
}

message GetLabelsByRegionRequest {
  uint64 regionId = 1;
}

message GetLabelsByRegionResponse {
  repeated QHLabelResponse data = 1;
  int32 total = 2;
}

message GetRegionsByLabelRequest {
  uint64 labelId = 1;
  optional uint64 layerId = 2;
  uint32 page = 3;
  uint32 size = 4;
}

message GetRegionsByLabelResponse {
  repeated RegionResponse data = 1;
  int64 total = 2;
  int32 page = 3;
  int32 pageSize = 4;
}

message BatchAssignLabelsRequest {
  repeated uint64 regionIds = 1;
  repeated uint64 labelIds = 2;
  string operation = 3;                // "add", "remove", "set"
  optional string notes = 4;
}

message BatchAssignLabelsResponse {
  int32 successCount = 1;
  int32 failureCount = 2;
  string message = 3;
  repeated BatchAssignFailure failures = 4;
}

message BatchAssignFailure {
  uint64 regionId = 1;
  string reason = 2;
}