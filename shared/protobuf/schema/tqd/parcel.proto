}

message ParcelInfo {
  uint64 id = 1;
  string addressStr = 2;
  uint32 mapNumber = 3;
  uint32 landNumber = 4;
  double lat = 5;
  double lng = 6;
  uint64 parcelId = 7;
  sharepb.ItemV3Proto shape = 8;
