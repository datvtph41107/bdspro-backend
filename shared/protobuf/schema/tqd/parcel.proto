syntax = "proto3";

package tqdpb;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "shared/common.proto";
import "tqd/features.proto";

option go_package = "pb/types/tqd;tqdpb";

service ParcelService {
  rpc CreateBatchParcels(ParcelListDTO) returns (ParcelListDTO) {
    option (google.api.http) = {
      post: "/v2/tqd/parcels/batch"
      body: "*"
    };
  }
  rpc FindParcelByLocation(FindParcelByLocationRequest) returns (Parcel) {
    option (google.api.http) = {
      post: "/v2/tqd/parcels/by-location"
      body: "*"
    };
  }
  rpc FindParcelsByPolygon(FindParcelsByPolygonRequest) returns (FindParcelsByPolygonResponse) {
    option (google.api.http) = {
      post: "/v2/tqd/parcels/by-polygon"
      body: "*"
    };
  }
}

message FindParcelsByPolygonRequest {
  string geoJson = 1;
  repeated Point coordinates = 6;
  
  double maxAreaKm2 = 2;
  int32 page = 3;
  int32 pageSize = 4;
  bool allowAutoShrink = 5;
}

message FindParcelsByPolygonResponse {
  repeated Parcel data = 1;
  int32 total = 2;
  int32 page = 3;
  int32 pageSize = 4;
  string adjustedGeoJson = 5;
  string adjustmentReason = 6;
  double originalAreaKm2 = 7;
  double adjustedAreaKm2 = 8;
  double maxAllowedAreaKm2 = 9;
  string warning = 10;
}

message FindParcelByLocationRequest {
  double latitude = 1;
  double longitude = 2;
  double radius = 3;
}

message Parcel {
  uint64 id = 1;
  string name = 2;
  double latitude = 3;
  double longitude = 4;
  bytes geometry = 5;
  double minLat = 6;
  double minLng = 7;
  double maxLat = 8;
  double maxLng = 9;
}

message GetParcelRequest {
  int32 id = 1;
}

message ListParcelsRequest {
  int32 page = 1;
  int32 pageSize = 2;
}

message ListParcelsResponse {
  repeated Parcel parcels = 1;
  int32 total = 2;
}

message ParcelListDTO {
  repeated Parcel data = 1;
}
