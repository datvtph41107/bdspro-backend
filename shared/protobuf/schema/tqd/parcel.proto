syntax = "proto3";

package tqdpb;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "shared/common.proto";
import "tqd/features.proto";
import "shared/v3.proto";

option go_package = "pb/types/tqd;tqdpb";

service ParcelService {
  rpc CreateBatchParcels(ParcelListDTO) returns (ParcelListDTO) {
    option (google.api.http) = {
      post: "/v2/tqd/parcels/batch"
      body: "*"
    };
  }
  
  rpc FindParcelByLocation(FindParcelByLocationRequest) returns (Parcel) {
    option (google.api.http) = {
      post: "/v2/tqd/parcels/by-location"
      body: "*"
    };
  }
  rpc FindParcelsByPolygon(FindParcelsByPolygonRequest) returns (FindParcelsByPolygonResponse) {
    option (google.api.http) = {
      post: "/v2/tqd/parcels/by-polygon"
      body: "*"
    };
  }
  rpc PreviewParcelsById(sharepb.RequestV3Proto) returns (ParcelInfo) {
    option (google.api.http) = {
      get: "/v2/tqd/parcels/preview/{id}"
    };
  }

  rpc PublicParcelsById(sharepb.RequestV3Proto) returns (ParcelInfo) {
    option (google.api.http) = {
      get: "/v2/tqd/parcels/public/{id}"
    };
  }

  // GetClientLayer - Chi tiết layer cho client (public)
  rpc SearchTxtClientParcels(sharepb.RequestV3Proto) returns (ListParcelResponse) {
    option (google.api.http) = {
      get: "/v2/tqd/client/parcels/search"
    };
  }

  rpc GetParcelInfo(GetParcelDetailRequest) returns (ParcelInfoResponse) {
    option (google.api.http) = {
      get: "/v2/tqd/parcels/{parcelId}/info"
    };
  }
  
  // Overview — Tổng quan quy hoạch (Free): layers, regions, geometry, basic risk
  rpc GetParcelOverview(GetParcelDetailRequest) returns (ParcelOverviewResponse) {
    option (google.api.http) = {
      get: "/v2/tqd/parcels/{parcelId}/overview"
    };
  }

  // Assessment — Đánh giá chuyên sâu (VIP): conflicts, landUseGroups, assessment, 3 modes
  rpc GetParcelAssessment(GetParcelAssessmentRequest) returns (ParcelAssessmentResponse) {
    option (google.api.http) = {
      get: "/v2/tqd/parcels/{parcelId}/assessment"
    };
  }

  // Timeline — Lịch sử biến động quy hoạch của thửa đất
  rpc GetParcelTimeline(GetParcelDetailRequest) returns (ParcelTimelineResponse) {
    option (google.api.http) = {
      get: "/v2/tqd/parcels/{parcelId}/timeline"
    };
  }

  // LayerHistory — Lịch sử phiên bản của 1 layer
  rpc GetLayerHistory(GetLayerHistoryRequest) returns (LayerHistoryResponse) {
    option (google.api.http) = {
      get: "/v2/tqd/layers/{layerId}/history"
    };
  }
}

message GetParcelAssessmentRequest {
  uint64 parcelId = 1;      // parcel_id
  string mode = 2;          // popup, detail, compare
  string preset = 3;        // active_only, all_layers
  string asOfDate = 4;      // as_of_date (YYYY-MM-DD)
  int64 timestamp = 5;
}

message ParcelAssessmentResponse {
  uint64 parcelId = 1;                // parcel_id
  double parcelAreaSqm = 2;           // parcel_area_sqm
  PlanDetailInfo currentPlan = 3;     // current_plan
  repeated PlanDetailInfo otherPlans = 4;  // other_plans
  bool hasConflict = 5;               // has_conflict
  repeated ConflictDetail conflicts = 6;
  AssessmentResponse assessment = 7;
  ResponseMetadataInfo metadata = 8;
  uint32 riskScore = 9;               // risk_score (0-100)
  string riskLevel = 10;              // risk_level (LOW/MEDIUM/HIGH/CRITICAL)
  repeated string riskReasons = 11;   // risk_reasons
  string resolutionStatus = 12;       // resolution_status
  repeated ConflictDetail infoConflicts = 13;  // info_conflicts
  CompareResult compareResult = 14;   // compare_result
  HistoricalRisk historicalRisk = 15; // historical_risk
  repeated LayerDetail layers = 16;   // layers (detail mode)
}

message PlanDetailInfo {
  uint64 layerId = 1;
  string layerName = 2;
  string displayName = 3;
  string landUseCode = 4;
  string landUseName = 5;
  string landUseColor = 6;
  string groupCode = 7;
  double impactPercent = 8;
  double impactAreaSqm = 9;
  repeated PlanLandUseGroupDetail landUseGroups = 10;
  string legalCanonical = 11;         // legal_canonical
  string legalConfidence = 12;        // legal_confidence
  string legalActiveState = 13;       // legal_active_state
}

message PlanLandUseGroupDetail {
  string code = 1;
  string name = 2;
  string color = 3;
  bool canBuild = 4;
  int32 priority = 5;
  string landUseCode = 6;
  string landUseName = 7;
  string landUseColor = 8;
  double overlapPercent = 9;
  double overlapAreaSqm = 10;
}

message ConflictDetail {
  string type = 1;
  string severity = 2;
  string description = 3;
  string recommendation = 4;
  string actionRequired = 5;        // action_required
  double affectedPercent = 6;       // affected_percent
}

message AssessmentResponse {
  BuildabilityResponse buildability = 1;
  string summary = 2;
  string verdict = 3;
}

message BuildabilityResponse {
  bool canBuild = 1;                // can_build
  string status = 2;
  string reason = 3;
  string recommendation = 4;
}

message ResponseMetadataInfo {
  int64 responseTimeMs = 1;         // response_time_ms
  string dataVersion = 2;           // data_version
  bool isCached = 3;                // is_cached
  string disclaimer = 4;
}

message GetParcelDetailRequest {
  uint64 parcelId = 1;
  int64 timestamp = 2;
}

message ParcelInfoResponse {
  uint64 parcelId = 1;
  double lat = 2;
  double lon = 3;
  double areaSqm = 4;
  string address = 5;
  bytes geometry = 6;

  string mapNumber = 7;
  string landNumber = 8;
  string propertyCode = 9;
  string propertyUuid = 10;
  string shape = 11;
  string direction = 12;

  string landUseCode = 13;
  string landUseName = 14;
  string landUseColor = 15;

  string province = 16;
  string provinceCode = 17;
  string wardCode = 18;
}

message ParcelSummary {
  string dominantLandUse = 1;
  double dominantPercentage = 2;
  double totalAffectedPercentage = 3;
  string topLayerName = 4;
  bool buildable = 5;
}

message ParcelOverviewResponse {
  uint64 parcelId = 1;
  double parcelAreaSqm = 2;

  ParcelSummary summary = 3;
  repeated Layer layers = 4;

  double totalOverlapArea = 5;
  double totalOverlapPercent = 6;
  uint32 layersAffected = 7;
  uint32 labelsAffected = 8;
  uint32 regionsAffected = 9;
  bool hasConflict = 10;
  string warning = 11;

  string riskLevel = 12;
  uint32 riskScore = 13;
  bool canBuild = 14;
  repeated string riskReasons = 15;
  string recommendation = 16;

  string dataSource = 17;
  string queriedAt = 18;
  int64 responseTimeMs = 19;
  bool spatialDataAvailable = 20;

  // Region có overlapArea lớn nhất trên thửa (kết luận chủ đạo).
  Region conclude_label = 21;
}

message Layer {
  uint64 id = 1;
  string name = 2;
  string displayName = 3;
  uint32 type = 4;
  string severity = 5;
  string effectiveDate = 6;
  string legalDoc = 7;
  repeated Label labels = 8;
  double totalArea = 9;
  double totalPercent = 10;
  repeated LayerLegalDocInfo legalDocs = 11;
  optional AuthorityIssuingInfo authorityIssuing = 12;
}

message LayerLegalDocInfo {
  uint64 id = 1;
  string name = 2;
  string fileUrl = 3;
  string fileType = 4;
}

message AuthorityIssuingInfo {
  uint64 id = 1;
  string name = 2;
  string code = 3;
  string description = 4;
}

message Label {
  uint64 id = 1;
  string name = 2;
  string displayName = 3;
  string color = 4;
  uint32 fontSize = 5;
  string fontWeight = 6;
  uint32 minZoom = 7;
  uint32 maxZoom = 8;
  repeated Region regions = 9;
  double totalArea = 10;
  double totalPercent = 11;
}

message Region {
  uint64 id = 1;
  string name = 2;
  string displayName = 3;
  string landUseCode = 4;
  string landUseName = 5;
  string landUseGroup = 6;
  RGBColor color = 7;
  double overlapArea = 8;
  double overlapPercent = 9;
  double centerLat = 10;
  double centerLng = 11;
  bytes geometry = 12;
}

message RGBColor {
  uint32 red = 1;
  uint32 green = 2;
  uint32 blue = 3;
}

message FindParcelsByPolygonRequest {
  repeated Point coordinates = 1;
  double maxAreaKm2 = 2;
  uint32 page = 3;
  uint32 size = 4;
  bool allowAutoShrink = 5;
  bool intersect = 6;
  int64 timestamp = 7;
}

message FindParcelsByPolygonResponse {
  repeated Parcel data              = 1;
  int32           total             = 2;
  int32           page              = 3;
  int32           pageSize          = 4;
  string          adjustedGeoJson   = 5;
  string          adjustmentReason  = 6;
  double          originalAreaKm2   = 7;
  double          adjustedAreaKm2   = 8;
  double          maxAllowedAreaKm2 = 9;
  string          warning           = 10;
}

message FindParcelByLocationRequest {
  double latitude  = 1;
  double longitude = 2;
  double radius    = 3;
  int64 timestamp  = 4;
}

message Parcel {
  uint64 id        = 1;
  string name      = 2;
  double latitude  = 3;
  double longitude = 4;
  bytes  geometry  = 5;
  double minLat    = 6;
  double minLng    = 7;
  double maxLat    = 8;
  double maxLng    = 9;
}

message ParcelInfo {
  uint64              id         = 1;
  string              addressStr = 2;
  uint32              mapNumber  = 3;
  uint32              landNumber = 4;
  double              lat        = 5;
  double              lng        = 6;
  uint64              parcelId   = 7;
  sharepb.ItemV3Proto shape      = 8;
  uint32              facade     = 9;
  double              totalArea  = 10;
  sharepb.ItemV3Proto landType   = 11;
  bytes               geometry   = 12;
  repeated sharepb.ItemV3Proto directions  = 13;
}

message GetParcelRequest {
  int32 id = 1;
}

message ListParcelsRequest {
  uint32 page = 1;
  uint32 size = 2;
}

message ListParcelsResponse {
  repeated Parcel parcels = 1;
  int32           total   = 2;
}

// ─── Compare & Historical Risk messages ───

message CompareResult {
  int32 totalLayers = 1;
  repeated CompareChange changes = 2;
}

message CompareChange {
  uint64 layerId = 1;
  string layerName = 2;
  string changeType = 3;
  string oldValue = 4;
  string newValue = 5;
}

message HistoricalRisk {
  string trend = 1;
  string trendDetail = 2;
  int32 activeLayers = 3;
  int32 expiringLayers = 4;
  string analyzedAt = 5;
}

message LayerDetail {
  uint64 id = 1;
  string name = 2;
  string displayName = 3;
  uint32 type = 4;
  string effectiveDate = 5;
  repeated LabelDetail labels = 6;
  repeated LegalDocDetail legalDocs = 7;
  AuthorityDetail authority = 8;
  double totalArea = 9;
  double totalPct = 10;
}

message LabelDetail {
  uint64 id = 1;
  string name = 2;
  string displayName = 3;
  string color = 4;
  repeated RegionDetail regions = 5;
  double totalArea = 6;
  double totalPct = 7;
}

message RegionDetail {
  uint64 id = 1;
  string name = 2;
  string displayName = 3;
  string landUseCode = 4;
  string landUseName = 5;
  uint32 colorRed = 6;
  uint32 colorGreen = 7;
  uint32 colorBlue = 8;
  double overlapAreaSqm = 9;
  double overlapPct = 10;
  bytes geometry = 11;
}

message LegalDocDetail {
  uint64 id = 1;
  string name = 2;
  string fileUrl = 3;
  string fileType = 4;
}

message AuthorityDetail {
  uint64 id = 1;
  string name = 2;
  string code = 3;
  string description = 4;
}

// ─── Timeline messages ───

message ParcelTimelineResponse {
  uint64 parcelId = 1;
  repeated TimelineEvent events = 2;
  TimelineSummary summary = 3;
}

message TimelineEvent {
  string id = 1;
  string date = 2;
  string eventType = 3;
  uint64 layerId = 4;
  string layerName = 5;
  string description = 6;
}

message TimelineSummary {
  int32 totalEvents = 1;
  string firstEventAt = 2;
  string lastEventAt = 3;
  repeated string majorChanges = 4;
}

// ─── LayerHistory messages ───

message GetLayerHistoryRequest {
  uint64 layerId = 1;
}

message LayerHistoryResponse {
  uint64 layerId = 1;
  uint64 familyId = 2;
  repeated LayerVersionInfo versions = 3;
  uint64 currentId = 4;
}

message LayerVersionInfo {
  int32 version = 1;
  uint64 layerId = 2;
  string state = 3;
  string createdAt = 4;
  string createdBy = 5;
  bool isLatest = 6;
  repeated LifecycleTransitionInfo transitions = 7;
}

message LifecycleTransitionInfo {
  string fromState = 1;
  string toState = 2;
  string timestamp = 3;
  string actor = 4;
  string reason = 5;
  string legalDoc = 6;
}

message ParcelListDTO {
  repeated Parcel data = 1;
}

message ListParcelResponse {
  repeated ParcelInfo data  = 1;
  uint32              total = 2;
}