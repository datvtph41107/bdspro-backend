syntax = "proto3";

package tqdpb;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "shared/common.proto";
import "tqd/features.proto";
import "shared/v3.proto";

option go_package = "pb/types/tqd;tqdpb";

service ParcelService {
  rpc CreateBatchParcels(ParcelListDTO) returns (ParcelListDTO) {
    option (google.api.http) = {
      post: "/v2/tqd/parcels/batch"
      body: "*"
    };
  }
  
  rpc FindParcelByLocation(FindParcelByLocationRequest) returns (Parcel) {
    option (google.api.http) = {
      post: "/v2/tqd/parcels/by-location"
      body: "*"
    };
  }
  rpc FindParcelsByPolygon(FindParcelsByPolygonRequest) returns (FindParcelsByPolygonResponse) {
    option (google.api.http) = {
      post: "/v2/tqd/parcels/by-polygon"
      body: "*"
    };
  }
  rpc PreviewParcelsById(sharepb.RequestV3Proto) returns (ParcelInfo) {
    option (google.api.http) = {
      get: "/v2/tqd/parcels/preview/{id}"
    };
  }

  // GetClientLayer - Chi tiết layer cho client (public)
  rpc SearchTxtClientParcels(sharepb.RequestV3Proto) returns (ListParcelResponse) {
    option (google.api.http) = {
      get: "/v2/tqd/client/parcels/search"
    };
  }
  
  rpc GetParcelDetail(GetParcelDetailRequest) returns (ParcelDetailResponse) {
    option (google.api.http) = {
      get: "/v2/tqd/parcels/{parcelId}/charge"
    };
  }
}

message GetParcelDetailRequest {
  uint64 parcelId = 1;
}

message ParcelDetailResponse {
  uint64 parcelId = 1;
  double lat = 2;
  double lon = 3;
  double areaSqm = 4;
  string address = 5;
  bytes geometry = 6;  // GeoJSON
  
  string mapNumber = 7;
  string landNumber = 8;
  string propertyCode = 9;
  string propertyUuid = 10;
  string shape = 11;
  string direction = 12;
  
  // === Loại đất hiện tại ===
  string landUseCode = 13;
  string landUseName = 14;
  string landUseColor = 15;
  
  // === Hành chính ===
  string province = 16;
  string provinceCode = 17;
  string wardCode = 18;
  
  // === Các layer quy hoạch ảnh hưởng ===
  repeated Layer layers = 19;
  
  // === Thống kê ===
  double totalOverlapArea = 20;
  double totalOverlapPercent = 21;
  uint32 layersAffected = 22;
  uint32 labelsAffected = 23;
  uint32 regionsAffected = 24;
  bool hasConflict = 25;
  string warning = 26;
  
  string riskLevel = 27;      // LOW, MEDIUM, HIGH, CRITICAL
  uint32 riskScore = 28;
  bool canBuild = 29;
  repeated string riskReasons = 30;
  string recommendation = 31;
  
  string dataSource = 32;
  string queriedAt = 33;
  int64 responseTimeMs = 34;
}

message Layer {
  uint64 id = 1;
  string name = 2;
  string displayName = 3;
  string effectiveDate = 4;
  string legalDoc = 5;
  repeated Label labels = 6;
  double totalArea = 7;
  double totalPercent = 8;
}

message Label {
  uint64 id = 1;
  string name = 2;
  string displayName = 3;
  string color = 4;
  repeated Region regions = 5;
  double totalArea = 6;
  double totalPercent = 7;
}

message Region {
  uint64 id = 1;
  string name = 2;
  string landUseCode = 3;
  string landUseName = 4;
  RGBColor color = 5;
  double overlapArea = 6;
  double overlapPercent = 7;
  bytes geometry = 8;  // GeoJSON
}

message RGBColor {
  uint32 red = 1;
  uint32 green = 2;
  uint32 blue = 3;
}

message FindParcelsByPolygonRequest {
  repeated Point coordinates = 1;
  double maxAreaKm2 = 2;
  uint32 page = 3;
  uint32 size = 4;
  bool allowAutoShrink = 5;
  bool intersect = 6;
}

message FindParcelsByPolygonResponse {
  repeated Parcel data              = 1;
  int32           total             = 2;
  int32           page              = 3;
  int32           pageSize          = 4;
  string          adjustedGeoJson   = 5;
  string          adjustmentReason  = 6;
  double          originalAreaKm2   = 7;
  double          adjustedAreaKm2   = 8;
  double          maxAllowedAreaKm2 = 9;
  string          warning           = 10;
}

message FindParcelByLocationRequest {
  double latitude  = 1;
  double longitude = 2;
  double radius    = 3;
}

message Parcel {
  uint64 id        = 1;
  string name      = 2;
  double latitude  = 3;
  double longitude = 4;
  bytes  geometry  = 5;
  double minLat    = 6;
  double minLng    = 7;
  double maxLat    = 8;
  double maxLng    = 9;
}

message ParcelInfo {
  uint64              id         = 1;
  string              addressStr = 2;
  uint32              mapNumber  = 3;
  uint32              landNumber = 4;
  double              lat        = 5;
  double              lng        = 6;
  sharepb.ItemV3Proto direction  = 7;
  sharepb.ItemV3Proto shape      = 8;
  uint32              facade     = 9;
  double              totalArea  = 10;
  sharepb.ItemV3Proto landType   = 11;
  bytes               geometry   = 12;
}

message GetParcelRequest {
  int32 id = 1;
}

message ListParcelsRequest {
  uint32 page = 1;
  uint32 size = 2;
}

message ListParcelsResponse {
  repeated Parcel parcels = 1;
  int32           total   = 2;
}

message ParcelListDTO {
  repeated Parcel data = 1;
}

message ListParcelResponse {
  repeated ParcelInfo data  = 1;
  uint32              total = 2;
}