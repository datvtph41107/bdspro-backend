// tqd/qh_planning.proto
syntax = "proto3";

package tqdpb;

import "google/api/annotations.proto";
import "shared/common.proto";
import "tqd/qh_layer.proto";
import "tqd/planning_client.proto";

option go_package = "pb/types/tqd;tqdpb";

service QHPlanningService {
  // QHPlanningProject APIs
  rpc CreatePlanningProject(PlanningProject) returns (PlanningProject) {
    option (google.api.http) = {
      post: "/v2/tqd/admin/planning-projects"
      body: "*"
    };
  }
  rpc GetPlanningProject(IdRequest) returns (PlanningProject) {
    option (google.api.http) = {
      get: "/v2/tqd/admin/planning-projects/{id}"
    };
  }
  rpc CountPlanningProject(IdRequest) returns (PlanningProjectCountResponse) {
    option (google.api.http) = {
      get: "/v2/tqd/admin/planning-projects/{id}/count"
    };
  }
  rpc UpdatePlanningProject(PlanningProject) returns (PlanningProject) {
    option (google.api.http) = {
      put: "/v2/tqd/admin/planning-projects/{id}"
      body: "*"
    };
  }
  rpc DeletePlanningProject(IdRequest) returns (SubmitResponse) {
    option (google.api.http) = {
      delete: "/v2/tqd/admin/planning-projects/{id}"
    };
  }
  rpc ListPlanningProjects(ListPlanningProjectsRequest) returns (ListPlanningProjectsResponse) {
    option (google.api.http) = {
      get: "/v2/tqd/admin/planning-projects"
    };
  }
  rpc ListPlanningProjectLayers(ListPlanningProjectLayersRequest) returns (ListLayersResponse) {
    option (google.api.http) = {
      get: "/v2/tqd/admin/planning-projects/{planningId}/layers"
    };
  }
  // Assign provinces to planning project
  rpc AdminAssignProvinces(AdminAssignProvincesRequest) returns (SubmitResponse) {
    option (google.api.http) = {
      post: "/v2/tqd/admin/planning-projects/{planningId}/provinces"
      body: "*"
    };
  }
  // Unassign provinces (delete relations)
  rpc AdminUnassignProvinces(AdminUnassignProvincesRequest) returns (SubmitResponse) {
    option (google.api.http) = {
      post: "/v2/tqd/admin/planning-projects/{planningId}/provinces:remove"
      body: "*"
    };
  }
  // Assign wards to planning project
  rpc AdminAssignWards(AdminAssignWardsRequest) returns (SubmitResponse) {
    option (google.api.http) = {
      post: "/v2/tqd/admin/planning-projects/{planningId}/wards"
      body: "*"
    };
  }
  // Unassign wards (delete relations)
  rpc AdminUnassignWards(AdminUnassignWardsRequest) returns (SubmitResponse) {
    option (google.api.http) = {
      post: "/v2/tqd/admin/planning-projects/{planningId}/wards:remove"
      body: "*"
    };
  }
  // UnassignPlanningProjectLayer gỡ layer khỏi đồ án: chỉ xóa layer_plan_doc_relation, không xóa layer.
  rpc UnassignPlanningProjectLayer(UnassignPlanningProjectLayerRequest) returns (SubmitResponse) {
    option (google.api.http) = {
      delete: "/v2/tqd/admin/planning-projects/{planningId}/layers/{layerId}"
    };
  }
  // CreatePlanningProjectFromFolder tạo đồ án + toàn bộ tài liệu từ 1 folder admin chọn.
  // Mỗi file trong folder trở thành 1 PlanningDocument (trạng thái Pending, chờ job AI phân loại).
  rpc CreatePlanningProjectFromFolder(CreatePlanningProjectFromFolderRequest) returns (CreatePlanningProjectFromFolderResponse) {
    option (google.api.http) = {
      post: "/v2/tqd/admin/planning-projects/from-folder"
      body: "*"
    };
  }
  // ApprovePlanningProject phê duyệt đồ án (chỉ khi đã Classified), đồng thời phê duyệt các tài liệu đã Classified.
  rpc ApprovePlanningProject(IdRequest) returns (PlanningProject) {
    option (google.api.http) = {
      post: "/v2/tqd/admin/planning-projects/{id}/approve"
    };
  }
  // RetryFailedPlanningDocuments đưa tất cả tài liệu Failed của đồ án về Pending để job classify chạy lại.
  rpc RetryFailedPlanningDocuments(IdRequest) returns (PlanningProject) {
    option (google.api.http) = {
      post: "/v2/tqd/admin/planning-projects/{id}/retry-failed"
    };
  }

  rpc GetPlanningProjectSeoSource(IdRequest) returns (PlanningProjectSeoSourceResponse) {
    option (google.api.http) = {
      get: "/v2/tqd/internal/planning-projects/{id}/seo-source"
    };
  }

  rpc UpdatePlanningProjectSeoID(UpdatePlanningProjectSeoIDRequest) returns (SubmitResponse) {
    option (google.api.http) = {
      put: "/v2/tqd/internal/planning-projects/{planningProjectId}/seo-id"
      body: "*"
    };
  }

  rpc AdminGenPlanningProjectSeo(AdminGenPlanningProjectSeoRequest) returns (AdminGenPlanningProjectSeoResponse) {
    option (google.api.http) = {
      post: "/v2/tqd/admin/planning-projects/gen-seo"
      body: "*"
    };
  }

  // Pro AI Jobs — tiến trình AI (type Đồ án gắn planning_project_id).
  rpc ListProAIJobs(ListProAIJobsRequest) returns (ListProAIJobsResponse) {
    option (google.api.http) = {
      get: "/v2/tqd/admin/ai-jobs"
    };
  }
  rpc GetProAIJob(IdRequest) returns (ProAIJob) {
    option (google.api.http) = {
      get: "/v2/tqd/admin/ai-jobs/{id}"
    };
  }

  // QHPlanningDocument APIs
  rpc CreatePlanningDocument(PlanningDocument) returns (PlanningDocument) {
    option (google.api.http) = {
      post: "/v2/tqd/admin/planning-documents"
      body: "*"
    };
  }
  rpc GetPlanningDocument(IdRequest) returns (PlanningDocument) {
    option (google.api.http) = {
      get: "/v2/tqd/admin/planning-documents/{id}"
    };
  }
  // UpdatePlanningDocument cập nhật toàn bộ thông tin tài liệu (loại, số liệu, ngày, cơ quan, ngành, lĩnh vực, người ký, ...).
  rpc UpdatePlanningDocument(PlanningDocument) returns (PlanningDocument) {
    option (google.api.http) = {
      put: "/v2/tqd/admin/planning-documents/{id}"
      body: "*"
    };
  }
  rpc DeletePlanningDocument(IdRequest) returns (SubmitResponse) {
    option (google.api.http) = {
      delete: "/v2/tqd/admin/planning-documents/{id}"
    };
  }
  rpc ListPlanningDocuments(ListPlanningDocumentsRequest) returns (ListPlanningDocumentsResponse) {
    option (google.api.http) = {
      get: "/v2/tqd/admin/planning-documents"
    };
  }
  // ApprovePlanningDocument phê duyệt 1 tài liệu đã được AI phân loại (chỉ khi đang Classified).
  rpc ApprovePlanningDocument(IdRequest) returns (PlanningDocument) {
    option (google.api.http) = {
      post: "/v2/tqd/admin/planning-documents/{id}/approve"
    };
  }
  // RetryPlanningDocument đưa 1 tài liệu Failed về Pending để job classify chạy lại.
  rpc RetryPlanningDocument(IdRequest) returns (PlanningDocument) {
    option (google.api.http) = {
      post: "/v2/tqd/admin/planning-documents/{id}/retry"
    };
  }
  rpc GetPlanningDocumentSeoSource(IdRequest) returns (PlanningDocumentSeoSourceResponse) {
    option (google.api.http) = {
      get: "/v2/tqd/internal/planning-documents/{id}/seo-source"
    };
  }
  rpc UpdatePlanningDocumentSeoID(UpdatePlanningDocumentSeoIDRequest) returns (SubmitResponse) {
    option (google.api.http) = {
      put: "/v2/tqd/internal/planning-documents/{planningDocumentId}/seo-id"
      body: "*"
    };
  }
  rpc AdminGenPlanningDocumentSeo(AdminGenPlanningDocumentSeoRequest) returns (AdminGenPlanningDocumentSeoResponse) {
    option (google.api.http) = {
      post: "/v2/tqd/admin/planning-documents/gen-seo"
      body: "*"
    };
  }
  // AssignPlanningDocumentsToLayer gán tài liệu vào layer (cartesian layerIds × docIds trên layer_plan_doc_relation).
  rpc AssignPlanningDocumentsToLayer(AssignPlanningDocumentsToLayerRequest) returns (SubmitResponse) {
    option (google.api.http) = {
      post: "/v2/tqd/admin/layer-docs/assign"
      body: "*"
    };
  }
  // UnassignPlanningDocumentsFromLayer gỡ tài liệu khỏi layer: xóa cứng bản ghi layer_plan_doc_relation.
  rpc UnassignPlanningDocumentsFromLayer(AssignPlanningDocumentsToLayerRequest) returns (SubmitResponse) {
    option (google.api.http) = {
      post: "/v2/tqd/admin/layer-docs/unassign"
      body: "*"
    };
  }
  // Planning document legal histories.
  rpc CreatePlanningDocumentHistory(PlanningDocumentHistory) returns (PlanningDocumentHistory) {
    option (google.api.http) = {
      post: "/v2/tqd/admin/planning-documents/{planningDocumentId}/histories"
      body: "*"
    };
  }
  rpc DeletePlanningDocumentHistory(DeletePlanningDocumentHistoryRequest) returns (SubmitResponse) {
    option (google.api.http) = {
      delete: "/v2/tqd/admin/planning-documents/{planningDocumentId}/histories/{id}"
    };
  }
  rpc ListPlanningDocumentHistories(ListPlanningDocumentHistoriesRequest) returns (ListPlanningDocumentHistoriesResponse) {
    option (google.api.http) = {
      get: "/v2/tqd/client/planning-documents/{planningDocumentId}/histories"
    };
  }

  // QHPlanningEvent APIs — lịch sử pháp lý / timeline đồ án.
  rpc CreatePlanningEvent(PlanningEvent) returns (PlanningEvent) {
    option (google.api.http) = {
      post: "/v2/tqd/admin/planning-events"
      body: "*"
    };
  }
  rpc GetPlanningEvent(IdRequest) returns (PlanningEvent) {
    option (google.api.http) = {
      get: "/v2/tqd/admin/planning-events/{id}"
    };
  }
  rpc UpdatePlanningEvent(PlanningEvent) returns (PlanningEvent) {
    option (google.api.http) = {
      put: "/v2/tqd/admin/planning-events/{id}"
      body: "*"
    };
  }
  rpc DeletePlanningEvent(IdRequest) returns (SubmitResponse) {
    option (google.api.http) = {
      delete: "/v2/tqd/admin/planning-events/{id}"
    };
  }
  rpc ListPlanningEvents(ListPlanningEventsRequest) returns (ListPlanningEventsResponse) {
    option (google.api.http) = {
      get: "/v2/tqd/admin/planning-events"
    };
  }

  // QHPlanningRelation APIs — quan hệ đồ án (parent/child/peer).
  rpc CreatePlanningRelation(PlanningRelation) returns (PlanningRelation) {
    option (google.api.http) = {
      post: "/v2/tqd/admin/planning-relations"
      body: "*"
    };
  }
  rpc GetPlanningRelation(IdRequest) returns (PlanningRelation) {
    option (google.api.http) = {
      get: "/v2/tqd/admin/planning-relations/{id}"
    };
  }
  rpc UpdatePlanningRelation(PlanningRelation) returns (PlanningRelation) {
    option (google.api.http) = {
      put: "/v2/tqd/admin/planning-relations/{id}"
      body: "*"
    };
  }
  rpc DeletePlanningRelation(IdRequest) returns (SubmitResponse) {
    option (google.api.http) = {
      delete: "/v2/tqd/admin/planning-relations/{id}"
    };
  }
  rpc ListPlanningRelations(ListPlanningEventsRequest) returns (ListPlanningRelationsResponse) {
    option (google.api.http) = {
      get: "/v2/tqd/admin/planning-relations"
    };
  }

  // Client APIs
  // gRPC compatibility method. Client HTTP ownership belongs to PlanningClientService.
  rpc ClientGetPlanningProject(IdRequest) returns (PlanningProject);
  // gRPC compatibility method. Client HTTP ownership belongs to PlanningClientService.
  rpc ClientGetPlanningDocument(IdRequest) returns (PlanningDocument);
  rpc ClientListPlanningEvents(ListPlanningEventsRequest) returns (ListPlanningEventsResponse) {
    option (google.api.http) = {
      get: "/v2/tqd/client/planning-projects/{project_id}/timeline"
    };
  }
  rpc ClientListPlanningRelations(ListPlanningEventsRequest) returns (ListPlanningRelationsResponse) {
    option (google.api.http) = {
      get: "/v2/tqd/client/planning-projects/{project_id}/relations"
    };
  }
  rpc ClientCountPlanningProject(PlanningProjectIdRequest) returns (PlanningProjectCountResponse) {
    option (google.api.http) = {
      get: "/v2/tqd/client/planning-projects/{project_id}/count"
    };
  }
  // List planning projects filtered by administrative unit (admId = compositeId)
  // admId is the composite ID ({sourceId}{1=tỉnh|2=phường})
  rpc ClientListPlanningProjects(ClientListPlanningProjectsRequest) returns (ListPlanningProjectsResponse) {
    option (google.api.http) = {
      get: "/v2/tqd/client/planning-projects"
    };
  }
}

message Jurisdiction {
  uint64 id = 1;
  string name = 2;
}

message PlanningProject {
  uint64 id = 1;
  string code = 2;
  string name = 3;
  uint32 planningType = 4;
  string planningTypeName = 17;
  uint32 planningLevel = 5;
  string planningLevelName = 18;
  string authority = 6;
  uint64 jurisdictionId = 7;
  Jurisdiction jurisdiction = 19;
  string summary = 8;
  string approvalDate = 9;
  string effectiveDate = 10;
  string expiryDate = 11;
  string validityStatus = 12;
  string currentVersion = 13;
  string metadata = 14; // JSON string
  string createdAt = 15;
  string updatedAt = 16;
  uint32 legalStatus = 20;
  string legalStatusName = 21;
  repeated LayerResponse layers = 22;
  string sourceFolderName = 23;
  string sourceFolderPath = 24;
  uint32 processStatus = 25;
  string processStatusName = 26;
  string researchScope = 27; // Phạm vi nghiên cứu hiển thị trên hồ sơ đồ án công khai.
  string indicators = 28; // JSON array chỉ tiêu quy hoạch hiển thị trên hồ sơ đồ án công khai.
  optional uint64 seoId = 29;
  // clientView=false ẩn đồ án khỏi API client. Không truyền khi tạo = mặc định true.
  optional bool clientView = 30;
}

message PlanningProjectSeoSourceResponse {
  uint64 planningProjectId = 1;
  string name = 2;
  string slug = 3;
  uint64 seoId = 4;
}

message UpdatePlanningProjectSeoIDRequest {
  uint64 planningProjectId = 1;
  uint64 seoId = 2;
}

message AdminGenPlanningProjectSeoRequest {
  repeated uint64 planningProjectIds = 1;
}

message AdminGenPlanningProjectSeoItem {
  uint64 planningProjectId = 1;
  uint64 seoId = 2;
  string canonicalUrl = 3;
  string slug = 4;
  bool created = 5;
  string message = 6;
}

message AdminGenPlanningProjectSeoResponse {
  repeated AdminGenPlanningProjectSeoItem data = 1;
  int64 total = 2;
  int64 created = 3;
  int64 skipped = 4;
  int64 failed = 5;
  repeated string errors = 6;
}

message PlanningDocumentSeoSourceResponse {
  uint64 planningDocumentId = 1;
  string title = 2;
  string slug = 3;
  uint64 seoId = 4;
}

message UpdatePlanningDocumentSeoIDRequest {
  uint64 planningDocumentId = 1;
  uint64 seoId = 2;
}

message AdminGenPlanningDocumentSeoRequest {
  repeated uint64 docIds = 1;
}

message AdminGenPlanningDocumentSeoItem {
  uint64 planningDocumentId = 1;
  uint64 seoId = 2;
  string canonicalUrl = 3;
  string slug = 4;
  bool created = 5;
  string message = 6;
}

message AdminGenPlanningDocumentSeoResponse {
  repeated AdminGenPlanningDocumentSeoItem data = 1;
  int64 total = 2;
  int64 created = 3;
  int64 skipped = 4;
  int64 failed = 5;
  repeated string errors = 6;
}

message ListPlanningProjectsResponse {
  repeated PlanningProject data = 1;
  int64 total = 2;
}

message AdminAssignProvincesRequest {
  uint64 planningId = 1;
  repeated uint64 provinceIds = 2; // stored as string composite ids
}

message AdminUnassignProvincesRequest {
  uint64 planningId = 1;
  repeated uint64 provinceIds = 2;
}

message AdminAssignWardsRequest {
  uint64 planningId = 1;
  repeated uint64 wardIds = 2;
}

message AdminUnassignWardsRequest {
  uint64 planningId = 1;
  repeated uint64 wardIds = 2;
}

message ClientListPlanningProjectsRequest {
  uint64 admId = 1; // compositeId: {sourceId}{1=tỉnh|2=phường}
  uint32 page = 2;
  uint32 size = 3;
  string search = 4;
}

message PlanningProjectCountResponse {
  int64 timeline = 1;
  int64 tin = 2;
  int64 relation = 3;
  int64 doc = 4;
  int64 layer = 5;
}

message ListPlanningProjectLayersRequest {
  uint64 planningId = 1;
  uint32 page = 2;
  uint32 size = 3;
}

message UnassignPlanningProjectLayerRequest {
  uint64 planningId = 1;
  uint64 layerId = 2;
}

message PlanningDocument {
  uint64 id = 1;
  uint64 planningProjectId = 2;
  string documentType = 3; // Loại tài liệu (ví dụ: Bản đồ, Pháp lý, Thuyết minh).
  string code = 4;
  string title = 5;
  string description = 6;
  string filepath = 7;
  string versionNo = 8;
  string validityStatus = 9; // Tình trạng hiệu lực (còn hiệu lực / hết hiệu lực / ...).
  string issueDate = 10; // Ngày ban hành.
  string issuedDate = 29; // Alias JSON issuedDate (cùng nghĩa issueDate).
  string effectiveDate = 11; // Ngày hiệu lực.
  string metadata = 12; // JSON string
  string createdAt = 13;
  string updatedAt = 14;
  string thumbnail = 15;
  string relativePath = 16;
  uint32 processStatus = 17;
  string processStatusName = 18;
  string classifyError = 19;
  string ext = 20;
  optional uint64 seoId = 21;
  string indicators = 22; // Số liệu / chỉ tiêu của tài liệu, JSON array.
  string authority = 23; // Cơ quan ban hành.
  string sector = 24; // Ngành (phân loại chuyên môn của tài liệu).
  string field = 25; // Lĩnh vực (phân loại nội dung của tài liệu).
  string signer = 26; // Người ký.
  uint32 status = 27; // 10=Thường, 20=Quan trọng.
  string statusName = 28;
}

// FolderFileEntry — 1 file trong folder admin chọn để tạo đồ án.
message FolderFileEntry {
  string relative_path = 1;
  bytes content = 2;
  string content_type = 3;
}

message CreatePlanningProjectFromFolderRequest {
  string folder_name = 1;
  string code = 2;
  string name = 3;
  uint32 planning_type = 4;
  uint32 planning_level = 5;
  string validity_status = 6;
  string authority = 7;
  string summary = 8;
  uint64 jurisdiction_id = 9;
  repeated FolderFileEntry files = 10;
  // job_type: 10 = Đồ án (mặc định). Chỉ type Đồ án được hỗ trợ hiện tại.
  uint32 job_type = 11;
}

message CreatePlanningProjectFromFolderResponse {
  PlanningProject project = 1;
  repeated PlanningDocument documents = 2;
  ProAIJob ai_job = 3;
}

message ProAIJob {
  uint64 id = 1;
  uint32 job_type = 2;
  string job_type_name = 3;
  string name = 4;
  string source_folder_name = 5;
  uint32 process_status = 6;
  string process_status_name = 7;
  uint64 planning_project_id = 8;
  string classify_error = 9;
  string metadata = 10;
  string created_at = 11;
  string updated_at = 12;
  string completed_at = 13; // thời gian hoàn thành job (phân loại xong / lỗi)
  string approved_at = 14;  // thời gian phê duyệt
}

message ListProAIJobsRequest {
  uint32 page = 1;
  uint32 size = 2;
  string search = 3;
  string job_type = 4;
  string process_status = 5;
}

message ListProAIJobsResponse {
  repeated ProAIJob data = 1;
  int64 total = 2;
}

message ListPlanningDocumentsResponse {
  repeated PlanningDocument data = 1;
  int64 total = 2;
}

message AssignPlanningDocumentsToLayerRequest {
  uint64 layerId = 1; // vẫn nhận 1 layer; gộp vào layerIds
  repeated uint64 docIds = 2;
  repeated uint64 layerIds = 3;
}

message PlanningDocumentHistory {
  uint64 id = 1;
  uint64 planningDocumentId = 2;
  string eventType = 3;
  string eventName = 4;
  string description = 5;
  string eventDate = 6;
  string createdAt = 7;
  string updatedAt = 8;
}

message DeletePlanningDocumentHistoryRequest {
  uint64 planningDocumentId = 1;
  uint64 id = 2;
}

message ListPlanningDocumentHistoriesRequest {
  uint64 planningDocumentId = 1;
  uint32 page = 2;
  uint32 size = 3;
}

message ListPlanningDocumentHistoriesResponse {
  repeated PlanningDocumentHistory data = 1;
  int64 total = 2;
}

message PlanningEvent {
  uint64 id = 1;
  uint64 planningProjectId = 2;
  string eventName = 3;
  string eventDate = 4;
  string createdAt = 5;
  string updatedAt = 6;
  string description = 7;
  repeated PlanningDocument docs = 8;
  repeated uint64 docIds = 9;
  string verNo = 10;
  uint32 legalStatus = 11;
  string legalStatusName = 12;
  string eventType = 13;
}

message ListPlanningEventsResponse {
  repeated PlanningEvent data = 1;
  int64 total = 2;
}

message IdRequest {
  uint64 id = 1;
}

message SubmitResponse {
  bool success = 1;
  string message = 2;
}

message ListPlanningRelationsResponse {
  repeated PlanningRelation data = 1;
  int64 total = 2;
}

message PlanningRelation {
  PlanningProject parent = 1;
  PlanningProject child = 2;
  PlanningProject peer = 3;
  uint64 id = 4;
  uint64 fromId = 5;
  uint64 toId = 6;
  bool isPeer = 7;
  string relationType = 8;
  string createdAt = 9;
  string updatedAt = 10;
}
