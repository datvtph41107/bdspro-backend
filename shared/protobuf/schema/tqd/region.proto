syntax = "proto3";

package regionpb;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "pb/types/tqd;tqdpb";

service RegionService {
    // ==================== ADMIN APIS ====================
    rpc ListRegions(ListRegionsRequest) returns (ListRegionsResponse) {
        option (google.api.http) = {
            get: "/v2/admin/regions"
        };
    }
    
    rpc GetRegion(GetRegionRequest) returns (RegionResponse) {
        option (google.api.http) = {
            get: "/v2/admin/regions/{id}"
        };
    }
    
    rpc GetRegionStats(GetRegionStatsRequest) returns (RegionStatsResponse) {
        option (google.api.http) = {
            get: "/v2/admin/regions/stats/{layer_id}"
        };
    }
    
    // ==================== CLIENT APIS ====================
    rpc ListClientRegions(ListClientRegionsRequest) returns (ListRegionsResponse) {
        option (google.api.http) = {
            get: "/v2/client/regions"
        };
    }
    
    rpc GetClientRegion(GetClientRegionRequest) returns (RegionResponse) {
        option (google.api.http) = {
            get: "/v2/client/regions/{id}"
        };
    }
    
    rpc FindRegionByPoint(FindRegionByPointRequest) returns (RegionResponse) {
        option (google.api.http) = {
            get: "/v2/client/regions/find/by-point"
        };
    }
    
    rpc FindRegionsByBBox(FindRegionsByBBoxRequest) returns (ListRegionsResponse) {
        option (google.api.http) = {
            get: "/v2/client/regions/find/by-bbox"
        };
    }
}

message ListRegionsRequest {
    optional uint64 layerId = 1;
    optional string landUseCode = 2;
    optional uint32 status = 3;
    optional string search = 4;
    uint32 page = 5;
    uint32 size = 6;
    optional string orderBy = 7;
    optional string orderDir = 8;
}

message ListClientRegionsRequest {
    optional uint64 layerId = 1;
    optional string landUseCode = 2;
    optional BBox bbox = 3;
    uint32 page = 4;
    uint32 size = 5;
}

message GetRegionRequest {
    uint64 id = 1;
}

message GetClientRegionRequest {
    uint64 id = 1;
}

message GetRegionStatsRequest {
    uint64 layer_id = 1;
}

message FindRegionByPointRequest {
    double lat = 1;
    double lng = 2;
}

message FindRegionsByBBoxRequest {
    BBox bbox = 1;
    optional string landUseCode = 2;
    uint32 page = 3;
    uint32 size = 4;
}

message BBox {
    double minLng = 1;
    double minLat = 2;
    double maxLng = 3;
    double maxLat = 4;
}

// =====================================================
// RESPONSE MESSAGES
// =====================================================

message ListRegionsResponse {
    repeated RegionResponse data = 1;
    int64 total = 2;
    int32 page = 3;
    int32 size = 4;
}

message RegionResponse {
    uint64 id = 1;
    uint64 layer_id = 2;
    string name = 3;
    string displayName = 4;
    string description = 5;
    string landUseCode = 6;
    string landUseName = 7;
    string geometry_geojson = 8;
    double area_ha = 9;
    uint32 color_red = 10;
    uint32 color_green = 11;
    uint32 color_blue = 12;
    string color_hex = 13;
    string styleConfig = 14;
    uint32 status = 15;
    uint32 version = 16;
    bool isLatest = 17;
    string createdAt = 18;
    string updatedAt = 19;
}

message RegionStatsResponse {
    uint64 layer_id = 1;
    int64 total_regions = 2;
    double total_area_ha = 3;
    double avg_area_ha = 4;
    double min_area_ha = 5;
    double max_area_ha = 6;
    repeated LandUseStat landUseStats = 7;
}

message LandUseStat {
    string land_use_code = 1;
    string land_use_name = 2;
    int64 count = 3;
    double total_area_ha = 4;
}