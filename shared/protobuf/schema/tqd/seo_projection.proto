syntax = "proto3";

package tqdpb;
option go_package = "pb/types/tqd;tqdpb";

import "google/api/annotations.proto";
import "google/protobuf/wrappers.proto";
import "google/api/httpbody.proto";

// Canonical public SEO projection contract. Gateway registers generated HTTP handlers; TQD exposes gRPC only.
service TqdSeoProjectionService {
  rpc GetAdministrativeUnitProjection(google.protobuf.StringValue) returns (google.protobuf.BytesValue) {
    option (google.api.http) = {
      get: "/v2/tqd/public/administrative-units/{value}/projection"
      additional_bindings {
        custom {
          kind: "HEAD"
          path: "/v2/tqd/public/administrative-units/{value}/projection"
        }
      }
    };
  }
  // gRPC compatibility method. Public HTTP ownership belongs to
  // GetPlanningProjectProjectionPublic so raw JSON is emitted via HttpBody.
  rpc GetPlanningProjectProjection(google.protobuf.StringValue) returns (google.protobuf.BytesValue);

  rpc GetParcelQuickViewPublic(GetParcelQuickViewRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {
      get: "/v2/tqd/public/parcels/{parcel_id}/quick-view"
    };
  }

  rpc GetPlanningProjectProjectionPublic(GetPlanningProjectProjectionRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {
      get: "/v2/tqd/public/planning-projects/{identity}/projection"
      additional_bindings {
        custom {
          kind: "HEAD"
          path: "/v2/tqd/public/planning-projects/{identity}/projection"
        }
      }
      additional_bindings {
        get: "/v2/tqd/public/planning-projects/{identity}"
      }
    };
  }
}

message GetParcelQuickViewRequest {
  uint64 parcel_id = 1;
}

message GetPlanningProjectProjectionRequest {
  string identity = 1;
}
