syntax = "proto3";

package tqdpb;
option go_package = "pb/types/tqd;tqdpb";

import "google/api/annotations.proto";
import "google/protobuf/wrappers.proto";

// Canonical public SEO projection contract. Gateway registers generated HTTP handlers; TQD exposes gRPC only.
service TqdSeoProjectionService {
  rpc GetAdministrativeUnitProjection(google.protobuf.StringValue) returns (google.protobuf.BytesValue) {
    option (google.api.http) = {
      get: "/v2/tqd/public/administrative-units/{value}/projection"
      additional_bindings {
        custom {
          kind: "HEAD"
          path: "/v2/tqd/public/administrative-units/{value}/projection"
        }
      }
    };
  }
  rpc GetPlanningProjectProjection(google.protobuf.StringValue) returns (google.protobuf.BytesValue) {
    option (google.api.http) = {
      get: "/v2/tqd/public/planning-projects/{value}/projection"
      additional_bindings {
        custom {
          kind: "HEAD"
          path: "/v2/tqd/public/planning-projects/{value}/projection"
        }
      }
      additional_bindings {
        get: "/v2/tqd/public/planning-projects/{value}"
      }
    };
  }

  // Internal CRM / backend sync (no google.api.http)
  rpc GetPlanningProjectProjection(google.protobuf.StringValue)
      returns (google.protobuf.BytesValue);
}