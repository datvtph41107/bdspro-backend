syntax = "proto3";

package tqdpb;

option go_package = "pb/types/tqd;tqdpb";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

import "shared/common.proto";

service TqdPublicService {
  // Config app quy hoạch
  rpc GetQhConfigApp(google.protobuf.Empty) returns (google.protobuf.Struct) {
    option (google.api.http) = {
      get: "/v2/qh/config-app"
    };
  }

  rpc GetEnums(sharepb.SyncRequest) returns (sharepb.GetEnumsResponse) {
    option (google.api.http) = {
      get: "/v2/tqd/public/enums"
    };
  }

  rpc GetPublicMaps(google.protobuf.Empty) returns (GetPublicMapsResponse) {
    option (google.api.http) = {
      get: "/v2/tqd/public/maps"
    };
  }
}

message GetPublicMapsResponse {
  repeated MapSource data = 1;
}

message MapSource {
  string source = 1;
  string type = 2;
  string name = 3;
}
