syntax = "proto3";

package tqdpb;

import "google/api/annotations.proto";
import "tqd/discovery.proto";

option go_package = "pb/types/tqd;tqdpb";

// RelatedEntityService returns a bounded relationship projection for one
// canonical map entity. The HTTP route is generated by grpc-gateway and is
// exposed only by gateway-service; business logic executes in tqd-service.
service RelatedEntityService {
  rpc GetRelatedEntities(GetRelatedEntitiesRequest) returns (GetRelatedEntitiesResponse) {
    option (google.api.http) = {
      get: "/v2/tqd/public/entities/{key}/related"
    };
  }
}

message GetRelatedEntitiesRequest {
  // Canonical key, for example parcel:123 or planning_region:456.
  string key = 1;

  // Zero uses the server default. The application service always applies an
  // upper bound before any spatial query is executed.
  double radius_meters = 2;

  // Zero uses the server default. The application service always applies an
  // upper bound before provider queries are executed.
  int32 limit = 3;
}

message GetRelatedEntitiesResponse {
  string request_id = 1;
  EntityCandidate primary = 2;
  repeated EntityCandidate candidates = 3;
  bool partial = 4;
  repeated string warnings = 5;
  double applied_radius_meters = 6;
  int32 applied_limit = 7;
}
