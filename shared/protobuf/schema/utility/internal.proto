syntax = "proto3";

package utilitypb;

option go_package = "pb/types/utility;utilitypb";
import "google/api/annotations.proto";
import "shared/common.proto";

service UtilityInternalService {
  rpc HealthCheck (sharepb.Empty) returns (sharepb.SubmitResponse) {
    option (google.api.http) = {
      get: "/v2/utility/internal/health"
    };
  };
}

