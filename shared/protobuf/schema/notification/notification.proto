syntax = "proto3";

package notificationpb;
option go_package = "types/notificationpb";
import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "shared/common.proto";

service NotificationService {
  rpc Create (sharepb.NotificationRequest) returns (NotificationDTO);
  rpc SendBatch (NotiBatchRequest) returns (BatchResponse);
  rpc PushByToken (PushTokenRequest) returns (PushResponse);
  rpc PushByTopic (PushTopicRequest) returns (PushResponse);
  rpc CreateAdminHistory (AdminHistoryCreateRequest) returns (AdminHistoryDTO);
  rpc CreateAdminHistoryBatch (AdminHistoryBatchRequest) returns (BatchResponse);
}
service GatewayNotificationService {
  rpc Create (GatewayNotiNewRequest) returns (NotificationDTO) {
    option (google.api.http) = {
      post: "/v2/notification/new"
      body: "*"
    };
  };
  rpc Count (EmptyRequest) returns (CountResponse) {
    option (google.api.http) = {
      get: "/v2/notification/count"
    };
  };
  rpc Read (IdRequest) returns (StatusResponse) {
    option (google.api.http) = {
      put: "/v2/notification/read/{id}"
    };
  };
  rpc ReadAll (EmptyRequest) returns (StatusResponse) {
    option (google.api.http) = {
      put: "/v2/notification/read-all"
    };
  };
  rpc Remove (IdRequest) returns (StatusResponse) {
    option (google.api.http) = {
      delete: "/v2/notification/remove/{id}"
    };
  };
  rpc List (ListRequest) returns (ListResponse) {
    option (google.api.http) = {
      get: "/v2/notification/list"
    };
  };
  rpc PushByToken (PushTokenRequest) returns (PushResponse) {
    option (google.api.http) = {
      post: "/v2/notification/push/token"
      body: "*"
    };
  };
  rpc PushByTopic (PushTopicRequest) returns (PushResponse) {
    option (google.api.http) = {
      post: "/v2/notification/push/topic"
      body: "*"
    };
  };
  rpc SearchAdminHistory (AdminHistorySearchRequest) returns (AdminHistoryListResponse) {
    option (google.api.http) = {
      get: "/v2/admin-history/search"
    };
  };
}

message NotiBatchRequest {
    repeated sharepb.NotificationRequest datas = 1;
    bool sendToDevice = 2;
}

message BatchResponse {
    repeated uint64 data = 1;
}

message PushTopicRequest {
    string topic = 1;
    string title = 2;
    string body = 3;
}
message PushTokenRequest {
    string token = 1;
    string title = 2;
    string body = 3;
}
message PushResponse {
    string messageId = 1;
}

message ListRequest {
    int32 page = 1;
    int32 size = 2;
    string sort = 3;
    bool isRead = 4;
}
message ListResponse {
  repeated NotificationDTO data = 1;
  int32 total = 2;
}

message NotificationDTO {
    uint64 id = 1;
    string link = 2;
    repeated string message = 3;
    string title = 4;
    int32 type = 5;
    uint64 userId = 6;
    bool isRead = 7;
    string timestamp = 8;
    string avatar = 9;
    optional uint64 targetId = 10;
}

message IdRequest {
    uint64 id = 1;
}

message EmptyRequest {}
message EmptyResponse {}

message CountResponse {
    int32 count = 1;
}


message GatewayNotiNewRequest {
    string title = 1;
    string message = 2;
    int32 type = 3;
    string link = 4;
    uint64 ownerId = 5;
}

message StatusResponse {
    bool status = 1;
    string message = 2;
}

// Admin History Messages
message AdminHistoryDTO {
    uint64 id = 1;
    uint64 targetId = 2;
    int32 targetType = 3;
    int32 actionType = 4;
    string title = 5;
    repeated string note = 6;
    string preStage = 7;
    string afterStage = 8;
    uint64 adminId = 9;
    optional uint64 ownerId = 10;
    int32 ownerType = 11;
    bool isInternal = 12;
    string adminRole = 13;
    string ipAddress = 14;
    string userAgent = 15;
    string createdAt = 16;
    string updatedAt = 17;
}

message AdminHistoryListResponse {
    repeated AdminHistoryDTO data = 1;
    int32 total = 2;
}

message AdminActionStatsResponse {
    uint64 adminId = 1;
    int64 totalActions = 2;
    map<string, int64> actionCounts = 3;
    string fromDate = 4;
    string toDate = 5;
}

message AdminHistorySearchRequest {
    int32 page = 1;
    int32 size = 2;
    optional uint64 adminId = 3;
    optional uint64 ownerId = 4;
    optional int32 ownerType = 5;
    optional uint64 targetId = 6;
    optional int32 targetType = 7;
    optional int32 actionType = 8;
    optional string adminRole = 9;
    optional string fromDate = 10;
    optional string toDate = 11;
    optional bool isInternal = 12;
}

message AdminHistoryCreateRequest {
    uint64 targetId = 1;
    int32 targetType = 2;
    int32 actionType = 3;
    string title = 4;
    repeated string note = 5;
    string preStage = 6;
    string afterStage = 7;
    uint64 adminId = 8;
    optional uint64 ownerId = 9;
    int32 ownerType = 10;
    bool isInternal = 11;
    string adminRole = 12;
    string ipAddress = 13;
    string userAgent = 14;
}

message AdminHistoryBatchRequest {
    repeated AdminHistoryCreateRequest datas = 1;
}

