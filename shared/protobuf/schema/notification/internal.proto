syntax = "proto3";

package notificationpb;
option go_package = "pb/types/notification;notificationpb";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "shared/common.proto";
import "notification/notification.proto";


// InternalNotificationService định nghĩa các RPC nội bộ cho notification service
service InternalNotificationService {
    rpc Create (sharepb.NotificationRequest) returns (NotificationDTO);
    rpc SendBatch (NotiBatchRequest) returns (BatchResponse);
    rpc PushByToken (PushTokenRequest) returns (PushResponse);
    rpc PushByTopic (PushTopicRequest) returns (PushResponse);
    rpc CreateAdminHistory (AdminHistoryCreateRequest) returns (AdminHistoryDTO);
    rpc CreateAdminHistoryBatch (AdminHistoryBatchRequest) returns (BatchResponse);
    // Tạo deal history (internal RPC)
    rpc CreateDealHistory(CreateDealHistoryRequest) returns (CreateDealHistoryResponse);
}

// ===== NOTIFICATION MESSAGES =====
message NotiBatchRequest {
  repeated sharepb.NotificationRequest datas = 1;
  bool sendToDevice = 2;
}

message BatchResponse {
  bool success = 1;
  repeated uint64 data = 2;
}

// ===== ADMIN HISTORY MESSAGES =====
message AdminActionStatsResponse {
  map<string, int32> action_counts = 1;
  int32 total_actions = 2;
}


message AdminHistoryCreateRequest {
    uint64 targetId = 1;
    int32 targetType = 2;
    int32 actionType = 3;
    string title = 4;
    repeated string note = 5;
    string preStage = 6;
    string afterStage = 7;
    uint64 adminId = 8;
    optional uint64 ownerId = 9;
    int32 ownerType = 10;
    bool isInternal = 11;
    string adminRole = 12;
    string ipAddress = 13;
    string userAgent = 14;
}

message AdminHistoryBatchRequest {
    repeated AdminHistoryCreateRequest datas = 1;
}

// ===== DEAL HISTORY MESSAGES =====

// CreateDealHistoryRequest request để tạo deal history
message CreateDealHistoryRequest {
  uint64 deal_id = 1;
  uint64 actor_id = 2;
  string actor_name = 3;
  string actor_avatar = 4;
  string action_type = 5;
  string action_name = 6;
  string content = 7;
  google.protobuf.Struct metadata = 8;
}

// CreateDealHistoryResponse response khi tạo deal history
message CreateDealHistoryResponse {
  bool success = 1;
  string message = 2;
  uint64 id = 3;
}