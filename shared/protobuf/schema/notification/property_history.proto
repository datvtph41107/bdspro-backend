syntax = "proto3";

package notificationpb;

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";

option go_package = "pb/types/notification;notificationpb";

service PropertyHistoryService {

  rpc CreatePropertyHistory(CreatePropertyHistoryRequest)
      returns (CreatePropertyHistoryResponse) {
    option (google.api.http) = {
      post: "/v2/notification/property-history"
      body: "*"
    };
  }

  rpc GetPropertyHistory(GetPropertyHistoryRequest)
      returns (GetPropertyHistoryResponse) {
    option (google.api.http) = {
      get: "/v2/notification/property-history/{subjectId}"
    };
  }

  rpc GetPropertyHistoryByID(GetPropertyHistoryByIDRequest)
      returns (GetPropertyHistoryByIDResponse) {
    option (google.api.http) = {
      get: "/v2/notification/property-history/detail/{id}"
    };
  }

  rpc SoftDeletePropertyHistoryId(SoftDeletePropertyHistoryIdRequest) returns (SoftDeletePropertyHistoryIdResponse) {
    option (google.api.http) = {
      delete: "/v2/notification/property-history/{id}"
    };
  }
}

message SoftDeletePropertyHistoryIdRequest {
  uint64 id = 1;
  uint64 actorId = 2;
}

message SoftDeletePropertyHistoryIdResponse {
  bool success = 1;
}

message CreatePropertyHistoryRequest {
  uint64 subjectId = 1;
  uint32 subjectType = 2;
  uint32 action = 3;
  string description = 4;
  uint64 actorId = 5;
}

message CreatePropertyHistoryResponse {
  bool success = 1;
  uint64 id = 2;
}

message GetPropertyHistoryRequest {
  uint64 subjectId = 1;
  string subjectType = 2;
  int32 page = 3;
  int32 size = 4;
}

message GetPropertyHistoryResponse {
  repeated PropertyHistoryItem data = 1;
  int64 total = 2;
}

message GetPropertyHistoryByIDRequest {
  uint64 id = 1;
}

message GetPropertyHistoryByIDResponse {
  PropertyHistoryItem data = 1;
}

message PropertyHistoryItem {
  uint64 id = 1;
  uint64 subjectId = 2;
  string subjectType = 3;
  string action = 4;
  string description = 5;
  google.protobuf.Struct metadata = 6;
  uint64 actorId = 7;
  string occurredAt = 8;
  string createdAt = 9;
  string updatedAt = 10;
}
