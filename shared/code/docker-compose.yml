version: '3.3'

services:
  user:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user
    command: ["./main", "http"]
    networks:
      - internal
    
  user-grpc:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user_grpc
    command: ["./main", "grpc"]
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - internal


  bdspro:
    build:
      context: ./bdspro-service
      dockerfile: Dockerfile
    container_name: bdspro
    command: ["./main", "http"]
    networks:
      - internal
  
  bdspro-grpc:
    build:
      context: ./bdspro-service
      dockerfile: Dockerfile
    container_name: bdspro_grpc
    command: ["./main", "grpc"]
    networks:
      - internal

  file:
    build:
      context: ./file-service
      dockerfile: Dockerfile
    container_name: file
    command: ["./main", "http"]
    ports:
      - "8002:8002"
    networks:
      - internal
    volumes:
      - ${PWD}/files:/files

  chat:
    build:
      context: ./chat-service
      dockerfile: Dockerfile
    container_name: chat
    volumes:
      - ${PWD}/configs:/app/configs
    environment:
      - CONFIG_FILE=/app/configs/docker_config.yaml 
    command: ["/app/main", "grpc"]
    networks:
      - internal
  # openai:
  #   build:
  #     context: ./openai-service
  #     dockerfile: Dockerfile
  #   container_name: openai
  #   networks:
  #     - internal
  #   depends_on:
  #     - redis
  #     - eureka

  gateway:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: gateway
    networks:
      - internal
    ports:
      - "8000:8000"

  map:
    build:
      context: ./map-service
      dockerfile: Dockerfile
    container_name: map
    networks:
      - internal

  notification:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    command: ["./main", "grpc"]
    container_name: notification
    networks:
      - internal

  payment:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payment
    command: ["/app/main", "grpc"]
    volumes:
      - ${PWD}/config:/app/config
    environment:
      - CONFIG_FILE=/app/config/docker_config.yaml 
    networks:
      - internal
  
  crm:
    build:
      context: ./crm-service
      dockerfile: Dockerfile
    container_name: crm
    command: ["./main", "grpc"]
    networks:
      - internal
  
  membership:
    build:
      context: ./membership-service
      dockerfile: Dockerfile
    container_name: membership
    networks:
      - internal

  # config:
  #   build:
  #     context: ./config-server
  #     dockerfile: Dockerfile
  #   container_name: config
  #   networks:
  #     - internal

  organization:
    build:
      context: ./organization-service
      dockerfile: Dockerfile
    container_name: organization
    volumes:
      - ${PWD}/config:/app/config
    environment:
      - CONFIG_FILE=/app/config/docker_config.yaml 
    command: ["./main", "grpc-server"]
    networks:
      - internal

  appointment:
    build:
      context: ./appointment-service
      dockerfile: Dockerfile
    container_name: appointment
    volumes:
      - ${PWD}/config:/config
    environment:
      - CONFIG_FILE=/app/config/docker_config.yaml 
      - ENV_RUNTIME=release
    command: ["./main", "grpc"]
    networks:
      - internal

  http-server:
    build: 
      context: ./chat-service
    container_name: http-server
    ports:
      - "8106:8081"
    command: ["sh", "-c", "sleep 5 && /app/main http-serve --httpPort=8081 || sleep infinity"]
    volumes:
      - ${PWD}/configs:/app/configs
    environment:
      - CONFIG_FILE=/app/configs/docker_config.yaml 
    networks:
      - internal

  relay:
    build: ./relay-service
    container_name: relay
    ports:
      - "8308:8308"
    command: ["sh", "-c", "sleep 5 && /app/main || sleep infinity"]
    volumes:
      - ${PWD}/config:/app/config
    environment:
      - CONFIG_FILE=/app/config/release.yml 
    networks:
      - internal
  
  swagger-chat:
    build: ./chat-service
    container_name: swagger-chat
    ports:
      - "8107:3001"
    command: ["sh", "-c", "sleep 5 && /app/main swagger-serve || sleep infinity"]
    volumes:
      - ./configs:/app/configs
    environment:
      - CONFIG_FILE=/app/configs/docker_config.yaml 
    networks:
      - internal

  social:
    build: ./social-service
    container_name: social
    networks:
      - internal

  transaction:
    build: ./transaction-service
    container_name: transaction
    command: ["./main", "grpc"]
    networks:
      - internal

      
  # eureka:
  #   build:
  #     context: ./eureka-server
  #     dockerfile: Dockerfile
  #   container_name: eureka
  #   networks:
  #     - internal
  #   ports:
  #     - "8761:8761"

  # redis:
  #   image: redis:latest
  #   container_name: redis
  #   restart: always
  #   command: ["redis-server", "--requirepass", "protected_redis_secure_password", "--bind", "0.0.0.0"]
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - ./redis-data:/data  # Mount thư mục redis-data trên host vào /data trong container
  #   networks:
  #     - internal

networks:
  internal:
    driver: bridge
