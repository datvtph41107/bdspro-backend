server:
  port: 8002

eureka:
  url: localhost
  port: 8761
  
database:
  dsn: "" # inject DATABASE_DSN from secret storage

jwt:
  key-generate: "" # inject JWT_KEY_GENERATE from secret storage
  tokenPrefix: Bearer
  tokenExpirationAfterDays: 14
  accessExpAfterMinutes: 15 # access token hết hạn 5 phút
  refreshExpAfterMinutes: 129600 # refresh token có hạn là 3 tháng
  listPermit:
  authorizationHeader: Authorization

file:
  signature_key: "" # inject FILE_SIGNATURE_KEY from secret storage
  xor_crypt_key: "" # inject FILE_XOR_CRYPT_KEY from secret storage
  signature_expire: 5m

service:
  auth_key: "" # inject SERVICE_AUTH_KEY from secret storage


auth:
  grpc_address: "localhost:8216"
  timeout: 2s

hub:
  grpc_address: "localhost:8280"
  timeout: 5s

internal_grpc:
  enabled: false
  port: "8203"
