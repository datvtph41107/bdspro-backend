syntax = "proto3";

package pb_marketing;
option go_package = "pb/types/marketing;pb_marketing";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "shared/common.proto";

service MarketingService {
  // Campaign Management APIs - D.10.2.1
  rpc CreateCampaign(CreateCampaignRequest) returns (CampaignResponse) {
    option (google.api.http) = {
      post: "/v2/marketing/campaigns"
      body: "*"
    };
  };

  rpc GetCampaign(GetCampaignRequest) returns (CampaignResponse) {
    option (google.api.http) = {
      get: "/v2/marketing/campaigns/{id}"
    };
  };

  rpc UpdateCampaign(UpdateCampaignRequest) returns (CampaignResponse) {
    option (google.api.http) = {
      put: "/v2/marketing/campaigns/{id}"
      body: "*"
    };
  };

  rpc DeleteCampaign(DeleteCampaignRequest) returns (DeleteCampaignResponse) {
    option (google.api.http) = {
      delete: "/v2/marketing/campaigns/{id}"
    };
  };

  rpc ListCampaigns(ListCampaignsRequest) returns (ListCampaignsResponse) {
    option (google.api.http) = {
      get: "/v2/marketing/campaigns"
    };
  };

  rpc UpdateCampaignStatus(UpdateCampaignStatusRequest) returns (CampaignResponse) {
    option (google.api.http) = {
      put: "/v2/marketing/campaigns/{id}/status"
      body: "*"
    };
  };

  rpc TopupCampaignBudget(TopupCampaignBudgetRequest) returns (CampaignResponse) {
    option (google.api.http) = {
      post: "/v2/marketing/campaigns/{id}/topup"
      body: "*"
    };
  };

  // Package Management APIs - D.10.2.2
  rpc CreatePackage(CreatePackageRequest) returns (PackageResponse) {
    option (google.api.http) = {
      post: "/v2/marketing/packages"
      body: "*"
    };
  };

  rpc GetPackage(GetPackageRequest) returns (PackageResponse) {
    option (google.api.http) = {
      get: "/v2/marketing/packages/{id}"
    };
  };

  rpc UpdatePackage(UpdatePackageRequest) returns (PackageResponse) {
    option (google.api.http) = {
      put: "/v2/marketing/packages/{id}"
      body: "*"
    };
  };

  rpc DeletePackage(DeletePackageRequest) returns (DeletePackageResponse) {
    option (google.api.http) = {
      delete: "/v2/marketing/packages/{id}"
    };
  };

  rpc ListPackages(ListPackagesRequest) returns (ListPackagesResponse) {
    option (google.api.http) = {
      get: "/v2/marketing/packages"
    };
  };

  // Payment Management APIs - D.10.2.3
  rpc CreatePayment(CreatePaymentRequest) returns (PaymentResponse) {
    option (google.api.http) = {
      post: "/v2/marketing/payments"
      body: "*"
    };
  };

  rpc GetPayment(GetPaymentRequest) returns (PaymentResponse) {
    option (google.api.http) = {
      get: "/v2/marketing/payments/{id}"
    };
  };

  rpc ListPayments(ListPaymentsRequest) returns (ListPaymentsResponse) {
    option (google.api.http) = {
      get: "/v2/marketing/payments"
    };
  };

  // Campaign Detail Management APIs - D.10.2.4
  rpc CreateCampaignDetail(CreateCampaignDetailRequest) returns (CampaignDetailResponse) {
    option (google.api.http) = {
      post: "/v2/marketing/campaign-details"
      body: "*"
    };
  };

  rpc GetCampaignDetail(GetCampaignDetailRequest) returns (CampaignDetailResponse) {
    option (google.api.http) = {
      get: "/v2/marketing/campaign-details/{id}"
    };
  };

  rpc UpdateCampaignDetail(UpdateCampaignDetailRequest) returns (CampaignDetailResponse) {
    option (google.api.http) = {
      put: "/v2/marketing/campaign-details/{id}"
      body: "*"
    };
  };

  rpc DeleteCampaignDetail(DeleteCampaignDetailRequest) returns (DeleteCampaignDetailResponse) {
    option (google.api.http) = {
      delete: "/v2/marketing/campaign-details/{id}"
    };
  };

  rpc ListCampaignDetails(ListCampaignDetailsRequest) returns (ListCampaignDetailsResponse) {
    option (google.api.http) = {
      get: "/v2/marketing/campaign-details"
    };
  };

  // Budget Management APIs - D.10.2.5
  rpc CreateBudget(CreateBudgetRequest) returns (BudgetResponse) {
    option (google.api.http) = {
      post: "/v2/marketing/budgets"
      body: "*"
    };
  };

  rpc GetBudget(GetBudgetRequest) returns (BudgetResponse) {
    option (google.api.http) = {
      get: "/v2/marketing/budgets/{id}"
    };
  };

  rpc UpdateBudget(UpdateBudgetRequest) returns (BudgetResponse) {
    option (google.api.http) = {
      put: "/v2/marketing/budgets/{id}"
      body: "*"
    };
  };

  rpc DeleteBudget(DeleteBudgetRequest) returns (DeleteBudgetResponse) {
    option (google.api.http) = {
      delete: "/v2/marketing/budgets/{id}"
    };
  };

  rpc ListBudgets(ListBudgetsRequest) returns (ListBudgetsResponse) {
    option (google.api.http) = {
      get: "/v2/marketing/budgets"
    };
  };

  // Advertising Settings Management APIs - D.10.2.6
  rpc CreateAdvertisingSettings(CreateAdvertisingSettingsRequest) returns (AdvertisingSettingsResponse) {
    option (google.api.http) = {
      post: "/v2/marketing/advertising-settings"
      body: "*"
    };
  };

  rpc GetAdvertisingSettings(GetAdvertisingSettingsRequest) returns (AdvertisingSettingsResponse) {
    option (google.api.http) = {
      get: "/v2/marketing/advertising-settings/{id}"
    };
  };

  rpc UpdateAdvertisingSettings(UpdateAdvertisingSettingsRequest) returns (AdvertisingSettingsResponse) {
    option (google.api.http) = {
      put: "/v2/marketing/advertising-settings/{id}"
      body: "*"
    };
  };

  rpc DeleteAdvertisingSettings(DeleteAdvertisingSettingsRequest) returns (DeleteAdvertisingSettingsResponse) {
    option (google.api.http) = {
      delete: "/v2/marketing/advertising-settings/{id}"
    };
  };

  rpc ListAdvertisingSettings(ListAdvertisingSettingsRequest) returns (ListAdvertisingSettingsResponse) {
    option (google.api.http) = {
      get: "/v2/marketing/advertising-settings"
    };
  };

  // Lưu ý: GetCampaignTransactionHistory đã được xóa
  // Sử dụng trực tiếp API từ notification service:
  // GET /v2/notification/history/campaign/{id}
  // GET /v2/notification/history/package/{id}
}

message Campaign {
  uint64 id = 1;
  string name = 2;
  string description = 3;
  string type = 4;
  string status = 5;
  uint64 productId = 6;
  string productName = 7;
  string productType = 8;
  uint64 packageId = 9;
  string packageName = 10;
  double budget = 11;
  uint32 duration = 12;
  string startDate = 13;
  string endDate = 14;
  string targetAudience = 15;
  string targetLocation = 16;
  bool isActive = 17;
  uint32 priority = 18;
  string internalNote = 19;
  uint64 createdBy = 20;
  uint64 organizationId = 21;
  string walletId = 22;
  double walletBalance = 23;
  string currency = 24;
  uint64 transactionId = 25; // Payment transaction ID
  string createdAt = 26;
  string updatedAt = 27;
}

message CreateCampaignRequest {
  string name = 1;
  string description = 2;
  string type = 3;
  uint64 productId = 4;
  string productName = 5;
  string productType = 6;
  uint64 packageId = 7;
  string packageName = 8;
  double budget = 9;
  uint32 duration = 10;
  string startDate = 11;
  string endDate = 12;
  string targetAudience = 13;
  string targetLocation = 14;
  uint32 priority = 15;
  string internalNote = 16;
  bool termsAccepted = 17;
}

message UpdateCampaignRequest {
  uint64 id = 1;
  string name = 2;
  string description = 3;
  string type = 4;
  uint64 productId = 5;
  string productName = 6;
  string productType = 7;
  uint64 packageId = 8;
  string packageName = 9;
  double budget = 10;
  uint32 duration = 11;
  string startDate = 12;
  string endDate = 13;
  string targetAudience = 14;
  string targetLocation = 15;
  string status = 16;
  uint32 priority = 17;
  string internalNote = 18;
}

message CampaignResponse {
  Campaign data = 1;
}

message SearchCampaignsRequest {
  uint32 page = 1;
  uint32 size = 2;
  string name = 3;
  string type = 4;
  string status = 5;
  uint64 productId = 6;
  string productType = 7;
