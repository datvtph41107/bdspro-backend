syntax = "proto3";

package transactionpb;

import "google/api/annotations.proto";
import "bdspro/common.proto";
import "shared/common.proto";
import "transaction/type.proto";

option go_package = "pb/types/transaction;transactionpb";

enum TransactionType {
    TRANSACTION_TYPE_UNKNOWN = 0;
    TRANSACTION_TYPE_EXPENSE = 10; // Chi phí
    TRANSACTION_TYPE_REVENUE = 20; // Doanh thu
}

service InternalTransactionService {
    rpc SaveTransaction(SaveTransactionRequest) returns (ActionResponse);
    rpc Transfer(TransferRequest) returns (ActionResponse);
    rpc Approve(ApproveRequest) returns (ActionResponse);
    rpc Reject(RejectRequest) returns (ActionResponse);
    rpc Sign(SignRequest) returns (ActionResponse);
    rpc CreateSignTransaction(SignRequest) returns (ActionResponse);
}


message SaveTransactionRequest {
    uint64 id = 1;
    string transaction_name = 2;
    string description = 3;
    string transaction_type = 4;
    string transaction_status = 5;
    string transaction_date = 6;
    string transaction_amount = 7;
    string transaction_currency = 8;
}

message SaveTransactionResponse {
    string transaction_id = 1;
}

message ActionResponse {
    uint64 transactionId = 1;
    string timestamp = 2;
}

message TransferRequest {
    uint64 id = 1;
    uint64 from_id = 2;
    uint64 to_id = 3;
    double amount = 4;
    string currency = 5;
    string note = 6;
}

message ApproveRequest {
    uint64 id = 1;
    string note = 2;
}

message RejectRequest {
    uint64 id = 1;
    string note = 2;
}

message SignRequest {
    uint64 id = 1;
    string contract_name = 2;
    uint64 from_id = 3;
    OwnerType from_of = 4;
    uint64 to_id = 5;
    OwnerType to_of = 6;
    double amount = 7;
    string note = 8;
}

message CreateSignTransactionRequest {
    uint64 id = 1;
    string note = 2;
    string to_id = 3;
    string to_of = 4;
    double amount = 5;
}