syntax = "proto3";

package transactionpb;

import "google/api/annotations.proto";
import "bdspro/common.proto";
import "shared/common.proto";
import "transaction/type.proto";

option go_package = "pb/types/transaction;transactionpb";

service TransactionService {
    rpc ListTransactions(TransactionListRequest) returns (TransactionListResponse) {
        option (google.api.http) = {
            get: "/v2/transaction/list"
        };
    }

    rpc GetTransaction(sharepb.IdRequest) returns (TransactionResponse) {
        option (google.api.http) = {
            get: "/v2/transaction/detail/{id}"
        };
    }

    rpc CreateTransaction(CreateTransactionRequest) returns (CreateTransactionResponse) {
        option (google.api.http) = {
            post: "/v2/transaction"
            body: "*"
        };
    }

    rpc ApproveTransaction(sharepb.IdRequest) returns (TransactionResponse) {
        option (google.api.http) = {
            post: "/v2/transaction/{id}/approve"
            body: "*"
        };
    }

    // rpc CreateSignTransaction(CreateSignTransactionRequest) returns (CreateSignTransactionResponse) {
    //     option (google.api.http) = {
    //         post: "/v2/transaction/sign"
    //         body: "*"
    //     };
    // }
}

message CreateTransactionRequest {
    string transaction_name = 1;
    string description = 2;
    string transaction_type = 3;
    string transaction_status = 4;
    string transaction_date = 5;
    string transaction_amount = 6;
    string transaction_currency = 7;
}

message CreateTransactionResponse {
    string transaction_id = 1;
}

message TransactionResponse {
    uint64 transactionId = 1;
    string transactionName = 2;
    TransactionStatus status = 3;
    TransactionMethod method = 4;
    double value = 5;
    string note = 6;
    optional sharepb.ProfileItem profile = 7;
    uint64 fromId = 8;
    OwnerType fromOf = 9;
    uint64 toId = 10;
    OwnerType toOf = 11;
}

// message CreateSignTransactionRequest {
//     string transaction_id = 1;
// }

// message CreateSignTransactionResponse {
//     string transaction_id = 1;
// }

message TransactionListRequest {
    uint64 page = 1;
    uint64 size = 2;
    uint64 toId = 3;
    OwnerType toOf = 4;
    TransactionStatus status = 5;
    TransactionMethod method = 6;
}

message TransactionListResponse {
    repeated TransactionResponse data = 1;
    int64 total = 2;
}