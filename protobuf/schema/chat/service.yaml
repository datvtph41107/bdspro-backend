type: google.api.http
config_version: 3

http:
  rules:
    - selector: chatpb.ChatService.CreateConversation
      post: /chat/conversations
      body: "*"  
    - selector: chatpb.ChatService.GetConversations
      get: /chat/conversations
    - selector: chatpb.ChatService.SendMessage
      post: /chat/messages
      body: "*"
    - selector: chatpb.ChatService.GetMessages
      get: /chat/messages
    - selector: chatpb.ChatService.ForwardMessage
      post: /chat/forward
      body: "*"
    - selector: chatpb.ChatService.MarkAsRead
      post: /chat/read
      body: "*"
    - selector: chatpb.ChatService.PinMessage
      post: /chat/pin
      body: "*"
    - selector: chatpb.ChatService.RecallMessage
      post: /chat/recall
      body: "*"
    - selector: chatpb.ChatService.RemoveUser
      post: /chat/removeUser
      body: "*"
    - selector: chatpb.ChatService.EditChannel
      post: /chat/editChannel
      body: "*"
    - selector: chatpb.ChatService.CreateOrgChannel
      post: /chat/createOrgChannel
      body: "*"
    - selector: chatpb.ChatService.MuteConversation
      post: /chat/mute
      body: "*"
    - selector: chatpb.ChatService.Search
      get: /chat/search
    - selector: chatpb.ChatService.GetListParticipant
      get: /conversation/{conversationId}/members
    - selector: chatpb.ChatService.GetReadReceipt
      get: /messages/{messageId}/readReceipt
    - selector: chatpb.ChatService.GetPinnedMessages
      get: /messages/{conversationId}/pinned
    - selector: chatpb.ChatService.AddUser
      post: /conversation/add-user
      body: "*"
    - selector: chatpb.ChatService.LeaveRoom
      post: /conversation/leave
      body: "*"
    - selector: chatpb.ChatService.EditMessage
      post: /messages/edit/{messageId}
      body: "*"
    - selector: chatpb.ChatService.DeleteViolation
      delete: /messages/delete-violation/{messageId}
    - selector: chatpb.ChatService.DeleteRoom
      delete: /conversation/delete-conversation/{conversationId}
    - selector: chatpb.ChatService.GetConversationById
      get: /conversation/{conversationId}
    - selector: chatpb.ChatService.GetSetting
      get: /conversation/{id}/setting
    - selector: chatpb.ChatService.GetFiles
      get: /conversation/{conversationId}/files
    - selector: chatpb.ChatService.GetImages
      get: /conversation/{conversationId}/images
    - selector: chatpb.ChatService.GetLinks
      get: /conversation/{conversationId}/links
    - selector: chatpb.ChatService.ReactionMessage
      post: /message/reaction
      body: "*"
    - selector: chatpb.BackgroundImageService.CreateBackgroundImage
      post: /background
      body: "*"  
    - selector: chatpb.BackgroundImageService.GetBackgroundImages
      get: /background
    - selector: chatpb.BackgroundImageService.UpdateBackgroundImage
      put: /background/{id}
      body: "*"
    - selector: chatpb.BackgroundImageService.DeleteBackgroundImage
      delete: /background/delete/{id}