syntax = "proto3";

package notificationpb;

option go_package = "pb/types/notification;notificationpb";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";


service HistoryService {
  rpc OwnerHistory (HistorySearchRequest) returns (HistoryListDTO) {
      option (google.api.http) = {
          get: "/v2/notification/history/list/{ownerId}/{ownerType}"
      };
  };

  rpc ContactHistory (HistorySearchRequest) returns (HistoryListDTO) {
    option (google.api.http) = {
        get: "/v2/notification/history/contact/{id}"
    };
  };

  rpc AssetHistory (HistorySearchRequest) returns (HistoryListDTO) {
    option (google.api.http) = {
        get: "/v2/notification/history/asset/{id}"
    };
  };

  rpc ProductHistory (HistorySearchRequest) returns (HistoryListDTO) {
    option (google.api.http) = {
        get: "/v2/notification/history/product/{id}"
    };
  };

  rpc ProductChildHistory (HistorySearchRequest) returns (HistoryListDTO) {
    option (google.api.http) = {
        get: "/v2/notification/history/product/child/{id}"
    };
  };

  rpc RuleEventHistory (HistorySearchRequest) returns (HistoryListDTO) {
    option (google.api.http) = {
        get: "/v2/notification/history/rule-event/{id}"
    };
  };

  rpc Create (HistoryDTO) returns (HistoryDTO);
}

// message HistoryContactRequest {
//   uint64 id = 1;
//   uint32 page = 2;
//   uint32 size = 3;
//   google.protobuf.Timestamp fromDate = 4;
//   google.protobuf.Timestamp toDate = 5;
// }

message HistorySearchRequest {
  uint32 page = 1;
  uint32 size = 2;

  uint64 userId = 3;
  string fromDate = 4;
  string toDate = 5;

  optional int32 actionType = 6;
  optional int32 targetType = 7;
  optional uint64 targetId = 8;

  uint64 ownerId = 9;
  uint32 ownerType = 10;

  uint64 id = 11;
}

message HistoryDTO {
  uint64 targetId = 1;
  int32 targetType = 2;     
  int32 actionType = 3;     

  repeated string note = 4;
  string preStage = 5;
  string afterStage = 6;

  optional uint64 ownerId = 7;
  int32 ownerType = 8;
  string createdAt = 9;
  optional uint64 createdBy = 10;
  string title = 11;
}

message HistoryListDTO {
    repeated HistoryDTO data = 1;
    uint32 totalElements = 2;
}
