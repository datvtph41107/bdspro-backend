syntax = "proto3";

package pb_noti;
option go_package = "types/pb_noti";
import "google/protobuf/timestamp.proto";

service NotificationService {
  rpc SendBatch (NotiBatchRequest) returns (ListResponse);
  rpc Send (NotiNewRequest) returns (NotiNewResponse);
  rpc Count (EmptyRequest) returns (CountResponse);
  rpc Read (IdRequest) returns (EmptyResponse);
  rpc Remove (IdRequest) returns (EmptyResponse);
  rpc List (ListRequest) returns (ListResponse);
  rpc PushByToken (PushTokenRequest) returns (PushResponse);
  rpc PushByTopic (PushTopicRequest) returns (PushResponse);
}

message NotiBatchRequest {
    repeated NotiNewRequest datas = 1;
}

message PushTopicRequest {
    string topic = 1;
    string title = 2;
    string body = 3;
}
message PushTokenRequest {
    string token = 1;
    string title = 2;
    string body = 3;
}
message PushResponse {
    string messageId = 1;
}

message ListRequest {
    int32 page = 1;
    int32 size = 2;
    string sort = 3;
}
message ListResponse {
  repeated Notification data = 1;
}

message Notification {
    uint64 id = 1;
    string link = 2;
    string message = 3;
    string title = 4;
    int32 type = 5;
    uint64 userID = 6;
    bool isRead = 7;
    google.protobuf.Timestamp timestamp = 8;
    google.protobuf.Timestamp visibleAt = 9;
}

message IdRequest {
    uint64 id = 1;
}

message EmptyRequest {}
message EmptyResponse {}

message CountResponse {
    int32 count = 1;
}

message NotiNewRequest {
    string link = 1;
    string message = 2;
    string title = 3;
    int32 type = 4;
    uint64 userID = 5;
    google.protobuf.Timestamp visibleAt = 6;
}

message NotiNewResponse {
  bool success = 1;
}