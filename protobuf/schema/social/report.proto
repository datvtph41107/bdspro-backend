syntax = "proto3";

package pb_social;

option go_package = "types/social";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "validate/validate.proto";

service ReportService {
    rpc SubmitReport(ReportRequest) returns (ReportResponse) {
        option (google.api.http) = {
            post: "/v2/social/report/submit"
            body: "*"
        };
    }
    rpc GetAllReportReason(google.protobuf.Empty) returns (ReportReasonResponse) {
        option (google.api.http) = {
            get: "/v2/social/report/reasons"
        };
    }
}

message ReportReason {
    uint64 id = 1;
    string reasonName = 2;
    bool active = 3;
}

message ReportReasonRequest {
    uint64 page = 1;
    uint64 size = 2;
    string reasonName = 3;
}

message ReportReasonResponse {
    repeated ReportReason data = 1;
    uint64 total = 2;
}

message ReportRequest {
    uint64 id = 1;
    uint64 reasonId = 2;
    uint64 newsFeedId = 3;
    string content = 4;
}

message ReportResponse {
    uint64 id = 1;
    uint64 reasonId = 2;
    uint64 newsFeedId = 3;
    string createdAt = 4;
}