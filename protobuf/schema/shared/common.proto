syntax = "proto3";

package sharepb;
option go_package = "pb/types/shared;sharepb";

message ArchivedRequest {
  uint64 id = 1;
  bool archived = 2;
}

message IdRequest {
  uint64 id = 1;
}

message Empty {}

message SubmitResponse {
  uint64 id = 1;
  string message = 2;
}

message FriendItem {
	uint64 id = 1;
	uint64 receiverId = 2;
	optional uint64 createdBy = 3;
	uint32 status = 4;
}

message ProfileItem {
	uint64 id = 1;
	string fullName = 2;
	string avatar = 3;
  bool tickVerified = 4;
  string phone = 5;
}

message GetProfileByIdsRequest {
  repeated uint64 ids = 1;
}

message GetProfileByIdsResponse {
  repeated ProfileItem profiles = 1;
}