syntax = "proto3";

package sharepb;
option go_package = "pb/types/shared;sharepb";

import "google/protobuf/timestamp.proto";

message ArchivedRequest {
  uint64 id = 1;
  bool archived = 2;
}

message IdRequest {
  uint64 id = 1;
  uint32 page = 2;
  uint32 size = 3;
}

message IdDTO {
  uint64 id = 1;
}

message Empty {}

message SubmitResponse {
  uint64 id = 1;
  string message = 2;
  repeated uint64 ids = 3;
}

message FriendItem {
	uint64 id = 1;
	uint64 receiverId = 2;
	optional uint64 createdBy = 3;
	uint32 status = 4;
}

message ProfileItem {
	uint64 id = 1;
	string fullName = 2;
	string avatar = 3;
  bool tickVerified = 4;
  string phone = 5;
}

message GetProfileByIdsRequest {
  repeated uint64 ids = 1;
}

message GetProfileByIdsResponse {
  repeated ProfileItem profiles = 1;
}

message NotificationRequest {
  string link = 1;
  string message = 2;
  string title = 3;
  int32 type = 4;
  uint64 targetId = 5;
  int32 targetType = 6;
  google.protobuf.Timestamp visibleAt = 7;
  bool sendToDevice = 8;
  repeated string attachData = 9;
  bool isMerge = 10;
  uint64 ownerId = 11;
}