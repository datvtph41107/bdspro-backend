message ItemResponse {
    uint64 id = 1;
    string name = 2;
}

message ListItemResponse {
    repeated ItemResponse data = 1;
    uint32 totalElements = 2;
}

message SearchQueryRequest {
    uint32 page = 1;
    uint32 size = 2;
    string text = 3;
    optional uint64 parentId = 4;
}