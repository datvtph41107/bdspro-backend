version: v1
plugins:
  - plugin: go
    out: ../types
    opt: paths=source_relative
  - plugin: go-grpc
    out: ../types
    opt: paths=source_relative
  - plugin: grpc-gateway
    out: ../types
    opt: 
      - paths=source_relative
      - grpc_api_configuration=./bdspro/service.yaml
  - plugin: openapiv2
    out: ../docs/bdspro
    opt:
      - logtostderr=true
      - allow_merge=true
      - merge_file_name=bdspro
      - grpc_api_configuration=./bdspro/service.yaml
      - version=true