syntax = "proto3";

package pb_bdspro;
option go_package = "types/bdspro";
import "google/protobuf/timestamp.proto";

message AssetCostDTO {
  uint64 id = 1;
  uint64 assetId = 2;
  double amount = 3;
  google.protobuf.Timestamp date = 4;
  string description = 5;
}

message AssetCostListDTO {
  repeated AssetCostDTO data = 1;
  uint32 totalElements = 2;
}

service AssetCostService {
    rpc Get (AssetCostDTO) returns (AssetCostListDTO);
    rpc Detail (AssetCostDTO) returns (AssetCostDTO);
    rpc Create (AssetCostDTO) returns (AssetCostDTO);
    rpc Update (AssetCostDTO) returns (AssetCostDTO);
    rpc Delete (AssetCostDTO) returns (AssetCostDTO);
}
