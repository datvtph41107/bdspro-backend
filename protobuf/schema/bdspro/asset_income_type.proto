syntax = "proto3";

package pb_bdspro;
option go_package = "types/bdspro";
import "google/protobuf/timestamp.proto";

message AssetIncomeTypeDTO {
  uint64 id = 1;
  string typeName = 2;
  bool isCustom = 3;
}

message AssetIncomeTypeListDTO {
  repeated AssetIncomeTypeDTO data = 1;
  uint32 totalElements = 2;
}

service AssetIncomeTypeService {
    rpc Get (AssetIncomeTypeDTO) returns (AssetIncomeTypeListDTO);
    rpc Detail (AssetIncomeTypeDTO) returns (AssetIncomeTypeDTO);
    rpc Create (AssetIncomeTypeDTO) returns (AssetIncomeTypeDTO);
    rpc Update (AssetIncomeTypeDTO) returns (AssetIncomeTypeDTO);
    rpc Delete (AssetIncomeTypeDTO) returns (AssetIncomeTypeDTO);
}
