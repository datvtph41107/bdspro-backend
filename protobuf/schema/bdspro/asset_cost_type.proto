syntax = "proto3";

package pb_bdspro;
option go_package = "pb/types/bdspro;pb_bdspro";

message AssetCostTypeDTO {
  uint64 id = 1;
  string typeName = 2;
  bool isCustom = 3;
}

message AssetCostTypeListDTO {
  repeated AssetCostTypeDTO data = 1;
  uint32 totalElements = 2;
}

service AssetCostTypeService {
    rpc Get (AssetCostTypeDTO) returns (AssetCostTypeListDTO);
    rpc Detail (AssetCostTypeDTO) returns (AssetCostTypeDTO);
    rpc Create (AssetCostTypeDTO) returns (AssetCostTypeDTO);
    rpc Update (AssetCostTypeDTO) returns (AssetCostTypeDTO);
    rpc Delete (AssetCostTypeDTO) returns (AssetCostTypeDTO);
}
