syntax = "proto3";

package organizationpb;

option go_package = "types/organizationpb";
import "shared/common.proto";
import "google/api/annotations.proto";
import "organization/deal.proto";

service InvestmentService {
    rpc CreateInvestment(SubmitInvestRequest) returns (sharepb.IdDTO) {
        option (google.api.http) = {
            post: "/v2/org/investment"
            body: "*"
        };
    };
    rpc UpdateInvestment(SubmitInvestRequest) returns (sharepb.IdDTO) {
        option (google.api.http) = {
            put: "/v2/org/investment/{id}"
            body: "*"
        };
    };
    rpc DeleteInvestment(sharepb.IdDTO) returns (sharepb.IdDTO) {
        option (google.api.http) = {
            delete: "/v2/org/investment/{id}"
        };
    };
    rpc DetailInvestment(sharepb.IdDTO) returns (Investment) {
        option (google.api.http) = {
            get: "/v2/org/investment/{id}"
        };
    };
    rpc GetInvestments(InvestmentListRequest) returns (ListInvestment) {
        option (google.api.http) = {
            get: "/v2/org/investments/{dealId}"
        };
    };
    rpc ApproveInvestment(sharepb.IdDTO) returns (sharepb.IdDTO) {
        option (google.api.http) = {
            post: "/v2/org/investment/{id}/approve"
        };
    };
    rpc RejectInvestment(sharepb.IdDTO) returns (sharepb.IdDTO) {
        option (google.api.http) = {
            post: "/v2/org/investment/{id}/reject"
        };
    };
}

message CreateInvestmentRequest {
    uint64 dealId = 1;
    uint32 investType = 2;
    double amount = 3;
    string transferTime = 4;
    string note = 5;
    repeated DocumentItem documents = 6;
}

message CreateInvestmentResponse {
    uint64 id = 1;
}

message UpdateInvestmentRequest {
    uint64 id = 1;
    uint64 dealId = 2;
    uint32 investType = 3;
    double amount = 4;
    string transferTime = 5;
    string note = 6;
    repeated DocumentItem documents = 7;
}

message UpdateInvestmentResponse {
    uint64 id = 1;
}

message SubmitInvestRequest {
    uint64 id = 1;
    uint64 dealId = 2;
    uint32 investType = 3;
    double amount = 4;
    string transferTime = 5;
    string note = 6;
    repeated DocumentItem documents = 7;
}


message ListInvestment {
    repeated Investment data = 1;
    int64 total = 2;
}

message Investment {
    uint64 id = 1;
    uint64 dealId = 2;
    uint32 investType = 3;
    double amount = 4;
    string transferTime = 5;
    string note = 6;
    repeated DocumentItem documents = 7;
    uint32 status = 8;
    string changedAt = 9;
    optional uint64 createdBy = 10;
    optional sharepb.ProfileItem createdUser = 11;
    string statusName = 12;
}

message InvestmentListRequest {
    uint64 dealId = 1;
    uint32 investType = 2;
    uint32 status = 3;
    string transferTime = 4;
    string note = 5;
    repeated DocumentItem documents = 6;
}