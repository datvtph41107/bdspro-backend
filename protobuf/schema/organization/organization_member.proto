syntax = "proto3";

package pb_organization;

import "google/api/annotations.proto";
import "validate/validate.proto";

option go_package = "types/pb_organization";



service OrganizationMemberService {
    rpc SwitchOrganization(SwitchOrganizationRequest) returns (SwitchOrganizationResponse) {}
    rpc CreateOrganizationMember(CreateOrganizationMemberRequest) returns (CreateOrganizationMemberResponse) {
        option (google.api.http) = {
            post: "/v2/organization/create-organization-member"
            body: "*"
        };
    }
    rpc UpdateOrganizationMember(UpdateOrganizationMemberRequest) returns (UpdateOrganizationMemberResponse) {
        option (google.api.http) = {
            put: "/v2/organization/update-organization-member/{id}"
            body: "*"
        };
    }
    rpc DeleteOrganizationMember(DeleteOrganizationMemberRequest) returns (DeleteOrganizationMemberResponse) {
        option (google.api.http) = {
            delete: "/v2/organization/delete-organization-member/{id}"
        };
    }

    rpc GetOrganizationMembers(GetOrganizationMembersRequest) returns (GetOrganizationMembersResponse) {
        option (google.api.http) = {
            get: "/v2/organization/get-organization-members/{organizationId}"
        };
    }

}

message SwitchOrganizationRequest {
    uint32 organizationId = 1 [json_name = "organizationId"];
    uint32 userId = 2 [json_name = "userId"];
}

message SwitchOrganizationResponse {
    uint32 id = 1 [json_name = "id"];
    uint32 userId = 2 [json_name = "userId"];
    bool isSuccess = 3 [json_name = "isSuccess"];
}

enum OrganizationMemberRole {
    ORGANIZATION_MEMBER_ROLE_UNSPECIFIED = 0;
    ORGANIZATION_MEMBER_ROLE_ADMIN = 1;
    ORGANIZATION_MEMBER_ROLE_MEMBER = 2;
  }

message CreateOrganizationMemberRequest {
    uint32 organizationId = 1 [json_name = "organizationId"];
    uint32 userId = 2 [json_name = "userId"];
    OrganizationMemberRole role = 3 [json_name = "role", (validate.rules).enum = {defined_only: true, not_in: [0]}];
}

message CreateOrganizationMemberResponse {
    uint32 id = 1 [json_name = "id"];
}

message UpdateOrganizationMemberRequest {
    uint32 id = 1 [json_name = "id"];
    OrganizationMemberRole role = 2 [json_name = "role", (validate.rules).enum = {defined_only: true, not_in: [0]}];
}

message UpdateOrganizationMemberResponse {
    uint32 id = 1 [json_name = "id"];
}

message DeleteOrganizationMemberRequest {   
    uint32 id = 1 [json_name = "id"];
}

message DeleteOrganizationMemberResponse {
    uint32 id = 1 [json_name = "id"];
}

message GetOrganizationMembersRequest {
    uint32 organizationId = 1 [json_name = "organizationId"];
}

message OrganizationMember {
    uint32 id = 1 [json_name = "id"];
    uint32 userId = 2 [json_name = "userId"];
    OrganizationMemberRole role = 3 [json_name = "role"];
    string status = 4 [json_name = "status"];
}
message GetOrganizationMembersResponse {
    repeated OrganizationMember organizationMembers = 1 [json_name = "organizationMembers"];
}