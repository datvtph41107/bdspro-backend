syntax = "proto3";

package pb_organization;

import "google/api/annotations.proto";

option go_package = "types/pb_organization";

service OrganizationService {
    rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse) {
        option (google.api.http) = {
            post: "/v2/organization"
            body: "*"
        };
    }

    rpc UpdateOrganization(UpdateOrganizationRequest) returns (UpdateOrganizationResponse) {
        option (google.api.http) = {
            put: "/v2/organization/{id}"
            body: "*"
        };
    }

    rpc GetOrganizations(GetOrganizationsRequest) returns (GetOrganizationsResponse) {
        option (google.api.http) = {
            get: "/v2/organization"
        };
    }

    rpc GetOrganizationByUserId(GetOrganizationByUserIdRequest) returns (GetOrganizationByUserIdResponse) {
        option (google.api.http) = {
            get: "/v2/organization/user/{userId}"
        };
    }

    rpc CheckOrganizationIsExist(CheckOrganizationIsExistRequest) returns (CheckOrganizationIsExistResponse) {
        option (google.api.http) = {
            get: "/v2/organization/check-is-exist/{id}"
        };
    }   
    
}

message CreateOrganizationRequest {
    string name = 1 [json_name = "name"]; 
    string taxCode = 2 [json_name = "taxCode"];
    optional string businessLicenseUrl = 3 [json_name = "businessLicenseUrl"];
    optional string address = 4 [json_name = "address"];
    optional string phone = 5 [json_name = "phone"];
    optional string email = 6 [json_name = "email"];
    optional string website = 7 [json_name = "website"];
    optional string logoUrl = 8 [json_name = "logoUrl"];
}

message CreateOrganizationResponse {
    uint32 id = 1 [json_name = "id"];
}

message UpdateOrganizationRequest {
    uint32 id = 1 [json_name = "id"];
    string name = 2 [json_name = "name"];
    string taxCode = 3 [json_name = "taxCode"];
    optional string businessLicenseUrl = 4 [json_name = "businessLicenseUrl"];
    optional string address = 5 [json_name = "address"];
    optional string phone = 6 [json_name = "phone"];
    optional string email = 7 [json_name = "email"];
    optional string website = 8 [json_name = "website"];
    optional string logoUrl = 9 [json_name = "logoUrl"];
    optional string status = 10 [json_name = "status"];
}

message UpdateOrganizationResponse {
    uint32 id = 1 [json_name = "id"];
}

message GetOrganizationsRequest {
    uint32 id = 1 [json_name = "id"];
    optional uint32 page = 2 [json_name = "page"];
    optional uint32 size = 3 [json_name = "size"];
}

message Organization {
    uint32 id = 1 [json_name = "id"];
    string name = 2 [json_name = "name"];
    string taxCode = 3 [json_name = "taxCode"];
    optional string businessLicenseUrl = 4 [json_name = "businessLicenseUrl"];
    optional string address = 5 [json_name = "address"];
    optional string phone = 6 [json_name = "phone"];
    optional string email = 7 [json_name = "email"];
    optional string website = 8 [json_name = "website"];
    optional string logoUrl = 9 [json_name = "logoUrl"];
}

message GetOrganizationsResponse {
    repeated Organization organizations = 1 [json_name = "organizations"];
    uint32 total = 2 [json_name = "total"];
}

message GetOrganizationByUserIdRequest {
    uint32 userId = 1 [json_name = "userId"];
}

message GetOrganizationByUserIdResponse {
    repeated Organization organizations = 1 [json_name = "organizations"];
}

message CheckOrganizationIsExistRequest {
    uint32 id = 1 [json_name = "id"];
}

message CheckOrganizationIsExistResponse {
    bool isExist = 1 [json_name = "isExist"];
}