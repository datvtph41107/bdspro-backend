syntax = "proto3";

package organizationpb;

import "google/api/annotations.proto";
import "validate/validate.proto";

option go_package = "types/organizationpb";



service OrganizationBranchService {
    rpc CreateOrganizationBranch(CreateOrganizationBranchRequest) returns (CreateOrganizationBranchResponse) {
        option (google.api.http) = {
            post: "/v2/org/organization/branch"
            body: "*"
        };
    }
    rpc UpdateOrganizationBranch(UpdateOrganizationBranchRequest) returns (UpdateOrganizationBranchResponse) {
        option (google.api.http) = {
            put: "/v2/org/organization/branch/{id}"
            body: "*"
        };
    }
    rpc DeleteOrganizationBranch(DeleteOrganizationBranchRequest) returns (DeleteOrganizationBranchResponse) {
        option (google.api.http) = {
            delete: "/v2/org/organization/branch/{id}"
        };
    }
    rpc AddMemberToOrganizationBranch(AddMemberToOrganizationBranchRequest) returns (AddMemberToOrganizationBranchResponse) {
        option (google.api.http) = {
            post: "/v2/org/organization/branch/{id}/add-member"
            body: "*"
        };
    }
    rpc RemoveMemberFromOrganizationBranch(RemoveMemberFromOrganizationBranchRequest) returns (RemoveMemberFromOrganizationBranchResponse) {
        option (google.api.http) = {
            delete: "/v2/org/organization/branch/{id}/remove-member/{userId}"
        };
    }
    rpc GetOrganizationBranchMembers(GetOrganizationBranchMembersRequest) returns (GetOrganizationBranchMembersResponse) {
        option (google.api.http) = {
            get: "/v2/org/organization/branch/{id}/members"
        };
    }
    rpc GetOrganizationBranches(GetOrganizationBranchesRequest) returns (GetOrganizationBranchesResponse) {
        option (google.api.http) = {
            get: "/v2/org/organization/branch"
        };
    }
    rpc UpdateIsActive(UpdateIsActiveRequest) returns (UpdateIsActiveResponse) {
        option (google.api.http) = {
            put: "/v2/org/organization/branch/{id}/is-active"
            body: "*"
        };
    }
}

message CreateOrganizationBranchRequest {
    string name = 1;
    string address = 2;
    string phone = 3;
    string email = 4;
    uint32 managerId = 5;
    uint32 organizationId = 6;
}

message CreateOrganizationBranchResponse {
    uint32 id = 1;
}

message UpdateOrganizationBranchRequest {
    uint32 id = 1;
    string name = 2;
    string address = 3;
    string phone = 4;
    string email = 5;
}

message UpdateOrganizationBranchResponse {
    uint32 id = 1;
}

message DeleteOrganizationBranchRequest {
    uint32 id = 1;
}

message DeleteOrganizationBranchResponse {
    bool success = 1;
}

message AddMemberToOrganizationBranchRequest {
    uint32 id = 1;
    uint32 userId = 2;
}

message AddMemberToOrganizationBranchResponse {
    uint32 id = 1;
}

message RemoveMemberFromOrganizationBranchRequest {
    uint32 id = 1;
    uint32 userId = 2;
}

message RemoveMemberFromOrganizationBranchResponse {
    uint32 id = 1;
}

message GetOrganizationBranchMembersRequest {
    uint32 id = 1;
    optional uint32 page = 2;
    optional uint32 size = 3;
}

message OrganizationBranchMember {
    uint32 id = 1;
    uint32 userId = 2;
}

message GetOrganizationBranchMembersResponse {
    repeated OrganizationBranchMember members = 1;
    uint32 total = 2;
}

message GetOrganizationBranchesRequest {
    uint32 organizationId = 1;
    optional uint32 page = 2;
    optional uint32 size = 3;
}

message OrganizationBranch {
    uint32 id = 1;
    string name = 2;
    string address = 3;
    string phone = 4;
    string email = 5;
    bool isActive = 6;
}

message GetOrganizationBranchesResponse {
    repeated OrganizationBranch branches = 1;
    uint32 total = 2;
}


message UpdateIsActiveRequest {
    uint32 id = 1;
    bool isActive = 2;
}

message UpdateIsActiveResponse {
    bool success = 1;
}