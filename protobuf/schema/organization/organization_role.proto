syntax = "proto3";

package organizationpb;

import "google/api/annotations.proto";
import "validate/validate.proto";
import "organization/organization_permission.proto";

option go_package = "types/organizationpb";

service OrganizationRoleService {
    rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse) {
        option (google.api.http) = {
            post: "/v2/org/organization/role"
            body: "*"
        };
    }

    rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse) {
        option (google.api.http) = {
            put: "/v2/org/organization/role/{id}"
            body: "*"
        };
    }

    rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse) {
        option (google.api.http) = {
            delete: "/v2/org/organization/role/{id}"
        };
    }

    rpc GetRoles(GetRolesRequest) returns (GetRolesResponse) {
        option (google.api.http) = {
            get: "/v2/org/organization/role"
        };
    }

    rpc AddPermissionToRole(AddPermissionToRoleRequest) returns (AddPermissionToRoleResponse) {
        option (google.api.http) = {
            post: "/v2/org/organization/role/add-permission"
            body: "*"
        };
    }
    
}

message CreateRoleRequest {
    string name = 1 [json_name = "name"];
    string key = 2 [json_name = "key"];
    uint32 organizationId = 3 [json_name = "organizationId"];
    repeated uint64 permissionIds = 4 [json_name = "permissionIds"];
}

message CreateRoleResponse {
    uint32 id = 1 [json_name = "id"];
}

message UpdateRoleRequest {
    uint32 id = 1 [json_name = "id"];
    string name = 2 [json_name = "name"];
    string key = 3 [json_name = "key"];
    repeated uint32 permissionIds = 4 [json_name = "permissionIds"];
}

message UpdateRoleResponse {    
    uint32 id = 1 [json_name = "id"];
}

message DeleteRoleRequest {
    uint32 id = 1 [json_name = "id"];
}

message DeleteRoleResponse {
    uint32 id = 1 [json_name = "id"];
}

message GetRolesRequest {
    uint32 organizationId = 1 [json_name = "organizationId"];
    optional uint32 page = 2 [json_name = "page"];
    optional uint32 size = 3 [json_name = "size"];
}

message Role {
    uint32 id = 1 [json_name = "id"];
    string name = 2 [json_name = "name"];
    string key = 3 [json_name = "key"];
    repeated Permission permissions = 4 [json_name = "permissions"];
}

message GetRolesResponse {
    repeated Role roles = 1 [json_name = "roles"];
    uint32 total = 2 [json_name = "total"];
}

message AddPermissionToRoleRequest {
    uint32 roleId = 1 [json_name = "roleId"];
    uint32 permissionId = 2 [json_name = "permissionId"];
}

message AddPermissionToRoleResponse {
    uint32 id = 1 [json_name = "id"];
}