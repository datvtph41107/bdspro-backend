syntax = "proto3";

package crmpb;

option go_package = "pb/types/crm;crmpb";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

message HistorySearchRequest {
  uint32 page = 1;
  uint32 size = 2;

  uint64 userId = 3;
  google.protobuf.Timestamp fromDate = 4;
  google.protobuf.Timestamp toDate = 5;

  optional int32 actionType = 6;
  optional int32 targetType = 7;
  optional uint64 targetId = 8;

  uint64 ownerId = 9;
  uint32 ownerType = 10;
}

message HistoryDTO {
  uint64 targetId = 1;
  int32 targetType = 2;     
  int32 actionType = 3;     

  string note = 4;
  string preStage = 5;
  string afterStage = 6;

  optional uint64 ownerId = 7;
  int32 ownerType = 8;
  string createdAt = 9;
  optional uint64 createdBy = 10;
}

message HistoryListDTO {
    repeated HistoryDTO data = 1;
    uint32 totalElements = 2;
}

service HistoryService {
    rpc Search (HistorySearchRequest) returns (HistoryListDTO) {
        option (google.api.http) = {
            get: "/v2/crm/history/list/{ownerId}/{ownerType}"
        };
    };
}
