syntax = "proto3";

package crmpb;

option go_package = "pb/types/crm;crmpb";
import "google/api/annotations.proto";
import "shared/common.proto";

service ContactService {
  rpc Search (ContactSearchRequest) returns (ContactListDTO) {
    option (google.api.http) = {
      get: "/v2/crm/contact/list/{ownerType}"
    };
  };
  rpc Detail (sharepb.IdRequest) returns (ContactDTO) {
    option (google.api.http) = {
      get: "/v2/crm/contact/detail/{id}"
    };
  };
  rpc Create (ContactSaveDTO) returns (ContactDTO) {
    option (google.api.http) = {
      post: "/v2/crm/contact"
      body: "*"
    };
  };
  rpc Update (ContactSaveDTO) returns (ContactDTO) {
    option (google.api.http) = {
      put: "/v2/crm/contact/{id}"
      body: "*"
    };
  };
  rpc Delete (sharepb.IdRequest) returns (sharepb.SubmitResponse) {
    option (google.api.http) = {
      delete: "/v2/crm/contact/{id}"
    };
  };
  rpc Sync (ContactSyncRequest) returns (ContactSyncResponse) {
    option (google.api.http) = {
      post: "/v2/crm/contact/sync"
      body: "*"
    };
  };
  rpc RelationShip (sharepb.IdRequest) returns (RelationShipResponse) {
    option (google.api.http) = {
      get: "/v2/crm/contact/relation-ship/{id}"
    };
  };
  rpc Note (NoteContactDTO) returns (NoteContactDTO) {
    option (google.api.http) = {
      put: "/v2/crm/contact/note/{id}"
      body: "*"
    };
  };
}

message ContactSearchRequest {
  uint64 page = 1;
  uint32 size = 2;
  string text = 3;
  int32 ownerType = 4;
  repeated int32 friendStatus = 5;
  optional bool following = 6;
  repeated int32 roles = 7;
  optional bool leaded = 8;
  optional bool connected = 9;
  optional bool appInstalled = 10;
}

message ContactSaveDTO {
  uint64 id = 1;
  string phone = 2;
  string fullName = 3;
  int32 ownerType = 4;
  string email = 5;
  string zalo = 6;
  string company = 7;
  string note = 8;
  string avatar = 9;
  int32 visibility = 10;
  bool assignedCrm = 11;
}

message ContactDTO {
  uint64 id = 1;
  string phone = 2;
  string fullName = 3;
  uint64 ownerId = 4;
  int32 ownerType = 5;
  string createdAt = 6;
  optional uint64 createdBy = 7;
  uint32 contactStatus = 8;
  string statusName = 9;
  sharepb.FriendItem friendStatus = 10;
  bool following = 11;
  string avatar = 12;
  sharepb.ProfileItem profileInfo = 13;
  optional uint64 profileId = 14;
  bool blocked = 15;
  string email = 16;
  string zalo = 17;
  string company = 18;
  string note = 19;
}

message ContactListDTO {
    repeated ContactDTO data = 1;
    uint32 totalElements = 2;
}

message ContactSyncRequest {
  repeated ContactSaveDTO contacts = 1;
  uint64 ownerId = 2;
  int32 ownerType = 3;
}

message ContactSyncResponse {
  repeated ContactDTO data = 1;
  uint32 totalElements = 2;
}

message RelationShipResponse {
  optional sharepb.FriendItem friendStatus = 1;
  bool following = 2;
  bool blocked = 3;
  int64 numFollower = 4;
  int64 numFollowing = 5;
  int64 numFriend = 6;
}

message NoteContactDTO {
  uint64 id = 1;
  string note = 2;
}