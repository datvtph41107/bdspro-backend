type: google.api.Service
config_version: 3

http:
  rules:
    #pipeline
    - selector: crmpb.PipelineService.Search
      get: /v2/crm/pipeline/{ownerId}/{ownerType}

    - selector: crmpb.PipelineService.Detail
      get: /v2/crm/pipeline/{id}

    - selector: crmpb.PipelineService.Create
      post: /v2/crm/pipeline
      body: "*"

    - selector: crmpb.PipelineService.Update
      put: /v2/crm/pipeline/{id}
      body: "*"

    - selector: crmpb.PipelineService.Delete
      delete: /v2/crm/pipeline/{id}

    #contact
    - selector: crmpb.ContactService.Search
      get: /v2/crm/contact

    - selector: crmpb.ContactService.Detail
      get: /v2/crm/contact/{id}

    - selector: crmpb.ContactService.Create
      post: /v2/crm/contact
      body: "*"

    - selector: crmpb.ContactService.Update
      put: /v2/crm/contact/{id}
      body: "*"

    - selector: crmpb.ContactService.Delete
      delete: /v2/crm/contact/{id}

    #customer
    - selector: crmpb.CustomerService.Search
      get: /v2/crm/customer/list/{ownerId}/{ownerType}

    - selector: crmpb.CustomerService.Detail
      get: /v2/crm/customer/{id}

    - selector: crmpb.CustomerService.Create
      post: /v2/crm/customer
      body: "*"

    - selector: crmpb.CustomerService.Update
      put: /v2/crm/customer/{id}
      body: "*"

    - selector: crmpb.CustomerService.Delete
      delete: /v2/crm/customer/{id}

    - selector: crmpb.CustomerService.Assign
      put: /v2/crm/customer/{customerId}/assign
      body: "*"

    - selector: crmpb.CustomerService.Note
      put: /v2/crm/customer/{customerId}/note
      body: "*"

    - selector: crmpb.CustomerService.Stage
      put: /v2/crm/customer/{customerId}/stage
      body: "*"

    #stage
    - selector: crmpb.StageService.Search
      get: /v2/crm/stage/{pipelineId}

    - selector: crmpb.StageService.Create
      post: /v2/crm/stage
      body: "*"

    - selector: crmpb.StageService.Update
      put: /v2/crm/stage/{id}
      body: "*"

    - selector: crmpb.StageService.Delete
      delete: /v2/crm/stage/{id}

    #history
    - selector: crmpb.HistoryService.Search
      get: /v2/crm/histories/{ownerId}/{ownerType}

    #rule
    - selector: crmpb.RuleService.Search
      get: /v2/crm/rule/{ownerId}/{ownerType}

    - selector: crmpb.RuleService.Detail
      get: /v2/crm/rule/{id}

    - selector: crmpb.RuleService.Create
      post: /v2/crm/rule
      body: "*"

    - selector: crmpb.RuleService.Update
      put: /v2/crm/rule/{id}
      body: "*"

    - selector: crmpb.RuleService.Delete
      delete: /v2/crm/rule/{id}